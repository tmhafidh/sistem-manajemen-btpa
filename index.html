                    const existingIdx = updatedDocs.findIndex(d => d.number === num && d.status === 'DI_ADMIN' && d.teamId === formData.teamId);
                    if (existingIdx !== -1) updatedDocs[existingIdx] = { ...updatedDocs[existingIdx], batchId, status: 'DIALOKASIKAN' };
                    else updatedDocs.push({ id: generateId(), batchId, teamId: formData.teamId, number: num, status: 'DIALOKASIKAN' });
                  });

                  setBatches([...batches, { id: batchId, teamId: formData.teamId, date: formData.date, name: formData.name, population: populationNum, status: 'AKTIF' }]);
                  setDocuments(updatedDocs);
                  
                  fireAlert('Chick-in Berhasil!', `Kandang ${formData.name} berhasil didaftarkan. ${numbersToGenerate.length} dokumen BTPA telah dialokasikan dan siap beredar di lapangan.`, 'success');
                  setFormData({ teamId: '', date: '', name: '', population: '' });
                  setRanges([{ from: '', to: '' }]); setUsedDrawerDocs(new Set());
                } finally {
                  setIsGenerating(false);
                }
              }, 300);
            };

            return (
              <div className="p-4 md:p-8 max-w-7xl mx-auto flex flex-col lg:flex-row gap-8 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                
                {/* Panel Kiri: Form Kandang */}
                <div className="w-full lg:w-[400px] shrink-0 space-y-6">
                  <div className="flex items-center gap-4 mb-6">
                    <div className="w-14 h-14 bg-gradient-to-br from-brand-100 to-orange-100 text-brand-600 rounded-2xl flex items-center justify-center shadow-inner"><PlusCircle size={28}/></div>
                    <div>
                      <h2 className="text-2xl font-black text-slate-800 tracking-tight">1. Data Kandang</h2>
                      <p className="text-slate-500 font-medium text-sm mt-0.5">Informasi siklus panen.</p>
                    </div>
                  </div>

                  <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-200/60 space-y-6">
                     <div className="space-y-2">
                       <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Tim Pelaksana</label>
                       <select className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-slate-700 text-lg appearance-none cursor-pointer" value={formData.teamId} onChange={(e) => {setFormData({...formData, teamId: e.target.value}); setRanges([{from:'', to:''}]); setUsedDrawerDocs(new Set());}}>
                         <option value="">-- Pilih Tim --</option>
                         {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                       </select>
                     </div>
                     <div className="space-y-2">
                       <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Tanggal Chick-in</label>
                       <input type="date" className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-slate-700 text-lg" value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} />
                     </div>
                     <div className="space-y-2">
                       <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Nama Kandang</label>
                       <input type="text" placeholder="Contoh: Kandang A1" className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-slate-700 text-lg" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} />
                     </div>
                     <div className="space-y-2">
                       <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Populasi Ayam</label>
                       <input type="number" placeholder="Contoh: 5000" className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-slate-700 text-lg" value={formData.population} onChange={(e) => setFormData({...formData, population: e.target.value})} />
                     </div>

                     <div className="bg-sky-50 border border-sky-100 p-6 rounded-2xl flex justify-between items-center mt-8">
                       <div>
                         <p className="text-[10px] font-black text-sky-600/80 uppercase tracking-widest mb-1">Estimasi Dokumen</p>
                         <p className="text-3xl font-black text-sky-700 tracking-tight">{estimatedDocs} <span className="text-base font-bold opacity-70">lembar</span></p>
                       </div>
                       <div className="w-12 h-12 bg-sky-100 rounded-xl flex items-center justify-center text-sky-500"><BarChart3 size={24}/></div>
                     </div>
                  </div>
                </div>

                {/* Panel Kanan: Alokasi */}
                <div className="flex-1 space-y-6">
                   <div className="flex items-center gap-4 mb-6">
                    <div className="w-14 h-14 bg-gradient-to-br from-brand-100 to-orange-100 text-brand-600 rounded-2xl flex items-center justify-center shadow-inner"><FileText size={28}/></div>
                    <div>
                      <h2 className="text-2xl font-black text-slate-800 tracking-tight">2. Alokasi BTPA</h2>
                      <p className="text-slate-500 font-medium text-sm mt-0.5">Berikan dokumen baru atau daur ulang dari Laci.</p>
                    </div>
                  </div>

                  <div className="bg-white p-6 md:p-10 rounded-[2rem] shadow-sm border border-slate-200/60 space-y-6">
                    
                    {/* Widget Laci Admin */}
                    {drawerDocsAnalysis.docs.length > 0 && (
                      <div className="bg-amber-50/80 border border-amber-200/60 p-6 rounded-2xl">
                        <h3 className="text-sm font-black text-amber-800 uppercase tracking-widest mb-4 flex items-center gap-2"><Inbox size={18}/> Dokumen di Laci ({drawerDocsAnalysis.docs.length} Lembar)</h3>
                        
                        {drawerDocsAnalysis.groups.length > 0 && (
                          <div className="mb-5">
                            <p className="text-[10px] font-bold text-amber-600/80 uppercase tracking-widest mb-2">Pilih Grup Sekaligus:</p>
                            <div className="flex flex-wrap gap-2.5">
                              {drawerDocsAnalysis.groups.map((group, idx) => {
                                const isUsed = usedDrawerDocs.has(group[0].id);
                                return (
                                  <button key={`g${idx}`} disabled={isUsed} onClick={() => injectRange(group[0].number, group[group.length-1].number, group.map(g=>g.id))} className={`px-4 py-2.5 rounded-xl border-2 font-black text-sm transition-all shadow-sm flex items-center gap-2 ${isUsed ? 'bg-amber-100/50 border-transparent text-amber-400 opacity-60' : 'bg-white border-brand-300 text-brand-700 hover:bg-brand-100 hover:border-brand-400 active:scale-95 cursor-pointer'}`}>
                                    {isUsed ? <CheckCircle2 size={16}/> : <ListOrdered size={16}/>} #{group[0].number} - #{group[group.length-1].number} <span className="bg-brand-200/50 px-2 py-0.5 rounded-md text-[10px]">{group.length}x</span>
                                  </button>
                                )
                              })}
                            </div>
                          </div>
                        )}
                        
                        <div>
                           <p className="text-[10px] font-bold text-amber-600/80 uppercase tracking-widest mb-2">Atau Pilih Satuan:</p>
                           <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar pr-2">
                             {drawerDocsAnalysis.docs.map(doc => {
                               const isUsed = usedDrawerDocs.has(doc.id);
                               return (
                                 <button key={doc.id} disabled={isUsed} onClick={() => injectRange(doc.number, doc.number, doc.id)} className={`px-3 py-1.5 rounded-lg border font-mono font-bold text-sm transition-all ${isUsed ? 'bg-amber-100/50 border-transparent text-amber-400 opacity-60 flex items-center gap-1' : 'bg-white border-brand-200 text-brand-700 hover:bg-brand-100 shadow-sm active:scale-95'}`}>
                                   {isUsed && <CheckCircle2 size={12}/>} #{doc.number}
                                 </button>
                               )
                             })}
                           </div>
                        </div>
                      </div>
                    )}

                    {/* Input Rentang */}
                    <div className="space-y-4 pt-2">
                      {ranges.map((range, idx) => {
                        const fromVal = parseInt(range.from); const toVal = parseInt(range.to);
                        const rangeCount = (!isNaN(fromVal) && !isNaN(toVal) && fromVal <= toVal) ? (toVal - fromVal + 1) : 0;
                        return (
                          <div key={idx} className="flex flex-col md:flex-row items-start md:items-center gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200/60 transition-all hover:border-brand-200">
                            <div className="w-full md:flex-1">
                              <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Mulai Nomor</label>
                              <input type="number" placeholder="1001" className="w-full px-5 py-3 bg-white border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none transition-all font-mono font-black tracking-widest text-xl text-slate-800 placeholder:text-slate-300" value={range.from} onChange={(e) => handleRangeChange(idx, 'from', e.target.value)} />
                            </div>
                            <div className="hidden md:block text-slate-300 font-black text-3xl mt-4">-</div>
                            <div className="w-full md:flex-1">
                              <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Sampai Nomor</label>
                              <input type="number" placeholder="1005" className="w-full px-5 py-3 bg-white border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none transition-all font-mono font-black tracking-widest text-xl text-slate-800 placeholder:text-slate-300" value={range.to} onChange={(e) => handleRangeChange(idx, 'to', e.target.value)} />
                            </div>
                            <div className="w-full md:w-auto flex items-center justify-between gap-3 mt-2 md:mt-6 shrink-0">
                              {rangeCount > 0 ? <span className="bg-brand-100/50 text-brand-700 font-black text-sm px-4 py-3 rounded-xl border border-brand-200">{rangeCount} Lembar</span> : <span className="text-slate-400 px-4 py-3 text-sm font-medium">0 Lembar</span>}
                              <button onClick={() => handleRemoveRange(idx)} disabled={ranges.length === 1} className="p-3 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl disabled:opacity-30 transition-all"><Trash2 size={22}/></button>
                            </div>
                          </div>
                        )
                      })}
                      <button onClick={handleAddRange} className="w-full md:w-auto px-6 py-4 border-2 border-dashed border-brand-200 text-brand-600 font-bold rounded-2xl hover:bg-brand-50 transition-all flex items-center justify-center gap-2"><PlusCircle size={20}/> Tambah Baris Input</button>
                    </div>

                    {/* Error Bentrok */}
                    {conflictError && (
                     <div className="bg-red-50 border border-red-200 p-6 rounded-2xl flex items-start gap-4 animate-in slide-in-from-top-2 duration-300">
                       <div className="bg-red-100 text-red-600 p-2 rounded-xl mt-1"><AlertTriangle size={24}/></div>
                       <div>
                         <h4 className="text-red-800 font-black text-lg tracking-tight">Bentrok Lintas Tim!</h4>
                         <p className="text-red-600 font-medium text-sm mt-1">Nomor <strong className="font-mono bg-red-200 px-1.5 py-0.5 rounded">#{conflictError.number}</strong> sudah berstatus sah milik: <strong className="bg-red-600 text-white px-2 py-0.5 rounded text-xs uppercase tracking-widest ml-1">{conflictError.owner}</strong>. Harap ganti rentang.</p>
                       </div>
                     </div>
                   )}

                   {/* Preview Live */}
                   {previewNumbers.length > 0 && !conflictError && (
                     <div className="bg-slate-50 border border-slate-200/60 rounded-2xl p-6">
                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Preview Nomor Dialokasikan (Live)</p>
                        <div className="flex flex-wrap gap-2">
                          {previewNumbers.map(n => <span key={n} className="bg-white border border-slate-200 px-3 py-1.5 rounded-lg text-sm font-mono font-bold text-slate-600 shadow-sm">#{n}</span>)}
                          {totalGeneratedDocs > 100 && <span className="bg-slate-200 px-3 py-1.5 rounded-lg text-sm font-bold text-slate-600">+{totalGeneratedDocs - 100} lainnya...</span>}
                        </div>
                     </div>
                   )}

                    {/* Simpan Area */}
                    <div className={`p-8 rounded-3xl flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl transition-all ${estimatedDocs > 0 && totalGeneratedDocs !== estimatedDocs && !conflictError ? 'bg-amber-500 shadow-amber-500/20' : 'bg-slate-800 shadow-slate-800/20'}`}>
                      <div className="text-white text-center md:text-left">
                        <p className="text-white/60 text-[10px] font-black uppercase tracking-widest mb-1">Total Generate Final</p>
                        <div className="flex items-center gap-3">
                          <p className="text-5xl font-black tracking-tight">{totalGeneratedDocs}</p>
                          {estimatedDocs > 0 && totalGeneratedDocs !== estimatedDocs && !conflictError && <span className="bg-white/20 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 mt-2"><AlertTriangle size={14}/> Meleset Estimasi</span>}
                          {estimatedDocs > 0 && totalGeneratedDocs === estimatedDocs && !conflictError && <span className="bg-brand-500 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 mt-2 shadow-sm"><CheckCircle2 size={14}/> Pas Estimasi</span>}
                        </div>
                      </div>
                      <button onClick={handleGenerate} disabled={isGenerating || !!conflictError || !formData.teamId} className="w-full md:w-auto px-10 py-5 bg-brand-500 hover:bg-brand-600 text-white font-black text-lg rounded-2xl transition-all shadow-lg shadow-brand-500/30 active:scale-95 disabled:opacity-50 disabled:active:scale-100 flex items-center justify-center gap-3">
                        {isGenerating ? <RefreshCw className="animate-spin"/> : <Play className="fill-current"/>} {isGenerating ? 'Memproses...' : 'Simpan Kandang'}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          };

          // ==========================================
          // 7. PROSES PANEN VIEW
          // ==========================================
          const ProsesPanenView = () => {
            const [selectedBatch, setSelectedBatch] = useState(null);
            const [visibleCount, setVisibleCount] = useState(50);
            
            const [searchTerm, setSearchTerm] = useState('');
            const [batchSearchTerm, setBatchSearchTerm] = useState('');
            const [filterTeam, setFilterTeam] = useState('ALL');
            const [sortByDate, setSortByDate] = useState('NEWEST');

            const [editBatchModal, setEditBatchModal] = useState({ isOpen: false, id: '', name: '', date: '', population: '' });
            
            const activeBatches = batches.filter(b => b.status === 'AKTIF');

            const processedBatches = useMemo(() => {
                let filtered = activeBatches;
                if (batchSearchTerm) filtered = filtered.filter(b => b.name.toLowerCase().includes(batchSearchTerm.toLowerCase()));
                if (filterTeam !== 'ALL') filtered = filtered.filter(b => b.teamId === filterTeam);
                return filtered.sort((a, b) => {
                    const dateA = new Date(a.date).getTime();
                    const dateB = new Date(b.date).getTime();
                    return sortByDate === 'NEWEST' ? dateB - dateA : dateA - dateB;
                });
            }, [batches, batchSearchTerm, filterTeam, sortByDate]);

            useEffect(() => {
                if (globalNavTarget.type === 'BATCH' && globalNavTarget.id) {
                    const targetBatch = activeBatches.find(b => b.id === globalNavTarget.id);
                    if (targetBatch) {
                        setSelectedBatch(targetBatch);
                        if (globalNavTarget.keyword) {
                            setSearchTerm(globalNavTarget.keyword);
                        }
                    }
                    setGlobalNavTarget({ type: null, id: null, keyword: null });
                }
            }, [globalNavTarget, activeBatches]);

            const handleBatchClick = (batch) => {
              setSelectedBatch(batch); setVisibleCount(50); setSearchTerm('');
            };

            const handleUpdateDocStatus = (docId, newStatus) => {
              setDocuments(docs => docs.map(d => d.id === docId ? { ...d, status: newStatus } : d));
            };

            const handleBulkAction = (status) => {
              if (!selectedBatch) return;
              setDocuments(docs => docs.map(d => {
                if (d.batchId === selectedBatch.id && d.status === 'DIALOKASIKAN') return { ...d, status: status };
                return d;
              }));
              addToast(`Eksekusi Massal: Status diubah menjadi ${status === 'TERPAKAI' ? 'Selesai' : 'Ke Laci'}`, 'success');
            };

            const handleCloseBatch = () => {
              if (!selectedBatch) return;
              const batchDocs = documents.filter(d => d.batchId === selectedBatch.id);
              const unresolvedDocs = batchDocs.filter(d => d.status === 'DIALOKASIKAN');
              
              if (unresolvedDocs.length > 0) return fireAlert('Penutupan Ditolak', `Masih ada ${unresolvedDocs.length} dokumen BTPA yang statusnya Menggantung. Harap selesaikan atau tarik ke laci.`, 'error');

              setBatches(bs => bs.map(b => b.id === selectedBatch.id ? { ...b, status: 'SELESAI' } : b));
              fireAlert('Siklus Selesai!', `Kandang ${selectedBatch.name} berhasil ditutup dan masuk arsip permanen.`, 'success');
              setSelectedBatch(null);
            };

            const submitEditBatch = (e) => {
              e.preventDefault();
              if (!editBatchModal.name.trim() || !editBatchModal.date || !editBatchModal.population) {
                  return fireAlert('Validasi Gagal', 'Harap lengkapi semua data kandang.', 'error');
              }
              setBatches(bs => bs.map(b => b.id === editBatchModal.id ? {
                  ...b,
                  name: editBatchModal.name.trim(),
                  date: editBatchModal.date,
                  population: parseInt(editBatchModal.population) || 0
              } : b));
              
              if (selectedBatch && selectedBatch.id === editBatchModal.id) {
                  setSelectedBatch(prev => ({
                      ...prev,
                      name: editBatchModal.name.trim(),
                      date: editBatchModal.date,
                      population: parseInt(editBatchModal.population) || 0
                  }));
              }

              setEditBatchModal({ isOpen: false, id: '', name: '', date: '', population: '' });
              addToast('Data kandang berhasil diperbarui!', 'success');
            };

            if (!selectedBatch) {
              return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                  <div className="flex items-center gap-4 mb-8">
                    <div className="p-3 bg-white rounded-2xl shadow-sm border border-slate-100"><RefreshCw className="text-brand-600" size={28}/></div>
                    <div>
                      <h2 className="text-3xl font-black text-slate-800 tracking-tight">Proses Panen (Kandang Aktif)</h2>
                      <p className="text-slate-500 font-medium mt-1">Pilih kandang untuk memproses dan mencatat kepulangan dokumen BTPA.</p>
                    </div>
                  </div>

                  {/* Panel Filter UI UX Baru */}
                  {activeBatches.length > 0 && (
                     <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200/60 flex flex-col md:flex-row gap-4 mb-6 relative z-20">
                        <div className="flex-1 relative">
                          <Search size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                          <input type="text" placeholder="Cari nama kandang..." value={batchSearchTerm} onChange={e => setBatchSearchTerm(e.target.value)} className="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-sm text-slate-700 transition-all"/>
                        </div>
                        <select value={filterTeam} onChange={e => setFilterTeam(e.target.value)} className="w-full md:w-56 px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-sm text-slate-700 cursor-pointer appearance-none">
                          <option value="ALL">Semua Tim</option>
                          {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>
                        <select value={sortByDate} onChange={e => setSortByDate(e.target.value)} className="w-full md:w-56 px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-sm text-slate-700 cursor-pointer appearance-none">
                          <option value="NEWEST">Terbaru (Tgl CI)</option>
                          <option value="OLDEST">Terlama (Tgl CI)</option>
                        </select>
                     </div>
                  )}

                  {activeBatches.length === 0 ? (
                    <div className="bg-white border border-slate-200/60 rounded-[2rem] p-20 text-center shadow-sm">
                      <div className="w-24 h-24 bg-slate-50 rounded-[2rem] flex items-center justify-center mx-auto mb-6"><ListOrdered size={40} className="text-slate-300" /></div>
                      <h3 className="text-2xl font-black text-slate-800 tracking-tight mb-2">Tidak Ada Kandang Aktif</h3>
                      <p className="text-slate-500 text-lg">Semua kandang saat ini sudah ditutup atau belum ada yang di-input.</p>
                    </div>
                  ) : processedBatches.length === 0 ? (
                    <div className="bg-white border border-slate-200/60 rounded-[2rem] p-16 text-center shadow-sm">
                      <div className="w-20 h-20 bg-slate-50 rounded-[1.5rem] flex items-center justify-center mx-auto mb-4"><Search size={32} className="text-slate-300" /></div>
                      <h3 className="text-xl font-black text-slate-800 tracking-tight mb-2">Pencarian Tidak Ditemukan</h3>
                      <p className="text-slate-500">Coba ubah kata kunci pencarian atau filter tim.</p>
                      <button onClick={() => {setBatchSearchTerm(''); setFilterTeam('ALL');}} className="mt-6 px-6 py-3 bg-brand-50 text-brand-600 font-bold rounded-xl hover:bg-brand-100 transition-colors">Reset Filter</button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {processedBatches.map(batch => {
                        const team = teams.find(t => t.id === batch.teamId)?.name || 'Tim Dihapus';
                        const unresolved = documents.filter(d => d.batchId === batch.id && d.status === 'DIALOKASIKAN').length;
                        return (
                          <div key={batch.id} onClick={() => handleBatchClick(batch)} className="bg-white rounded-3xl p-8 border border-slate-200/60 shadow-sm hover:shadow-xl hover:border-brand-300 cursor-pointer transition-all duration-300 group relative overflow-hidden flex flex-col">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-brand-50 rounded-bl-full -z-10 group-hover:scale-125 transition-transform duration-500"></div>
                            <div className="flex justify-between items-start mb-6">
                              <div>
                                <h3 className="text-2xl font-black text-slate-800 tracking-tight mb-2 group-hover:text-brand-600 transition-colors">{batch.name}</h3>
                                <div className="flex flex-col gap-2">
                                  <span className="bg-slate-100 text-slate-500 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 w-max"><Users size={14}/> {team}</span>
                                  <span className="bg-brand-50 border border-brand-100 text-brand-600 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 w-max"><Calendar size={14}/> Tgl CI: {formatDate(batch.date)}</span>
                                </div>
                              </div>
                              <span className="bg-brand-500 text-white text-[10px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-md shadow-brand-500/30 mt-1">Aktif</span>
                            </div>
                            <div className="flex items-center gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-100 mt-auto">
                              <div className="flex-1"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Populasi</p><p className="text-xl font-black text-slate-700">{batch.population}</p></div>
                              <div className="w-px h-10 bg-slate-200"></div>
                              <div className="flex-1"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Gantung</p><p className={`text-xl font-black flex items-center gap-1.5 ${unresolved > 0 ? 'text-amber-500' : 'text-emerald-500'}`}>{unresolved > 0 ? unresolved : <span className="flex items-center gap-1"><CheckCircle2 size={20}/> Bersih</span>}</p></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            }

            const batchDocs = documents.filter(d => d.batchId === selectedBatch.id).sort((a,b) => parseInt(a.number) - parseInt(b.number));
            const filteredDocs = searchTerm ? batchDocs.filter(d => d.number.includes(searchTerm)) : batchDocs;
            const visibleDocsList = filteredDocs.slice(0, visibleCount);
            const unresolvedCount = batchDocs.filter(d => d.status === 'DIALOKASIKAN').length;

            return (
              <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                <button onClick={() => setSelectedBatch(null)} className="text-slate-500 hover:text-brand-600 text-sm font-bold flex items-center gap-2 mb-6 transition-all group w-max">
                  <div className="w-10 h-10 rounded-2xl bg-white border border-slate-200 flex items-center justify-center shadow-sm group-hover:-translate-x-1 transition-transform"><ChevronRight size={18} className="rotate-180" /></div>
                  Kembali ke Daftar Kandang
                </button>

                <div className="bg-slate-800 rounded-[2rem] p-8 md:p-10 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-8 relative overflow-hidden text-white">
                  <div className="absolute top-0 right-0 w-64 h-64 bg-brand-500/20 rounded-full blur-3xl -z-10 translate-x-1/2 -translate-y-1/2"></div>
                  <div>
                     <div className="flex flex-wrap items-center gap-4 mb-3">
                       <h2 className="text-4xl font-black tracking-tight">{selectedBatch.name}</h2>
                       <button onClick={() => setEditBatchModal({ isOpen: true, id: selectedBatch.id, name: selectedBatch.name, date: selectedBatch.date, population: selectedBatch.population })} className="bg-slate-700/50 hover:bg-indigo-500 text-white p-2 rounded-xl transition-all shadow-sm flex items-center gap-2 text-sm font-bold"><Edit size={16}/> Edit Kandang</button>
                       <span className="bg-brand-500 text-white text-[10px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-md">AKTIF</span>
                     </div>
                     <p className="text-slate-300 font-medium flex flex-wrap items-center gap-5 text-sm">
                       <span className="flex items-center gap-2"><Users size={16} className="text-slate-400"/> {teams.find(t=>t.id === selectedBatch.teamId)?.name}</span>
                       <span className="flex items-center gap-2"><Calendar size={16} className="text-slate-400"/> Tgl CI: {formatDate(selectedBatch.date)}</span>
                       <span className="flex items-center gap-2"><Activity size={16} className="text-slate-400"/> Populasi: {selectedBatch.population} Ekor</span>
                       <span className="flex items-center gap-2"><FileText size={16} className="text-slate-400"/> Total: {batchDocs.length} Dokumen</span>
                     </p>
                  </div>
                  <button onClick={handleCloseBatch} className={`w-full md:w-auto px-10 py-5 rounded-2xl font-black flex items-center justify-center gap-3 transition-all ${unresolvedCount === 0 ? 'bg-brand-500 text-white hover:bg-brand-400 shadow-lg shadow-brand-500/30 active:scale-95' : 'bg-slate-700 text-slate-500 cursor-not-allowed border border-slate-600'}`}>
                    <Archive size={24} /> Tutup Siklus Permanen
                  </button>
                </div>

                <div className="bg-white rounded-[2rem] p-5 border border-slate-200/60 shadow-sm flex flex-col lg:flex-row justify-between items-center gap-5 sticky top-4 z-20">
                   <div className="flex items-center justify-between lg:justify-start gap-4 bg-amber-50 px-6 py-4 rounded-2xl border border-amber-100 w-full lg:w-auto">
                     <div className="flex items-center gap-3">
                       <div className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></div>
                       <span className="text-amber-800 font-black text-sm tracking-wide">MENGGANTUNG</span>
                     </div>
                     <span className="text-amber-600 font-black text-xl">{unresolvedCount}</span>
                   </div>
                   
                   <div className="flex flex-col sm:flex-row gap-4 w-full lg:w-auto">
                      <div className="relative flex-1 sm:min-w-[250px]">
                        <Search size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input type="text" placeholder="Cari No. BTPA spesifik..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-semibold text-slate-700 transition-all" />
                      </div>
                      <div className="w-px h-12 bg-slate-200 hidden sm:block"></div>
                      <button onClick={() => handleBulkAction('TERPAKAI')} disabled={unresolvedCount===0} className="flex-1 sm:flex-none px-6 py-4 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-2xl hover:bg-emerald-100 font-black text-sm flex items-center justify-center gap-2 disabled:opacity-50 transition-all active:scale-95"><CheckSquare size={20}/> Selesai Semua</button>
                      <button onClick={() => handleBulkAction('DI_ADMIN')} disabled={unresolvedCount===0} className="flex-1 sm:flex-none px-6 py-4 bg-amber-50 border border-amber-200 text-amber-700 rounded-2xl hover:bg-amber-100 font-black text-sm flex items-center justify-center gap-2 disabled:opacity-50 transition-all active:scale-95"><Inbox size={20}/> Ke Laci Semua</button>
                   </div>
                </div>

                <div className="bg-white rounded-3xl shadow-sm border border-slate-200/60 overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse min-w-[700px]">
                      <thead>
                        <tr className="bg-slate-50/80 border-b border-slate-100 text-slate-500 text-xs uppercase tracking-widest font-bold">
                          <th className="px-8 py-5 w-20">No</th>
                          <th className="px-8 py-5">Identitas Dokumen</th>
                          <th className="px-8 py-5">Status Live</th>
                          <th className="px-8 py-5 text-right">Aksi Eksekusi Manual</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100/80">
                        {visibleDocsList.map((doc, idx) => (
                          <tr key={doc.id} className="hover:bg-slate-50/50 transition-colors group">
                            <td className="px-8 py-6 text-slate-400 font-bold">{idx + 1}</td>
                            <td className="px-8 py-6 font-black text-slate-800 font-mono text-2xl tracking-wider">#{doc.number}</td>
                            <td className="px-8 py-6">
                              {doc.status === 'DIALOKASIKAN' && <span className="bg-slate-100 text-slate-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-2 border border-slate-200"><Activity size={14}/> Di Lapangan</span>}
                              {doc.status === 'TERPAKAI' && <span className="bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-2 border border-emerald-200 shadow-sm"><CheckCircle2 size={14}/> Sah (Selesai)</span>}
                              {doc.status === 'DI_ADMIN' && <span className="bg-amber-100 text-amber-700 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-2 border border-amber-200 shadow-sm"><Inbox size={14}/> Sisa (Di Laci)</span>}
                            </td>
                            <td className="px-8 py-6 text-right">
                              {doc.status === 'DIALOKASIKAN' ? (
                                <div className="flex justify-end gap-3">
                                  <button onClick={() => handleUpdateDocStatus(doc.id, 'TERPAKAI')} className="px-6 py-3 bg-emerald-500 text-white rounded-xl hover:bg-emerald-400 font-black shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">Pakai Sah</button>
                                  <button onClick={() => handleUpdateDocStatus(doc.id, 'DI_ADMIN')} className="px-6 py-3 bg-amber-500 text-white rounded-xl hover:bg-amber-400 font-black shadow-lg shadow-amber-500/20 active:scale-95 transition-all">Sisa Laci</button>
                                </div>
                              ) : (
                                <button onClick={() => handleUpdateDocStatus(doc.id, 'DIALOKASIKAN')} className="px-6 py-3 bg-slate-100 border border-slate-200 text-slate-500 rounded-xl hover:bg-slate-200 hover:text-slate-700 font-bold transition-all shadow-sm active:scale-95 flex items-center gap-2 ml-auto"><Undo2 size={18}/> Batalkan</button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  {visibleCount < filteredDocs.length && <div className="p-8 bg-slate-50/50 border-t border-slate-100 text-center"><button onClick={() => setVisibleCount(p => p+50)} className="px-8 py-3.5 bg-white border border-slate-200 text-slate-600 font-bold rounded-2xl hover:bg-slate-50 shadow-sm transition-all">Tampilkan {filteredDocs.length - visibleCount} Baris Lainnya...</button></div>}
                </div>

                {/* Modal Edit Kandang */}
                {editBatchModal.isOpen && (
                  <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center z-[100] p-4 animate-in fade-in duration-200">
                     <div className="bg-white rounded-[2rem] max-w-lg w-full shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 duration-200 border border-slate-100">
                       <div className="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                         <h3 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3"><Edit size={24} className="text-brand-600"/> Edit Data Kandang</h3>
                         <button onClick={() => setEditBatchModal({ isOpen: false, id: '', name: '', date: '', population: '' })} className="text-slate-400 hover:text-slate-700 bg-white p-2 rounded-full border shadow-sm transition-all"><X size={20}/></button>
                       </div>
                       <form onSubmit={submitEditBatch}>
                         <div className="p-8 space-y-6">
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Nama Kandang</label>
                              <input type="text" value={editBatchModal.name} onChange={(e) => setEditBatchModal({...editBatchModal, name: e.target.value})} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-lg text-slate-800" />
                            </div>
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Tanggal Chick-in</label>
                              <input type="date" value={editBatchModal.date} onChange={(e) => setEditBatchModal({...editBatchModal, date: e.target.value})} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-lg text-slate-800" />
                            </div>
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Jumlah Populasi</label>
                              <input type="number" value={editBatchModal.population} onChange={(e) => setEditBatchModal({...editBatchModal, population: e.target.value})} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-lg text-slate-800" />
                            </div>
                         </div>
                         <div className="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                           <button type="button" onClick={() => setEditBatchModal({ isOpen: false, id: '', name: '', date: '', population: '' })} className="px-8 py-4 font-bold text-slate-600 bg-white border border-slate-200 rounded-2xl hover:bg-slate-100 transition-all">Batal</button>
                           <button type="submit" className="px-8 py-4 font-black text-white bg-brand-500 rounded-2xl shadow-lg shadow-brand-500/30 hover:bg-brand-600 active:scale-95 transition-all flex items-center gap-2"><CheckCircle2 size={20}/> Simpan Perubahan</button>
                         </div>
                       </form>
                     </div>
                  </div>
                )}
              </div>
            );
          };

          // ==========================================
          // 8. LACI ADMIN VIEW
          // ==========================================
          const LaciAdminView = () => {
            const [activeTab, setActiveTab] = useState('laci');
            const [givePenimbangModal, setGivePenimbangModal] = useState({ isOpen: false, teamId: null });
            const [penimbangForm, setPenimbangForm] = useState({ name: '', selectedDocs: new Set() });

            const drawerDocs = documents.filter(d => d.status === 'DI_ADMIN');
            const penimbangDocs = documents.filter(d => d.status === 'DI_PENIMBANG');

            const groupedDrawer = drawerDocs.reduce((acc, doc) => {
              if (!acc[doc.teamId]) acc[doc.teamId] = [];
              acc[doc.teamId].push(doc);
              return acc;
            }, {});

            const groupedPenimbang = penimbangDocs.reduce((acc, doc) => {
              if (!acc[doc.penimbangName]) acc[doc.penimbangName] = [];
              acc[doc.penimbangName].push(doc);
              return acc;
            }, {});

            const availableTeamDocs = givePenimbangModal.teamId ? (groupedDrawer[givePenimbangModal.teamId]?.sort((a,b) => parseInt(a.number) - parseInt(b.number)) || []) : [];

            const submitGiveToPenimbang = () => {
              if (!penimbangForm.name.trim() || penimbangForm.selectedDocs.size === 0) {
                fireAlert('Gagal', 'Pastikan nama Penimbang dan minimal 1 dokumen telah dipilih.', 'error'); return;
              }
              const selectedIds = penimbangForm.selectedDocs;
              setDocuments(docs => docs.map(d => selectedIds.has(d.id) ? { ...d, status: 'DI_PENIMBANG', penimbangName: penimbangForm.name.trim() } : d));
              setGivePenimbangModal({ isOpen: false, teamId: null });
              addToast(`Dokumen resmi dipindahkan ke tangan ${penimbangForm.name}`, 'success');
            };

            const handleReturnFromPenimbang = (docId) => {
              setDocuments(docs => docs.map(d => d.id === docId ? { ...d, status: 'DI_ADMIN', penimbangName: null } : d));
              addToast('Dokumen ditarik kembali ke Laci Utama Admin', 'success');
            };

            return (
              <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-8 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 bg-white p-6 md:p-10 rounded-[2rem] shadow-sm border border-slate-200/60">
                  <div className="flex items-center gap-5">
                    <div className="w-20 h-20 bg-gradient-to-br from-amber-100 to-orange-100 rounded-[1.25rem] flex items-center justify-center text-amber-600 shadow-inner"><Inbox size={40} /></div>
                    <div>
                      <h2 className="text-3xl font-black text-slate-800 tracking-tight mb-1">Gudang Inventaris</h2>
                      <p className="text-slate-500 font-medium">Pusat kontrol dokumen sisa dan pelacakan pemegang dokumen (Penimbang).</p>
                    </div>
                  </div>
                  
                  <div className="flex bg-slate-100 p-2 rounded-2xl w-full md:w-auto shadow-inner border border-slate-200/50">
                     <button onClick={() => setActiveTab('laci')} className={`flex-1 md:flex-none px-8 py-3.5 rounded-xl text-sm font-black uppercase tracking-widest transition-all duration-300 flex justify-center items-center gap-2 ${activeTab === 'laci' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}><Inbox size={18}/> Stok Internal</button>
                     <button onClick={() => setActiveTab('penimbang')} className={`flex-1 md:flex-none px-8 py-3.5 rounded-xl text-sm font-black uppercase tracking-widest transition-all duration-300 flex justify-center items-center gap-2 ${activeTab === 'penimbang' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}><UserCheck size={18}/> Di Penimbang</button>
                  </div>
                </div>

                {activeTab === 'laci' && (
                  <div className="animate-in slide-in-from-left-4 duration-300 fade-in">
                    {Object.keys(groupedDrawer).length === 0 ? (
                      <div className="bg-white rounded-[2rem] p-20 border-2 border-dashed border-slate-200/80 text-center"><Inbox className="mx-auto mb-6 text-slate-200" size={80} /><h3 className="text-2xl font-black text-slate-700 tracking-tight mb-2">Laci Sangat Bersih</h3><p className="text-slate-500 text-lg">Tidak ada tumpukan dokumen sisa di admin saat ini.</p></div>
                    ) : (
                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {Object.entries(groupedDrawer).map(([teamId, docs]) => {
                          const team = teams.find(t => t.id === teamId);
                          return (
                            <div key={teamId} className="bg-white rounded-3xl border border-slate-200/60 shadow-sm flex flex-col relative overflow-hidden group hover:shadow-lg hover:border-brand-200 transition-all duration-300">
                              <div className="absolute top-0 right-0 w-40 h-40 bg-slate-50 rounded-bl-full -z-10 group-hover:bg-brand-50/50 transition-colors duration-500"></div>
                              
                              <div className="p-8 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div>
                                  <h3 className="text-xl font-black text-slate-800 tracking-tight mb-1"><Users size={20} className="inline mr-2 text-slate-400"/> {team?.name || 'Tim Dihapus'}</h3>
                                  <span className="bg-slate-100 text-slate-500 px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider shadow-inner">{docs.length} Dokumen Laci</span>
                                </div>
                                <button onClick={() => { setGivePenimbangModal({isOpen:true, teamId}); setPenimbangForm({name: team?.penimbang || '', selectedDocs:new Set()}) }} className="w-full sm:w-auto bg-indigo-50 border border-indigo-200 text-indigo-700 px-5 py-3 rounded-xl font-black hover:bg-indigo-100 flex justify-center items-center gap-2 shadow-sm active:scale-95 transition-all group/btn">
                                  <Briefcase size={18} className="group-hover/btn:-translate-y-0.5 transition-transform"/> Serahkan ke Penimbang
                                </button>
                              </div>
                              
                              <div className="p-8 bg-slate-50/30 flex-1">
                                 <div className="flex flex-wrap gap-3 max-h-64 overflow-y-auto custom-scrollbar pr-2">
                                   {docs.map(d => <span key={d.id} className="bg-white border border-slate-200/80 px-4 py-2 rounded-xl text-sm font-mono font-bold text-slate-600 shadow-sm hover:border-emerald-300 hover:text-emerald-700 cursor-default transition-colors">#{d.number}</span>)}
                                 </div>
                              </div>
                            </div>
                          )
                        })}
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'penimbang' && (
                  <div className="animate-in slide-in-from-right-4 duration-300 fade-in">
                     {Object.keys(groupedPenimbang).length === 0 ? (
                      <div className="bg-white rounded-[2rem] p-20 border-2 border-dashed border-slate-200/80 text-center"><UserCheck className="mx-auto mb-6 text-slate-200" size={80} /><h3 className="text-2xl font-black text-slate-700 tracking-tight mb-2">Penimbang Kosong</h3><p className="text-slate-500 text-lg">Tidak ada dokumen yang sedang dipegang oleh Penimbang.</p></div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {Object.entries(groupedPenimbang).map(([penimbangName, docs]) => (
                          <div key={penimbangName} className="bg-white rounded-3xl border border-indigo-200/60 shadow-sm flex flex-col hover:shadow-lg transition-all">
                            <div className="p-6 border-b border-indigo-100 bg-indigo-50/50 flex flex-col gap-2 rounded-t-3xl">
                              <div className="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mb-1"><UserCheck size={24}/></div>
                              <h3 className="text-2xl font-black text-indigo-950 tracking-tight">{penimbangName}</h3>
                              <span className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest w-fit shadow-md shadow-indigo-600/30">Membawa {docs.length} Lembar</span>
                            </div>
                            
                            <div className="p-6 max-h-80 overflow-y-auto flex flex-col gap-3 custom-scrollbar">
                              {docs.map(d => (
                                <div key={d.id} className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 group">
                                  <div>
                                    <span className="font-mono font-black text-lg text-slate-800 tracking-wider block mb-1">#{d.number}</span>
                                    <span className="text-[10px] font-black text-slate-400 bg-white border border-slate-200 px-2 py-0.5 rounded-md uppercase tracking-wider shadow-sm">{teams.find(t=>t.id===d.teamId)?.name}</span>
                                  </div>
                                  <button onClick={() => handleReturnFromPenimbang(d.id)} className="text-xs font-black text-amber-700 bg-amber-50 hover:bg-amber-500 hover:text-white px-4 py-2.5 rounded-xl border border-amber-200 flex items-center gap-1.5 transition-all shadow-sm active:scale-95"><Undo2 size={16}/> Tarik</button>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* Modal Penimbang */}
                {givePenimbangModal.isOpen && (
                  <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center z-[100] p-4 animate-in fade-in duration-200">
                     <div className="bg-white rounded-[2rem] max-w-xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-200 border border-slate-100">
                       <div className="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                         <h3 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3"><Briefcase size={24} className="text-indigo-600"/> Handover Dokumen</h3>
                         <button onClick={() => setGivePenimbangModal({isOpen:false, teamId:null})} className="text-slate-400 hover:text-slate-700 bg-white p-2 rounded-full border shadow-sm transition-all"><X size={20}/></button>
                       </div>
                       
                       <div className="p-8 overflow-y-auto flex-1">
                         <div className="mb-8">
                           <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 pl-1">Nama Penerima (Penimbang)</label>
                           <input type="text" placeholder="Ketik nama..." className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all font-black text-slate-800 text-lg" value={penimbangForm.name} onChange={e => setPenimbangForm({...penimbangForm, name: e.target.value})}/>
                         </div>
                         
                         <div className="mb-4 flex justify-between items-end">
                           <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Pilih Dokumen Diserahkan</label>
                           <span className="text-xs font-black text-brand-700 bg-brand-100 px-3 py-1.5 rounded-lg shadow-sm">{penimbangForm.selectedDocs.size} Dipilih</span>
                         </div>
                         
                         <div className="bg-slate-50 border border-slate-200/80 p-5 rounded-2xl flex flex-wrap gap-2.5 max-h-64 overflow-y-auto custom-scrollbar">
                            {availableTeamDocs.map(d => {
                              const sel = penimbangForm.selectedDocs.has(d.id);
                              return <button key={d.id} onClick={() => {const set = new Set(penimbangForm.selectedDocs); sel ? set.delete(d.id) : set.add(d.id); setPenimbangForm({...penimbangForm, selectedDocs:set})}} className={`px-4 py-2 rounded-xl text-sm font-mono font-bold border transition-all active:scale-95 ${sel ? 'bg-brand-600 text-white border-brand-700 shadow-md shadow-brand-600/30' : 'bg-white text-slate-600 border-slate-200 hover:border-brand-300'}`}>{sel && <CheckCircle2 size={14} className="inline mr-1.5"/>}#{d.number}</button>
                            })}
                         </div>
                       </div>
                       
                       <div className="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                         <button onClick={() => setGivePenimbangModal({isOpen:false, teamId:null})} className="px-8 py-4 font-bold text-slate-600 bg-white border border-slate-200 rounded-2xl hover:bg-slate-100 transition-all">Batalkan</button>
                         <button onClick={submitGiveToPenimbang} className="px-8 py-4 font-black text-white bg-brand-500 rounded-2xl shadow-lg shadow-brand-500/30 hover:bg-brand-600 active:scale-95 transition-all flex items-center gap-2"><UserCheck size={20}/> Serahkan Resmi</button>
                       </div>
                     </div>
                  </div>
                )}
              </div>
            );
          };

          // ==========================================
          // RENDER UTAMA APLIKASI
          // ==========================================
          return (
            <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row font-sans text-slate-900 selection:bg-brand-200 selection:text-brand-900">
              
              {/* Mobile Header */}
              <div className="md:hidden bg-slate-900 text-white p-4 flex items-center gap-4 z-30 sticky top-0 shadow-lg">
                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2.5 bg-slate-800 rounded-xl hover:bg-slate-700 transition-colors active:scale-95 shrink-0">
                  {isMobileMenuOpen ? <X size={24} /> : <Menu size={24} />}
                </button>
                <h1 className="font-black text-2xl flex items-center gap-3 tracking-tight">
                   <div className="bg-gradient-to-br from-brand-400 to-brand-600 p-2 rounded-xl shadow-inner"><Files size={22} className="text-white"/></div> BTPA Monitor
                </h1>
              </div>

              {/* Sidebar */}
              <div className={`
                fixed inset-y-0 left-0 z-40 w-[300px] bg-white border-r border-slate-200/80 shadow-[10px_0_30px_rgba(0,0,0,0.05)] md:shadow-none transform transition-transform duration-500 ease-in-out md:relative md:translate-x-0 flex flex-col
                ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}
              `}>
                <div className="p-8 hidden md:block">
                  <h1 className="font-black text-3xl text-slate-800 flex items-center gap-4 tracking-tight">
                    <div className="bg-gradient-to-br from-brand-400 to-brand-600 p-3 rounded-[1.25rem] text-white shadow-lg shadow-brand-500/30">
                       <Files size={28}/>
                    </div>
                    Monitor BTPA
                  </h1>
                </div>

                {/* --- MASTER PENCARIAN GLOBAL --- */}
                <div className="px-5 mb-4 relative mt-4 md:mt-0 z-50">
                    <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <Search size={18} className="text-slate-400" />
                        </div>
                        <input 
                            type="text" 
                            placeholder="Cari No. BTPA, Kandang, Tim..." 
                            className="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-slate-700 text-sm transition-all shadow-inner"
                            value={globalSearch}
                            onChange={(e) => {
                                setGlobalSearch(e.target.value);
                                setShowSearchBox(e.target.value.length > 0);
                            }}
                            onFocus={() => { if(globalSearch) setShowSearchBox(true) }}
                            onBlur={() => setTimeout(() => setShowSearchBox(false), 200)}
                        />
                    </div>
                    
                    {/* Kotak Hasil Pencarian Lintas Data */}
                    {showSearchBox && (
                        <div className="absolute top-full left-5 right-5 mt-2 bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden max-h-80 overflow-y-auto z-[100] custom-scrollbar">
                            {searchResults.length === 0 ? (
                                <div className="p-6 text-center text-sm font-bold text-slate-400 flex flex-col items-center gap-2">
                                  <Search size={24} className="opacity-50"/>
                                  Tidak ada hasil ditemukan.
                                </div>
                            ) : (
                                searchResults.map(res => {
                                    let IconComponent = FileText;
                                    let iconColor = "text-amber-500 bg-amber-50 border-amber-100";
                                    
                                    if (res.type === 'BATCH') { IconComponent = Activity; iconColor = "text-brand-600 bg-brand-50 border-brand-100"; }
                                    else if (res.type === 'TEAM') { IconComponent = Users; iconColor = "text-indigo-600 bg-indigo-50 border-indigo-100"; }
                                    else { IconComponent = FileText; iconColor = "text-sky-600 bg-sky-50 border-sky-100"; }

                                    return (
                                        <div key={res.id} onMouseDown={() => handleGlobalSearchResultClick(res)} className="p-4 border-b border-slate-50 hover:bg-slate-50 transition-colors cursor-pointer flex gap-3 items-center group">
                                            <div className={`p-2 rounded-lg border ${iconColor} group-hover:scale-110 transition-transform`}>
                                              <IconComponent size={16}/>
                                            </div>
                                            <div>
                                              <div className="font-black text-slate-800 text-sm tracking-tight">{res.title}</div>
                                              <p className="text-[10px] font-bold text-slate-500 mt-0.5">{res.subtitle}</p>
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    )}
                </div>
                
                <div className="flex-1 overflow-y-auto py-2 px-5 space-y-2 custom-scrollbar">
                  <p className="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 mt-2 md:mt-0">Menu Utama</p>
                  <NavItem id="dashboard" label="Dasbor Analitik" icon={LayoutDashboard} />

                  <div className="my-6 border-t border-slate-100 mx-4"></div>

                  <p className="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Siklus Kandang</p>
                  <NavItem id="chick-in" label="1. Buka Kandang (Input)" icon={PlusCircle} />
                  <NavItem id="proses-panen" label="2. Proses Panen Aktif" icon={RefreshCw} />
                  <NavItem id="scan-massal" label="Scan Massal (Global)" icon={ClipboardPaste} />
                  
                  <div className="my-6 border-t border-slate-100 mx-4"></div>
                  
                  <p className="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Inventaris & Gudang</p>
                  <NavItem id="input-laci" label="Tambah Stok Laci" icon={Archive} />
                  <NavItem id="laci-admin" label="Gudang (Laci & PPL)" icon={Inbox} />
                  
                  <div className="my-6 border-t border-slate-100 mx-4"></div>
                  
                  <p className="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Manajemen Sistem</p>
                  <NavItem id="master-tim" label="Master Data Tim" icon={Users} />
                  <NavItem id="database" label="Backup & Restore" icon={Database} />
                </div>
                
                <div className="p-6 border-t border-slate-100 bg-slate-50/50">
                  <div className="bg-white p-4 rounded-2xl border border-slate-200 text-center shadow-sm">
                    <p className="text-xs font-black text-slate-700 tracking-tight">Sistem Digital BTPA</p>
                    <p className="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest">&copy; 2026 Teuku Muhammad Hafidh Rafif • <span className="text-brand-500 font-black">Auto-Save V5</span></p>
                  </div>
                </div>
              </div>

              {isMobileMenuOpen && <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 md:hidden transition-opacity duration-300" onClick={closeMobileMenu} />}

              {/* Main Content Area */}
              <div className="flex-1 overflow-y-auto bg-slate-50/50 md:h-screen relative custom-scrollbar">
                {activeMenu === 'dashboard' && <DashboardView />}
                {activeMenu === 'master-tim' && <MasterTimView />}
                {activeMenu === 'database' && <DatabaseView />}
                {activeMenu === 'input-laci' && <InputLaciView />}
                {activeMenu === 'chick-in' && <ChickInView />}
                {activeMenu === 'proses-panen' && <ProsesPanenView />}
                {activeMenu === 'laci-admin' && <LaciAdminView />}
                {activeMenu === 'scan-massal' && <ScanMassalView />}
              </div>

              {/* Global Alert / Custom Pop-up Modal */}
              {alertConfig.isOpen && (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-md flex items-center justify-center z-[100] p-4 animate-in fade-in duration-300">
                  <div className="bg-white rounded-[2rem] max-w-sm w-full p-8 shadow-2xl animate-in zoom-in-95 duration-300 border border-slate-100">
                    <div className={`w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner ${alertConfig.type === 'success' ? 'bg-emerald-50 text-emerald-500' : 'bg-red-50 text-red-500'}`}>
                      {alertConfig.type === 'success' ? <CheckCircle2 size={48} /> : <XCircle size={48} />}
                    </div>
                    <h3 className="text-3xl font-black text-center mb-2 tracking-tight text-slate-800">{alertConfig.title}</h3>
                    <p className="text-center text-slate-500 mb-8 font-medium leading-relaxed">{alertConfig.message}</p>
                    <button onClick={() => setAlertConfig({...alertConfig, isOpen: false})} className={`w-full text-white py-4 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all ${alertConfig.type === 'success' ? 'bg-brand-500 hover:bg-brand-600 shadow-brand-500/30' : 'bg-red-500 hover:bg-red-600 shadow-red-500/30'}`}>
                      Tutup Pesan
                    </button>
                  </div>
                </div>
              )}

              {/* Global Toast Notifications */}
              <div className="fixed top-6 right-6 z-[80] flex flex-col gap-3 pointer-events-none">
                {toasts.map(toast => (
                  <div key={toast.id} className={`pointer-events-auto flex items-center gap-4 px-6 py-4 rounded-2xl shadow-xl transform transition-all animate-in slide-in-from-right-8 duration-500 ${toast.type === 'success' ? 'bg-slate-800 text-white border border-slate-700' : 'bg-red-600 text-white'}`}>
                    {toast.type === 'success' ? <CheckCircle2 size={24} className="text-emerald-400" /> : <AlertCircle size={24} className="text-white" />}
                    <p className="text-sm font-bold tracking-wide">{toast.message}</p>
                  </div>
                ))}
              </div>

              {/* Global CSS Overrides */}
              <style dangerouslySetInnerHTML={{__html: `
                .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
                .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
                .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 12px; }
                .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
                input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
              `}} />
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
