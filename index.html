                                className="w-full h-64 p-5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm shadow-inner resize-none transition-all" 
                                placeholder="Paste data Anda di sini...&#10;Contoh:&#10;16277&#10;16278&#10;16248..."
                            ></textarea>
                            
                            <div className="flex justify-end mt-6">
                                <button onClick={handleProcess} disabled={!inputText.trim()} className="px-8 py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md shadow-indigo-200 hover:bg-indigo-700 disabled:opacity-50 disabled:shadow-none transition-all flex items-center gap-2"><Icon name="Play" size={20} className="fill-current"/> Proses Semua Nomor</button>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- VIEW: LACI ADMIN & PENIMBANG ---
            const LaciAdminView = () => {
                const [tab, setTab] = useState('laci');
                const [handoverModal, setHandoverModal] = useState({ isOpen: false, teamId: null, penimbangName: '' });
                const [handoverRanges, setHandoverRanges] = useState([{from:'', to:''}]);
                
                const laciDocs = documents.filter(d => d.status === 'DI_ADMIN');
                const penimDocs = documents.filter(d => d.status === 'DI_PENIMBANG');

                const groupLaci = laciDocs.reduce((a,c) => { if(!a[c.teamId]) a[c.teamId]=[]; a[c.teamId].push(c); return a; }, {});
                const groupPenim = penimDocs.reduce((a,c) => { if(!a[c.penimbangName]) a[c.penimbangName]=[]; a[c.penimbangName].push(c); return a; }, {});

                const handleHandover = () => {
                    let numToUpdate = [];
                    for(const r of handoverRanges) {
                        const f = parseInt(r.from); const t = parseInt(r.to);
                        if(isNaN(f)||isNaN(t)||f>t) continue;
                        for(let i=f; i<=t; i++) numToUpdate.push(i.toString());
                    }
                    if(numToUpdate.length===0) return fireAlert('Gagal','Rentang tidak valid/kosong','error');

                    let updated = 0;
                    const newDocs = documents.map(d => {
                        if(d.teamId === handoverModal.teamId && d.status === 'DI_ADMIN' && numToUpdate.includes(d.number)) {
                            updated++; return { ...d, status: 'DI_PENIMBANG', penimbangName: handoverModal.penimbangName };
                        }
                        return d;
                    });

                    if(updated===0) return fireAlert('Gagal','Nomor yang diketik tidak ditemukan di Laci Tim ini.','error');
                    
                    setDocuments(newDocs);
                    setHandoverModal({isOpen:false}); setHandoverRanges([{from:'',to:''}]);
                    addToast(`${updated} lembar diserahkan ke ${handoverModal.penimbangName}`,'success');
                };

                return (
                    <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-6 fade-in">
                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center shadow-inner"><Icon name="Inbox" size={28}/></div>
                                <div><h2 className="text-2xl font-bold text-slate-800">Gudang Inventaris</h2><p className="text-sm font-semibold text-slate-500 mt-0.5">Pantau Laci Admin & Dokumen di Penimbang</p></div>
                            </div>
                            <div className="flex bg-slate-100 p-1.5 rounded-xl border border-slate-200 w-full md:w-auto">
                                <button onClick={()=>setTab('laci')} className={`flex-1 md:flex-none px-6 py-2.5 text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${tab==='laci'?'bg-white shadow-sm text-slate-800':'text-slate-500'}`}><Icon name="Inbox" size={16}/> Laci Internal</button>
                                <button onClick={()=>setTab('penim')} className={`flex-1 md:flex-none px-6 py-2.5 text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${tab==='penim'?'bg-white shadow-sm text-slate-800':'text-slate-500'}`}><Icon name="UserCheck" size={16}/> Di Penimbang</button>
                            </div>
                        </div>

                        {tab === 'laci' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 fade-in">
                                {Object.keys(groupLaci).length === 0 ? (
                                    <div className="col-span-1 md:col-span-2 p-12 text-center bg-white rounded-2xl border-2 border-dashed border-slate-200"><Icon name="Inbox" size={48} className="mx-auto text-slate-300 mb-4"/><p className="text-lg font-bold text-slate-600">Laci sangat bersih.</p></div>
                                ) : Object.entries(groupLaci).map(([teamId, docs]) => {
                                    const team = teams.find(t=>t.id===teamId);
                                    return (
                                    <div key={teamId} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col group hover:border-amber-200 transition-all">
                                        <div className="flex justify-between items-start mb-4 border-b border-slate-100 pb-4">
                                            <div><h3 className="font-bold text-slate-800 text-lg flex items-center gap-2"><Icon name="Users" size={18} className="text-slate-400"/> {team?.name}</h3><p className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded w-max mt-2 border border-amber-100">{docs.length} Lembar</p></div>
                                            <button onClick={()=>setHandoverModal({isOpen:true, teamId, penimbangName: team?.penimbang || ''})} className="text-xs bg-indigo-50 border border-indigo-200 text-indigo-700 px-4 py-2 font-bold rounded-xl hover:bg-indigo-100 transition-all flex items-center gap-1.5 shadow-sm active:scale-95"><Icon name="Briefcase" size={14}/> Handover Penimbang</button>
                                        </div>
                                        <div className="flex flex-wrap gap-2 max-h-48 overflow-y-auto custom-scrollbar pr-2">
                                            {docs.map(d=><span key={d.id} className="text-sm bg-slate-50 border border-slate-200 px-3 py-1.5 font-mono font-semibold rounded-lg text-slate-600 shadow-sm cursor-default hover:bg-white transition-colors">#{d.number}</span>)}
                                        </div>
                                    </div>
                                )})}
                            </div>
                        )}

                        {tab === 'penim' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 fade-in">
                                {Object.keys(groupPenim).length === 0 ? (
                                    <div className="col-span-full p-12 text-center bg-white rounded-2xl border-2 border-dashed border-slate-200"><Icon name="UserCheck" size={48} className="mx-auto text-slate-300 mb-4"/><p className="text-lg font-bold text-slate-600">Tidak ada dokumen di Penimbang.</p></div>
                                ) : Object.entries(groupPenim).map(([pName, docs]) => (
                                    <div key={pName} className="bg-white rounded-2xl border border-indigo-200 shadow-sm flex flex-col overflow-hidden hover:shadow-md transition-all">
                                        <div className="p-5 bg-indigo-50/50 border-b border-indigo-100">
                                            <h3 className="font-bold text-lg text-indigo-900 flex items-center gap-2 mb-2"><Icon name="UserCheck" size={20} className="text-indigo-500"/> {pName}</h3>
                                            <span className="text-[10px] font-bold text-white bg-indigo-500 px-2 py-1 rounded shadow-sm">Membawa {docs.length} Lembar</span>
                                        </div>
                                        <div className="p-4 bg-slate-50/30 flex-1 overflow-y-auto max-h-80 custom-scrollbar space-y-2">
                                            {docs.map(d=>(
                                                <div key={d.id} className="flex justify-between items-center bg-white p-3 border border-slate-200 rounded-xl shadow-sm hover:border-indigo-200 transition-colors">
                                                    <div>
                                                        <span className="font-mono text-base font-bold text-slate-800">#{d.number}</span>
                                                        <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">{teams.find(t=>t.id===d.teamId)?.name}</p>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={()=>{setDocuments(documents.map(x=>x.id===d.id?{...x,status:'TERPAKAI'}:x)); addToast('Terpakai','success')}} className="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-100 active:scale-95 transition-all shadow-sm">Sah</button>
                                                        <button onClick={()=>{setDocuments(documents.map(x=>x.id===d.id?{...x,status:'DI_ADMIN',penimbangName:null}:x)); addToast('Ditarik','success')}} className="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-lg font-bold hover:bg-amber-100 active:scale-95 transition-all shadow-sm flex items-center gap-1"><Icon name="Undo2" size={12}/> Tarik</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Modal Handover ke Penimbang (Dengan Fitur Rentang) */}
                        {handoverModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[100] fade-in">
                                <div className="bg-white rounded-2xl p-6 w-full max-w-lg shadow-xl">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2"><Icon name="Briefcase" size={20} className="text-indigo-600"/> Handover Dokumen</h3>
                                        <button onClick={()=>setHandoverModal({isOpen:false})} className="text-slate-400 hover:text-slate-700"><Icon name="X" size={20}/></button>
                                    </div>
                                    
                                    <div className="mb-6">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 block">Nama Penimbang</label>
                                        <input type="text" value={handoverModal.penimbangName} onChange={e=>setHandoverModal({...handoverModal, penimbangName: e.target.value})} className="w-full border border-slate-200 bg-slate-50 p-3 rounded-xl font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500" />
                                    </div>

                                    <div className="mb-2">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block">Pilih Rentang Laci yang Diserahkan</label>
                                    </div>
                                    
                                    <div className="space-y-3 max-h-48 overflow-y-auto custom-scrollbar p-1">
                                        {handoverRanges.map((r, i)=>(
                                            <div key={i} className="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                                <input type="number" placeholder="Mulai" value={r.from} onChange={e=>{const n=[...handoverRanges]; n[i].from=e.target.value; setHandoverRanges(n)}} className="w-full border border-slate-200 bg-white p-2 rounded-lg text-sm font-mono font-bold outline-none focus:ring-2 focus:ring-indigo-500"/>
                                                <span className="text-slate-400 font-bold">-</span>
                                                <input type="number" placeholder="Sampai" value={r.to} onChange={e=>{const n=[...handoverRanges]; n[i].to=e.target.value; setHandoverRanges(n)}} className="w-full border border-slate-200 bg-white p-2 rounded-lg text-sm font-mono font-bold outline-none focus:ring-2 focus:ring-indigo-500"/>
                                                <button onClick={()=>setHandoverRanges(handoverRanges.filter((_,idx)=>idx!==i))} disabled={handoverRanges.length===1} className="text-slate-400 hover:text-red-500 disabled:opacity-30"><Icon name="Trash2" size={18}/></button>
                                            </div>
                                        ))}
                                        <button onClick={()=>setHandoverRanges([...handoverRanges,{from:'',to:''}])} className="text-xs text-indigo-600 font-bold flex items-center gap-1 hover:text-indigo-800"><Icon name="PlusCircle" size={14}/> Tambah Baris Rentang</button>
                                    </div>

                                    <div className="flex gap-3 justify-end mt-8 pt-4 border-t border-slate-100">
                                        <button onClick={()=>setHandoverModal({isOpen:false})} className="px-5 py-2.5 font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Batal</button>
                                        <button onClick={handleHandover} className="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 flex items-center gap-2"><Icon name="UserCheck" size={18}/> Serahkan ke Penimbang</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // --- VIEW: MONITOR TIM ---
            const MonitorTimView = () => {
                const [selectedTeam, setSelectedTeam] = useState(teams[0]?.id || '');
                if(teams.length === 0) return <div className="p-12 text-center text-slate-400 font-bold text-lg"><Icon name="BarChart3" size={48} className="mx-auto mb-4 opacity-30"/>Belum ada tim didaftarkan.</div>;

                const tDocs = documents.filter(d => d.teamId === selectedTeam);
                const teamBatches = batches.filter(b => b.teamId === selectedTeam);
                const sSelesai = tDocs.filter(d=>d.status==='TERPAKAI').length;
                const sGantung = tDocs.filter(d=>d.status==='DIALOKASIKAN').length;
                const sLaci = tDocs.filter(d=>d.status==='DI_ADMIN').length;
                const sPenim = tDocs.filter(d=>d.status==='DI_PENIMBANG').length;
                const tot = tDocs.length;

                const pS = tot? (sSelesai/tot)*100 : 0;
                const pG = tot? (sGantung/tot)*100 : 0;
                const pL = tot? (sLaci/tot)*100 : 0;
                const pP = tot? (sPenim/tot)*100 : 0;

                return (
                    <div className="flex flex-col lg:flex-row h-full fade-in">
                        {/* Internal Sidebar */}
                        <div className="w-full lg:w-72 bg-white border-r border-slate-200 p-6 flex flex-col gap-2 overflow-y-auto">
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 px-2">Pilih Dasbor Tim</p>
                            {teams.map(t=>(
                                <button key={t.id} onClick={()=>setSelectedTeam(t.id)} className={`text-left px-4 py-3.5 rounded-xl font-bold transition-all flex items-center justify-between text-sm ${selectedTeam===t.id?'bg-slate-800 text-white shadow-md':'text-slate-600 hover:bg-slate-50 border border-slate-100 hover:border-slate-200'}`}>
                                    <span className="flex items-center gap-3"><Icon name="Users" size={16} className={selectedTeam===t.id?'text-slate-300':'text-slate-400'}/> {t.name}</span>
                                    {selectedTeam===t.id && <Icon name="ChevronRight" size={16}/>}
                                </button>
                            ))}
                        </div>
                        {/* Dasbor Area */}
                        <div className="flex-1 p-4 md:p-8 space-y-6 overflow-y-auto bg-slate-50/50">
                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-5">
                                <div className="w-16 h-16 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center shadow-inner"><Icon name="BarChart3" size={32}/></div>
                                <div><h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">{teams.find(t=>t.id===selectedTeam)?.name}</h2><p className="text-sm font-semibold text-slate-500 mt-1">Analitik lengkap sirkulasi dokumen BTPA tim terkait.</p></div>
                            </div>

                            {tot === 0 ? (
                                <div className="bg-white p-12 text-center rounded-2xl border-2 border-dashed border-slate-200 text-slate-400"><Icon name="Activity" size={48} className="mx-auto mb-4 opacity-30"/><p className="text-lg font-bold text-slate-600">Belum ada transaksi</p></div>
                            ) : (
                                <>
                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4 md:gap-6">
                                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden"><Icon name="FileText" size={80} className="absolute -right-4 -bottom-4 text-slate-50"/><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 relative z-10">Total Dokumen</p><p className="text-3xl font-black text-slate-800 relative z-10">{tot}</p></div>
                                        <div className="bg-emerald-500 text-white p-5 rounded-2xl shadow-md shadow-emerald-200 relative overflow-hidden"><Icon name="CheckCircle2" size={80} className="absolute -right-4 -bottom-4 text-emerald-400/50"/><p className="text-[10px] font-bold text-emerald-100 uppercase tracking-widest mb-1 relative z-10">Selesai</p><p className="text-3xl font-black relative z-10">{sSelesai}</p></div>
                                        <div className="bg-amber-500 text-white p-5 rounded-2xl shadow-md shadow-amber-200 relative overflow-hidden"><Icon name="Inbox" size={80} className="absolute -right-4 -bottom-4 text-amber-400/50"/><p className="text-[10px] font-bold text-amber-100 uppercase tracking-widest mb-1 relative z-10">Di Laci</p><p className="text-3xl font-black relative z-10">{sLaci}</p></div>
                                        <div className="bg-indigo-500 text-white p-5 rounded-2xl shadow-md shadow-indigo-200 relative overflow-hidden"><Icon name="UserCheck" size={80} className="absolute -right-4 -bottom-4 text-indigo-400/50"/><p className="text-[10px] font-bold text-indigo-100 uppercase tracking-widest mb-1 relative z-10">Di Penimbang</p><p className="text-3xl font-black relative z-10">{sPenim}</p></div>
                                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden"><Icon name="Activity" size={80} className="absolute -right-4 -bottom-4 text-slate-50"/><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 relative z-10">Gantung</p><p className="text-3xl font-black text-slate-800 relative z-10">{sGantung}</p></div>
                                    </div>
                                    
                                    <div className="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="flex justify-between items-center mb-6"><h3 className="font-bold text-lg text-slate-800">Distribusi Status</h3><span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded uppercase tracking-widest">100% Total Kapasitas</span></div>
                                        <div className="h-10 flex rounded-xl overflow-hidden bg-slate-100 shadow-inner mb-6">
                                            <div style={{width:`${pS}%`}} className="bg-emerald-500 h-full flex items-center justify-center text-[10px] font-bold text-white overflow-hidden transition-all">{pS>5&&`${pS.toFixed(0)}%`}</div>
                                            <div style={{width:`${pL}%`}} className="bg-amber-500 h-full flex items-center justify-center text-[10px] font-bold text-white overflow-hidden transition-all">{pL>5&&`${pL.toFixed(0)}%`}</div>
                                            <div style={{width:`${pP}%`}} className="bg-indigo-500 h-full flex items-center justify-center text-[10px] font-bold text-white overflow-hidden transition-all">{pP>5&&`${pP.toFixed(0)}%`}</div>
                                            <div style={{width:`${pG}%`}} className="bg-slate-300 h-full flex items-center justify-center text-[10px] font-bold text-slate-600 overflow-hidden transition-all">{pG>5&&`${pG.toFixed(0)}%`}</div>
                                        </div>
                                        <div className="flex flex-wrap gap-4 text-xs font-bold text-slate-600">
                                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-emerald-500"></div>Selesai</div>
                                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-amber-500"></div>Di Laci</div>
                                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-indigo-500"></div>Penimbang</div>
                                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded bg-slate-300"></div>Gantung</div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden flex flex-col">
                                            <div className="p-5 bg-slate-50 border-b border-slate-100"><h3 className="font-bold text-slate-800">Riwayat Kandang</h3></div>
                                            <div className="overflow-x-auto flex-1">
                                                <table className="w-full text-left text-sm"><thead className="bg-white border-b border-slate-100 text-[10px] font-bold text-slate-400 uppercase tracking-widest"><tr><th className="p-4">Kandang</th><th className="p-4">Tgl</th><th className="p-4">Sts</th></tr></thead>
                                                <tbody className="divide-y divide-slate-50">
                                                    {teamBatches.map(b=>(<tr key={b.id} className="hover:bg-slate-50"><td className="p-4 font-bold text-slate-700">{b.name}</td><td className="p-4 text-slate-500 font-semibold">{b.date}</td><td className="p-4"><span className={`text-[10px] font-bold px-2 py-1 rounded border ${b.status==='AKTIF'?'bg-emerald-50 text-emerald-600 border-emerald-200':'bg-slate-100 text-slate-500 border-slate-200'}`}>{b.status}</span></td></tr>))}
                                                </tbody></table>
                                            </div>
                                        </div>
                                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col">
                                            <div className="p-5 bg-slate-50 border-b border-slate-100"><h3 className="font-bold text-slate-800">Log Dokumen (Semua)</h3></div>
                                            <div className="p-5 flex-1 max-h-[300px] overflow-y-auto custom-scrollbar">
                                                <div className="flex flex-wrap gap-2">
                                                    {tDocs.map(d=>{
                                                        let color = 'bg-slate-50 border-slate-200 text-slate-500'; 
                                                        if (d.status === 'TERPAKAI') color = 'bg-emerald-50 border-emerald-200 text-emerald-700 shadow-sm';
                                                        if (d.status === 'DIALOKASIKAN') color = 'bg-white border-slate-200 text-slate-700 shadow-sm';
                                                        if (d.status === 'DI_ADMIN') color = 'bg-amber-50 border-amber-200 text-amber-700 shadow-sm';
                                                        if (d.status === 'DI_PENIMBANG') color = 'bg-indigo-50 border-indigo-200 text-indigo-700 shadow-sm';
                                                        return <span key={d.id} className={`px-2.5 py-1 border rounded text-xs font-mono font-bold cursor-default ${color}`} title={d.status}>#{d.number}</span>
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-50 font-sans text-slate-900 selection:bg-emerald-200">
                    
                    {/* Header Mobile */}
                    <div className="md:hidden bg-slate-900 p-4 flex justify-between items-center border-b z-30 sticky top-0 shadow-sm">
                        <h1 className="font-black text-xl flex items-center gap-2 text-white tracking-tight"><div className="bg-emerald-500 p-1.5 rounded-lg"><Icon name="Activity" size={20} className="text-white"/></div> BTPA Hub</h1>
                        <button onClick={()=>setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-slate-800 rounded-xl text-white"><Icon name={isMobileMenuOpen?'X':'Menu'} size={24}/></button>
                    </div>

                    {/* Sidebar */}
                    <div className={`fixed inset-y-0 left-0 z-40 w-72 bg-white border-r border-slate-200 transform ${isMobileMenuOpen?'translate-x-0':'-translate-x-full'} md:relative md:translate-x-0 transition-transform duration-300 flex flex-col shadow-2xl md:shadow-none`}>
                        <div className="p-6 hidden md:block">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-500 p-2.5 rounded-xl text-white shadow-lg shadow-emerald-200"><Icon name="Activity" size={24}/></div>
                                <h1 className="font-black text-2xl tracking-tight text-slate-800">BTPA Hub</h1>
                            </div>
                        </div>

                        {/* Search Quick Action */}
                        <div className="px-5 mb-4 relative z-50">
                            <div className="relative flex items-center">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <Icon name="Search" size={16} className="text-slate-400" />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="Pencarian Cepat..." 
                                    value={globalSearch} 
                                    onFocus={()=>setShowSearchBox(true)} 
                                    onChange={e=>setGlobalSearch(e.target.value)} 
                                    className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all placeholder:text-slate-400 shadow-sm" 
                                />
                            </div>
                            
                            {/* Hasil Pencarian Pop-up */}
                            {showSearchBox && globalSearch && (
                                <div className="absolute top-14 left-5 right-5 bg-white border border-slate-200 rounded-xl shadow-2xl p-2 max-h-72 overflow-y-auto z-50">
                                    <div className="flex justify-between items-center mb-2 px-2 pb-2 border-b border-slate-100">
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">HASIL PELACAKAN</span>
                                        <button onClick={()=>{setShowSearchBox(false);setGlobalSearch('');}} className="text-slate-400 hover:text-slate-700 bg-slate-50 p-1 rounded-md transition-colors"><Icon name="X" size={14}/></button>
                                    </div>
                                    {searchResults.length === 0 ? (
                                        <div className="text-center p-6">
                                            <Icon name="SearchX" size={24} className="mx-auto text-slate-300 mb-2" />
                                            <p className="text-xs text-slate-500 font-semibold">Nomor "{globalSearch}" tidak terdaftar di sistem.</p>
                                        </div>
                                    ) : searchResults.map(d => (
                                        <div key={d.id} className="p-3 hover:bg-slate-50 rounded-lg border border-transparent hover:border-slate-100 mb-1 last:mb-0 transition-colors">
                                            <div className="flex justify-between items-center mb-1.5">
                                                <p className="font-mono font-bold text-base text-slate-800">#{d.number}</p>
                                                <span className={`text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-widest border ${d.status === 'TERPAKAI' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : d.status === 'DI_ADMIN' ? 'bg-amber-50 text-amber-600 border-amber-200' : d.status === 'DI_PENIMBANG' ? 'bg-indigo-50 text-indigo-600 border-indigo-200' : 'bg-slate-50 text-slate-600 border-slate-200 shadow-sm'}`}>
                                                    {d.status === 'DIALOKASIKAN' ? 'LAPANGAN' : d.status.replace('_', ' ')}
                                                </span>
                                            </div>
                                            <div className="flex flex-col gap-1 mt-2">
                                                <p className="text-[10px] text-slate-500 font-bold flex items-center gap-1.5"><Icon name="Users" size={12} className="text-slate-400"/> Pemilik: {d.teamName}</p>
                                                {d.status === 'DI_PENIMBANG' && d.penimbangName && <p className="text-[10px] text-indigo-600 font-bold flex items-center gap-1.5"><Icon name="UserCheck" size={12}/> Dibawa: {d.penimbangName}</p>}
                                                {d.status === 'DIALOKASIKAN' && d.batchName && <p className="text-[10px] text-slate-600 font-bold flex items-center gap-1.5"><Icon name="FileText" size={12}/> Posisi: {d.batchName}</p>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="flex-1 overflow-y-auto px-4 space-y-1 custom-scrollbar">
                            <p className="px-3 text-[10px] font-bold text-slate-400 mt-2 mb-2 uppercase tracking-widest">SIKLUS</p>
                            <button onClick={()=>{setActiveMenu('chick-in');closeMobileMenu()}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeMenu==='chick-in'?'bg-emerald-50 text-emerald-600':'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><Icon name="PlusCircle" size={18}/> Chick-in (Input)</button>
                            <button onClick={()=>{setActiveMenu('proses-panen');closeMobileMenu()}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeMenu==='proses-panen'?'bg-emerald-50 text-emerald-600':'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><Icon name="RefreshCw" size={18}/> Proses Panen</button>
                            <button onClick={()=>{setActiveMenu('scan-massal');closeMobileMenu()}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeMenu==='scan-massal'?'bg-indigo-50 text-indigo-600':'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><Icon name="CheckSquare" size={18}/> Scan Massal (Global)</button>
                            
                            <p className="px-3 text-[10px] font-bold text-slate-400 mt-6 mb-2 uppercase tracking-widest">INVENTARIS</p>
                            <button onClick={()=>{setActiveMenu('input-laci');closeMobileMenu()}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeMenu==='input-laci'?'bg-emerald-50 text-emerald-600':'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><Icon name="Archive" size={18}/> Tambah Stok Laci</button>
                            <button onClick={()=>{setActiveMenu('laci-admin');closeMobileMenu()}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeMenu==='laci-admin'?'bg-emerald-50 text-emerald-600':'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><Icon name="Inbox" size={18}/> Laci & PPL</button>
                            <button onClick={()=>{setActiveMenu('monitor-tim');closeMobileMenu()}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeMenu==='monitor-tim'?'bg-emerald-50 text-emerald-600':'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><Icon name="BarChart3" size={18}/> Monitor Tim</button>
                            
                            <p className="px-3 text-[10px] font-bold text-slate-400 mt-6 mb-2 uppercase tracking-widest">SISTEM</p>
                            <button onClick={()=>{setActiveMenu('master-tim');closeMobileMenu()}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeMenu==='master-tim'?'bg-emerald-50 text-emerald-600':'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><Icon name="Users" size={18}/> Master Tim</button>
                            <button onClick={()=>{setActiveMenu('database');closeMobileMenu()}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeMenu==='database'?'bg-emerald-50 text-emerald-600':'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><Icon name="Database" size={18}/> Backup & Restore</button>
                        </div>
                        
                        {/* Copyright Area */}
                        <div className="p-6 border-t border-slate-100">
                            <div className="bg-slate-50 p-4 rounded-xl text-center border border-slate-100">
                                <p className="text-xs font-bold text-slate-600 tracking-tight">Sistem BTPA v2.0</p>
                                <p className="text-[10px] font-semibold text-slate-400 mt-1">&copy; {new Date().getFullYear()} Teuku Muhammad Hafidh Rafif</p>
                            </div>
                        </div>
                    </div>

                    {isMobileMenuOpen && <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 md:hidden" onClick={closeMobileMenu}></div>}

                    {/* Main Content Render */}
                    <div className="flex-1 overflow-y-auto h-screen relative custom-scrollbar">
                        {activeMenu === 'master-tim' && <MasterTimView />}
                        {activeMenu === 'database' && <DatabaseView />}
                        {activeMenu === 'input-laci' && <InputLaciView />}
                        {activeMenu === 'chick-in' && <ChickInView />}
                        {activeMenu === 'proses-panen' && <ProsesPanenView />}
                        {activeMenu === 'scan-massal' && <ScanMassalView />}
                        {activeMenu === 'laci-admin' && <LaciAdminView />}
                        {activeMenu === 'monitor-tim' && <MonitorTimView />}
                    </div>

                    {/* Global Custom Alert Modal */}
                    {alertConfig.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[200] p-4 fade-in">
                            <div className={`bg-white rounded-3xl max-w-sm w-full p-8 text-center shadow-2xl border-t-8 ${alertConfig.type === 'success' ? 'border-emerald-500' : 'border-red-500'}`}>
                                <div className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner ${alertConfig.type === 'success' ? 'bg-emerald-100 text-emerald-500' : 'bg-red-100 text-red-500'}`}>
                                    <Icon name={alertConfig.type === 'success' ? 'CheckCircle2' : 'XCircle'} size={40} />
                                </div>
                                <h3 className="text-2xl font-black text-slate-800 mb-3 tracking-tight">{alertConfig.title}</h3>
                                <p className="text-slate-500 mb-8 font-medium leading-relaxed text-sm whitespace-pre-line">{alertConfig.message}</p>
                                <button onClick={() => setAlertConfig({...alertConfig, isOpen: false})} className={`w-full text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-all ${alertConfig.type === 'success' ? 'bg-emerald-500 hover:bg-emerald-600 shadow-emerald-200' : 'bg-red-500 hover:bg-red-600 shadow-red-200'}`}>Tutup Pesan</button>
                            </div>
                        </div>
                    )}

                    {/* Global Toasts */}
                    <div className="fixed top-4 right-4 z-[300] flex flex-col gap-3 pointer-events-none">
                        {toasts.map(t => (
                            <div key={t.id} className={`pointer-events-auto flex items-center gap-3 px-5 py-4 rounded-2xl shadow-xl fade-in border ${t.type === 'success' ? 'bg-white text-emerald-700 border-emerald-100' : 'bg-red-600 text-white border-transparent'}`}>
                                <Icon name={t.type === 'success' ? 'CheckCircle2' : 'AlertCircle'} size={20} className={t.type === 'success' ? "text-emerald-500" : "text-white"}/>
                                <p className="text-sm font-bold tracking-wide">{t.message}</p>
                            </div>
                        ))}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
