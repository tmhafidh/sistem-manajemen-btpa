<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen BTPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Inter', system-ui, sans-serif;}
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            Menu, X, Users, PlusCircle, Inbox, Activity, 
            Trash2, CheckCircle2, XCircle, AlertCircle, 
            RefreshCw, CheckSquare, Archive, ChevronRight,
            Calendar, Hash, ListOrdered, FileText, BarChart3, Search, Play,
            Database, Download, Upload, AlertTriangle, UserCheck, Briefcase, Undo2, Edit
        } from 'https://esm.sh/lucide-react@0.292.0';

        const generateId = () => Math.random().toString(36).substr(2, 9);

        function App() {
            const [activeMenu, setActiveMenu] = useState('chick-in');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [alertConfig, setAlertConfig] = useState({ isOpen: false, title: '', message: '', type: 'success' });
            
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const searchInputRef = useRef(null);
            
            const [teams, setTeams] = useState([
                { id: 't1', name: 'Agus - Budi', ppl: 'Agus', penimbang: 'Budi' },
                { id: 't2', name: 'Cipto - Doni', ppl: 'Cipto', penimbang: 'Doni' }
            ]);
            const [batches, setBatches] = useState([]); 
            const [documents, setDocuments] = useState([]); 
            
            const addToast = (message, type = 'success') => {
                const id = generateId();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };

            const fireAlert = (title, message, type = 'success') => {
                setAlertConfig({ isOpen: true, title, message, type });
            };

            const closeMobileMenu = () => setIsMobileMenuOpen(false);

            const getTeamName = (id) => teams.find(t => t.id === id)?.name || 'Tim Dihapus';
            const getBatchName = (id) => batches.find(b => b.id === id)?.name || 'Kandang Tidak Diketahui';

            const searchResults = useMemo(() => {
                if (!searchQuery.trim()) return [];
                return documents.filter(d => d.number.includes(searchQuery)).slice(0, 10);
            }, [searchQuery, documents]);

            // --- KOMPONEN SIDEBAR ITEM ---
            const NavItem = ({ id, label, icon: Icon }) => {
                const isActive = activeMenu === id;
                return (
                    <button
                        onClick={() => { setActiveMenu(id); closeMobileMenu(); }}
                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg transition-all duration-200 text-sm font-medium ${
                            isActive 
                                ? 'bg-emerald-50 text-emerald-600 font-semibold' 
                                : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                        }`}
                    >
                        <Icon size={18} className={isActive ? "text-emerald-600" : "text-slate-400"} />
                        <span>{label}</span>
                    </button>
                );
            };

            // --- VIEW: MASTER TIM ---
            const MasterTimView = () => {
                const [pplName, setPplName] = useState('');
                const [penimbangName, setPenimbangName] = useState('');
                const [editModal, setEditModal] = useState({ isOpen: false, id: '', ppl: '', penimbang: '' });

                const handleAddTeam = (e) => {
                    e.preventDefault();
                    if (!pplName.trim() || !penimbangName.trim()) {
                        fireAlert('Validasi Gagal', 'Nama PPL dan Penimbang wajib diisi keduanya.', 'error'); return;
                    }
                    const combinedName = `${pplName.trim()} - ${penimbangName.trim()}`;
                    if (teams.some(t => t.name.toLowerCase() === combinedName.toLowerCase())) {
                        fireAlert('Data Duplikat', 'Tim ini sudah terdaftar!', 'error'); return;
                    }
                    setTeams([...teams, { id: generateId(), name: combinedName, ppl: pplName.trim(), penimbang: penimbangName.trim() }]);
                    setPplName(''); setPenimbangName('');
                    addToast('Tim berhasil ditambahkan!');
                };

                const handleDeleteTeam = (id) => {
                    if (batches.some(b => b.teamId === id) || documents.some(d => d.teamId === id)) {
                        fireAlert('Ditolak', 'Tim sedang terikat pada data kandang/dokumen.', 'error'); return;
                    }
                    setTeams(teams.filter(t => t.id !== id));
                    addToast('Tim dihapus');
                };

                const handleUpdateTeam = (e) => {
                    e.preventDefault();
                    if (!editModal.ppl.trim() || !editModal.penimbang.trim()) {
                        fireAlert('Validasi', 'Nama wajib diisi.', 'error'); return;
                    }
                    const combinedName = `${editModal.ppl.trim()} - ${editModal.penimbang.trim()}`;
                    setTeams(teams.map(t => t.id === editModal.id ? { ...t, name: combinedName, ppl: editModal.ppl.trim(), penimbang: editModal.penimbang.trim() } : t));
                    setEditModal({ isOpen: false, id: '', ppl: '', penimbang: '' });
                    addToast('Data tim diperbarui!');
                };

                return (
                    <div className="p-4 md:p-8 max-w-4xl mx-auto space-y-6 fade-in">
                        <div className="mb-6">
                            <h2 className="text-2xl font-bold text-slate-800">Master Data Tim</h2>
                            <p className="text-slate-500 text-sm mt-1">Kelola daftar personel PPL dan Penimbang.</p>
                        </div>

                        <div className="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                            <form onSubmit={handleAddTeam} className="flex flex-col gap-4">
                                <div className="flex flex-col md:flex-row items-start md:items-end gap-4">
                                    <div className="w-full flex-1">
                                        <label className="text-xs font-semibold text-slate-500 mb-1.5 block">Nama PPL</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Briefcase size={16} className="text-slate-400" /></div>
                                            <input type="text" value={pplName} onChange={(e) => setPplName(e.target.value)} placeholder="Ketik nama PPL" className="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none text-slate-700" />
                                        </div>
                                    </div>
                                    <div className="w-full flex-1">
                                        <label className="text-xs font-semibold text-slate-500 mb-1.5 block">Nama Penimbang</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><UserCheck size={16} className="text-slate-400" /></div>
                                            <input type="text" value={penimbangName} onChange={(e) => setPenimbangName(e.target.value)} placeholder="Ketik nama Penimbang" className="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none text-slate-700" />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full md:w-auto bg-slate-800 text-white px-6 py-2.5 rounded-lg hover:bg-slate-900 text-sm font-semibold transition-all shadow-sm flex items-center justify-center gap-2">
                                        <PlusCircle size={16} /> Tambah Tim
                                    </button>
                                </div>
                            </form>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm border-collapse min-w-[500px]">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold">
                                            <th className="px-6 py-3.5">Profil Tim (PPL - Penimbang)</th>
                                            <th className="px-6 py-3.5 text-right">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {teams.length === 0 ? (
                                           <tr><td colSpan="2" className="p-8 text-center text-slate-400">Belum ada tim terdaftar.</td></tr>
                                        ) : (
                                            teams.map(team => (
                                                <tr key={team.id} className="hover:bg-slate-50/50 transition-colors group">
                                                    <td className="px-6 py-4">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg font-bold shrink-0 border border-emerald-100">
                                                                {team.name.charAt(0).toUpperCase()}
                                                            </div>
                                                            <div>
                                                                <h3 className="font-bold text-slate-700">{team.name}</h3>
                                                                <div className="flex items-center gap-2 mt-1">
                                                                    <span className="text-[11px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-medium">{team.ppl || '-'}</span>
                                                                    <span className="text-[11px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-medium">{team.penimbang || '-'}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 text-right">
                                                        <div className="flex justify-end gap-2">
                                                            <button onClick={() => setEditModal({ isOpen: true, id: team.id, ppl: team.ppl || '', penimbang: team.penimbang || '' })} className="text-slate-400 hover:text-indigo-600 p-2 rounded-lg hover:bg-indigo-50 transition-colors" title="Edit">
                                                                <Edit size={16} />
                                                            </button>
                                                            <button onClick={() => handleDeleteTeam(team.id)} className="text-slate-400 hover:text-red-600 p-2 rounded-lg hover:bg-red-50 transition-colors" title="Hapus">
                                                                <Trash2 size={16} />
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Modal Edit */}
                        {editModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4 fade-in">
                                <div className="bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden">
                                    <div className="p-5 border-b border-slate-100 flex justify-between items-center">
                                        <h3 className="font-bold text-lg text-slate-800">Edit Data Tim</h3>
                                        <button onClick={() => setEditModal({ isOpen: false, id: '', ppl: '', penimbang: '' })} className="text-slate-400 hover:text-slate-700"><X size={20}/></button>
                                    </div>
                                    <form onSubmit={handleUpdateTeam}>
                                        <div className="p-5 space-y-4">
                                            <div>
                                                <label className="text-xs font-semibold text-slate-500 mb-1.5 block">Nama PPL</label>
                                                <input type="text" value={editModal.ppl} onChange={(e) => setEditModal({...editModal, ppl: e.target.value})} className="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-semibold text-slate-500 mb-1.5 block">Nama Penimbang</label>
                                                <input type="text" value={editModal.penimbang} onChange={(e) => setEditModal({...editModal, penimbang: e.target.value})} className="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                            </div>
                                        </div>
                                        <div className="p-5 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                                            <button type="button" onClick={() => setEditModal({ isOpen: false, id: '', ppl: '', penimbang: '' })} className="px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-100">Batal</button>
                                            <button type="submit" className="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">Simpan</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // --- VIEW: DATABASE BACKUP ---
            const DatabaseView = () => {
                const fileInputRef = useRef(null);

                const handleBackup = () => {
                    const data = { version: '2.0', timestamp: new Date().toISOString(), teams, batches, documents };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = `backup_btpa_${new Date().toISOString().slice(0,10)}.json`;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                    fireAlert('Sukses', 'File backup berhasil diunduh.', 'success');
                };

                const handleFileChange = (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if (data.teams && data.batches && data.documents) {
                                if(window.confirm("PERINGATAN: Memulihkan data akan menghapus data yang ada. Lanjutkan?")) {
                                    setTeams(data.teams); setBatches(data.batches); setDocuments(data.documents);
                                    fireAlert('Berhasil', 'Sistem berhasil dipulihkan!', 'success');
                                }
                            } else fireAlert('Gagal', 'Format file backup tidak valid!', 'error');
                        } catch (error) { fireAlert('Gagal', 'Gagal membaca file json.', 'error'); }
                    };
                    reader.readAsText(file); e.target.value = null;
                };

                const handleResetData = () => {
                    const ans = window.prompt("Ketik 'HAPUS' untuk mengonfirmasi penghapusan seluruh data:");
                    if(ans === 'HAPUS') {
                        setTeams([]); setBatches([]); setDocuments([]);
                        fireAlert('Sistem Bersih', 'Semua data telah dikosongkan.', 'success');
                    } else if(ans !== null) addToast('Kata kunci salah.', 'error');
                }

                return (
                    <div className="p-4 md:p-8 max-w-4xl mx-auto space-y-6 fade-in">
                        <div className="mb-6">
                            <h2 className="text-2xl font-bold text-slate-800">Backup & Restore</h2>
                            <p className="text-slate-500 text-sm mt-1">Simpan cadangan data dan pulihkan sistem.</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center hover:border-emerald-300 transition-colors">
                                <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3"><Download size={24} /></div>
                                <h3 className="text-lg font-bold text-slate-800">Backup Data</h3>
                                <p className="text-slate-500 text-xs mt-1 mb-4">Unduh data ke komputer format .json.</p>
                                <button onClick={handleBackup} className="w-full bg-emerald-500 text-white py-2 rounded-lg text-sm font-semibold hover:bg-emerald-600">Unduh File</button>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center hover:border-amber-300 transition-colors">
                                <div className="w-12 h-12 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3"><Upload size={24} /></div>
                                <h3 className="text-lg font-bold text-slate-800">Restore Data</h3>
                                <p className="text-slate-500 text-xs mt-1 mb-4">Pulihkan dari file. Akan menimpa data.</p>
                                <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileChange} className="hidden" />
                                <button onClick={() => fileInputRef.current?.click()} className="w-full bg-amber-500 text-white py-2 rounded-lg text-sm font-semibold hover:bg-amber-600">Pilih File</button>
                            </div>
                        </div>

                        <div className="mt-8 pt-6 border-t border-slate-200">
                            <div className="bg-red-50 p-5 rounded-2xl border border-red-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                                <div>
                                    <h3 className="text-sm font-bold text-red-800 flex items-center gap-2"><AlertTriangle size={18} /> Reset Sistem</h3>
                                    <p className="text-red-600/80 text-xs mt-1">Hapus seluruh data secara permanen.</p>
                                </div>
                                <button onClick={handleResetData} className="w-full sm:w-auto px-5 py-2.5 bg-red-600 text-white text-sm font-semibold rounded-lg hover:bg-red-700 shrink-0">Kosongkan Data</button>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- VIEW: TAMBAH STOK LACI ---
            const InputLaciView = () => {
                const [teamId, setTeamId] = useState('');
                const [ranges, setRanges] = useState([{ from: '', to: '' }]);
                const [isGenerating, setIsGenerating] = useState(false);

                const totalGeneratedDocs = ranges.reduce((acc, range) => {
                    const from = parseInt(range.from); const to = parseInt(range.to);
                    if (!isNaN(from) && !isNaN(to) && from <= to) return acc + (to - from + 1); return acc;
                }, 0);

                const previewNumbers = useMemo(() => {
                    let nums = [];
                    for (const range of ranges) {
                        const from = parseInt(range.from); const to = parseInt(range.to);
                        if (!isNaN(from) && !isNaN(to) && from <= to) {
                            for (let i = from; i <= to; i++) { nums.push(i.toString()); if(nums.length >= 100) break; }
                        }
                        if(nums.length >= 100) break;
                    }
                    return nums;
                }, [ranges]);

                const conflictError = useMemo(() => {
                    if (!teamId) return null;
                    for (const range of ranges) {
                        const from = parseInt(range.from); const to = parseInt(range.to);
                        if (isNaN(from) || isNaN(to) || from > to) continue;
                        for (let i = from; i <= to; i++) {
                            const numStr = i.toString();
                            const existing = documents.find(d => d.number === numStr);
                            if (existing && existing.teamId !== teamId) {
                                return { number: numStr, owner: teams.find(t => t.id === existing.teamId)?.name || 'Tim Lain' };
                            }
                        }
                    }
                    return null;
                }, [ranges, documents, teamId, teams]);

                const handleGenerate = () => {
                    if (!teamId) return fireAlert('Peringatan', 'Pilih tim penerima stok terlebih dahulu.', 'error');
                    if (conflictError) return;
                    setIsGenerating(true);
                    setTimeout(() => {
                        let newDocs = [];
                        for (const range of ranges) {
                            const from = parseInt(range.from); const to = parseInt(range.to);
                            if (isNaN(from) || isNaN(to) || from > to) continue;
                            for (let i = from; i <= to; i++) {
                                const numStr = i.toString();
                                if (!documents.some(d => d.number === numStr && d.teamId === teamId)) {
                                    newDocs.push({ id: generateId(), batchId: null, teamId, number: numStr, status: 'DI_ADMIN' });
                                }
                            }
                        }
                        if (newDocs.length === 0) { setIsGenerating(false); return fireAlert('Gagal', 'Nomor tidak valid/sudah ada.', 'error'); }
                        setDocuments([...documents, ...newDocs]);
                        fireAlert('Stok Disimpan', `${newDocs.length} dokumen masuk Laci Admin tim terkait.`, 'success');
                        setTeamId(''); setRanges([{ from: '', to: '' }]); setIsGenerating(false);
                    }, 100);
                };

                return (
                    <div className="p-4 md:p-8 max-w-4xl mx-auto space-y-6 fade-in">
                        <div className="mb-6">
                            <h2 className="text-2xl font-bold text-slate-800">Tambah Stok Laci</h2>
                            <p className="text-slate-500 text-sm mt-1">Masukkan dokumen baru langsung ke gudang tanpa ke kandang.</p>
                        </div>

                        <div className="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                            <div className="mb-5">
                                <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">Pilih Tim Pemilik</label>
                                <select className="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none text-slate-700" value={teamId} onChange={(e) => setTeamId(e.target.value)}>
                                    <option value="">-- Pilih Tim --</option>
                                    {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                </select>
                            </div>

                            <div className="space-y-3">
                                {ranges.map((range, idx) => {
                                    const fromVal = parseInt(range.from); const toVal = parseInt(range.to);
                                    const rangeCount = (!isNaN(fromVal) && !isNaN(toVal) && fromVal <= toVal) ? (toVal - fromVal + 1) : 0;
                                    return (
                                        <div key={idx} className="flex flex-col sm:flex-row items-start sm:items-end gap-3 bg-slate-50 p-3 rounded-lg border border-slate-100">
                                            <div className="w-full sm:flex-1">
                                                <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Mulai</label>
                                                <input type="number" placeholder="Misal: 1001" className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-amber-500 outline-none font-mono" value={range.from} onChange={(e) => { const r = [...ranges]; r[idx].from = e.target.value; setRanges(r); }} />
                                            </div>
                                            <div className="w-full sm:flex-1">
                                                <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Sampai</label>
                                                <input type="number" placeholder="Misal: 1005" className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-amber-500 outline-none font-mono" value={range.to} onChange={(e) => { const r = [...ranges]; r[idx].to = e.target.value; setRanges(r); }} />
                                            </div>
                                            <div className="w-full sm:w-auto flex items-center justify-between sm:justify-end gap-2 mt-1 sm:mt-0">
                                                <span className={`text-xs font-semibold px-2 py-1.5 rounded-md ${rangeCount > 0 ? 'bg-amber-100 text-amber-700' : 'text-slate-400'}`}>{rangeCount} lembar</span>
                                                <button onClick={() => { if(ranges.length > 1) setRanges(ranges.filter((_, i) => i !== idx)) }} disabled={ranges.length === 1} className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-md disabled:opacity-30"><Trash2 size={16}/></button>
                                            </div>
                                        </div>
                                    )
                                })}
                                <button onClick={() => setRanges([...ranges, { from: '', to: '' }])} className="text-sm font-medium text-amber-600 flex items-center gap-1 hover:text-amber-700 py-2"><PlusCircle size={16}/> Tambah Baris Rentang</button>
                            </div>

                            {conflictError && (
                                <div className="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg flex items-start gap-2">
                                    <AlertTriangle size={16} className="text-red-500 mt-0.5" />
                                    <div><p className="font-semibold text-red-700 text-sm">Akses Ditolak Lintas Tim</p><p className="text-xs text-red-600">Nomor #{conflictError.number} sudah menjadi milik {conflictError.owner}.</p></div>
                                </div>
                            )}

                            {previewNumbers.length > 0 && !conflictError && (
                                <div className="mt-4 bg-slate-50 border border-slate-100 rounded-lg p-3">
                                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Preview Nomor (Max 100):</p>
                                    <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scrollbar">
                                        {previewNumbers.map(n => <span key={n} className="bg-white border border-slate-200 px-1.5 py-0.5 rounded text-xs font-mono text-slate-600">#{n}</span>)}
                                        {totalGeneratedDocs > 100 && <span className="text-xs bg-slate-200 px-1.5 py-0.5 rounded text-slate-600">+{totalGeneratedDocs - 100} lagi</span>}
                                    </div>
                                </div>
                            )}

                            {totalGeneratedDocs > 0 && !conflictError && (
                                <div className="mt-6 flex flex-col sm:flex-row justify-between items-center gap-4 border-t border-slate-100 pt-5">
                                    <div className="text-sm">
                                        <span className="text-slate-500">Total Generate: </span>
                                        <span className="font-bold text-amber-600">{totalGeneratedDocs} Lembar</span>
                                    </div>
                                    <button onClick={handleGenerate} disabled={isGenerating || !teamId} className="w-full sm:w-auto bg-amber-500 text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-amber-600 disabled:opacity-50 flex items-center justify-center gap-2">
                                        {isGenerating ? <RefreshCw size={16} className="animate-spin"/> : <Archive size={16}/>} Simpan ke Laci
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // --- VIEW: CHICK-IN (INPUT KANDANG) ---
            const ChickInView = () => {
                const [formData, setFormData] = useState({ teamId: '', date: '', name: '', population: '' });
                const [ranges, setRanges] = useState([{ from: '', to: '' }]);
                const [isGenerating, setIsGenerating] = useState(false);
                const [usedDrawerDocs, setUsedDrawerDocs] = useState(new Set());

                const populationNum = parseInt(formData.population) || 0;
                const estimatedDocs = Math.ceil(populationNum / 1000);

                const drawerAnalysis = useMemo(() => {
                    if (!formData.teamId) return { docs: [], groups: [] };
                    const dDocs = documents.filter(d => d.teamId === formData.teamId && d.status === 'DI_ADMIN').sort((a,b) => parseInt(a.number) - parseInt(b.number));
                    let groups = [];
                    if (dDocs.length > 0) {
                        let cur = [dDocs[0]];
                        for (let i = 1; i < dDocs.length; i++) {
                            if (parseInt(dDocs[i].number) === parseInt(dDocs[i-1].number) + 1) cur.push(dDocs[i]);
                            else { if (cur.length > 1) groups.push([...cur]); cur = [dDocs[i]]; }
                        }
                        if (cur.length > 1) groups.push(cur);
                    }
                    return { docs: dDocs, groups };
                }, [documents, formData.teamId]);

                const totalGeneratedDocs = ranges.reduce((acc, range) => {
                    const from = parseInt(range.from); const to = parseInt(range.to);
                    if (!isNaN(from) && !isNaN(to) && from <= to) return acc + (to - from + 1); return acc;
                }, 0);

                const previewNumbers = useMemo(() => {
                    let nums = [];
                    for (const range of ranges) {
                        const from = parseInt(range.from); const to = parseInt(range.to);
                        if (!isNaN(from) && !isNaN(to) && from <= to) {
                            for (let i = from; i <= to; i++) { nums.push(i.toString()); if(nums.length >= 100) break; }
                        }
                        if(nums.length >= 100) break;
                    }
                    return nums;
                }, [ranges]);

                const conflictError = useMemo(() => {
                    if (!formData.teamId) return null;
                    for (const range of ranges) {
                        const from = parseInt(range.from); const to = parseInt(range.to);
                        if (isNaN(from) || isNaN(to) || from > to) continue;
                        for (let i = from; i <= to; i++) {
                            const numStr = i.toString();
                            const existing = documents.find(d => d.number === numStr);
                            if (existing && existing.teamId !== formData.teamId) {
                                return { number: numStr, owner: teams.find(t => t.id === existing.teamId)?.name || 'Tim Lain' };
                            }
                        }
                    }
                    return null;
                }, [ranges, documents, formData.teamId, teams]);

                const handleRangeChange = (idx, field, value) => {
                    const r = [...ranges]; r[idx][field] = value; setRanges(r);
                };

                const injectFromLaci = (fromStr, toStr, sourceIdArr) => {
                    let inserted = false;
                    const r = [...ranges];
                    for (let i = 0; i < r.length; i++) {
                        if (!r[i].from && !r[i].to) { r[i] = { from: fromStr, to: toStr }; inserted = true; break; }
                    }
                    if (!inserted) r.push({ from: fromStr, to: toStr });
                    setRanges(r);
                    const used = new Set(usedDrawerDocs);
                    sourceIdArr.forEach(id => used.add(id));
                    setUsedDrawerDocs(used);
                    addToast('Nomor laci dimasukkan ke form');
                };

                const handleGenerate = () => {
                    if (!formData.teamId || !formData.date || !formData.name || !formData.population) return fireAlert('Peringatan', 'Lengkapi seluruh data kandang di panel kiri.', 'error');
                    if (conflictError || totalGeneratedDocs === 0) return fireAlert('Peringatan', 'Periksa kembali rentang nomor BTPA.', 'error');
                    
                    setIsGenerating(true);
                    setTimeout(() => {
                        let numsToGen = [];
                        for (const range of ranges) {
                            const f = parseInt(range.from); const t = parseInt(range.to);
                            if (isNaN(f) || isNaN(t) || f > t) continue;
                            for (let i = f; i <= t; i++) numsToGen.push(i.toString());
                        }

                        if (numsToGen.length > 20000) { setIsGenerating(false); return fireAlert('Limit', 'Maksimal 20.000 dokumen per kandang.', 'error'); }

                        const batchId = generateId();
                        const newBatch = { id: batchId, teamId: formData.teamId, date: formData.date, name: formData.name, population: populationNum, status: 'AKTIF' };
                        const updatedDocs = [...documents];
                        
                        numsToGen.forEach(num => {
                            const extIdx = updatedDocs.findIndex(d => d.number === num && d.teamId === formData.teamId && (d.status === 'DI_ADMIN' || d.status === 'DI_PENIMBANG'));
                            if (extIdx !== -1) updatedDocs[extIdx] = { ...updatedDocs[extIdx], batchId, status: 'DIALOKASIKAN', penimbangName: null };
                            else updatedDocs.push({ id: generateId(), batchId, teamId: formData.teamId, number: num, status: 'DIALOKASIKAN' });
                        });

                        setBatches([...batches, newBatch]); setDocuments(updatedDocs);
                        fireAlert('Kandang Didaftarkan!', `Kandang ${formData.name} berjalan. ${numsToGen.length} dokumen dialokasikan.`, 'success');
                        
                        setFormData({ teamId: '', date: '', name: '', population: '' });
                        setRanges([{ from: '', to: '' }]); setUsedDrawerDocs(new Set());
                        setIsGenerating(false);
                    }, 50);
                };

                return (
                    <div className="p-4 md:p-8 max-w-7xl mx-auto flex flex-col lg:flex-row gap-6 fade-in">
                        {/* Kiri: Data Kandang */}
                        <div className="w-full lg:w-[320px] shrink-0 space-y-6">
                            <div className="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">Data Kandang</h2>
                                <div className="space-y-3">
                                    <div><label className="text-xs font-semibold text-slate-500 mb-1 block">Tim</label><select className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none" value={formData.teamId} onChange={(e) => {setFormData({...formData, teamId: e.target.value}); setRanges([{from:'', to:''}]); setUsedDrawerDocs(new Set());}}><option value="">- Pilih Tim -</option>{teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
                                    <div><label className="text-xs font-semibold text-slate-500 mb-1 block">Tanggal</label><input type="date" className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})}/></div>
                                    <div><label className="text-xs font-semibold text-slate-500 mb-1 block">Nama Kandang</label><input type="text" placeholder="Misal: A1" className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})}/></div>
                                    <div><label className="text-xs font-semibold text-slate-500 mb-1 block">Populasi</label><input type="number" placeholder="5000" className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none" value={formData.population} onChange={e => setFormData({...formData, population: e.target.value})}/></div>
                                </div>
                                <div className="mt-5 p-4 bg-sky-50 border border-sky-100 rounded-xl flex justify-between items-center">
                                    <div><p className="text-[10px] font-semibold text-sky-700 uppercase mb-0.5">Estimasi BTPA</p><p className="text-xl font-bold text-sky-600">{estimatedDocs} <span className="text-xs">lembar</span></p></div>
                                    <BarChart3 size={24} className="text-sky-200"/>
                                </div>
                            </div>
                        </div>

                        {/* Kanan: Alokasi Nomor */}
                        <div className="flex-1 space-y-6">
                            <div className="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">Alokasi Nomor</h2>
                                
                                {drawerAnalysis.docs.length > 0 && (
                                    <div className="p-4 mb-5 bg-amber-50/50 border border-amber-100 rounded-xl">
                                        <p className="text-xs font-bold text-amber-800 mb-3 flex items-center gap-1.5"><Inbox size={14}/> Sisa Laci ({drawerAnalysis.docs.length}):</p>
                                        
                                        {drawerAnalysis.groups.length > 0 && (
                                            <div className="mb-3">
                                                <p className="text-[10px] text-amber-600 uppercase mb-1.5">Pilih Grup:</p>
                                                <div className="flex flex-wrap gap-2">
                                                    {drawerAnalysis.groups.map((g, i) => {
                                                        const isU = usedDrawerDocs.has(g[0].id);
                                                        return <button key={i} disabled={isU} onClick={()=>injectFromLaci(g[0].number, g[g.length-1].number, g.map(x=>x.id))} className={`px-2.5 py-1.5 rounded-lg border text-xs transition-all ${isU?'bg-amber-100/50 text-amber-400 border-transparent':'bg-white border-amber-200 text-amber-700 hover:bg-amber-100'}`}>#{g[0].number} - #{g[g.length-1].number} ({g.length})</button>
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                        <div>
                                            <p className="text-[10px] text-amber-600 uppercase mb-1.5">Pilih Satuan:</p>
                                            <div className="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto custom-scrollbar">
                                                {drawerAnalysis.docs.map(d => {
                                                    const isU = usedDrawerDocs.has(d.id);
                                                    return <button key={d.id} disabled={isU} onClick={()=>injectFromLaci(d.number, d.number, [d.id])} className={`px-2 py-1 rounded-md border text-xs font-mono transition-all ${isU?'bg-amber-100/50 text-amber-400 border-transparent':'bg-white border-amber-200 text-amber-700 hover:bg-amber-100'}`}>{isU&&<CheckCircle2 size={10} className="inline mr-0.5"/>}#{d.number}</button>
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="space-y-3">
                                    {ranges.map((range, idx) => {
                                        const fv = parseInt(range.from); const tv = parseInt(range.to);
                                        const c = (!isNaN(fv) && !isNaN(tv) && fv <= tv) ? (tv - fv + 1) : 0;
                                        return (
                                            <div key={idx} className="flex flex-col sm:flex-row items-start sm:items-end gap-3 bg-slate-50 p-3 rounded-lg border border-slate-100">
                                                <div className="w-full sm:flex-1"><label className="text-[10px] font-semibold text-slate-500 uppercase block mb-1">Mulai</label><input type="number" placeholder="1001" className="w-full px-3 py-2 bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-mono" value={range.from} onChange={(e) => handleRangeChange(idx, 'from', e.target.value)} /></div>
                                                <div className="w-full sm:flex-1"><label className="text-[10px] font-semibold text-slate-500 uppercase block mb-1">Sampai</label><input type="number" placeholder="1005" className="w-full px-3 py-2 bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-mono" value={range.to} onChange={(e) => handleRangeChange(idx, 'to', e.target.value)} /></div>
                                                <div className="w-full sm:w-auto mt-1 sm:mt-0 flex items-center justify-between gap-2">
                                                    <span className={`text-xs font-semibold px-2 py-1.5 rounded-md ${c > 0 ? 'bg-emerald-100 text-emerald-700' : 'text-slate-400'}`}>{c} lembar</span>
                                                    <button onClick={() => { if(ranges.length>1) setRanges(ranges.filter((_,i)=>i!==idx)) }} disabled={ranges.length===1} className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-md disabled:opacity-30"><Trash2 size={16}/></button>
                                                </div>
                                            </div>
                                        )
                                    })}
                                    <button onClick={() => setRanges([...ranges, {from:'', to:''}])} className="text-sm font-medium text-emerald-600 hover:text-emerald-700 flex items-center gap-1 py-1"><PlusCircle size={16}/> Tambah Baris Rentang</button>
                                </div>

                                {conflictError && (
                                    <div className="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg flex items-start gap-2">
                                        <AlertTriangle size={16} className="text-red-500 mt-0.5" />
                                        <div><p className="font-semibold text-red-700 text-sm">Akses Ditolak Lintas Tim</p><p className="text-xs text-red-600">Nomor #{conflictError.number} milik {conflictError.owner}.</p></div>
                                    </div>
                                )}

                                {previewNumbers.length > 0 && !conflictError && (
                                    <div className="mt-4 bg-slate-50 border border-slate-100 rounded-lg p-3">
                                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Preview Nomor (Max 100):</p>
                                        <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scrollbar">
                                            {previewNumbers.map(n => <span key={n} className="bg-white border border-slate-200 px-1.5 py-0.5 rounded text-xs font-mono text-slate-600">#{n}</span>)}
                                            {totalGeneratedDocs > 100 && <span className="text-xs bg-slate-200 px-1.5 py-0.5 rounded text-slate-600">+{totalGeneratedDocs - 100} lagi</span>}
                                        </div>
                                    </div>
                                )}

                                {totalGeneratedDocs > 0 && !conflictError && (
                                    <div className="mt-6 flex flex-col sm:flex-row justify-between items-center gap-4 border-t border-slate-100 pt-5">
                                        <div className="text-sm">
                                            <span className="text-slate-500">Total Generate: </span>
                                            <span className={`font-bold ${estimatedDocs>0&&totalGeneratedDocs!==estimatedDocs?'text-amber-600':'text-emerald-600'}`}>{totalGeneratedDocs} Lembar</span>
                                            {estimatedDocs>0&&totalGeneratedDocs!==estimatedDocs&&<p className="text-[10px] text-amber-500 flex items-center gap-1 mt-0.5"><AlertTriangle size={12}/> Beda estimasi</p>}
                                        </div>
                                        <button onClick={handleGenerate} disabled={isGenerating || !formData.teamId} className="w-full sm:w-auto px-6 py-2.5 bg-emerald-500 text-white rounded-lg font-semibold hover:bg-emerald-600 flex items-center justify-center gap-2">
                                            {isGenerating?<RefreshCw size={16} className="animate-spin"/>:<Play size={16} className="fill-current"/>} Simpan Kandang
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            // --- VIEW: PROSES PANEN ---
            const ProsesPanenView = () => {
                const [selectedBatch, setSelectedBatch] = useState(null);
                const [visibleCount, setVisibleCount] = useState(50);
                const [searchTerm, setSearchTerm] = useState('');
                const activeBatches = batches.filter(b => b.status === 'AKTIF');

                const handleUpdateDocStatus = (docId, newStatus) => {
                    setDocuments(docs => docs.map(d => d.id === docId ? { ...d, status: newStatus } : d));
                };

                const handleBulkAction = (status) => {
                    if (!selectedBatch) return;
                    setDocuments(docs => docs.map(d => (d.batchId === selectedBatch.id && d.status === 'DIALOKASIKAN') ? { ...d, status: status } : d));
                    addToast(`Status massal diubah menjadi ${status === 'TERPAKAI' ? 'Selesai' : 'Laci'}`);
                };

                const handleCloseBatch = () => {
                    const unresolved = documents.filter(d => d.batchId === selectedBatch.id && d.status === 'DIALOKASIKAN').length;
                    if (unresolved > 0) return fireAlert('Ditolak', `Masih ada ${unresolved} dokumen menggantung!`, 'error');
                    setBatches(bs => bs.map(b => b.id === selectedBatch.id ? { ...b, status: 'SELESAI' } : b));
                    fireAlert('Selesai', `Siklus kandang ditutup.`, 'success');
                    setSelectedBatch(null);
                };

                if (!selectedBatch) {
                    return (
                        <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6 fade-in">
                            <div className="mb-6">
                                <h2 className="text-2xl font-bold text-slate-800">Proses Panen</h2>
                                <p className="text-slate-500 text-sm mt-1">Pilih kandang aktif untuk mencatat kepulangan dokumen.</p>
                            </div>

                            {activeBatches.length === 0 ? (
                                <div className="bg-white p-10 text-center rounded-2xl border border-slate-200"><ListOrdered size={32} className="mx-auto text-slate-300 mb-3"/><p className="font-semibold text-slate-600">Tidak ada kandang aktif.</p></div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {activeBatches.map(batch => {
                                        const unresolved = documents.filter(d => d.batchId === batch.id && d.status === 'DIALOKASIKAN').length;
                                        return (
                                            <div key={batch.id} onClick={() => { setSelectedBatch(batch); setVisibleCount(50); setSearchTerm(''); }} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:border-emerald-300 cursor-pointer transition-colors group">
                                                <div className="flex justify-between items-start mb-4">
                                                    <div>
                                                        <h3 className="font-bold text-slate-800 group-hover:text-emerald-600">{batch.name}</h3>
                                                        <p className="text-xs text-slate-500 mt-1">{getTeamName(batch.teamId)}</p>
                                                    </div>
                                                    <span className="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded">AKTIF</span>
                                                </div>
                                                <div className="flex gap-4 text-sm bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                    <div><p className="text-[10px] text-slate-400 uppercase mb-0.5">Populasi</p><p className="font-semibold">{batch.population}</p></div>
                                                    <div className="w-px bg-slate-200"></div>
                                                    <div><p className="text-[10px] text-slate-400 uppercase mb-0.5">Gantung</p><p className={`font-semibold ${unresolved>0?'text-amber-600':'text-emerald-600'}`}>{unresolved}</p></div>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            )}
                        </div>
                    );
                }

                const batchDocs = documents.filter(d => d.batchId === selectedBatch.id).sort((a,b)=>parseInt(a.number)-parseInt(b.number));
                const filteredDocs = searchTerm ? batchDocs.filter(d => d.number.includes(searchTerm)) : batchDocs;
                const unresolvedCount = batchDocs.filter(d => d.status === 'DIALOKASIKAN').length;

                return (
                    <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6 fade-in">
                        <button onClick={() => setSelectedBatch(null)} className="text-slate-500 hover:text-emerald-600 text-sm font-medium flex items-center gap-1 mb-2"><ChevronRight className="rotate-180" size={16}/> Kembali</button>
                        
                        <div className="bg-white p-5 md:p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">{selectedBatch.name}</h2>
                                <p className="text-sm text-slate-500 mt-1">{getTeamName(selectedBatch.teamId)} • {batchDocs.length} Dokumen</p>
                            </div>
                            <button onClick={handleCloseBatch} className={`px-5 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2 ${unresolvedCount===0?'bg-emerald-600 text-white hover:bg-emerald-700':'bg-slate-100 text-slate-400 cursor-not-allowed'}`}><Archive size={16}/> Tutup Kandang</button>
                        </div>

                        <div className="bg-white p-4 rounded-xl border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-2 z-10 shadow-sm">
                            <span className="text-sm font-semibold text-amber-700 bg-amber-50 px-3 py-1.5 rounded-md border border-amber-100">{unresolvedCount} Menggantung</span>
                            <div className="flex gap-2 w-full md:w-auto">
                                <input type="text" placeholder="Cari..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="w-full md:w-32 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none text-sm"/>
                                <button onClick={() => handleBulkAction('TERPAKAI')} disabled={unresolvedCount===0} className="px-3 py-2 bg-emerald-50 text-emerald-700 text-sm font-semibold rounded-lg hover:bg-emerald-100 disabled:opacity-50 whitespace-nowrap"><CheckSquare size={16} className="inline mr-1"/> Selesai</button>
                                <button onClick={() => handleBulkAction('DI_ADMIN')} disabled={unresolvedCount===0} className="px-3 py-2 bg-amber-50 text-amber-700 text-sm font-semibold rounded-lg hover:bg-amber-100 disabled:opacity-50 whitespace-nowrap"><Inbox size={16} className="inline mr-1"/> Laci</button>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <table className="w-full text-left text-sm border-collapse min-w-[500px]">
                                <thead><tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold"><th className="px-6 py-3">No.</th><th className="px-6 py-3">BTPA</th><th className="px-6 py-3">Status</th><th className="px-6 py-3 text-right">Aksi</th></tr></thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredDocs.slice(0, visibleCount).map((doc, i) => (
                                        <tr key={doc.id} className="hover:bg-slate-50/50">
                                            <td className="px-6 py-3 text-slate-400">{i+1}</td>
                                            <td className="px-6 py-3 font-mono font-semibold">{doc.number}</td>
                                            <td className="px-6 py-3">
                                                {doc.status==='DIALOKASIKAN'&&<span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-1 rounded font-semibold uppercase">Lapangan</span>}
                                                {doc.status==='TERPAKAI'&&<span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-1 rounded font-semibold uppercase flex w-fit items-center gap-1"><CheckCircle2 size={12}/> Selesai</span>}
                                                {doc.status==='DI_ADMIN'&&<span className="text-[10px] bg-amber-100 text-amber-700 px-2 py-1 rounded font-semibold uppercase flex w-fit items-center gap-1"><Inbox size={12}/> Laci</span>}
                                            </td>
                                            <td className="px-6 py-3 text-right">
                                                {doc.status==='DIALOKASIKAN'? (
                                                    <div className="flex justify-end gap-1.5"><button onClick={()=>handleUpdateDocStatus(doc.id,'TERPAKAI')} className="px-3 py-1.5 bg-emerald-500 text-white rounded-md text-xs font-semibold hover:bg-emerald-600">Pakai</button><button onClick={()=>handleUpdateDocStatus(doc.id,'DI_ADMIN')} className="px-3 py-1.5 bg-amber-500 text-white rounded-md text-xs font-semibold hover:bg-amber-600">Laci</button></div>
                                                ) : (
                                                    <button onClick={()=>handleUpdateDocStatus(doc.id,'DIALOKASIKAN')} className="px-3 py-1.5 text-slate-500 bg-slate-100 rounded-md text-xs font-medium hover:bg-slate-200">Batal</button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {visibleCount < filteredDocs.length && <div className="p-4 text-center border-t border-slate-100"><button onClick={()=>setVisibleCount(p=>p+50)} className="text-sm font-medium text-emerald-600">Tampilkan Lagi</button></div>}
                        </div>
                    </div>
                );
            };

            // --- VIEW: LACI ADMIN ---
            const LaciAdminView = () => {
                const [activeTab, setActiveTab] = useState('laci');
                const [giveModal, setGiveModal] = useState({ isOpen: false, teamId: null, penimbangName: '', selected: new Set() });

                const drawerDocs = documents.filter(d => d.status === 'DI_ADMIN');
                const penimbangDocs = documents.filter(d => d.status === 'DI_PENIMBANG');

                const gDrawer = drawerDocs.reduce((a,c)=>{if(!a[c.teamId])a[c.teamId]=[];a[c.teamId].push(c);return a}, {});
                const gPenimbang = penimbangDocs.reduce((a,c)=>{if(!a[c.penimbangName])a[c.penimbangName]=[];a[c.penimbangName].push(c);return a}, {});

                const confirmHandover = () => {
                    if(!giveModal.penimbangName.trim() || giveModal.selected.size===0) return fireAlert('Error','Pilih dokumen dan ketik nama.','error');
                    setDocuments(docs => docs.map(d => giveModal.selected.has(d.id)?{...d,status:'DI_PENIMBANG',penimbangName:giveModal.penimbangName.trim()}:d));
                    setGiveModal({isOpen:false,teamId:null,penimbangName:'',selected:new Set()});
                    addToast(`Diserahkan ke ${giveModal.penimbangName}`);
                };

                return (
                    <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6 fade-in">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between md:items-center gap-4">
                            <div><h2 className="text-2xl font-bold text-slate-800">Laci & Inventaris</h2><p className="text-slate-500 text-sm mt-1">Kontrol sisa dokumen.</p></div>
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                <button onClick={()=>setActiveTab('laci')} className={`px-4 py-2 rounded-md text-sm font-semibold transition-colors ${activeTab==='laci'?'bg-white text-slate-800 shadow-sm':'text-slate-500 hover:text-slate-700'}`}>Stok Laci</button>
                                <button onClick={()=>setActiveTab('penimbang')} className={`px-4 py-2 rounded-md text-sm font-semibold transition-colors ${activeTab==='penimbang'?'bg-white text-slate-800 shadow-sm':'text-slate-500 hover:text-slate-700'}`}>Di Penimbang</button>
                            </div>
                        </div>

                        {activeTab === 'laci' && (
                            <div className="space-y-4">
                                {Object.keys(gDrawer).length === 0 ? <div className="bg-white p-12 text-center rounded-2xl border border-slate-200"><Inbox className="mx-auto mb-3 text-slate-300" size={40} /><p className="text-slate-500 font-medium">Laci kosong.</p></div> : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {Object.entries(gDrawer).map(([tId, docs]) => {
                                            const team = teams.find(x=>x.id===tId);
                                            return (
                                                <div key={tId} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
                                                    <div className="flex justify-between items-center mb-4">
                                                        <div><h3 className="font-bold text-slate-800">{team?.name||'Tim Dihapus'}</h3><p className="text-xs text-slate-500">{docs.length} Dokumen</p></div>
                                                        <button onClick={()=>{setGiveModal({isOpen:true,teamId:tId,penimbangName:team?.penimbang||'',selected:new Set()})}} className="text-xs font-semibold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg hover:bg-indigo-100">Beri ke Penimbang</button>
                                                    </div>
                                                    <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto custom-scrollbar">
                                                        {docs.map(d => <span key={d.id} className="bg-slate-50 border border-slate-200 px-2 py-1 rounded text-xs font-mono text-slate-600">#{d.number}</span>)}
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'penimbang' && (
                            <div className="space-y-4">
                                {Object.keys(gPenimbang).length === 0 ? <div className="bg-white p-12 text-center rounded-2xl border border-slate-200"><UserCheck className="mx-auto mb-3 text-slate-300" size={40} /><p className="text-slate-500 font-medium">Tidak ada yang dibawa Penimbang.</p></div> : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {Object.entries(gPenimbang).map(([pName, docs]) => (
                                            <div key={pName} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
                                                <div className="mb-4">
                                                    <h3 className="font-bold text-slate-800 flex items-center gap-2"><UserCheck size={16} className="text-indigo-500"/> {pName}</h3>
                                                    <p className="text-xs text-slate-500 mt-1">Membawa {docs.length} lembar</p>
                                                </div>
                                                <div className="space-y-2 max-h-40 overflow-y-auto custom-scrollbar">
                                                    {docs.map(d => (
                                                        <div key={d.id} className="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                                                            <span className="font-mono text-sm font-semibold">#{d.number}</span>
                                                            <div className="flex gap-1.5">
                                                                <button onClick={()=>{setDocuments(ds=>ds.map(x=>x.id===d.id?{...x,status:'TERPAKAI'}:x)); addToast('Dipakai','success')}} className="text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded hover:bg-emerald-200">Sah</button>
                                                                <button onClick={()=>{setDocuments(ds=>ds.map(x=>x.id===d.id?{...x,status:'DI_ADMIN',penimbangName:null}:x)); addToast('Ditarik','success')}} className="text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded hover:bg-amber-200">Tarik</button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {giveModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                                <div className="bg-white rounded-2xl max-w-md w-full shadow-xl">
                                    <div className="p-5 border-b border-slate-100 flex justify-between items-center"><h3 className="font-bold text-lg">Handover Dokumen</h3><button onClick={()=>setGiveModal({isOpen:false,teamId:null,penimbangName:'',selected:new Set()})}><X size={20}/></button></div>
                                    <div className="p-5">
                                        <div className="mb-4"><label className="text-xs font-semibold text-slate-500 block mb-1">Nama Penimbang</label><input type="text" className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none" value={giveModal.penimbangName} onChange={e=>setGiveModal({...giveModal,penimbangName:e.target.value})}/></div>
                                        <label className="text-xs font-semibold text-slate-500 block mb-2">Pilih Dokumen ({giveModal.selected.size})</label>
                                        <div className="flex flex-wrap gap-1.5 max-h-40 overflow-y-auto custom-scrollbar">
                                            {(gDrawer[giveModal.teamId]||[]).map(d => {
                                                const sel = giveModal.selected.has(d.id);
                                                return <button key={d.id} onClick={()=>{const s=new Set(giveModal.selected); sel?s.delete(d.id):s.add(d.id); setGiveModal({...giveModal,selected:s})}} className={`px-2.5 py-1 rounded text-xs font-mono border ${sel?'bg-indigo-600 text-white border-indigo-600':'bg-white text-slate-600 border-slate-200'}`}>{d.number}</button>
                                            })}
                                        </div>
                                    </div>
                                    <div className="p-5 border-t border-slate-100 flex justify-end gap-2"><button onClick={()=>setGiveModal({isOpen:false,teamId:null,penimbangName:'',selected:new Set()})} className="px-4 py-2 text-sm text-slate-600 bg-slate-100 rounded-lg">Batal</button><button onClick={confirmHandover} className="px-4 py-2 text-sm text-white bg-indigo-600 rounded-lg">Serahkan</button></div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // --- VIEW: MONITOR TIM ---
            const MonitorTimView = () => {
                const [selectedTeamId, setSelectedTeamId] = useState(teams[0]?.id || '');
                const [visibleCount, setVisibleCount] = useState(100);

                useEffect(() => { setVisibleCount(100); }, [selectedTeamId]);

                if (teams.length === 0) return <div className="p-8 text-center text-slate-500">Belum ada tim.</div>;

                const teamDocs = documents.filter(d => d.teamId === selectedTeamId);
                const teamBatches = batches.filter(b => b.teamId === selectedTeamId);

                const statTerpakai = teamDocs.filter(d => d.status === 'TERPAKAI').length;
                const statDialokasikan = teamDocs.filter(d => d.status === 'DIALOKASIKAN').length;
                const statLaci = teamDocs.filter(d => d.status === 'DI_ADMIN').length;
                const statPenimbang = teamDocs.filter(d => d.status === 'DI_PENIMBANG').length;
                const totalDocs = teamDocs.length;

                const pTerpakai = totalDocs===0?0:(statTerpakai/totalDocs)*100;
                const pDialokasikan = totalDocs===0?0:(statDialokasikan/totalDocs)*100;
                const pLaci = totalDocs===0?0:(statLaci/totalDocs)*100;
                const pPenimbang = totalDocs===0?0:(statPenimbang/totalDocs)*100;

                return (
                    <div className="flex flex-col lg:flex-row h-full fade-in">
                        <div className="w-full lg:w-[240px] bg-white border-r border-slate-200 p-4 flex flex-col gap-2 overflow-y-auto shrink-0">
                            <h3 className="text-[10px] font-bold uppercase text-slate-400 mb-2 pl-2">Pilih Tim</h3>
                            {teams.map(t => (
                                <button key={t.id} onClick={() => setSelectedTeamId(t.id)} className={`text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex justify-between items-center ${selectedTeamId===t.id?'bg-emerald-50 text-emerald-700':'text-slate-600 hover:bg-slate-50'}`}>
                                    <span className="truncate">{t.name}</span>
                                    {selectedTeamId===t.id&&<ChevronRight size={14}/>}
                                </button>
                            ))}
                        </div>

                        <div className="flex-1 p-4 md:p-6 overflow-y-auto space-y-6 bg-slate-50/50">
                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="p-3 bg-sky-50 text-sky-600 rounded-xl"><BarChart3 size={24}/></div>
                                <div><h2 className="text-xl font-bold text-slate-800">{getTeamName(selectedTeamId)}</h2><p className="text-sm text-slate-500">Dasbor Performa Laporan Dokumen</p></div>
                            </div>
                            
                            {totalDocs === 0 ? (
                                <div className="p-12 text-center text-slate-400 bg-white rounded-2xl border border-slate-200"><p className="font-semibold text-slate-600">Belum ada transaksi</p></div>
                            ) : (
                                <>
                                    <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 md:gap-4">
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="flex items-center gap-2 mb-2"><FileText size={16} className="text-slate-400"/><span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Total</span></div>
                                            <p className="text-2xl font-bold text-slate-800">{totalDocs}</p>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-emerald-100 shadow-sm">
                                            <div className="flex items-center gap-2 mb-2"><CheckCircle2 size={16} className="text-emerald-500"/><span className="text-[10px] font-bold text-emerald-600 uppercase tracking-wider">Selesai</span></div>
                                            <p className="text-2xl font-bold text-slate-800">{statTerpakai}</p>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-amber-100 shadow-sm">
                                            <div className="flex items-center gap-2 mb-2"><Inbox size={16} className="text-amber-500"/><span className="text-[10px] font-bold text-amber-600 uppercase tracking-wider">Di Laci</span></div>
                                            <p className="text-2xl font-bold text-slate-800">{statLaci}</p>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm">
                                            <div className="flex items-center gap-2 mb-2"><UserCheck size={16} className="text-indigo-500"/><span className="text-[10px] font-bold text-indigo-600 uppercase tracking-wider">Penimbang</span></div>
                                            <p className="text-2xl font-bold text-slate-800">{statPenimbang}</p>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="flex items-center gap-2 mb-2"><Activity size={16} className="text-slate-400"/><span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Kandang</span></div>
                                            <p className="text-2xl font-bold text-slate-800">{statDialokasikan}</p>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                        <p className="text-sm font-bold text-slate-800 mb-4">Distribusi Status Dokumen</p>
                                        <div className="h-6 w-full bg-slate-100 rounded-md overflow-hidden flex shadow-inner mb-4">
                                            <div style={{width: `${pTerpakai}%`}} className="bg-emerald-500 h-full flex items-center justify-center text-[10px] font-bold text-white overflow-hidden">{pTerpakai>5&&`${pTerpakai.toFixed(0)}%`}</div>
                                            <div style={{width: `${pLaci}%`}} className="bg-amber-500 h-full flex items-center justify-center text-[10px] font-bold text-white overflow-hidden">{pLaci>5&&`${pLaci.toFixed(0)}%`}</div>
