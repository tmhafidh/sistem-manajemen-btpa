<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen BTPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Inter', sans-serif;}
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        /* Animasi Transisi Halus */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            Menu, X, Users, PlusCircle, Inbox, Activity, 
            Trash2, CheckCircle2, XCircle, AlertCircle, 
            RefreshCw, CheckSquare, Archive, ChevronRight,
            Calendar, Hash, ListOrdered, FileText, BarChart3, Search, Play,
            Database, Download, Upload, AlertTriangle, UserCheck, Briefcase, Undo2, Edit
        } from 'https://esm.sh/lucide-react@0.292.0';

        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- KOMPONEN UTAMA APLIKASI ---
        function App() {
            const [activeMenu, setActiveMenu] = useState('chick-in');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [alertConfig, setAlertConfig] = useState({ isOpen: false, title: '', message: '', type: 'success' });
            
            // State untuk Pencarian Global
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const searchInputRef = useRef(null);
            
            // Database Dummy bawaan agar tidak kosong melompong saat awal dibuka
            const [teams, setTeams] = useState([
                { id: 't1', name: 'Agus - Budi', ppl: 'Agus', penimbang: 'Budi' },
                { id: 't2', name: 'Cipto - Doni', ppl: 'Cipto', penimbang: 'Doni' }
            ]);
            const [batches, setBatches] = useState([]); 
            const [documents, setDocuments] = useState([]); 
            
            const addToast = (message, type = 'success') => {
                const id = generateId();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };

            const fireAlert = (title, message, type = 'success') => {
                setAlertConfig({ isOpen: true, title, message, type });
            };

            const closeMobileMenu = () => setIsMobileMenuOpen(false);

            // Helper untuk Global Search
            const getTeamName = (id) => teams.find(t => t.id === id)?.name || 'Tim Dihapus';
            const getBatchName = (id) => batches.find(b => b.id === id)?.name || 'Kandang Tidak Diketahui';

            // Hasil Pencarian Live
            const searchResults = useMemo(() => {
                if (!searchQuery.trim()) return [];
                return documents
                    .filter(d => d.number.includes(searchQuery))
                    .slice(0, 10); // Batasi 10 hasil agar tidak nge-lag
            }, [searchQuery, documents]);

            const NavItem = ({ id, label, icon: Icon }) => {
                const isActive = activeMenu === id;
                return (
                    <button
                        onClick={() => { setActiveMenu(id); closeMobileMenu(); }}
                        className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all duration-200 ${
                            isActive 
                                ? 'bg-emerald-500 text-white shadow-md shadow-emerald-200 font-semibold tracking-wide' 
                                : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900 font-medium'
                        }`}
                    >
                        <Icon size={20} className={isActive ? "text-white" : "text-slate-400"} />
                        <span>{label}</span>
                    </button>
                );
            };

            const MasterTimView = () => {
                const [pplName, setPplName] = useState('');
                const [penimbangName, setPenimbangName] = useState('');
                const [editModal, setEditModal] = useState({ isOpen: false, id: '', ppl: '', penimbang: '' });

                const handleAddTeam = (e) => {
                    e.preventDefault();
                    if (!pplName.trim() || !penimbangName.trim()) {
                        fireAlert('Validasi Gagal', 'Nama PPL dan Nama Penimbang wajib diisi keduanya.', 'error'); return;
                    }
                    const combinedName = `${pplName.trim()} - ${penimbangName.trim()}`;
                    if (teams.some(t => t.name.toLowerCase() === combinedName.toLowerCase())) {
                        fireAlert('Data Duplikat', 'Kombinasi Tim ini sudah terdaftar!', 'error'); return;
                    }
                    setTeams([...teams, { id: generateId(), name: combinedName, ppl: pplName.trim(), penimbang: penimbangName.trim() }]);
                    setPplName(''); setPenimbangName('');
                    fireAlert('Berhasil', `Tim ${combinedName} berhasil ditambahkan!`, 'success');
                };

                const handleDeleteTeam = (id) => {
                    if (batches.some(b => b.teamId === id) || documents.some(d => d.teamId === id)) {
                        fireAlert('Akses Ditolak', 'Tim sedang terikat pada data kandang/dokumen.', 'error'); return;
                    }
                    setTeams(teams.filter(t => t.id !== id));
                    addToast('Tim berhasil dihapus');
                };

                const handleUpdateTeam = (e) => {
                    e.preventDefault();
                    if (!editModal.ppl.trim() || !editModal.penimbang.trim()) {
                        fireAlert('Validasi Gagal', 'Nama PPL dan Penimbang wajib diisi.', 'error'); return;
                    }
                    const combinedName = `${editModal.ppl.trim()} - ${editModal.penimbang.trim()}`;
                    if (teams.some(t => t.id !== editModal.id && t.name.toLowerCase() === combinedName.toLowerCase())) {
                        fireAlert('Data Duplikat', 'Kombinasi Tim ini sudah terdaftar!', 'error'); return;
                    }
                    setTeams(teams.map(t => t.id === editModal.id ? { ...t, name: combinedName, ppl: editModal.ppl.trim(), penimbang: editModal.penimbang.trim() } : t));
                    setEditModal({ isOpen: false, id: '', ppl: '', penimbang: '' });
                    addToast('Data tim berhasil diperbarui!');
                };

                return (
                    <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6 fade-in">
                        <div className="flex items-center gap-4 mb-6">
                            <div className="p-3 bg-white rounded-2xl shadow-sm border border-slate-100"><Users className="text-emerald-600" size={28}/></div>
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800">Master Data Tim</h2>
                                <p className="text-slate-500 text-sm mt-1">Kelola daftar kombinasi PPL & Penimbang.</p>
                            </div>
                        </div>

                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
                            <form onSubmit={handleAddTeam} className="flex flex-col gap-4">
                                <div className="flex flex-col md:flex-row items-center gap-4">
                                    <div className="w-full flex-1 space-y-2">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Nama PPL</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><Briefcase size={18} className="text-slate-400" /></div>
                                            <input type="text" value={pplName} onChange={(e) => setPplName(e.target.value)} placeholder="Ketik nama PPL..." className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-slate-700 font-semibold" />
                                        </div>
                                    </div>
                                    <div className="hidden md:flex text-slate-300 font-black text-xl mt-6">-</div>
                                    <div className="w-full flex-1 space-y-2">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Nama Penimbang</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><UserCheck size={18} className="text-slate-400" /></div>
                                            <input type="text" value={penimbangName} onChange={(e) => setPenimbangName(e.target.value)} placeholder="Ketik nama Penimbang..." className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-slate-700 font-semibold" />
                                        </div>
                                    </div>
                                    <div className="w-full md:w-auto md:mt-6">
                                        <button type="submit" className="w-full bg-slate-800 text-white px-8 py-3.5 rounded-xl hover:bg-slate-900 flex items-center justify-center gap-2 font-semibold active:scale-95 transition-all shadow-sm">
                                            <PlusCircle size={18} /> Tambahkan
                                        </button>
                                    </div>
                                </div>
                                {(pplName || penimbangName) && (
                                    <div className="mt-2 p-4 bg-emerald-50 border border-emerald-100 rounded-xl flex items-center gap-3">
                                        <CheckCircle2 size={20} className="text-emerald-500" />
                                        <span className="text-sm font-bold text-emerald-700">Preview Tim:</span>
                                        <span className="bg-white px-3 py-1 rounded-lg border border-emerald-200 shadow-sm font-black text-slate-800 tracking-tight">
                                            {pplName || 'PPL'} <span className="text-slate-300 mx-1">-</span> {penimbangName || 'Penimbang'}
                                        </span>
                                    </div>
                                )}
                            </form>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[500px]">
                                    <thead>
                                        <tr className="bg-slate-50/80 border-b border-slate-100 text-slate-500 text-xs uppercase tracking-wider font-bold">
                                            <th className="px-6 py-4">Profil Tim</th>
                                            <th className="px-6 py-4 text-right">Manajemen</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {teams.length === 0 ? (
                                           <tr><td colSpan="2" className="p-8 text-center text-slate-400">Belum ada tim terdaftar.</td></tr>
                                        ) : (
                                            teams.map(team => (
                                                <tr key={team.id} className="hover:bg-slate-50/50 transition-colors group">
                                                    <td className="px-6 py-4">
                                                        <div className="flex items-center gap-4">
                                                            <div className="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg font-black shrink-0 shadow-inner">
                                                                {team.name.charAt(0).toUpperCase()}
                                                            </div>
                                                            <div>
                                                                <h3 className="font-bold text-slate-800">{team.name}</h3>
                                                                <div className="flex items-center gap-2 mt-1 text-[10px] font-bold uppercase tracking-wider">
                                                                    <span className="bg-slate-100 text-slate-500 px-2 py-0.5 rounded flex items-center gap-1"><Briefcase size={12}/> {team.ppl || 'N/A'}</span>
                                                                    <span className="bg-slate-100 text-slate-500 px-2 py-0.5 rounded flex items-center gap-1"><UserCheck size={12}/> {team.penimbang || 'N/A'}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 text-right">
                                                        <div className="flex justify-end gap-2">
                                                            <button onClick={() => setEditModal({ isOpen: true, id: team.id, ppl: team.ppl || '', penimbang: team.penimbang || '' })} className="text-slate-400 hover:text-indigo-600 p-2 rounded-lg transition-all bg-white hover:bg-indigo-50 border border-transparent hover:border-indigo-100" title="Edit">
                                                                <Edit size={18} />
                                                            </button>
                                                            <button onClick={() => handleDeleteTeam(team.id)} className="text-slate-400 hover:text-red-600 p-2 rounded-lg transition-all bg-white hover:bg-red-50 border border-transparent hover:border-red-100" title="Hapus">
                                                                <Trash2 size={18} />
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Modal Edit */}
                        {editModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4 fade-in">
                                <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
                                    <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                        <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2"><Edit size={20} className="text-indigo-600"/> Edit Data Tim</h3>
                                        <button onClick={() => setEditModal({ isOpen: false, id: '', ppl: '', penimbang: '' })} className="text-slate-400 hover:text-slate-700 bg-white p-1 rounded-full border"><X size={20}/></button>
                                    </div>
                                    <form onSubmit={handleUpdateTeam}>
                                        <div className="p-6 space-y-4">
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Nama PPL</label>
                                                <input type="text" value={editModal.ppl} onChange={(e) => setEditModal({...editModal, ppl: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-slate-700" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Nama Penimbang</label>
                                                <input type="text" value={editModal.penimbang} onChange={(e) => setEditModal({...editModal, penimbang: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-slate-700" />
                                            </div>
                                        </div>
                                        <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                                            <button type="button" onClick={() => setEditModal({ isOpen: false, id: '', ppl: '', penimbang: '' })} className="px-6 py-2.5 font-bold text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-100">Batal</button>
                                            <button type="submit" className="px-6 py-2.5 font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 shadow-lg active:scale-95">Simpan</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const DatabaseView = () => {
                const fileInputRef = useRef(null);
                const [restoreModal, setRestoreModal] = useState({ isOpen: false, data: null });
                const [resetModal, setResetModal] = useState({ isOpen: false, keyword: '' });

                const handleBackup = () => {
                    const data = { version: '2.0', timestamp: new Date().toISOString(), teams, batches, documents };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `backup_btpa_${new Date().toISOString().slice(0,10)}.json`;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                    fireAlert('Sukses', 'File backup berhasil diunduh ke komputer Anda!', 'success');
                };

                const handleFileChange = (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if (data.teams && data.batches && data.documents) setRestoreModal({ isOpen: true, data: data });
                            else fireAlert('Gagal', 'Format file backup tidak valid!', 'error');
                        } catch (error) { fireAlert('Gagal', 'Gagal membaca file json.', 'error'); }
                    };
                    reader.readAsText(file); e.target.value = null;
                };

                const confirmRestore = () => {
                    if (restoreModal.data) {
                        setTeams(restoreModal.data.teams); setBatches(restoreModal.data.batches); setDocuments(restoreModal.data.documents);
                        fireAlert('Sukses', 'Sistem berhasil dipulihkan dari file backup!', 'success');
                    }
                    setRestoreModal({ isOpen: false, data: null });
                };

                return (
                    <div className="p-4 md:p-8 max-w-4xl mx-auto space-y-6 fade-in">
                        <div className="flex items-center gap-4 mb-6">
                            <div className="p-3 bg-white rounded-2xl shadow-sm border border-slate-100"><Database className="text-emerald-600" size={28}/></div>
                            <div><h2 className="text-2xl font-bold text-slate-800">Backup & Restore</h2><p className="text-slate-500 text-sm mt-1">Simpan cadangan data dan pulihkan sistem.</p></div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center hover:border-emerald-300 transition-colors">
                                <div className="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4"><Download size={32} /></div>
                                <h3 className="text-lg font-bold text-slate-800">Backup Data</h3>
                                <p className="text-slate-500 text-sm mt-2 mb-6">Unduh data ke komputer format .json.</p>
                                <button onClick={handleBackup} className="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold hover:bg-emerald-600 flex items-center justify-center gap-2 shadow-md active:scale-95"><Download size={18} /> Unduh File</button>
                            </div>
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center hover:border-amber-300 transition-colors">
                                <div className="w-16 h-16 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4"><Upload size={32} /></div>
                                <h3 className="text-lg font-bold text-slate-800">Restore Data</h3>
                                <p className="text-slate-500 text-sm mt-2 mb-6">Pulihkan dari file. Akan menimpa data saat ini.</p>
                                <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileChange} className="hidden" />
                                <button onClick={() => fileInputRef.current?.click()} className="w-full bg-amber-500 text-white py-3 rounded-xl font-bold hover:bg-amber-600 flex items-center justify-center gap-2 shadow-md active:scale-95"><Upload size={18} /> Pilih File</button>
                            </div>
                        </div>

                        <div className="mt-8 pt-8 border-t border-slate-200">
                            <div className="bg-red-50 p-6 rounded-2xl border border-red-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div><h3 className="text-lg font-bold text-red-800 flex items-center gap-2"><AlertTriangle size={20} className="text-red-600" /> Reset Sistem</h3><p className="text-red-600/80 text-sm">Hapus seluruh data secara permanen.</p></div>
                                <button onClick={() => setResetModal({ isOpen: true, keyword: '' })} className="w-full md:w-auto px-6 py-3 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 flex items-center justify-center gap-2 shadow-md active:scale-95 shrink-0"><Trash2 size={18} /> Kosongkan Data</button>
                            </div>
                        </div>

                        {restoreModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4 fade-in">
                                <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl text-center">
                                    <div className="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner"><AlertTriangle size={32} /></div>
                                    <h3 className="text-xl font-bold text-slate-800 mb-2">Timpa Data Sistem?</h3>
                                    <p className="text-slate-500 text-sm mb-6">Seluruh data yang ada saat ini akan dihapus dan diganti dari file backup. Lanjutkan?</p>
                                    <div className="flex gap-3">
                                        <button onClick={() => setRestoreModal({ isOpen: false, data: null })} className="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200">Batal</button>
                                        <button onClick={confirmRestore} className="flex-1 bg-amber-500 text-white py-3 rounded-xl font-bold hover:bg-amber-600 shadow-md">Ya, Pulihkan</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {resetModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4 fade-in">
                                <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border-t-8 border-red-500 text-center">
                                    <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner"><Trash2 size={32} /></div>
                                    <h3 className="text-xl font-bold text-slate-800 mb-2">Peringatan Bahaya</h3>
                                    <p className="text-slate-500 text-sm mb-4">Ketik <strong className="text-red-600 bg-red-50 px-2 py-0.5 rounded font-mono">HAPUS</strong> untuk mengonfirmasi reset total.</p>
                                    <input type="text" className="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-center font-bold tracking-widest mb-6 text-lg" value={resetModal.keyword} onChange={(e) => setResetModal({...resetModal, keyword: e.target.value.toUpperCase()})} placeholder="Ketik HAPUS"/>
                                    <div className="flex gap-3">
                                        <button onClick={() => setResetModal({ isOpen: false, keyword: '' })} className="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200">Batal</button>
                                        <button onClick={() => { if(resetModal.keyword==='HAPUS'){ setTeams([]); setBatches([]); setDocuments([]); setResetModal({isOpen:false,keyword:''}); fireAlert('Sukses','Semua data telah dikosongkan.','success'); } else { addToast('Kata kunci salah!','error'); } }} disabled={resetModal.keyword !== 'HAPUS'} className="flex-1 bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 disabled:opacity-50 shadow-md active:scale-95">Eksekusi</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const InputLaciView = () => {
                const [teamId, setTeamId] = useState('');
                const [ranges, setRanges] = useState([{ from: '', to: '' }]);
                const [isGenerating, setIsGenerating] = useState(false);

                const totalGeneratedDocs = ranges.reduce((acc, range) => {
                    const from = parseInt(range.from); const to = parseInt(range.to);
                    if (!isNaN(from) && !isNaN(to) && from <= to) return acc + (to - from + 1); return acc;
                }, 0);

                const previewNumbers = useMemo(() => {
                    let nums = [];
                    for (const range of ranges) {
                        const from = parseInt(range.from); const to = parseInt(range.to);
                        if (!isNaN(from) && !isNaN(to) && from <= to) {
                            for (let i = from; i <= to; i++) { nums.push(i.toString()); if(nums.length >= 100) break; }
                        }
                        if(nums.length >= 100) break;
                    }
                    return nums;
                }, [ranges]);

                const conflictError = useMemo(() => {
                    if (!teamId) return null;
                    for (const range of ranges) {
                        const from = parseInt(range.from); const to = parseInt(range.to);
                        if (isNaN(from) || isNaN(to) || from > to) continue;
                        for (let i = from; i <= to; i++) {
                            const numStr = i.toString();
                            const existing = documents.find(d => d.number === numStr);
                            if (existing && existing.teamId !== teamId) {
                                const ownerTeam = teams.find(t => t.id === existing.teamId)?.name || 'Tim Lain';
                                return { number: numStr, owner: ownerTeam };
                            }
                        }
                    }
                    return null;
                }, [ranges, documents, teamId, teams]);

                const handleGenerate = () => {
                    if (!teamId) return fireAlert('Gagal', 'Pilih tim penerima stok laci terlebih dahulu.', 'error');
                    if (conflictError) return;
                    setIsGenerating(true);
                    setTimeout(() => {
                        let newDocs = [];
                        for (const range of ranges) {
                            const from = parseInt(range.from); const to = parseInt(range.to);
                            if (isNaN(from) || isNaN(to) || from > to) continue;
                            for (let i = from; i <= to; i++) {
                                const numStr = i.toString();
                                if (!documents.some(d => d.number === numStr && d.teamId === teamId)) {
                                    newDocs.push({ id: generateId(), batchId: null, teamId, number: numStr, status: 'DI_ADMIN' });
                                }
                            }
                        }
                        if (newDocs.length === 0) { setIsGenerating(false); return fireAlert('Gagal', 'Nomor tidak valid/sudah ada di laci tim ini.', 'error'); }
                        setDocuments([...documents, ...newDocs]);
                        fireAlert('Sukses', `${newDocs.length} dokumen ditambahkan ke Laci Admin tim terkait.`, 'success');
                        setTeamId(''); setRanges([{ from: '', to: '' }]); setIsGenerating(false);
                    }, 50);
                };

                return (
                    <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6 fade-in">
                        <div className="flex items-center gap-4 mb-6">
                            <div className="p-3 bg-white rounded-2xl shadow-sm border border-slate-100"><Archive className="text-amber-600" size={28}/></div>
                            <div><h2 className="text-2xl font-bold text-slate-800">Tambah Stok Laci</h2><p className="text-slate-500 text-sm mt-1">Masukkan dokumen baru langsung ke gudang tanpa kandang.</p></div>
                        </div>

                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                            <div className="mb-6">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Pilih Tim Pemilik Laci</label>
                                <select className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none font-semibold text-slate-700" value={teamId} onChange={(e) => setTeamId(e.target.value)}>
                                    <option value="">-- Pilih Tim --</option>
                                    {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                </select>
                            </div>

                            <div className="space-y-4">
                                {ranges.map((range, idx) => {
                                    const fromVal = parseInt(range.from); const toVal = parseInt(range.to);
                                    const rangeCount = (!isNaN(fromVal) && !isNaN(toVal) && fromVal <= toVal) ? (toVal - fromVal + 1) : 0;
                                    return (
                                        <div key={idx} className="flex flex-col xl:flex-row items-start xl:items-end gap-3 md:gap-4 bg-slate-50/50 p-4 md:p-5 rounded-xl border border-slate-200/60 group hover:border-amber-200 transition-colors">
                                            <div className="w-full xl:flex-1">
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Mulai Nomor</label>
                                                <input type="number" placeholder="Contoh: 1001" className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none font-mono text-lg font-bold tracking-widest text-slate-700 shadow-sm" value={range.from} onChange={(e) => { const r = [...ranges]; r[idx].from = e.target.value; setRanges(r); }} />
                                            </div>
                                            <div className="hidden xl:block text-slate-300 font-bold text-xl pb-3">-</div>
                                            <div className="w-full xl:flex-1">
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Sampai Nomor</label>
                                                <input type="number" placeholder="Contoh: 1005" className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none font-mono text-lg font-bold tracking-widest text-slate-700 shadow-sm" value={range.to} onChange={(e) => { const r = [...ranges]; r[idx].to = e.target.value; setRanges(r); }} />
                                            </div>
                                            <div className="w-full xl:w-auto flex items-center justify-between xl:justify-end gap-3 mt-1 xl:mt-0 pb-1">
                                                {rangeCount > 0 ? <span className="text-sm font-bold text-amber-700 bg-amber-100/50 px-4 py-2.5 rounded-xl border border-amber-200 shadow-sm">{rangeCount} lembar</span> : <span className="text-sm text-slate-400 px-4 py-2.5">0 lembar</span>}
                                                <button onClick={() => { if(ranges.length > 1) setRanges(ranges.filter((_, i) => i !== idx)) }} disabled={ranges.length === 1} className="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl disabled:opacity-30 shrink-0"><Trash2 size={22}/></button>
                                            </div>
                                        </div>
                                    )
                                })}
                                <button onClick={() => setRanges([...ranges, { from: '', to: '' }])} className="w-full sm:w-auto px-6 py-3 border-2 border-dashed border-amber-200 text-amber-600 font-semibold rounded-xl hover:bg-amber-50 flex items-center justify-center gap-2 transition-all"><PlusCircle size={18}/> Tambah Baris Rentang</button>
                            </div>

                            {conflictError && (
                                <div className="mt-6 p-5 bg-red-50 border border-red-200 rounded-xl flex items-start gap-3 fade-in">
                                    <AlertTriangle size={24} className="text-red-500 shrink-0" />
                                    <div>
                                        <p className="font-bold text-red-800 text-lg tracking-tight">Akses Ditolak! Lintas Tim</p>
                                        <p className="text-sm text-red-600 mt-1">Nomor <span className="font-mono bg-red-200 px-1.5 py-0.5 rounded text-red-900 font-bold">#{conflictError.number}</span> sudah dimiliki oleh <strong className="uppercase bg-red-600 text-white px-2 py-0.5 rounded text-xs tracking-wider">{conflictError.owner}</strong>. Harap ganti rentang.</p>
                                    </div>
                                </div>
                            )}

                            {previewNumbers.length > 0 && !conflictError && (
                                <div className="mt-6 bg-slate-50 border border-slate-200 rounded-xl p-5 fade-in">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Preview Live (Max 100):</p>
                                    <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar">
                                        {previewNumbers.map(n => <span key={n} className="bg-white border border-slate-200 px-2.5 py-1 rounded text-xs font-mono font-bold text-slate-600 shadow-sm">#{n}</span>)}
                                        {totalGeneratedDocs > 100 && <span className="text-xs bg-slate-200 px-2.5 py-1 rounded font-bold text-slate-600">+{totalGeneratedDocs - 100} lainnya...</span>}
                                    </div>
                                </div>
                            )}

                            {totalGeneratedDocs > 0 && !conflictError && (
                                <div className="mt-8 flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 md:p-8 rounded-2xl text-white gap-6 fade-in shadow-xl">
                                    <div className="text-center md:text-left">
                                        <p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Total Disimpan</p>
                                        <p className="text-4xl font-black">{totalGeneratedDocs} <span className="text-sm font-medium text-slate-400">lembar</span></p>
                                    </div>
                                    <button onClick={handleGenerate} disabled={isGenerating || !teamId} className="w-full md:w-auto bg-amber-500 text-slate-900 px-10 py-4 rounded-xl font-black text-lg hover:bg-amber-400 active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 transition-all">
                                        {isGenerating ? <RefreshCw className="animate-spin" size={24} /> : <Archive size={24} />} Simpan ke Laci
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const ChickInView = () => {
                const [formData, setFormData] = useState({ teamId: '', date: '', name: '', population: '' });
                const [ranges, setRanges] = useState([{ from: '', to: '' }]);
                const [isGenerating, setIsGenerating] = useState(false);
                const [usedDrawerDocs, setUsedDrawerDocs] = useState(new Set());

                const populationNum = parseInt(formData.population) || 0;
                const estimatedDocs = Math.ceil(populationNum / 1000);

                // Auto-group Laci
                const drawerDocsAnalysis = useMemo(() => {
                    if (!formData.teamId) return { adminDocs: [], adminGroups: [], penimDocs: [], penimGroups: [] };
                    const dDocs = documents.filter(d => d.teamId === formData.teamId && d.status === 'DI_ADMIN').sort((a,b) => parseInt(a.number) - parseInt(b.number));
                    const penimDocs = documents.filter(d => d.teamId === formData.teamId && d.status === 'DI_PENIMBANG').sort((a,b) => parseInt(a.number) - parseInt(b.number));
                    
                    const createGroups = (sourceDocs) => {
                        let groups = [];
                        if (sourceDocs.length > 0) {
                            let currentGroup = [sourceDocs[0]];
                            for (let i = 1; i < sourceDocs.length; i++) {
                                if (parseInt(sourceDocs[i].number) === parseInt(sourceDocs[i-1].number) + 1) {
                                    currentGroup.push(sourceDocs[i]);
                                } else {
                                    if (currentGroup.length > 1) groups.push([...currentGroup]);
                                    currentGroup = [sourceDocs[i]];
                                }
                            }
                            if (currentGroup.length > 1) groups.push(currentGroup);
                        }
                        return groups;
                    };

                    return { adminDocs: dDocs, adminGroups: createGroups(dDocs), penimDocs: penimDocs, penimGroups: createGroups(penimDocs) };
                }, [documents, formData.teamId]);

                const totalGeneratedDocs = ranges.reduce((acc, range) => {
                    const from = parseInt(range.from); const to = parseInt(range.to);
                    if (!isNaN(from) && !isNaN(to) && from <= to) return acc + (to - from + 1); return acc;
                }, 0);

                const previewNumbers = useMemo(() => {
                    let nums = [];
                    for (const range of ranges) {
                        const from = parseInt(range.from); const to = parseInt(range.to);
                        if (!isNaN(from) && !isNaN(to) && from <= to) {
                            for (let i = from; i <= to; i++) { nums.push(i.toString()); if(nums.length >= 100) break; }
                        }
                        if(nums.length >= 100) break;
                    }
                    return nums;
                }, [ranges]);

                const conflictError = useMemo(() => {
                    if (!formData.teamId) return null;
                    for (const range of ranges) {
                        const from = parseInt(range.from); const to = parseInt(range.to);
                        if (isNaN(from) || isNaN(to) || from > to) continue;
                        for (let i = from; i <= to; i++) {
                            const numStr = i.toString();
                            const existing = documents.find(d => d.number === numStr);
                            if (existing && existing.teamId !== formData.teamId) {
                                return { number: numStr, owner: teams.find(t => t.id === existing.teamId)?.name || 'Tim Lain' };
                            }
                        }
                    }
                    return null;
                }, [ranges, documents, formData.teamId, teams]);

                const handleRangeChange = (index, field, value) => {
                    const newRanges = [...ranges]; newRanges[index][field] = value; setRanges(newRanges);
                };

                const injectFromLaci = (fromStr, toStr, sourceIdArr) => {
                    let inserted = false;
                    const newRanges = [...ranges];
                    for (let i = 0; i < newRanges.length; i++) {
                        if (!newRanges[i].from && !newRanges[i].to) {
                            newRanges[i] = { from: fromStr, to: toStr }; inserted = true; break;
                        }
                    }
                    if (!inserted) newRanges.push({ from: fromStr, to: toStr });
                    setRanges(newRanges);
                    
                    const newUsed = new Set(usedDrawerDocs);
                    sourceIdArr.forEach(id => newUsed.add(id));
                    setUsedDrawerDocs(newUsed);
                };

                const handleGenerate = (e) => {
                    e.preventDefault();
                    if (!formData.teamId || !formData.date || !formData.name || !formData.population) return fireAlert('Validasi', 'Lengkapi seluruh data kandang (Panel Kiri).', 'error');
                    if (conflictError) return;
                    if (totalGeneratedDocs === 0) return fireAlert('Kosong', 'Rentang nomor belum diisi.', 'error');
                    
                    setIsGenerating(true);
                    setTimeout(() => {
                        let numsToGen = [];
                        for (const range of ranges) {
                            const f = parseInt(range.from); const t = parseInt(range.to);
                            if (isNaN(f) || isNaN(t) || f > t) continue;
                            for (let i = f; i <= t; i++) numsToGen.push(i.toString());
                        }

                        if (numsToGen.length > 20000) { setIsGenerating(false); return fireAlert('Limit', 'Maksimal 20.000 dokumen per kandang.', 'error'); }

                        const batchId = generateId();
                        const newBatch = { id: batchId, teamId: formData.teamId, date: formData.date, name: formData.name, population: populationNum, status: 'AKTIF' };

                        const updatedDocs = [...documents];
                        numsToGen.forEach(num => {
                            const extIdx = updatedDocs.findIndex(d => d.number === num && d.teamId === formData.teamId && (d.status === 'DI_ADMIN' || d.status === 'DI_PENIMBANG'));
                            if (extIdx !== -1) updatedDocs[extIdx] = { ...updatedDocs[extIdx], batchId, status: 'DIALOKASIKAN', penimbangName: null };
                            else updatedDocs.push({ id: generateId(), batchId, teamId: formData.teamId, number: num, status: 'DIALOKASIKAN' });
                        });

                        setBatches([...batches, newBatch]); setDocuments(updatedDocs);
                        fireAlert('Kandang Didaftarkan!', `Kandang ${formData.name} berjalan. ${numsToGen.length} dokumen dialokasikan.`, 'success');
                        
                        setFormData({ teamId: '', date: '', name: '', population: '' });
                        setRanges([{ from: '', to: '' }]); setUsedDrawerDocs(new Set());
                        setIsGenerating(false);
                    }, 50);
                };

                const renderLaciBox = (title, docs, groups, colorTheme, icon) => {
                    if (!docs || docs.length === 0) return null;
                    const IconComponent = icon;
                    return (
                        <div className={`p-5 mb-6 rounded-xl border ${colorTheme.bg} ${colorTheme.border}`}>
                            <p className={`text-sm font-bold ${colorTheme.text} mb-3 flex items-center gap-2`}><IconComponent size={18} /> {title} ({docs.length}):</p>
                            {groups && groups.length > 0 && (
                                <div className="mb-4">
                                    <p className={`text-[10px] font-bold ${colorTheme.subText} uppercase tracking-widest mb-2`}>Grup Berurutan:</p>
                                    <div className="flex flex-wrap gap-2">
                                        {groups.map((g, i) => {
                                            const isU = usedDrawerDocs.has(g[0].id);
                                            return <button key={i} disabled={isU} onClick={()=>injectFromLaci(g[0].number, g[g.length-1].number, g.map(x=>x.id))} className={`px-3 py-2 rounded-lg border-2 text-xs font-bold transition-all shadow-sm ${isU?`${colorTheme.usedBg} ${colorTheme.usedText} border-transparent`:`bg-white ${colorTheme.btnBorder} ${colorTheme.text} hover:${colorTheme.hoverBg} active:scale-95`}`}>{isU?<CheckCircle2 size={14} className="inline mr-1"/>:<ListOrdered size={14} className="inline mr-1"/>}#{g[0].number} - #{g[g.length-1].number} ({g.length})</button>
                                        })}
                                    </div>
                                </div>
                            )}
                            <div>
                                <p className={`text-[10px] font-bold ${colorTheme.subText} uppercase tracking-widest mb-2`}>Pilih Satuan:</p>
                                <div className="flex flex-wrap gap-2 max-h-24 overflow-y-auto custom-scrollbar pr-2">
                                    {docs.map(d => {
                                        const isU = usedDrawerDocs.has(d.id);
                                        return <button key={d.id} disabled={isU} onClick={()=>injectFromLaci(d.number, d.number, [d.id])} className={`px-2.5 py-1.5 rounded-md border text-xs font-mono font-bold transition-all shadow-sm ${isU?`${colorTheme.usedBg} ${colorTheme.usedText} border-transparent`:`bg-white ${colorTheme.btnBorder} ${colorTheme.text} hover:${colorTheme.hoverBg} active:scale-95`}`}>{isU&&<CheckCircle2 size={12} className="inline mr-1"/>}#{d.number}</button>
                                    })}
                                </div>
                            </div>
                        </div>
                    );
                };

                return (
                    <div className="p-4 md:p-8 max-w-7xl mx-auto flex flex-col lg:flex-row gap-6 fade-in">
                        {/* Kiri: Kandang */}
                        <div className="w-full lg:w-[350px] shrink-0 space-y-6">
                            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100">
                                <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2"><PlusCircle className="text-emerald-500" size={24}/> 1. Kandang</h2>
                                <div className="space-y-4">
                                    <div><label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 pl-1">Tim</label><select className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-bold text-slate-700 cursor-pointer" value={formData.teamId} onChange={(e) => {setFormData({...formData, teamId: e.target.value}); setRanges([{from:'', to:''}]); setUsedDrawerDocs(new Set());}}><option value="">-- Pilih Tim --</option>{teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
                                    <div><label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 pl-1">Tanggal</label><input type="date" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-bold text-slate-700" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})}/></div>
                                    <div><label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 pl-1">Nama Kandang</label><input type="text" placeholder="Kandang A1" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-bold text-slate-700" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})}/></div>
                                    <div><label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 pl-1">Populasi</label><input type="number" placeholder="5000" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-bold text-slate-700" value={formData.population} onChange={e => setFormData({...formData, population: e.target.value})}/></div>
                                </div>
                                <div className="mt-8 p-5 bg-gradient-to-br from-sky-50 to-blue-50 border border-sky-100 rounded-2xl flex justify-between items-center shadow-inner">
                                    <div><p className="text-[10px] font-bold text-sky-700 uppercase tracking-widest mb-1">Estimasi Sistem</p><p className="text-3xl font-black text-sky-600 tracking-tight">{estimatedDocs} <span className="text-sm font-medium">lbr</span></p></div>
                                    <BarChart3 size={32} className="text-sky-200"/>
                                </div>
                            </div>
                        </div>

                        {/* Kanan: Alokasi */}
                        <div className="flex-1 space-y-6">
                            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100">
                                <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2"><FileText className="text-emerald-500" size={24}/> 2. Alokasi BTPA</h2>
                                
                                {renderLaciBox("Di Laci Admin", drawerDocsAnalysis.adminDocs, drawerDocsAnalysis.adminGroups, {bg:'bg-amber-50/50', border:'border-amber-200', text:'text-amber-800', subText:'text-amber-600/80', btnBorder:'border-amber-300', hoverBg:'bg-amber-100', usedBg:'bg-amber-100/50', usedText:'text-amber-500'}, Inbox)}
                                {renderLaciBox("Di Tangan Penimbang", drawerDocsAnalysis.penimDocs, drawerDocsAnalysis.penimGroups, {bg:'bg-indigo-50/50', border:'border-indigo-200', text:'text-indigo-800', subText:'text-indigo-600/80', btnBorder:'border-indigo-300', hoverBg:'bg-indigo-100', usedBg:'bg-indigo-100/50', usedText:'text-indigo-500'}, UserCheck)}

                                <div className="space-y-4">
                                    {ranges.map((range, idx) => {
                                        const fv = parseInt(range.from); const tv = parseInt(range.to);
                                        const c = (!isNaN(fv) && !isNaN(tv) && fv <= tv) ? (tv - fv + 1) : 0;
                                        return (
                                            <div key={idx} className="flex flex-col xl:flex-row items-start xl:items-end gap-3 md:gap-4 bg-slate-50/50 p-4 md:p-5 rounded-xl border border-slate-200/60 group hover:border-emerald-200 transition-colors">
                                                <div className="w-full xl:flex-1"><label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Mulai Nomor</label><input type="number" placeholder="1001" className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-mono font-bold text-lg tracking-widest text-slate-700 shadow-sm" value={range.from} onChange={(e) => handleRangeChange(idx, 'from', e.target.value)} /></div>
                                                <div className="hidden xl:block font-bold text-slate-300 pb-3 text-xl">-</div>
                                                <div className="w-full xl:flex-1"><label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Sampai Nomor</label><input type="number" placeholder="1005" className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-mono font-bold text-lg tracking-widest text-slate-700 shadow-sm" value={range.to} onChange={(e) => handleRangeChange(idx, 'to', e.target.value)} /></div>
                                                <div className="w-full xl:w-auto mt-1 xl:mt-0 pb-1 flex items-center justify-between gap-3 shrink-0">
                                                    {c > 0 ? <span className="px-4 py-2.5 bg-emerald-100/50 text-emerald-700 text-sm font-bold rounded-xl border border-emerald-200 shadow-sm">{c} lbr</span> : <span className="px-4 py-2.5 text-slate-400 text-sm">0 lbr</span>}
                                                    <button onClick={() => { if(ranges.length>1) setRanges(ranges.filter((_,i)=>i!==idx)) }} disabled={ranges.length===1} className="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl disabled:opacity-30 transition-colors"><Trash2 size={22}/></button>
                                                </div>
                                            </div>
                                        )
                                    })}
                                    <button onClick={() => setRanges([...ranges, {from:'', to:''}])} className="w-full sm:w-auto px-6 py-3 border-2 border-dashed border-emerald-200 text-emerald-600 font-bold rounded-xl hover:bg-emerald-50 text-sm flex items-center justify-center gap-2 transition-all"><PlusCircle size={18}/> Tambah Baris Rentang</button>
                                </div>

                                {conflictError && (
                                    <div className="mt-6 p-5 bg-red-50 border border-red-200 rounded-xl flex items-start gap-3 fade-in">
                                        <AlertTriangle size={24} className="text-red-500 shrink-0" />
                                        <div><p className="font-bold text-red-800 text-lg tracking-tight">Akses Ditolak! Lintas Tim</p><p className="text-sm text-red-600 mt-1">Nomor <span className="font-mono bg-red-200 px-1.5 py-0.5 rounded text-red-900 font-bold">#{conflictError.number}</span> sudah sah milik <strong className="uppercase bg-red-600 text-white px-2 py-0.5 rounded text-xs tracking-wider">{conflictError.owner}</strong>.</p></div>
                                    </div>
                                )}

                                {previewNumbers.length > 0 && !conflictError && (
                                    <div className="mt-6 bg-slate-50 border border-slate-200 rounded-xl p-5 fade-in">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Preview Live (Max 100):</p>
                                        <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar">
                                            {previewNumbers.map(n => <span key={n} className="bg-white border border-slate-200 px-2.5 py-1 rounded text-xs font-mono font-bold text-slate-600 shadow-sm">#{n}</span>)}
                                            {totalGeneratedDocs > 100 && <span className="text-xs bg-slate-200 px-2.5 py-1 rounded font-bold text-slate-600">+{totalGeneratedDocs - 100} lainnya...</span>}
                                        </div>
                                    </div>
                                )}

                                {totalGeneratedDocs > 0 && !conflictError && (
                                    <div className={`mt-8 flex flex-col md:flex-row justify-between items-center p-6 md:p-8 rounded-2xl text-white gap-6 fade-in shadow-xl transition-all ${estimatedDocs>0&&totalGeneratedDocs!==estimatedDocs?'bg-amber-500':'bg-slate-800'}`}>
                                        <div className="text-center md:text-left">
                                            <p className="text-[10px] text-white/60 uppercase tracking-widest font-bold mb-1">Total Generate Final</p>
                                            <div className="flex items-center gap-3 justify-center md:justify-start">
                                                <p className="text-4xl font-black">{totalGeneratedDocs}</p>
                                                {estimatedDocs>0&&totalGeneratedDocs!==estimatedDocs&&<span className="text-[10px] bg-white/20 px-2.5 py-1.5 rounded-lg font-bold uppercase flex items-center gap-1"><AlertTriangle size={14}/> Meleset Estimasi</span>}
                                                {estimatedDocs>0&&totalGeneratedDocs===estimatedDocs&&<span className="text-[10px] bg-emerald-500/80 px-2.5 py-1.5 rounded-lg font-bold uppercase flex items-center gap-1 shadow-inner"><CheckCircle2 size={14}/> Sesuai</span>}
                                            </div>
                                        </div>
                                        <button onClick={handleGenerate} disabled={isGenerating || !formData.teamId} className={`w-full md:w-auto px-10 py-4 rounded-xl font-black text-lg active:scale-95 disabled:opacity-50 flex items-center justify-center gap-3 transition-all shadow-lg ${estimatedDocs>0&&totalGeneratedDocs!==estimatedDocs?'bg-slate-900 text-white hover:bg-slate-800':'bg-emerald-500 hover:bg-emerald-400'}`}>
                                            {isGenerating?<RefreshCw className="animate-spin" size={24}/>:<Play size={24} className="fill-current"/>} Simpan Kandang
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const ProsesPanenView = () => {
                const [selectedBatch, setSelectedBatch] = useState(null);
                const [visibleCount, setVisibleCount] = useState(50);
                const [searchTerm, setSearchTerm] = useState('');
                
                const activeBatches = batches.filter(b => b.status === 'AKTIF');

                const handleUpdateDocStatus = (docId, newStatus) => {
                    setDocuments(docs => docs.map(d => d.id === docId ? { ...d, status: newStatus } : d));
                };

                const handleBulkAction = (status) => {
                    if (!selectedBatch) return;
                    setDocuments(docs => docs.map(d => (d.batchId === selectedBatch.id && d.status === 'DIALOKASIKAN') ? { ...d, status: status } : d));
                    addToast(`Semua diubah jadi ${status === 'TERPAKAI' ? 'Selesai' : 'Laci Admin'}`);
                };

                const handleCloseBatch = () => {
                    const unresolved = documents.filter(d => d.batchId === selectedBatch.id && d.status === 'DIALOKASIKAN').length;
                    if (unresolved > 0) return fireAlert('Ditolak', `Masih ada ${unresolved} dokumen menggantung!`, 'error');
                    setBatches(bs => bs.map(b => b.id === selectedBatch.id ? { ...b, status: 'SELESAI' } : b));
                    fireAlert('Selesai', `Kandang ditutup permanen.`, 'success');
                    setSelectedBatch(null);
                };

                if (!selectedBatch) {
                    return (
                        <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 fade-in">
                            <div className="flex items-center gap-4 mb-6">
                                <div className="p-3 bg-white rounded-2xl shadow-sm border border-slate-100"><RefreshCw className="text-emerald-600" size={28}/></div>
                                <div><h2 className="text-2xl font-bold text-slate-800">Proses Panen</h2><p className="text-slate-500 text-sm mt-1">Pilih kandang aktif untuk mencatat kepulangan dokumen.</p></div>
                            </div>

                            {activeBatches.length === 0 ? (
                                <div className="bg-white p-16 text-center rounded-3xl border-2 border-dashed border-slate-200 shadow-sm"><ListOrdered size={48} className="mx-auto text-slate-300 mb-4"/><p className="text-xl font-bold text-slate-600 mb-1">Tidak ada kandang aktif.</p><p className="text-slate-400">Kandang yang sedang berjalan akan muncul di sini.</p></div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {activeBatches.map(batch => {
                                        const unresolved = documents.filter(d => d.batchId === batch.id && d.status === 'DIALOKASIKAN').length;
                                        return (
                                            <div key={batch.id} onClick={() => { setSelectedBatch(batch); setVisibleCount(50); setSearchTerm(''); }} className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm hover:shadow-lg hover:border-emerald-300 cursor-pointer transition-all duration-300 group relative overflow-hidden flex flex-col">
                                                <div className="absolute top-0 right-0 w-24 h-24 bg-emerald-50 rounded-bl-full -z-10 group-hover:scale-125 transition-transform duration-500"></div>
                                                <div className="flex justify-between items-start mb-6">
                                                    <div>
                                                        <h3 className="text-xl font-black text-slate-800 group-hover:text-emerald-600 transition-colors">{batch.name}</h3>
                                                        <p className="text-xs font-bold text-slate-500 mt-2 flex items-center gap-1.5"><Users size={14} className="text-slate-400"/> {getTeamName(batch.teamId)}</p>
                                                    </div>
                                                    <span className="bg-emerald-500 text-white text-[10px] font-black px-3 py-1.5 rounded-lg shadow-md uppercase tracking-widest">AKTIF</span>
                                                </div>
                                                <div className="flex items-center gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-100 mt-auto">
                                                    <div className="flex-1"><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Populasi</p><p className="font-black text-slate-700 text-lg">{batch.population}</p></div>
                                                    <div className="w-px h-8 bg-slate-200"></div>
                                                    <div className="flex-1"><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Menggantung</p><p className={`font-black text-lg flex items-center gap-1 ${unresolved>0?'text-amber-500':'text-emerald-500'}`}>{unresolved>0?unresolved:<><CheckCircle2 size={16}/> Bersih</>}</p></div>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            )}
                        </div>
                    );
                }

                const batchDocs = documents.filter(d => d.batchId === selectedBatch.id).sort((a,b)=>parseInt(a.number)-parseInt(b.number));
                const filteredDocs = searchTerm ? batchDocs.filter(d => d.number.includes(searchTerm)) : batchDocs;
                const unresolvedCount = batchDocs.filter(d => d.status === 'DIALOKASIKAN').length;

                return (
                    <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 fade-in">
                        <button onClick={() => setSelectedBatch(null)} className="text-slate-500 hover:text-emerald-600 text-sm font-bold flex items-center gap-2 mb-4 transition-colors"><div className="p-1.5 bg-white rounded-full shadow-sm border border-slate-200"><ChevronRight className="rotate-180" size={16}/></div> Kembali</button>
                        
                        <div className="bg-slate-800 p-8 md:p-10 rounded-3xl shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-64 h-64 bg-emerald-500/20 rounded-full blur-3xl -z-10 translate-x-1/2 -translate-y-1/2"></div>
                            <div className="text-white">
                                <div className="flex items-center gap-3 mb-2"><h2 className="text-4xl font-black tracking-tight">{selectedBatch.name}</h2><span className="bg-emerald-500 px-3 py-1 text-[10px] font-black rounded-lg uppercase tracking-widest">AKTIF</span></div>
                                <p className="text-slate-300 font-medium text-sm flex items-center gap-4"><span className="flex items-center gap-1.5"><Users size={16}/> {getTeamName(selectedBatch.teamId)}</span><span className="flex items-center gap-1.5"><FileText size={16}/> Total: {batchDocs.length} lbr</span></p>
                            </div>
                            <button onClick={handleCloseBatch} className={`w-full md:w-auto px-8 py-4 rounded-xl font-black flex items-center justify-center gap-2 transition-all shadow-lg text-lg ${unresolvedCount===0?'bg-emerald-500 text-white hover:bg-emerald-400 active:scale-95':'bg-slate-700 text-slate-500 cursor-not-allowed border border-slate-600'}`}><Archive size={24}/> Tutup Permanen</button>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col lg:flex-row justify-between items-center gap-4 sticky top-4 z-10">
                            <div className="flex items-center gap-3 bg-amber-50 px-5 py-3 rounded-xl border border-amber-100 w-full lg:w-auto">
                                <div className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></div> 
                                <span className="text-amber-800 font-black text-sm tracking-wide">{unresolvedCount} Menggantung</span>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                                <div className="relative flex-1"><Search size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"/><input type="text" placeholder="Cari No. BTPA..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold"/></div>
                                <div className="w-px h-10 bg-slate-200 hidden sm:block mt-1"></div>
                                <button onClick={() => handleBulkAction('TERPAKAI')} disabled={unresolvedCount===0} className="flex-1 sm:flex-none px-5 py-3 bg-emerald-50 text-emerald-700 font-bold text-sm rounded-xl hover:bg-emerald-100 disabled:opacity-50 transition-colors"><CheckSquare size={18} className="inline mr-1"/> Semua Selesai</button>
                                <button onClick={() => handleBulkAction('DI_ADMIN')} disabled={unresolvedCount===0} className="flex-1 sm:flex-none px-5 py-3 bg-amber-50 text-amber-700 font-bold text-sm rounded-xl hover:bg-amber-100 disabled:opacity-50 transition-colors"><Inbox size={18} className="inline mr-1"/> Semua Laci</button>
                            </div>
                        </div>

                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[700px]">
                                    <thead><tr className="bg-slate-50 border-b border-slate-100 text-slate-500 text-xs uppercase tracking-widest font-bold"><th className="px-8 py-5 w-20">No</th><th className="px-8 py-5">Nomor BTPA</th><th className="px-8 py-5">Status Live</th><th className="px-8 py-5 text-right">Aksi Eksekusi</th></tr></thead>
                                    <tbody className="divide-y divide-slate-100/80">
                                        {filteredDocs.slice(0, visibleCount).map((doc, i) => (
                                            <tr key={doc.id} className="hover:bg-slate-50/50 transition-colors">
                                                <td className="px-8 py-6 text-sm text-slate-400 font-bold">{i+1}</td>
                                                <td className="px-8 py-6 font-mono font-black text-2xl text-slate-800 tracking-wider">#{doc.number}</td>
                                                <td className="px-8 py-6">
                                                    {doc.status==='DIALOKASIKAN'&&<span className="bg-slate-100 border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-1.5"><Activity size={14}/> Lapangan</span>}
                                                    {doc.status==='TERPAKAI'&&<span className="bg-emerald-100 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-1.5 shadow-sm"><CheckCircle2 size={14}/> Selesai</span>}
                                                    {doc.status==='DI_ADMIN'&&<span className="bg-amber-100 border border-amber-200 text-amber-700 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-1.5 shadow-sm"><Inbox size={14}/> Laci</span>}
                                                </td>
                                                <td className="px-8 py-6 text-right">
                                                    {doc.status==='DIALOKASIKAN'? (
                                                        <div className="flex justify-end gap-2"><button onClick={()=>handleUpdateDocStatus(doc.id,'TERPAKAI')} className="px-5 py-2.5 bg-emerald-500 text-white rounded-xl font-bold text-sm hover:bg-emerald-600 shadow-md shadow-emerald-500/20 active:scale-95 transition-all">Terpakai</button><button onClick={()=>handleUpdateDocStatus(doc.id,'DI_ADMIN')} className="px-5 py-2.5 bg-amber-500 text-white rounded-xl font-bold text-sm hover:bg-amber-600 shadow-md shadow-amber-500/20 active:scale-95 transition-all">Laci</button></div>
                                                    ) : (
                                                        <button onClick={()=>handleUpdateDocStatus(doc.id,'DIALOKASIKAN')} className="px-5 py-2.5 text-slate-500 bg-slate-100 border border-slate-200 hover:bg-slate-200 font-bold text-sm rounded-xl transition-all shadow-sm active:scale-95 flex items-center gap-2 ml-auto"><Undo2 size={16}/> Batal</button>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            {visibleCount < filteredDocs.length && <div className="p-6 bg-slate-50/50 text-center border-t border-slate-100"><button onClick={()=>setVisibleCount(p=>p+50)} className="px-8 py-3 bg-white border border-slate-200 rounded-xl font-bold text-slate-600 hover:bg-slate-50 shadow-sm transition-all text-sm">Tampilkan Lebih Banyak ({filteredDocs.length - visibleCount} tersisa)</button></div>}
                        </div>
                    </div>
                );
            };

            const LaciAdminView = () => {
                const [activeTab, setActiveTab] = useState('laci');
                const [giveModal, setGiveModal] = useState({ isOpen: false, teamId: null, penimbangName: '', selected: new Set() });

                const drawerDocs = documents.filter(d => d.status === 'DI_ADMIN');
                const penimbangDocs = documents.filter(d => d.status === 'DI_PENIMBANG');

                const gDrawer = drawerDocs.reduce((a,c)=>{if(!a[c.teamId])a[c.teamId]=[];a[c.teamId].push(c);return a}, {});
                const gPenimbang = penimbangDocs.reduce((a,c)=>{if(!a[c.penimbangName])a[c.penimbangName]=[];a[c.penimbangName].push(c);return a}, {});

                const confirmHandover = () => {
                    if(!giveModal.penimbangName.trim() || giveModal.selected.size===0) return fireAlert('Error','Pilih dokumen dan ketik nama Penimbang.','error');
                    setDocuments(docs => docs.map(d => giveModal.selected.has(d.id)?{...d,status:'DI_PENIMBANG',penimbangName:giveModal.penimbangName.trim()}:d));
                    setGiveModal({isOpen:false,teamId:null,penimbangName:'',selected:new Set()});
                    addToast(`Dokumen resmi diserahkan ke ${giveModal.penimbangName}`, 'success');
                };

                return (
                    <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-8 fade-in">
                        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                            <div className="flex items-center gap-5">
                                <div className="p-4 bg-gradient-to-br from-amber-100 to-orange-100 text-amber-600 rounded-2xl shadow-inner"><Inbox size={32}/></div>
                                <div><h2 className="text-3xl font-black text-slate-800 tracking-tight mb-1">Gudang Inventaris</h2><p className="text-slate-500 font-medium text-sm">Pusat kontrol dokumen sisa dan di tangan Penimbang.</p></div>
                            </div>
                            <div className="flex bg-slate-100 p-2 rounded-2xl w-full md:w-auto shadow-inner border border-slate-200/50">
                                <button onClick={()=>setActiveTab('laci')} className={`flex-1 md:flex-none px-8 py-3.5 rounded-xl text-sm font-black uppercase tracking-widest transition-all duration-300 flex items-center justify-center gap-2 ${activeTab==='laci'?'bg-white text-slate-800 shadow-sm':'text-slate-400 hover:text-slate-600'}`}><Inbox size={18}/> Stok Internal</button>
