                                <button onClick={()=>setActiveTab('penimbang')} className={`flex-1 md:flex-none px-8 py-3.5 rounded-xl text-sm font-black uppercase tracking-widest transition-all duration-300 flex items-center justify-center gap-2 ${activeTab==='penimbang'?'bg-white text-slate-800 shadow-sm':'text-slate-400 hover:text-slate-600'}`}><UserCheck size={18}/> Di Penimbang</button>
                            </div>
                        </div>

                        {activeTab === 'laci' && (
                            <div className="fade-in">
                                {Object.keys(gDrawer).length === 0 ? <div className="bg-white rounded-3xl p-20 border-2 border-dashed border-slate-200 text-center"><Inbox className="mx-auto mb-6 text-slate-200" size={80} /><h3 className="text-2xl font-black text-slate-700 tracking-tight mb-2">Laci Sangat Bersih</h3><p className="text-slate-500 text-lg">Tidak ada tumpukan dokumen sisa di admin saat ini.</p></div> : (
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        {Object.entries(gDrawer).map(([tId, docs]) => {
                                            const team = teams.find(x=>x.id===tId);
                                            return (
                                                <div key={tId} className="bg-white rounded-3xl border border-slate-200 shadow-sm flex flex-col relative overflow-hidden group hover:shadow-lg hover:border-emerald-200 transition-all duration-300">
                                                    <div className="absolute top-0 right-0 w-40 h-40 bg-slate-50 rounded-bl-full -z-10 group-hover:bg-emerald-50/50 transition-colors duration-500"></div>
                                                    <div className="p-8 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                                        <div><h3 className="text-xl font-black text-slate-800 tracking-tight mb-1.5"><Users size={20} className="inline mr-2 text-slate-400"/> {team?.name||'Tim Dihapus'}</h3><span className="bg-slate-100 text-slate-500 px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider shadow-inner">{docs.length} Dokumen Laci</span></div>
                                                        <button onClick={()=>{setGiveModal({isOpen:true,teamId:tId,penimbangName:team?.penimbang||'',selected:new Set()})}} className="w-full sm:w-auto bg-indigo-50 border border-indigo-200 text-indigo-700 px-6 py-3.5 rounded-xl font-black hover:bg-indigo-100 flex justify-center items-center gap-2 shadow-sm active:scale-95 transition-all text-sm group/btn"><Briefcase size={18} className="group-hover/btn:-translate-y-0.5 transition-transform"/> Serahkan ke Penimbang</button>
                                                    </div>
                                                    <div className="p-8 bg-slate-50/30 flex-1">
                                                        <div className="flex flex-wrap gap-3 max-h-64 overflow-y-auto custom-scrollbar pr-2">
                                                            {docs.map(d => <span key={d.id} className="bg-white border border-slate-200/80 px-4 py-2 rounded-xl text-sm font-mono font-bold text-slate-600 shadow-sm cursor-default hover:border-emerald-300 transition-colors">#{d.number}</span>)}
                                                        </div>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'penimbang' && (
                            <div className="fade-in">
                                {Object.keys(gPenimbang).length === 0 ? <div className="bg-white rounded-3xl p-20 border-2 border-dashed border-slate-200 text-center"><UserCheck className="mx-auto mb-6 text-slate-200" size={80} /><h3 className="text-2xl font-black text-slate-700 tracking-tight mb-2">Penimbang Kosong</h3><p className="text-slate-500 text-lg">Tidak ada dokumen yang sedang dibawa Penimbang.</p></div> : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                        {Object.entries(gPenimbang).map(([pName, docs]) => (
                                            <div key={pName} className="bg-white rounded-3xl border border-indigo-200/60 shadow-sm flex flex-col hover:shadow-lg transition-all">
                                                <div className="p-6 border-b border-indigo-100 bg-indigo-50/50 flex flex-col gap-2 rounded-t-3xl">
                                                    <div className="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mb-1 shadow-inner"><UserCheck size={28}/></div>
                                                    <h3 className="text-3xl font-black text-indigo-950 tracking-tight">{pName}</h3>
                                                    <span className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest w-fit shadow-md shadow-indigo-600/30 mt-1">Membawa {docs.length} Lbr</span>
                                                </div>
                                                <div className="p-6 max-h-80 overflow-y-auto flex flex-col gap-4 custom-scrollbar">
                                                    {docs.map(d => (
                                                        <div key={d.id} className="flex flex-col xl:flex-row justify-between xl:items-center gap-3 bg-slate-50 p-5 rounded-2xl border border-slate-100 hover:border-indigo-200 transition-colors">
                                                            <div><span className="font-mono font-black text-xl text-slate-800 tracking-wider block mb-1.5">#{d.number}</span><span className="text-[10px] font-black text-slate-400 bg-white border border-slate-200 px-2 py-1 rounded-md uppercase tracking-wider shadow-sm">{getTeamName(d.teamId)}</span></div>
                                                            <div className="flex gap-2">
                                                                <button onClick={()=>{setDocuments(ds=>ds.map(x=>x.id===d.id?{...x,status:'TERPAKAI'}:x)); addToast(`Dokumen #${d.number} selesai dipakai.`,'success')}} className="flex-1 xl:flex-none p-3 bg-emerald-50 text-emerald-600 rounded-xl hover:bg-emerald-500 hover:text-white transition-all shadow-sm active:scale-95" title="Tandai Terpakai (Selesai)"><CheckCircle2 size={18} className="mx-auto"/></button>
                                                                <button onClick={()=>{setDocuments(ds=>ds.map(x=>x.id===d.id?{...x,status:'DI_ADMIN',penimbangName:null}:x)); addToast(`Ditarik ke laci.`,'success')}} className="flex-1 xl:flex-none p-3 bg-amber-50 text-amber-600 rounded-xl hover:bg-amber-500 hover:text-white transition-all shadow-sm active:scale-95" title="Tarik ke Laci Admin"><Undo2 size={18} className="mx-auto"/></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {giveModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4 fade-in">
                                <div className="bg-white rounded-3xl max-w-xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                                    <div className="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50"><h3 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3"><Briefcase size={24} className="text-indigo-600"/> Handover Dokumen</h3><button onClick={()=>setGiveModal({isOpen:false,teamId:null,penimbangName:'',selected:new Set()})} className="text-slate-400 hover:text-slate-700 bg-white p-2 rounded-full border shadow-sm"><X size={20}/></button></div>
                                    <div className="p-8 overflow-y-auto flex-1">
                                        <div className="mb-8"><label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 pl-1">Nama Penerima (Penimbang)</label><input type="text" placeholder="Ketik nama..." className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all font-black text-slate-800 text-lg" value={giveModal.penimbangName} onChange={e=>setGiveModal({...giveModal,penimbangName:e.target.value})}/></div>
                                        <div className="mb-4 flex justify-between items-end"><label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Pilih Dokumen Diserahkan</label><span className="text-xs font-black text-indigo-700 bg-indigo-100 px-3 py-1.5 rounded-lg shadow-sm">{giveModal.selected.size} Dipilih</span></div>
                                        <div className="bg-slate-50 border border-slate-200/80 p-5 rounded-2xl flex flex-wrap gap-2.5 max-h-64 overflow-y-auto custom-scrollbar">
                                            {(gDrawer[giveModal.teamId]||[]).map(d => {
                                                const sel = giveModal.selected.has(d.id);
                                                return <button key={d.id} onClick={()=>{const set=new Set(giveModal.selected); sel?set.delete(d.id):set.add(d.id); setGiveModal({...giveModal,selected:set})}} className={`px-4 py-2.5 rounded-xl text-sm font-mono font-bold border transition-all active:scale-95 ${sel?'bg-indigo-600 text-white border-indigo-700 shadow-md shadow-indigo-600/30':'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'}`}>{sel&&<CheckCircle2 size={16} className="inline mr-1.5"/>}#{d.number}</button>
                                            })}
                                        </div>
                                    </div>
                                    <div className="p-6 border-t border-slate-100 bg-slate-50 flex flex-col sm:flex-row justify-end gap-3"><button onClick={()=>setGiveModal({isOpen:false,teamId:null,penimbangName:'',selected:new Set()})} className="w-full sm:w-auto px-8 py-4 font-bold text-slate-600 bg-white border border-slate-200 rounded-2xl hover:bg-slate-100 transition-all">Batalkan</button><button onClick={confirmHandover} className="w-full sm:w-auto px-8 py-4 font-black text-white bg-indigo-600 rounded-2xl shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 active:scale-95 transition-all flex items-center justify-center gap-2"><UserCheck size={20}/> Serahkan Resmi</button></div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const MonitorTimView = () => {
                const [selectedTeamId, setSelectedTeamId] = useState(teams[0]?.id || '');
                const [visibleCount, setVisibleCount] = useState(100);

                useEffect(() => { setVisibleCount(100); }, [selectedTeamId]);

                if (teams.length === 0) return <div className="p-16 text-center text-slate-500 font-medium text-lg">Belum ada data tim. Silakan daftarkan di Master Tim.</div>;

                const teamDocs = documents.filter(d => d.teamId === selectedTeamId);
                const teamBatches = batches.filter(b => b.teamId === selectedTeamId);

                const statTerpakai = teamDocs.filter(d => d.status === 'TERPAKAI').length;
                const statDialokasikan = teamDocs.filter(d => d.status === 'DIALOKASIKAN').length;
                const statLaci = teamDocs.filter(d => d.status === 'DI_ADMIN').length;
                const statPenimbang = teamDocs.filter(d => d.status === 'DI_PENIMBANG').length;
                const totalDocs = teamDocs.length;

                const pTerpakai = totalDocs===0?0:(statTerpakai/totalDocs)*100;
                const pDialokasikan = totalDocs===0?0:(statDialokasikan/totalDocs)*100;
                const pLaci = totalDocs===0?0:(statLaci/totalDocs)*100;
                const pPenimbang = totalDocs===0?0:(statPenimbang/totalDocs)*100;

                return (
                    <div className="flex flex-col lg:flex-row h-full fade-in">
                        <div className="w-full lg:w-[320px] bg-white border-r border-slate-200/80 p-6 flex flex-col gap-3 overflow-y-auto custom-scrollbar z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)] shrink-0">
                            <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-3 pl-2">Pilih Dasbor Tim</h3>
                            {teams.map(t => (
                                <button key={t.id} onClick={() => setSelectedTeamId(t.id)} className={`text-left px-5 py-4 rounded-2xl font-bold transition-all flex items-center justify-between group ${selectedTeamId===t.id?'bg-slate-800 text-white shadow-xl shadow-slate-800/20 translate-x-1':'bg-white border border-slate-100 text-slate-600 hover:bg-slate-50 hover:border-slate-300'}`}>
                                    <div className="flex items-center gap-3"><div className={`p-2 rounded-xl transition-colors ${selectedTeamId===t.id?'bg-slate-700 text-white':'bg-slate-100 text-slate-400 group-hover:text-slate-600'}`}><Users size={18}/></div><span className="truncate max-w-[160px] tracking-tight text-base">{t.name}</span></div>
                                    {selectedTeamId===t.id&&<ChevronRight size={18} className="text-slate-400"/>}
                                </button>
                            ))}
                        </div>

                        <div className="flex-1 p-4 md:p-8 md:px-10 overflow-y-auto space-y-8 bg-slate-50/50 custom-scrollbar">
                            <div className="flex items-center gap-5 bg-white p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-200/60">
                                <div className="w-20 h-20 bg-sky-100 text-sky-600 rounded-3xl flex items-center justify-center shadow-inner"><BarChart3 size={36}/></div>
                                <div><h2 className="text-3xl md:text-4xl font-black text-slate-800 tracking-tight mb-1">{getTeamName(selectedTeamId)}</h2><p className="text-slate-500 font-medium">Analitik lengkap sirkulasi dokumen BTPA tim terkait.</p></div>
                            </div>
                            
                            {totalDocs === 0 ? (
                                <div className="p-20 text-center text-slate-400 bg-white rounded-[2rem] border-2 border-dashed border-slate-200/80"><Activity size={64} className="mx-auto mb-6 opacity-20"/><p className="text-2xl font-black text-slate-600 tracking-tight mb-2">Belum ada rekam jejak</p><p className="text-lg">Tim ini belum memiliki riwayat sirkulasi dokumen.</p></div>
                            ) : (
                                <>
                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4 md:gap-6">
                                        <div className="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/60 shadow-sm relative overflow-hidden group hover:border-slate-300 transition-colors"><div className="absolute -right-6 -top-6 text-slate-50 group-hover:scale-110 transition-transform duration-500"><FileText size={120} /></div><p className="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-2 relative z-10">Total Dokumen</p><p className="text-4xl md:text-5xl font-black text-slate-800 relative z-10 tracking-tighter">{totalDocs}</p></div>
                                        <div className="bg-emerald-500 p-6 md:p-8 rounded-3xl shadow-lg shadow-emerald-500/20 relative overflow-hidden group text-white"><div className="absolute -right-6 -top-6 text-emerald-400/30 group-hover:scale-110 transition-transform duration-500"><CheckCircle2 size={120} /></div><p className="text-emerald-100 text-[10px] font-black uppercase tracking-widest mb-2 relative z-10">Selesai</p><p className="text-4xl md:text-5xl font-black relative z-10 tracking-tighter">{statTerpakai}</p></div>
                                        <div className="bg-amber-500 p-6 md:p-8 rounded-3xl shadow-lg shadow-amber-500/20 relative overflow-hidden group text-white"><div className="absolute -right-6 -top-6 text-amber-400/30 group-hover:scale-110 transition-transform duration-500"><Inbox size={120} /></div><p className="text-amber-100 text-[10px] font-black uppercase tracking-widest mb-2 relative z-10">Di Laci</p><p className="text-4xl md:text-5xl font-black relative z-10 tracking-tighter">{statLaci}</p></div>
                                        <div className="bg-indigo-500 p-6 md:p-8 rounded-3xl shadow-lg shadow-indigo-500/20 relative overflow-hidden group text-white"><div className="absolute -right-6 -top-6 text-indigo-400/30 group-hover:scale-110 transition-transform duration-500"><UserCheck size={120} /></div><p className="text-indigo-100 text-[10px] font-black uppercase tracking-widest mb-2 relative z-10">Di Penimbang</p><p className="text-4xl md:text-5xl font-black relative z-10 tracking-tighter">{statPenimbang}</p></div>
                                        <div className="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/60 shadow-sm relative overflow-hidden group hover:border-slate-300 transition-colors"><div className="absolute -right-6 -top-6 text-slate-50 group-hover:scale-110 transition-transform duration-500"><Activity size={120} /></div><p className="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-2 relative z-10">Gantung</p><p className="text-4xl md:text-5xl font-black text-slate-800 relative z-10 tracking-tighter">{statDialokasikan}</p></div>
                                    </div>

                                    <div className="bg-white p-6 md:p-10 rounded-3xl border border-slate-200/60 shadow-sm">
                                        <div className="flex justify-between items-center mb-8"><h3 className="text-xl font-black text-slate-800 tracking-tight">Distribusi Status</h3><span className="text-[10px] font-black text-slate-400 bg-slate-100 px-4 py-2 rounded-xl uppercase tracking-widest shadow-inner hidden sm:block">100% Total Kapasitas</span></div>
                                        <div className="h-12 w-full bg-slate-100 rounded-2xl overflow-hidden flex shadow-inner mb-8">
                                            <div style={{width: `${pTerpakai}%`}} className="bg-emerald-500 h-full transition-all duration-1000 ease-out flex items-center justify-center text-xs font-black text-white overflow-hidden shadow-[inset_0_-4px_0_rgba(0,0,0,0.1)]" title={`Selesai: ${pTerpakai.toFixed(1)}%`}>{pTerpakai>5&&`${pTerpakai.toFixed(0)}%`}</div>
                                            <div style={{width: `${pLaci}%`}} className="bg-amber-500 h-full transition-all duration-1000 ease-out flex items-center justify-center text-xs font-black text-white overflow-hidden shadow-[inset_0_-4px_0_rgba(0,0,0,0.1)]" title={`Laci: ${pLaci.toFixed(1)}%`}>{pLaci>5&&`${pLaci.toFixed(0)}%`}</div>
                                            <div style={{width: `${pPenimbang}%`}} className="bg-indigo-500 h-full transition-all duration-1000 ease-out flex items-center justify-center text-xs font-black text-white overflow-hidden shadow-[inset_0_-4px_0_rgba(0,0,0,0.1)]" title={`Penimbang: ${pPenimbang.toFixed(1)}%`}>{pPenimbang>5&&`${pPenimbang.toFixed(0)}%`}</div>
                                            <div style={{width: `${pDialokasikan}%`}} className="bg-slate-300 h-full transition-all duration-1000 ease-out flex items-center justify-center text-xs font-black text-slate-600 overflow-hidden shadow-[inset_0_-4px_0_rgba(0,0,0,0.05)]" title={`Menggantung: ${pDialokasikan.toFixed(1)}%`}>{pDialokasikan>5&&`${pDialokasikan.toFixed(0)}%`}</div>
                                        </div>
                                        <div className="flex flex-wrap justify-center gap-4 md:gap-8 text-xs md:text-sm font-bold">
                                            <div className="flex items-center gap-2"><div className="w-5 h-5 bg-emerald-500 rounded-lg shadow-sm"></div> <span className="text-slate-600">Selesai</span></div>
                                            <div className="flex items-center gap-2"><div className="w-5 h-5 bg-amber-500 rounded-lg shadow-sm"></div> <span className="text-slate-600">Laci Admin</span></div>
                                            <div className="flex items-center gap-2"><div className="w-5 h-5 bg-indigo-500 rounded-lg shadow-sm"></div> <span className="text-slate-600">Penimbang</span></div>
                                            <div className="flex items-center gap-2"><div className="w-5 h-5 bg-slate-300 rounded-lg shadow-sm"></div> <span className="text-slate-600">Kandang</span></div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-8">
                                        <div className="bg-white border border-slate-200/60 rounded-3xl shadow-sm flex flex-col overflow-hidden">
                                            <div className="p-6 md:p-8 border-b border-slate-100 bg-slate-50/50"><h3 className="text-xl font-black text-slate-800 tracking-tight">Riwayat Kandang</h3></div>
                                            <div className="overflow-x-auto flex-1">
                                                <table className="w-full text-left text-sm">
                                                    <thead className="bg-white text-slate-400 text-[10px] font-black uppercase tracking-widest border-b border-slate-100"><tr><th className="px-6 md:px-8 py-5">Nama Kandang</th><th className="px-6 md:px-8 py-5">Tanggal</th><th className="px-6 md:px-8 py-5">Status</th><th className="px-6 md:px-8 py-5 text-center">Vol</th></tr></thead>
                                                    <tbody className="divide-y divide-slate-100/80">
                                                        {teamBatches.length === 0 ? (
                                                            <tr><td colSpan="4" className="p-10 text-center text-slate-400 font-medium">Belum ada riwayat kandang.</td></tr>
                                                        ) : (
                                                            teamBatches.map(b => (
                                                                <tr key={b.id} className="hover:bg-slate-50 transition-colors">
                                                                    <td className="px-6 md:px-8 py-5 font-black text-slate-700 text-base">{b.name}</td>
                                                                    <td className="px-6 md:px-8 py-5 font-semibold text-slate-500 whitespace-nowrap">{b.date}</td>
                                                                    <td className="px-6 md:px-8 py-5"><span className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-sm ${b.status==='AKTIF'?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-500'}`}>{b.status}</span></td>
                                                                    <td className="px-6 md:px-8 py-5 text-center font-black text-slate-700 text-lg">{documents.filter(d=>d.batchId===b.id).length}</td>
                                                                </tr>
                                                            ))
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div className="bg-white border border-slate-200/60 rounded-3xl shadow-sm flex flex-col">
                                            <div className="p-6 md:p-8 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center"><h3 className="text-xl font-black text-slate-800 tracking-tight">Log Nomor Dokumen</h3><span className="text-[10px] font-black uppercase tracking-widest bg-white border shadow-sm text-slate-500 px-3 py-1.5 rounded-lg hidden sm:block">Semua Status</span></div>
                                            <div className="p-6 md:p-8 flex-1">
                                                <div className="flex flex-wrap gap-2.5 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar">
                                                    {teamDocs.slice(0, visibleCount).map(d => {
                                                        let c = 'bg-slate-50 border-slate-200 text-slate-500'; 
                                                        if (d.status === 'TERPAKAI') c = 'bg-emerald-50 border-emerald-200 text-emerald-700 shadow-sm';
                                                        if (d.status === 'DIALOKASIKAN') c = 'bg-white border-slate-200 text-slate-700 shadow-sm';
                                                        if (d.status === 'DI_ADMIN') c = 'bg-amber-50 border-amber-200 text-amber-700 shadow-sm';
                                                        if (d.status === 'DI_PENIMBANG') c = 'bg-indigo-50 border-indigo-200 text-indigo-700 shadow-sm';
                                                        return <span key={d.id} className={`px-3 py-1.5 border rounded-lg text-sm font-mono font-bold transition-all hover:brightness-95 cursor-default ${c}`} title={d.status}>#{d.number}</span>
                                                    })}
                                                </div>
                                                {visibleCount < teamDocs.length && <div className="mt-8 text-center"><button onClick={() => setVisibleCount(p => p+100)} className="w-full sm:w-auto px-8 py-4 bg-slate-50 text-slate-600 font-black text-sm rounded-2xl hover:bg-slate-100 border border-slate-200 transition-all shadow-sm active:scale-95">Muat {teamDocs.length - visibleCount} Nomor Tersisa...</button></div>}
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                );
            };

            const GlobalSearchModal = () => {
                if (!isSearchOpen) return null;

                return (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-start justify-center z-[200] p-4 pt-16 md:pt-24 fade-in" onClick={() => setIsSearchOpen(false)}>
                        <div className="bg-white rounded-[2rem] max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}>
                            {/* Search Input Area */}
                            <div className="p-4 md:p-6 border-b border-slate-100 bg-slate-50/50 flex items-center gap-4">
                                <div className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm border border-slate-200 shrink-0 text-slate-400">
                                    <Search size={24}/>
                                </div>
                                <input 
                                    ref={searchInputRef}
                                    type="text" 
                                    placeholder="Ketik Nomor BTPA untuk melacak..."
                                    className="flex-1 bg-transparent border-none outline-none font-black text-xl md:text-2xl text-slate-800 placeholder:text-slate-300"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    autoFocus
                                />
                                <button onClick={() => setIsSearchOpen(false)} className="p-2 text-slate-400 hover:text-slate-700 bg-white rounded-full border shadow-sm shrink-0"><X size={20}/></button>
                            </div>

                            {/* Search Results Area */}
                            <div className="p-4 md:p-6 overflow-y-auto flex-1 custom-scrollbar bg-slate-50">
                                {searchQuery.trim() === '' ? (
                                    <div className="text-center py-12 text-slate-400">
                                        <Search size={48} className="mx-auto mb-4 opacity-20"/>
                                        <p className="font-bold text-lg">Pencarian Cepat</p>
                                        <p className="text-sm">Ketik sebagian atau seluruh nomor BTPA yang ingin dilacak.</p>
                                    </div>
                                ) : searchResults.length === 0 ? (
                                    <div className="text-center py-12 text-slate-400">
                                        <XCircle size={48} className="mx-auto mb-4 opacity-20"/>
                                        <p className="font-bold text-lg text-slate-600">Tidak Ditemukan</p>
                                        <p className="text-sm">Nomor <strong>#{searchQuery}</strong> tidak terdaftar di sistem.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        <p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 pl-2">Hasil Pelacakan (Max 10)</p>
                                        {searchResults.map(doc => {
                                            // Determine styles and info based on status
                                            let badgeColor = 'bg-slate-100 text-slate-600';
                                            let icon = <Activity size={18} />;
                                            let statusText = 'MENGGANTUNG';
                                            let locationInfo = `Kandang: ${getBatchName(doc.batchId)}`;

                                            if (doc.status === 'TERPAKAI') {
                                                badgeColor = 'bg-emerald-100 text-emerald-700 border border-emerald-200';
                                                icon = <CheckCircle2 size={18} />;
                                                statusText = 'SELESAI (SAH)';
                                                locationInfo = `Dipakai di: ${getBatchName(doc.batchId)}`;
                                            } else if (doc.status === 'DI_ADMIN') {
                                                badgeColor = 'bg-amber-100 text-amber-700 border border-amber-200';
                                                icon = <Inbox size={18} />;
                                                statusText = 'LACI ADMIN';
                                                locationInfo = 'Tersimpan di Laci Kantor';
                                            } else if (doc.status === 'DI_PENIMBANG') {
                                                badgeColor = 'bg-indigo-100 text-indigo-700 border border-indigo-200';
                                                icon = <UserCheck size={18} />;
                                                statusText = 'DI PENIMBANG';
                                                locationInfo = `Dibawa oleh: ${doc.penimbangName}`;
                                            }

                                            return (
                                                <div key={doc.id} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4 group hover:border-emerald-300 transition-colors">
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${badgeColor.split(' ')[0]} ${badgeColor.split(' ')[1]}`}>
                                                            {icon}
                                                        </div>
                                                        <div>
                                                            <p className="font-mono font-black text-xl text-slate-800 tracking-wider">#{doc.number}</p>
                                                            <div className="flex flex-wrap items-center gap-2 mt-1">
                                                                <span className="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded uppercase tracking-wider">{getTeamName(doc.teamId)}</span>
                                                                <span className="text-xs font-semibold text-slate-500">{locationInfo}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className={`px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest shadow-sm w-fit sm:w-auto text-center ${badgeColor}`}>
                                                        {statusText}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            // Autofocus Search input when modal opens
            useEffect(() => {
                if (isSearchOpen && searchInputRef.current) {
                    setTimeout(() => searchInputRef.current.focus(), 100);
                }
            }, [isSearchOpen]);

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row font-sans text-slate-900 selection:bg-emerald-200 selection:text-emerald-900">
                    
                    {/* Mobile Header */}
                    <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center z-30 sticky top-0 shadow-lg">
                        <h1 className="font-black text-2xl flex items-center gap-3 tracking-tight">
                            <div className="bg-gradient-to-br from-emerald-400 to-emerald-600 p-2 rounded-xl shadow-inner"><Activity size={22} className="text-white"/></div> BTPA Hub
                        </h1>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setIsSearchOpen(true)} className="p-2.5 bg-slate-800 rounded-xl hover:bg-slate-700 transition-colors text-emerald-400">
                                <Search size={22} />
                            </button>
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2.5 bg-slate-800 rounded-xl hover:bg-slate-700 transition-colors active:scale-95">
                                {isMobileMenuOpen ? <X size={24} /> : <Menu size={24} />}
                            </button>
                        </div>
                    </div>

                    {/* Sidebar Desktop & Mobile */}
                    <div className={`fixed inset-y-0 left-0 z-40 w-[300px] bg-white border-r border-slate-200/80 shadow-[10px_0_30px_rgba(0,0,0,0.05)] md:shadow-none transform transition-transform duration-500 ease-in-out md:relative md:translate-x-0 flex flex-col ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-8 hidden md:block">
                            <h1 className="font-black text-3xl text-slate-800 flex items-center gap-4 tracking-tight">
                                <div className="bg-gradient-to-br from-emerald-400 to-emerald-600 p-3 rounded-[1.25rem] text-white shadow-lg shadow-emerald-500/30"><Activity size={28}/></div>
                                BTPA Hub
                            </h1>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto py-6 px-5 space-y-2 custom-scrollbar">
                            
                            {/* Tombol Pencarian Global (Sidebar) */}
                            <div className="mb-6 hidden md:block">
                                <button onClick={() => setIsSearchOpen(true)} className="w-full bg-slate-50 text-slate-500 hover:bg-emerald-50 hover:text-emerald-600 hover:border-emerald-200 px-4 py-3.5 rounded-xl flex items-center gap-3 transition-all font-bold border border-slate-200 shadow-sm group">
                                    <Search size={20} className="group-hover:scale-110 transition-transform" /> 
                                    <span className="flex-1 text-left tracking-wide">Pencarian Cepat</span> 
                                    <span className="text-[10px] bg-white border border-slate-200 px-2 py-1 rounded shadow-sm text-slate-400 font-black">🔍</span>
                                </button>
                            </div>

                            <p className="px-4 text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3 mt-4 md:mt-0">Siklus Kandang</p>
                            <NavItem id="chick-in" label="1. Chick-in (Input)" icon={PlusCircle} />
                            <NavItem id="proses-panen" label="2. Proses Panen Aktif" icon={RefreshCw} />
                            
                            <div className="my-6 border-t border-slate-100/80 mx-4"></div>
                            
                            <p className="px-4 text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3">Inventaris & Gudang</p>
                            <NavItem id="input-laci" label="Tambah Stok Laci" icon={Archive} />
                            <NavItem id="laci-admin" label="Gudang (Laci & PPL)" icon={Inbox} />
                            <NavItem id="monitor-tim" label="Dasbor Analitik Tim" icon={BarChart3} />
                            
                            <div className="my-6 border-t border-slate-100/80 mx-4"></div>
                            
                            <p className="px-4 text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3">Manajemen Sistem</p>
                            <NavItem id="master-tim" label="Master Data Tim" icon={Users} />
                            <NavItem id="database" label="Backup & Restore" icon={Database} />
                        </div>
                        
                        <div className="p-6 border-t border-slate-100 bg-slate-50/50">
                            <div className="bg-white p-4 rounded-2xl border border-slate-200 text-center shadow-sm">
                                <p className="text-xs font-black text-slate-700 tracking-tight">Sistem Digital BTPA</p>
                                <p className="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest">Enterprise v2.0</p>
                                <p className="text-[9px] font-semibold text-slate-400 mt-3 border-t border-slate-100 pt-2">&copy; {new Date().getFullYear()} Teuku Muhammad Hafidh Rafif</p>
                            </div>
                        </div>
                    </div>

                    {isMobileMenuOpen && <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 md:hidden transition-opacity duration-300" onClick={closeMobileMenu} />}

                    {/* Konten Utama */}
                    <div className="flex-1 overflow-y-auto bg-slate-50/50 md:h-screen relative custom-scrollbar">
                        {activeMenu === 'master-tim' && <MasterTimView />}
                        {activeMenu === 'database' && <DatabaseView />}
                        {activeMenu === 'input-laci' && <InputLaciView />}
                        {activeMenu === 'chick-in' && <ChickInView />}
                        {activeMenu === 'proses-panen' && <ProsesPanenView />}
                        {activeMenu === 'laci-admin' && <LaciAdminView />}
                        {activeMenu === 'monitor-tim' && <MonitorTimView />}
                    </div>

                    {/* --- KOMPONEN OVERLAY GLOBAL --- */}
                    <GlobalSearchModal />

                    {alertConfig.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-md flex items-center justify-center z-[150] p-4 fade-in">
                            <div className="bg-white rounded-[2rem] max-w-sm w-full p-8 shadow-2xl border border-slate-100">
                                <div className={`w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner ${alertConfig.type === 'success' ? 'bg-emerald-50 text-emerald-500' : 'bg-red-50 text-red-500'}`}>
                                    {alertConfig.type === 'success' ? <CheckCircle2 size={48} /> : <XCircle size={48} />}
                                </div>
                                <h3 className="text-3xl font-black text-center mb-2 tracking-tight text-slate-800">{alertConfig.title}</h3>
                                <p className="text-center text-slate-500 mb-8 font-medium leading-relaxed">{alertConfig.message}</p>
                                <button onClick={() => setAlertConfig({...alertConfig, isOpen: false})} className={`w-full text-white py-4 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all ${alertConfig.type === 'success' ? 'bg-emerald-500 hover:bg-emerald-600 shadow-emerald-500/30' : 'bg-red-500 hover:bg-red-600 shadow-red-500/30'}`}>
                                    Tutup Pesan
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="fixed top-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`pointer-events-auto flex items-center gap-4 px-6 py-4 rounded-2xl shadow-xl fade-in ${toast.type === 'success' ? 'bg-slate-800 text-white border border-slate-700' : 'bg-red-600 text-white'}`}>
                                {toast.type === 'success' ? <CheckCircle2 size={24} className="text-emerald-400" /> : <AlertCircle size={24} className="text-white" />}
                                <p className="text-sm font-bold tracking-wide">{toast.message}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
