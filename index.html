                                      <button type="button" key={`g${idx}`} disabled={isUsed} onClick={() => injectRange(group[0].number, group[group.length-1].number)} className={`px-4 py-2.5 rounded-xl border-2 font-black text-sm transition-all shadow-sm flex items-center gap-2 ${isUsed ? 'bg-amber-100/50 border-transparent text-amber-400 opacity-60' : 'bg-white border-brand-300 text-brand-700 hover:bg-brand-100 hover:border-brand-400 active:scale-95 cursor-pointer'}`}>
                                          {isUsed ? <CheckCircle2 size={16}/> : <ListOrdered size={16}/>} #{group[0].number} - #{group[group.length-1].number} <span className="bg-brand-200/50 px-2 py-0.5 rounded-md text-[10px]">{group.length}x</span>
                                      </button>
                                      )
                                  })}
                              </div>
                          </div>
                        )}
                        <div>
                            <p className="text-[10px] font-bold text-amber-600/80 uppercase tracking-widest mb-2">Atau Pilih Satuan (Klik untuk mengisi kolom aktif):</p>
                            <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar pr-2">
                              {drawerDocsAnalysis.docs.map(doc => {
                                const isUsed = usedDrawerDocs.has(doc.id);
                                return (
                                  <button type="button" key={doc.id} disabled={isUsed} onClick={() => injectRange(doc.number, doc.number)} className={`px-3 py-1.5 rounded-lg border font-mono font-bold text-sm transition-all ${isUsed ? 'bg-amber-100/50 border-transparent text-amber-400 opacity-60 flex items-center gap-1' : 'bg-white border-brand-200 text-brand-700 hover:bg-brand-100 shadow-sm active:scale-95 cursor-pointer'}`}>
                                    {isUsed && <CheckCircle2 size={12}/>} #{doc.number}
                                  </button>
                                )
                              })}
                            </div>
                        </div>
                      </div>
                    )}

                    <div className="space-y-4 pt-2">
                      {ranges.map((range, idx) => {
                        const fromVal = parseInt(range.from); const toVal = parseInt(range.to);
                        const rangeCount = (!isNaN(fromVal) && !isNaN(toVal) && fromVal <= toVal) ? (toVal - fromVal + 1) : 0;
                        const isFromActive = activeInput.index === idx && activeInput.field === 'from';
                        const isToActive = activeInput.index === idx && activeInput.field === 'to';
                        return (
                          <div key={idx} className="flex flex-col md:flex-row items-start md:items-center gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200/60 transition-all hover:border-brand-200">
                              <div className="w-full md:flex-1">
                                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Mulai Nomor</label>
                                <input type="number" placeholder="1001" className={`w-full px-5 py-3 bg-white rounded-xl outline-none transition-all font-mono font-black tracking-widest text-xl text-slate-800 placeholder:text-slate-300 ${isFromActive ? 'border-2 border-brand-500 ring-4 ring-brand-500/10 shadow-sm' : 'border border-slate-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10'}`} value={range.from} onChange={(e) => handleRangeChange(idx, 'from', e.target.value)} onFocus={() => setActiveInput({index: idx, field: 'from'})} onClick={() => setActiveInput({index: idx, field: 'from'})} />
                              </div>
                              <div className="hidden md:block text-slate-300 font-black text-3xl mt-4">-</div>
                              <div className="w-full md:flex-1">
                                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Sampai Nomor</label>
                                <input type="number" placeholder="1005" className={`w-full px-5 py-3 bg-white rounded-xl outline-none transition-all font-mono font-black tracking-widest text-xl text-slate-800 placeholder:text-slate-300 ${isToActive ? 'border-2 border-brand-500 ring-4 ring-brand-500/10 shadow-sm' : 'border border-slate-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10'}`} value={range.to} onChange={(e) => handleRangeChange(idx, 'to', e.target.value)} onFocus={() => setActiveInput({index: idx, field: 'to'})} onClick={() => setActiveInput({index: idx, field: 'to'})} />
                              </div>
                              <div className="w-full md:w-auto flex items-center justify-between gap-3 mt-2 md:mt-6 shrink-0">
                                {rangeCount > 0 ? <span className="bg-brand-100/50 text-brand-700 font-black text-sm px-4 py-3 rounded-xl border border-brand-200">{rangeCount} Lembar</span> : <span className="text-slate-400 px-4 py-3 text-sm font-medium">0 Lembar</span>}
                                <button type="button" onClick={() => handleRemoveRange(idx)} disabled={ranges.length === 1} className="p-3 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl disabled:opacity-30 transition-all"><Trash2 size={22}/></button>
                              </div>
                          </div>
                        )
                      })}
                      <button type="button" onClick={handleAddRange} className="w-full md:w-auto px-6 py-4 border-2 border-dashed border-brand-200 text-brand-600 font-bold rounded-2xl hover:bg-brand-50 transition-all flex items-center justify-center gap-2"><PlusCircle size={20}/> Tambah Baris Input</button>
                    </div>

                    {conflictError && (
                      <div className="bg-red-50 border border-red-200 p-6 rounded-2xl flex items-start gap-4 animate-in slide-in-from-top-2 duration-300">
                        <div className="bg-red-100 text-red-600 p-2 rounded-xl mt-1"><AlertTriangle size={24}/></div>
                        <div>
                          <h4 className="text-red-800 font-black text-lg tracking-tight">Bentrok Lintas Tim!</h4>
                          <p className="text-red-600 font-medium text-sm mt-1">Nomor <strong className="font-mono bg-red-200 px-1.5 py-0.5 rounded">#{conflictError.number}</strong> sudah berstatus sah milik: <strong className="bg-red-600 text-white px-2 py-0.5 rounded text-xs uppercase tracking-widest ml-1">{conflictError.owner}</strong>. Harap ganti rentang.</p>
                        </div>
                      </div>
                    )}

                    {/* Preview Live */}
                    {previewNumbers.length > 0 && !conflictError && (
                      <div className="bg-slate-50 border border-slate-200/60 rounded-2xl p-6">
                          <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Preview Nomor Dialokasikan (Live)</p>
                          <div className="flex flex-wrap gap-2">
                            {previewNumbers.map(n => <span key={n} className="bg-white border border-slate-200 px-3 py-1.5 rounded-lg text-sm font-mono font-bold text-slate-600 shadow-sm">#{n}</span>)}
                            {totalGeneratedDocs > 100 && <span className="bg-slate-200 px-3 py-1.5 rounded-lg text-sm font-bold text-slate-600">+{totalGeneratedDocs - 100} lainnya...</span>}
                          </div>
                      </div>
                    )}

                    <div className={`p-8 rounded-3xl flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl transition-all ${estimatedDocs > 0 && totalGeneratedDocs !== estimatedDocs && !conflictError ? 'bg-amber-500 shadow-amber-500/20' : 'bg-slate-800 shadow-slate-800/20'}`}>
                        <div className="text-white text-center md:text-left">
                          <p className="text-white/60 text-[10px] font-black uppercase tracking-widest mb-1">Total Generate Final</p>
                          <div className="flex items-center gap-3">
                            <p className="text-5xl font-black tracking-tight">{totalGeneratedDocs}</p>
                            {estimatedDocs > 0 && totalGeneratedDocs !== estimatedDocs && !conflictError && <span className="bg-white/20 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 mt-2"><AlertTriangle size={14}/> Meleset Estimasi</span>}
                            {estimatedDocs > 0 && totalGeneratedDocs === estimatedDocs && !conflictError && <span className="bg-brand-500 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 mt-2 shadow-sm"><CheckCircle2 size={14}/> Pas Estimasi</span>}
                          </div>
                        </div>
                        <button type="button" onClick={handleGenerate} disabled={isGenerating || !!conflictError || !formData.teamId} className="w-full md:w-auto px-10 py-5 bg-brand-500 hover:bg-brand-600 text-white font-black text-lg rounded-2xl transition-all shadow-lg shadow-brand-500/30 active:scale-95 disabled:opacity-50 disabled:active:scale-100 flex items-center justify-center gap-3">
                          {isGenerating ? <RefreshCw className="animate-spin"/> : <Play className="fill-current"/>} {isGenerating ? 'Memproses...' : 'Simpan Kandang'}
                        </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          };

          // ==========================================
          // 7. PROSES PANEN VIEW
          // ==========================================
          const ProsesPanenView = ({ teams, batches, setBatches, documents, setDocuments, globalNavTarget, setGlobalNavTarget, fireAlert, addToast }) => {
            const [selectedBatchId, setSelectedBatchId] = useState(null);
            const [visibleCount, setVisibleCount] = useState(50);
            const [searchTerm, setSearchTerm] = useState('');
            const [batchSearchTerm, setBatchSearchTerm] = useState('');
            const [filterTeam, setFilterTeam] = useState('ALL');
            const [sortByDate, setSortByDate] = useState('NEWEST');
            const [batchStatusFilter, setBatchStatusFilter] = useState('ALL_ACTIVE'); // Tab Filter: ALL_ACTIVE, AKTIF, KOSONG
            const [editBatchModal, setEditBatchModal] = useState({ isOpen: false, id: '', name: '', date: '', population: '', teamId: '' });
            const [highlightedDocNumber, setHighlightedDocNumber] = useState(null);
            const [reportModal, setReportModal] = useState({ isOpen: false, content: '' });
            
            const activeBatches = useMemo(() => batches.filter(b => b.status === 'AKTIF' || b.status === 'KOSONG'), [batches]);

            const processedBatches = useMemo(() => {
                let filtered = activeBatches;
                if (batchStatusFilter !== 'ALL_ACTIVE') filtered = filtered.filter(b => b.status === batchStatusFilter);
                if (batchSearchTerm) filtered = filtered.filter(b => b.name.toLowerCase().includes(batchSearchTerm.toLowerCase()));
                if (filterTeam !== 'ALL') filtered = filtered.filter(b => b.teamId === filterTeam);
                return filtered.sort((a, b) => {
                    const dateA = new Date(a.date).getTime();
                    const dateB = new Date(b.date).getTime();
                    return sortByDate === 'NEWEST' ? dateB - dateA : dateA - dateB;
                });
            }, [activeBatches, batchStatusFilter, batchSearchTerm, filterTeam, sortByDate]);

            useEffect(() => {
                if (globalNavTarget && globalNavTarget.type === 'BATCH' && globalNavTarget.id) {
                    setSelectedBatchId(globalNavTarget.id); 
                    setSearchTerm(''); 
                    
                    if (globalNavTarget.highlightNumber) {
                        setHighlightedDocNumber(globalNavTarget.highlightNumber);
                    } else {
                        setVisibleCount(50);
                    }
                    setGlobalNavTarget({ type: null, id: null, keyword: null, highlightNumber: null });
                }
            }, [globalNavTarget, setGlobalNavTarget]);

            useEffect(() => {
                if (highlightedDocNumber && selectedBatchId) {
                    const batchDocs = documents.filter(d => d.batchId === selectedBatchId).sort((a,b) => parseInt(a.number) - parseInt(b.number));
                    const targetIndex = batchDocs.findIndex(d => d.number === highlightedDocNumber);
                    
                    if (targetIndex !== -1 && targetIndex >= visibleCount) {
                        setVisibleCount(targetIndex + 50);
                    }

                    setTimeout(() => {
                        const el = document.getElementById(`doc-${highlightedDocNumber}`);
                        if (el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            setTimeout(() => setHighlightedDocNumber(null), 6000); 
                        }
                    }, 300);
                }
            }, [highlightedDocNumber, selectedBatchId, documents, visibleCount]);

            const selectedBatch = useMemo(() => activeBatches.find(b => b.id === selectedBatchId), [activeBatches, selectedBatchId]);

            const handleUpdateDocStatus = (docId, newStatus) => setDocuments(docs => docs.map(d => d.id === docId ? { ...d, status: newStatus } : d));
            const handleBulkAction = (status) => {
              if (!selectedBatchId) return;
              setDocuments(docs => docs.map(d => (d.batchId === selectedBatchId && d.status === 'DIALOKASIKAN') ? { ...d, status: status } : d));
              addToast(`Eksekusi Massal: Status diubah menjadi ${status === 'TERPAKAI' ? 'Selesai' : 'Ke Laci'}`, 'success');
            };

            const generateRanges = (docs) => {
                if (!docs || docs.length === 0) return '';
                const nums = docs.map(d => parseInt(d.number)).sort((a,b) => a - b);
                let ranges = [];
                let start = nums[0];
                let prev = nums[0];
                for (let i = 1; i <= nums.length; i++) {
                    if (nums[i] === prev + 1) prev = nums[i];
                    else {
                        if (start === prev) ranges.push(start.toString());
                        else ranges.push(`${start} - ${prev}`);
                        start = nums[i];
                        prev = nums[i];
                    }
                }
                return ranges.join(', ');
            };

            const generateGlobalReport = () => {
                let reportText = `🚨 *REPORT GLOBAL BTPA GANTUNG* 🚨\n`;
                let totalDocs = 0;
                let batchCount = 0;
                let details = '';

                // Ambil dari processedBatches agar menghormati filter pencarian/tim yang sedang aktif di UI
                // dan pastikan HANYA kandang dengan status KOSONG yang masuk laporan
                const targetBatches = processedBatches.filter(b => b.status === 'KOSONG');

                targetBatches.forEach(batch => {
                    const unresolvedDocs = documents.filter(d => d.batchId === batch.id && d.status === 'DIALOKASIKAN').sort((a,b) => parseInt(a.number) - parseInt(b.number));
                    if (unresolvedDocs.length > 0) {
                        batchCount++;
                        totalDocs += unresolvedDocs.length;
                        const teamName = teams.find(t=>t.id === batch.teamId)?.name || '-';
                        const rangeStr = generateRanges(unresolvedDocs);
                        details += `\n*Kandang:* ${batch.name}\n*BTPA:* ${rangeStr}\n*Tim:* ${teamName}\n-----------------------------------`;
                    }
                });

                if (batchCount === 0) return fireAlert('Info', 'Tidak ada data kandang kosong dengan BTPA gantung pada daftar yang Anda filter saat ini.', 'success');

                reportText += `Total: ${totalDocs} Lembar di ${batchCount} Kandang\n${details}`;
                setReportModal({ isOpen: true, content: reportText });
            };

            const handleCopyReport = () => {
              const unresolvedDocs = documents.filter(d => d.batchId === selectedBatch.id && d.status === 'DIALOKASIKAN').sort((a,b) => parseInt(a.number) - parseInt(b.number));
              if (unresolvedDocs.length === 0) return;
              
              const rangeStr = generateRanges(unresolvedDocs);
              const teamName = teams.find(t=>t.id === selectedBatch.teamId)?.name || '-';
              const textToCopy = `🚨 *REPORT BTPA GANTUNG* 🚨\n\n*Kandang:* ${selectedBatch.name}\n*BTPA:* ${rangeStr}\n*Tim:* ${teamName}`;

              setReportModal({ isOpen: true, content: textToCopy });
            };

            const handleMarkEmpty = () => {
              if (!selectedBatch) return;
              setBatches(bs => bs.map(b => b.id === selectedBatch.id ? { ...b, status: 'KOSONG' } : b));
              fireAlert('Kandang Dikosongkan!', `Ayam di ${selectedBatch.name} ditandai habis. Dokumen BTPA menggantung masih perlu diselesaikan nanti.`, 'success');
            };

            const handleMarkActive = () => {
              if (!selectedBatch) return;
              setBatches(bs => bs.map(b => b.id === selectedBatch.id ? { ...b, status: 'AKTIF' } : b));
              addToast('Kandang dikembalikan ke status Aktif.', 'success');
            };

            const handleCloseBatch = () => {
              if (!selectedBatch) return;
              const unresolvedDocs = documents.filter(d => d.batchId === selectedBatch.id && d.status === 'DIALOKASIKAN');
              if (unresolvedDocs.length > 0) return fireAlert('Penutupan Ditolak', `Masih ada ${unresolvedDocs.length} dokumen BTPA yang statusnya Menggantung. Harap selesaikan atau tarik ke laci.`, 'error');
              setBatches(bs => bs.map(b => b.id === selectedBatch.id ? { ...b, status: 'SELESAI' } : b));
              fireAlert('Siklus Selesai!', `Kandang ${selectedBatch.name} berhasil ditutup dan masuk arsip permanen.`, 'success'); 
              setSelectedBatchId(null);
            };

            const submitEditBatch = (e) => {
              e.preventDefault();
              if (!editBatchModal.name.trim() || !editBatchModal.date || !editBatchModal.population || !editBatchModal.teamId) return fireAlert('Validasi Gagal', 'Harap lengkapi semua data kandang termasuk Tim.', 'error');
              const pop = parseInt(editBatchModal.population) || 0;
              
              const originalBatch = batches.find(b => b.id === editBatchModal.id);
              
              setBatches(bs => bs.map(b => b.id === editBatchModal.id ? { ...b, name: editBatchModal.name.trim(), date: editBatchModal.date, population: pop, teamId: editBatchModal.teamId } : b));
              
              // Transfer kepemilikan dokumen jika tim berubah
              if (originalBatch && originalBatch.teamId !== editBatchModal.teamId) {
                  setDocuments(docs => docs.map(d => d.batchId === editBatchModal.id ? { ...d, teamId: editBatchModal.teamId } : d));
              }

              setEditBatchModal({ isOpen: false, id: '', name: '', date: '', population: '', teamId: '' }); 
              addToast('Data kandang dan dokumen terkait berhasil diperbarui!', 'success');
            };

            if (!selectedBatch) {
              return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                    <div className="flex items-center gap-4 mb-8">
                      <div className="p-3 bg-white rounded-2xl shadow-sm border border-slate-100"><RefreshCw className="text-brand-600" size={28}/></div>
                      <div>
                        <h2 className="text-3xl font-black text-slate-800 tracking-tight">Proses Panen (Kandang Aktif)</h2>
                        <p className="text-slate-500 font-medium mt-1">Pilih kandang untuk memproses dan mencatat kepulangan dokumen BTPA.</p>
                      </div>
                    </div>

                  {activeBatches.length > 0 && (
                      <div className="space-y-4 mb-6 relative z-20">
                          <div className="flex flex-col md:flex-row gap-4">
                              <div className="flex flex-col sm:flex-row gap-2 bg-slate-100 p-2 rounded-2xl w-full md:flex-1 shadow-inner border border-slate-200/50 overflow-x-auto custom-scrollbar">
                                  <button type="button" onClick={() => setBatchStatusFilter('ALL_ACTIVE')} className={`flex-1 px-6 py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all whitespace-nowrap ${batchStatusFilter === 'ALL_ACTIVE' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>Semua Kandang</button>
                                  <button type="button" onClick={() => setBatchStatusFilter('AKTIF')} className={`flex-1 px-6 py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all whitespace-nowrap ${batchStatusFilter === 'AKTIF' ? 'bg-white text-brand-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>Ayam Aktif</button>
                                  <button type="button" onClick={() => setBatchStatusFilter('KOSONG')} className={`flex-1 px-6 py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all whitespace-nowrap flex items-center justify-center gap-2 ${batchStatusFilter === 'KOSONG' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
                                      <AlertTriangle size={14}/> Kosong (BTPA Gantung)
                                  </button>
                              </div>
                              <button type="button" onClick={generateGlobalReport} className="w-full md:w-auto px-6 py-4 bg-green-500 hover:bg-green-600 text-white rounded-2xl font-black text-sm flex items-center justify-center gap-2 shadow-lg shadow-green-500/30 active:scale-95 transition-all shrink-0">
                                  <Copy size={18}/> Report Semua Gantung
                              </button>
                          </div>

                          <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200/60 flex flex-col md:flex-row gap-4">
                              <div className="flex-1 relative">
                                <Search size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                                <input type="text" placeholder="Cari nama kandang..." value={batchSearchTerm} onChange={e => setBatchSearchTerm(e.target.value)} className="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-sm text-slate-700 transition-all"/>
                              </div>
                              <select value={filterTeam} onChange={e => setFilterTeam(e.target.value)} className="w-full md:w-56 px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-sm text-slate-700 cursor-pointer appearance-none">
                                <option value="ALL">Semua Tim</option>
                                {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                              </select>
                              <select value={sortByDate} onChange={e => setSortByDate(e.target.value)} className="w-full md:w-56 px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-sm text-slate-700 cursor-pointer appearance-none">
                                <option value="NEWEST">Terbaru (Tgl CI)</option>
                                <option value="OLDEST">Terlama (Tgl CI)</option>
                              </select>
                          </div>
                      </div>
                  )}

                  {activeBatches.length === 0 ? (
                      <div className="bg-white border border-slate-200/60 rounded-[2rem] p-20 text-center shadow-sm">
                        <div className="w-24 h-24 bg-slate-50 rounded-[2rem] flex items-center justify-center mx-auto mb-6"><ListOrdered size={40} className="text-slate-300" /></div>
                        <h3 className="text-2xl font-black text-slate-800 tracking-tight mb-2">Tidak Ada Kandang Aktif</h3>
                        <p className="text-slate-500 text-lg">Semua kandang saat ini sudah ditutup atau belum ada yang di-input.</p>
                      </div>
                    ) : processedBatches.length === 0 ? (
                      <div className="bg-white border border-slate-200/60 rounded-[2rem] p-16 text-center shadow-sm">
                        <div className="w-20 h-20 bg-slate-50 rounded-[1.5rem] flex items-center justify-center mx-auto mb-4"><Search size={32} className="text-slate-300" /></div>
                        <h3 className="text-xl font-black text-slate-800 tracking-tight mb-2">Pencarian Tidak Ditemukan</h3>
                        <p className="text-slate-500">Coba ubah kata kunci pencarian atau filter tim.</p>
                        <button type="button" onClick={() => {setBatchSearchTerm(''); setFilterTeam('ALL');}} className="mt-6 px-6 py-3 bg-brand-50 text-brand-600 font-bold rounded-xl hover:bg-brand-100 transition-colors">Reset Filter</button>
                      </div>
                    ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {processedBatches.map(batch => {
                          const team = teams.find(t => t.id === batch.teamId)?.name || 'Tim Dihapus';
                          const unresolved = documents.filter(d => d.batchId === batch.id && d.status === 'DIALOKASIKAN').length;
                          return (
                            <div key={batch.id} onClick={() => {setSelectedBatchId(batch.id); setVisibleCount(50); setSearchTerm('');}} className={`bg-white rounded-3xl p-8 border shadow-sm cursor-pointer transition-all duration-300 group relative overflow-hidden flex flex-col ${batch.status === 'KOSONG' ? 'border-red-200 hover:shadow-red-500/20 hover:border-red-400' : 'border-slate-200/60 hover:shadow-xl hover:border-brand-300'}`}>
                              <div className={`absolute top-0 right-0 w-32 h-32 rounded-bl-full -z-10 transition-transform duration-500 group-hover:scale-125 ${batch.status === 'KOSONG' ? 'bg-red-50' : 'bg-brand-50'}`}></div>
                              <div className="flex justify-between items-start mb-6">
                                <div>
                                  <h3 className={`text-2xl font-black tracking-tight mb-2 transition-colors ${batch.status === 'KOSONG' ? 'text-red-950 group-hover:text-red-600' : 'text-slate-800 group-hover:text-brand-600'}`}><HighlightText text={batch.name} highlight={batchSearchTerm} /></h3>
                                  <div className="flex flex-col gap-2">
                                    <span className="bg-slate-100 text-slate-500 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 w-max"><Users size={14}/> {team}</span>
                                    <span className={`text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 w-max border ${batch.status === 'KOSONG' ? 'bg-red-50 text-red-600 border-red-100' : 'bg-brand-50 text-brand-600 border-brand-100'}`}><Calendar size={14}/> Tgl CI: {formatDate(batch.date)}</span>
                                  </div>
                                </div>
                                {batch.status === 'KOSONG' ? (
                                    <span className="bg-red-500 text-white text-[10px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-md shadow-red-500/30 mt-1">Kosong</span>
                                ) : (
                                    <span className="bg-brand-500 text-white text-[10px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-md shadow-brand-500/30 mt-1">Aktif</span>
                                )}
                              </div>
                              <div className="flex items-center gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-100 mt-auto">
                                <div className="flex-1"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Populasi</p><p className="text-xl font-black text-slate-700">{batch.population}</p></div>
                                <div className="w-px h-10 bg-slate-200"></div>
                                <div className="flex-1"><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Gantung</p><p className={`text-xl font-black flex items-center gap-1.5 ${unresolved > 0 ? 'text-amber-500' : 'text-emerald-500'}`}>{unresolved > 0 ? unresolved : <span className="flex items-center gap-1"><CheckCircle2 size={20}/> Bersih</span>}</p></div>
                              </div>
                            </div>
                          );
                    })}
                  </div>
                  )}

                  {/* MODAL PREVIEW REPORT WA (GLOBAL) */}
                  {reportModal.isOpen && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-[110] p-4 animate-in fade-in duration-200">
                        <div className="bg-white rounded-[2rem] border border-slate-100 p-8 max-w-2xl w-full shadow-2xl flex flex-col max-h-[90vh]">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight"><FileText className="text-green-500" size={28}/> Preview Report WA</h3>
                                <button onClick={() => setReportModal({ isOpen: false, content: '' })} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-500 transition-colors"><X size={20}/></button>
                            </div>
                            
                            <div className="mb-2 px-1 flex justify-between items-center text-xs font-bold text-slate-400">
                                <span>Anda bisa mengedit teks di bawah sebelum disalin.</span>
                            </div>
                            
                            <textarea 
                                value={reportModal.content}
                                onChange={(e) => setReportModal({...reportModal, content: e.target.value})}
                                className="w-full flex-1 min-h-[300px] p-5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-green-500/10 focus:border-green-500 font-mono text-sm text-slate-700 resize-none mb-6 custom-scrollbar transition-all"
                            />
                            
                            <div className="flex gap-3 justify-end shrink-0">
                                <button onClick={() => setReportModal({ isOpen: false, content: '' })} className="px-6 py-4 bg-slate-100 hover:bg-slate-200 font-bold text-slate-600 rounded-2xl transition-colors">Tutup</button>
                                <button onClick={() => {
                                    const textArea = document.createElement("textarea");
                                    textArea.value = reportModal.content;
                                    textArea.style.position = "fixed"; textArea.style.opacity = "0";
                                    document.body.appendChild(textArea);
                                    textArea.focus(); textArea.select();
                                    try { document.execCommand('copy'); addToast('Teks berhasil disalin ke Clipboard!', 'success'); setReportModal({ isOpen: false, content: '' }); } catch (err) { fireAlert('Gagal', 'Tidak bisa menyalin.', 'error'); }
                                    document.body.removeChild(textArea);
                                }} className="px-8 py-4 bg-green-500 hover:bg-green-600 text-white font-black rounded-2xl shadow-lg shadow-green-500/30 flex items-center gap-2 active:scale-95 transition-all"><Copy size={20}/> Salin ke Clipboard</button>
                            </div>
                        </div>
                    </div>
                  )}

                </div>
              );
            }

            const batchDocs = documents.filter(d => d.batchId === selectedBatch.id).sort((a,b) => parseInt(a.number) - parseInt(b.number));
            const filteredDocs = searchTerm ? batchDocs.filter(d => d.number.includes(searchTerm)) : batchDocs;
            const visibleDocsList = filteredDocs.slice(0, visibleCount);
            const unresolvedCount = batchDocs.filter(d => d.status === 'DIALOKASIKAN').length;

            return (
              <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                <button type="button" onClick={() => setSelectedBatchId(null)} className="text-slate-500 hover:text-brand-600 text-sm font-bold flex items-center gap-2 mb-6 transition-all group w-max">
                    <div className="w-10 h-10 rounded-2xl bg-white border border-slate-200 flex items-center justify-center shadow-sm group-hover:-translate-x-1 transition-transform"><ChevronRight size={18} className="rotate-180" /></div>
                    Kembali ke Daftar Kandang
                </button>
                
                <div className={`rounded-[2rem] p-8 md:p-10 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-8 relative overflow-hidden text-white ${selectedBatch.status === 'KOSONG' ? 'bg-red-900 border border-red-800' : 'bg-slate-800'}`}>
                    <div className={`absolute top-0 right-0 w-64 h-64 rounded-full blur-3xl -z-10 translate-x-1/2 -translate-y-1/2 ${selectedBatch.status === 'KOSONG' ? 'bg-red-500/40' : 'bg-brand-500/20'}`}></div>
                    <div>
                      <div className="flex flex-wrap items-center gap-4 mb-3">
                        <h2 className="text-4xl font-black tracking-tight">{selectedBatch.name}</h2>
                        <button type="button" onClick={() => setEditBatchModal({ isOpen: true, id: selectedBatch.id, name: selectedBatch.name, date: selectedBatch.date, population: selectedBatch.population, teamId: selectedBatch.teamId })} className={`text-white p-2 rounded-xl transition-all shadow-sm flex items-center gap-2 text-sm font-bold ${selectedBatch.status === 'KOSONG' ? 'bg-red-800 hover:bg-red-700' : 'bg-slate-700/50 hover:bg-indigo-500'}`}><Edit size={16}/> Edit</button>
                        {selectedBatch.status === 'KOSONG' ? (
                            <span className="bg-red-500 text-white text-[10px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-md">KOSONG (GANTUNG)</span>
                        ) : (
                            <span className="bg-brand-500 text-white text-[10px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-md">AKTIF</span>
                        )}
                      </div>
                      <p className="text-slate-300 font-medium flex flex-wrap items-center gap-5 text-sm">
                        <span className="flex items-center gap-2"><Users size={16} className={`${selectedBatch.status === 'KOSONG' ? 'text-red-300' : 'text-slate-400'}`}/> {teams.find(t=>t.id === selectedBatch.teamId)?.name}</span>
                        <span className="flex items-center gap-2"><Calendar size={16} className={`${selectedBatch.status === 'KOSONG' ? 'text-red-300' : 'text-slate-400'}`}/> Tgl CI: {formatDate(selectedBatch.date)}</span>
                        <span className="flex items-center gap-2"><Activity size={16} className={`${selectedBatch.status === 'KOSONG' ? 'text-red-300' : 'text-slate-400'}`}/> Populasi: {selectedBatch.population} Ekor</span>
                        <span className="flex items-center gap-2"><FileText size={16} className={`${selectedBatch.status === 'KOSONG' ? 'text-red-300' : 'text-slate-400'}`}/> Total: {batchDocs.length} Dokumen</span>
                      </p>
                    </div>

                    <div className="flex flex-col gap-3 w-full md:w-auto shrink-0">
                        {selectedBatch.status === 'AKTIF' ? (
                            <button type="button" onClick={handleMarkEmpty} className="w-full px-8 py-4 bg-red-500 text-white rounded-2xl font-black flex items-center justify-center gap-2 shadow-lg shadow-red-500/30 hover:bg-red-400 active:scale-95 transition-all text-sm">
                                <AlertTriangle size={18}/> Tandai Kandang Kosong
                            </button>
                        ) : (
                            <button type="button" onClick={handleMarkActive} className="w-full px-8 py-4 bg-red-950 border border-red-800 text-white rounded-2xl font-black flex items-center justify-center gap-2 shadow-lg hover:bg-red-800 active:scale-95 transition-all text-sm">
                                <Undo2 size={18}/> Batal (Jadikan Aktif)
                            </button>
                        )}
                        
                        <button type="button" onClick={handleCloseBatch} className={`w-full px-8 py-4 rounded-2xl font-black flex items-center justify-center gap-2 transition-all text-sm ${unresolvedCount === 0 ? 'bg-emerald-500 text-white hover:bg-emerald-400 shadow-lg shadow-emerald-500/30 active:scale-95' : 'bg-white/10 text-white/50 cursor-not-allowed border border-white/10'}`}>
                            <Archive size={18} /> Tutup Siklus Permanen
                        </button>
                    </div>
                </div>

                <div className="bg-white rounded-[2rem] p-5 border border-slate-200/60 shadow-sm flex flex-col lg:flex-row justify-between items-center gap-5 sticky top-4 z-20">
                    <div className="flex flex-col sm:flex-row items-center gap-4 w-full lg:w-auto">
                        <div className="flex items-center justify-between lg:justify-start gap-4 bg-amber-50 px-6 py-4 rounded-2xl border border-amber-100 w-full sm:w-auto">
                          <div className="flex items-center gap-3">
                            <div className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></div>
                            <span className="text-amber-800 font-black text-sm tracking-wide">MENGGANTUNG</span>
                          </div>
                          <span className="text-amber-600 font-black text-xl">{unresolvedCount}</span>
                        </div>
                        {unresolvedCount > 0 && (
                            <button type="button" onClick={handleCopyReport} className="w-full sm:w-auto px-6 py-4 bg-green-500 hover:bg-green-600 text-white rounded-2xl font-black text-sm flex items-center justify-center gap-2 shadow-lg shadow-green-500/30 active:scale-95 transition-all shrink-0">
                                <FileText size={18}/> Preview Report
                            </button>
                        )}
                    </div>
                    
                    <div className="flex flex-col sm:flex-row gap-4 w-full lg:w-auto">
                        <div className="relative flex-1 sm:min-w-[250px]">
                          <Search size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                          <input type="text" placeholder="Cari No. BTPA spesifik..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-semibold text-slate-700 transition-all" />
                        </div>
                        <div className="w-px h-12 bg-slate-200 hidden sm:block"></div>
                        <button type="button" onClick={() => handleBulkAction('TERPAKAI')} disabled={unresolvedCount===0} className="flex-1 sm:flex-none px-6 py-4 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-2xl hover:bg-emerald-100 font-black text-sm flex items-center justify-center gap-2 disabled:opacity-50 transition-all active:scale-95"><CheckSquare size={20}/> Selesai Semua</button>
                        <button type="button" onClick={() => handleBulkAction('DI_ADMIN')} disabled={unresolvedCount===0} className="flex-1 sm:flex-none px-6 py-4 bg-amber-50 border border-amber-200 text-amber-700 rounded-2xl hover:bg-amber-100 font-black text-sm flex items-center justify-center gap-2 disabled:opacity-50 transition-all active:scale-95"><Inbox size={20}/> Ke Laci Semua</button>
                    </div>
                </div>

                <div className="bg-white rounded-3xl shadow-sm border border-slate-200/60 overflow-hidden">
                  <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse min-w-[700px]">
                        <thead>
                          <tr className="bg-slate-50/80 border-b border-slate-100 text-slate-500 text-xs uppercase tracking-widest font-bold">
                            <th className="px-8 py-5 w-20">No</th>
                            <th className="px-8 py-5">Identitas Dokumen</th>
                            <th className="px-8 py-5">Status Live</th>
                            <th className="px-8 py-5 text-right">Aksi Eksekusi Manual</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100/80">
                          {visibleDocsList.map((doc, idx) => (
                            <tr key={doc.id} id={`doc-${doc.number}`} className={`transition-all duration-500 group ${highlightedDocNumber === doc.number ? 'bg-brand-50 shadow-[inset_0_0_0_2px_#f36d1c] relative z-10' : 'hover:bg-slate-50/50'}`}>
                              <td className="px-8 py-6 text-slate-400 font-bold">{idx + 1}</td>
                              <td className="px-8 py-6 font-black text-slate-800 font-mono text-2xl tracking-wider"><HighlightText text={`#${doc.number}`} highlight={searchTerm} /></td>
                              <td className="px-8 py-6">
                                {doc.status === 'DIALOKASIKAN' && <span className="bg-slate-100 text-slate-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-2 border border-slate-200"><Activity size={14}/> Di Lapangan</span>}
                                {doc.status === 'TERPAKAI' && <span className="bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-2 border border-emerald-200 shadow-sm"><CheckCircle2 size={14}/> Sah (Selesai)</span>}
                                {doc.status === 'DI_ADMIN' && <span className="bg-amber-100 text-amber-700 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-2 border border-amber-200 shadow-sm"><Inbox size={14}/> Sisa (Di Laci)</span>}
                              </td>
                              <td className="px-8 py-6 text-right">
                                {doc.status === 'DIALOKASIKAN' ? (
                                  <div className="flex justify-end gap-3">
                                    <button type="button" onClick={() => handleUpdateDocStatus(doc.id, 'TERPAKAI')} className="px-6 py-3 bg-emerald-500 text-white rounded-xl hover:bg-emerald-400 font-black shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">Pakai Sah</button>
                                    <button type="button" onClick={() => handleUpdateDocStatus(doc.id, 'DI_ADMIN')} className="px-6 py-3 bg-amber-500 text-white rounded-xl hover:bg-amber-400 font-black shadow-lg shadow-amber-500/20 active:scale-95 transition-all">Sisa Laci</button>
                                  </div>
                                ) : (
                                  <button type="button" onClick={() => handleUpdateDocStatus(doc.id, 'DIALOKASIKAN')} className="px-6 py-3 bg-slate-100 border border-slate-200 text-slate-500 rounded-xl hover:bg-slate-200 hover:text-slate-700 font-bold transition-all shadow-sm active:scale-95 flex items-center gap-2 ml-auto"><Undo2 size={18}/> Batalkan</button>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                  </div>
                  {visibleCount < filteredDocs.length && <div className="p-8 bg-slate-50/50 border-t border-slate-100 text-center"><button type="button" onClick={() => setVisibleCount(p => p+50)} className="px-8 py-3.5 bg-white border border-slate-200 text-slate-600 font-bold rounded-2xl hover:bg-slate-50 shadow-sm transition-all">Tampilkan {filteredDocs.length - visibleCount} Baris Lainnya...</button></div>}
                </div>

                {editBatchModal.isOpen && (
                  <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center z-[100] p-4 animate-in fade-in duration-200">
                    <div className="bg-white rounded-[2rem] max-w-lg w-full shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 duration-200 border border-slate-100">
                      <div className="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h3 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3"><Edit size={24} className="text-brand-600"/> Edit Data Kandang</h3>
                        <button type="button" onClick={() => setEditBatchModal({ isOpen: false, id: '', name: '', date: '', population: '', teamId: '' })} className="text-slate-400 hover:text-slate-700 bg-white p-2 rounded-full border shadow-sm transition-all"><X size={20}/></button>
                      </div>
                      <form onSubmit={submitEditBatch}>
                        <div className="p-8 space-y-6">
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Tim Pelaksana</label>
                              <select value={editBatchModal.teamId} onChange={(e) => setEditBatchModal({...editBatchModal, teamId: e.target.value})} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-lg text-slate-800 appearance-none cursor-pointer">
                                <option value="">-- Pilih Tim --</option>
                                {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                              </select>
                            </div>
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Nama Kandang</label>
                              <input type="text" value={editBatchModal.name} onChange={(e) => setEditBatchModal({...editBatchModal, name: e.target.value})} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-lg text-slate-800" />
                            </div>
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Tanggal Chick-in</label>
                              <input type="date" value={editBatchModal.date} onChange={(e) => setEditBatchModal({...editBatchModal, date: e.target.value})} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-lg text-slate-800" />
                            </div>
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Jumlah Populasi</label>
                              <input type="number" value={editBatchModal.population} onChange={(e) => setEditBatchModal({...editBatchModal, population: e.target.value})} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-lg text-slate-800" />
                            </div>
                        </div>
                        <div className="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                          <button type="button" onClick={() => setEditBatchModal({ isOpen: false, id: '', name: '', date: '', population: '', teamId: '' })} className="px-8 py-4 font-bold text-slate-600 bg-white border border-slate-200 rounded-2xl hover:bg-slate-100 transition-all">Batal</button>
                          <button type="submit" className="px-8 py-4 font-black text-white bg-brand-500 rounded-2xl shadow-lg shadow-brand-500/30 hover:bg-brand-600 active:scale-95 transition-all flex items-center gap-2"><CheckCircle2 size={20}/> Simpan Perubahan</button>
                        </div>
                      </form>
                    </div>
                  </div>
                )}

                {/* MODAL PREVIEW REPORT WA */}
                {reportModal.isOpen && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-[110] p-4 animate-in fade-in duration-200">
                      <div className="bg-white rounded-[2rem] border border-slate-100 p-8 max-w-2xl w-full shadow-2xl flex flex-col max-h-[90vh]">
                          <div className="flex justify-between items-center mb-6">
                              <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight"><FileText className="text-green-500" size={28}/> Preview Report WA</h3>
                              <button onClick={() => setReportModal({ isOpen: false, content: '' })} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-500 transition-colors"><X size={20}/></button>
                          </div>
                          
                          <div className="mb-2 px-1 flex justify-between items-center text-xs font-bold text-slate-400">
                              <span>Anda bisa mengedit teks di bawah sebelum disalin.</span>
                          </div>
                          
                          <textarea 
                              value={reportModal.content}
                              onChange={(e) => setReportModal({...reportModal, content: e.target.value})}
                              className="w-full flex-1 min-h-[300px] p-5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-green-500/10 focus:border-green-500 font-mono text-sm text-slate-700 resize-none mb-6 custom-scrollbar transition-all"
                          />
                          
                          <div className="flex gap-3 justify-end shrink-0">
                              <button onClick={() => setReportModal({ isOpen: false, content: '' })} className="px-6 py-4 bg-slate-100 hover:bg-slate-200 font-bold text-slate-600 rounded-2xl transition-colors">Tutup</button>
                              <button onClick={() => {
                                  const textArea = document.createElement("textarea");
                                  textArea.value = reportModal.content;
                                  textArea.style.position = "fixed"; textArea.style.opacity = "0";
                                  document.body.appendChild(textArea);
                                  textArea.focus(); textArea.select();
                                  try { document.execCommand('copy'); addToast('Teks berhasil disalin ke Clipboard!', 'success'); setReportModal({ isOpen: false, content: '' }); } catch (err) { fireAlert('Gagal', 'Tidak bisa menyalin.', 'error'); }
                                  document.body.removeChild(textArea);
                              }} className="px-8 py-4 bg-green-500 hover:bg-green-600 text-white font-black rounded-2xl shadow-lg shadow-green-500/30 flex items-center gap-2 active:scale-95 transition-all"><Copy size={20}/> Salin ke Clipboard</button>
                          </div>
                      </div>
                  </div>
                )}
              </div>
            );
          };

          // ==========================================
          // 8. LACI ADMIN VIEW (Dengan Smart Click-to-Fill)
          // ==========================================
          const LaciAdminView = ({ teams, documents, setDocuments, fireAlert, addToast, globalNavTarget, setGlobalNavTarget }) => {
            const [activeTab, setActiveTab] = useState('laci');
            const [givePenimbangModal, setGivePenimbangModal] = useState({ isOpen: false, teamId: null });
            const [transferModal, setTransferModal] = useState({ isOpen: false, fromTeamId: null, toTeamId: '' });
            const [confirmTransfer, setConfirmTransfer] = useState({ isOpen: false, payload: null });
            const [penimbangForm, setPenimbangForm] = useState({ name: '' });
            const [ranges, setRanges] = useState([{ from: '', to: '' }]);
            const [activeInput, setActiveInput] = useState({ index: 0, field: 'from' });
            const [highlightedDocNumber, setHighlightedDocNumber] = useState(null);

            const drawerDocs = documents.filter(d => d.status === 'DI_ADMIN');
            const penimbangDocs = documents.filter(d => d.status === 'DI_PENIMBANG');

            useEffect(() => {
                if (globalNavTarget && globalNavTarget.type === 'LACI' && globalNavTarget.tab) {
                    setActiveTab(globalNavTarget.tab);
                    if (globalNavTarget.highlightNumber) {
                        setHighlightedDocNumber(globalNavTarget.highlightNumber);
                    }
                    setGlobalNavTarget({ type: null, id: null, keyword: null, tab: null, highlightNumber: null });
                }
            }, [globalNavTarget, setGlobalNavTarget]);

            useEffect(() => {
                if (highlightedDocNumber) {
                    setTimeout(() => {
                        const el = document.getElementById(`doc-laci-${highlightedDocNumber}`);
                        if (el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            setTimeout(() => setHighlightedDocNumber(null), 6000);
                        }
                    }, 400);
                }
            }, [highlightedDocNumber, activeTab]);

            const groupedDrawer = drawerDocs.reduce((acc, doc) => {
              if (!acc[doc.teamId]) acc[doc.teamId] = []; acc[doc.teamId].push(doc); return acc;
            }, {});

            const groupedPenimbang = penimbangDocs.reduce((acc, doc) => {
              if (!acc[doc.penimbangName]) acc[doc.penimbangName] = []; acc[doc.penimbangName].push(doc); return acc;
            }, {});

            const activeDrawerTeamId = givePenimbangModal.teamId || transferModal.fromTeamId;
            const availableTeamDocs = activeDrawerTeamId ? (groupedDrawer[activeDrawerTeamId]?.sort((a,b) => parseInt(a.number) - parseInt(b.number)) || []) : [];

            const teamDrawerGroups = useMemo(() => {
              let groups = [];
              if (availableTeamDocs.length > 0) {
                let currentGroup = [availableTeamDocs[0]];
                for (let i = 1; i < availableTeamDocs.length; i++) {
                  if (parseInt(availableTeamDocs[i].number) === parseInt(availableTeamDocs[i-1].number) + 1) currentGroup.push(availableTeamDocs[i]);
                  else { if (currentGroup.length > 1) groups.push([...currentGroup]); currentGroup = [availableTeamDocs[i]]; }
                }
                if (currentGroup.length > 1) groups.push(currentGroup);
              }
              return groups;
            }, [availableTeamDocs]);

            const usedDrawerDocs = useMemo(() => {
              const used = new Set();
              availableTeamDocs.forEach(doc => {
                const num = parseInt(doc.number);
                const isUsed = ranges.some(r => {
                  const f = parseInt(r.from); const t = parseInt(r.to);
                  if (!isNaN(f) && !isNaN(t)) return num >= f && num <= t;
                  if (!isNaN(f) && isNaN(t)) return num === f;
                  if (isNaN(f) && !isNaN(t)) return num === t;
                  return false;
                });
                if (isUsed) used.add(doc.id);
              });
              return used;
            }, [ranges, availableTeamDocs]);

            const totalSelectedDocs = ranges.reduce((acc, range) => {
              const from = parseInt(range.from); const to = parseInt(range.to);
              if (!isNaN(from) && !isNaN(to) && from <= to) return acc + (to - from + 1);
              return acc;
            }, 0);

            const activeTeamErrorCheck = givePenimbangModal.teamId || transferModal.fromTeamId;
            const invalidDocsError = useMemo(() => {
              if (!activeTeamErrorCheck) return null;
              const availableSet = new Set(availableTeamDocs.map(d => d.number));
              let missing = [];

              for (const range of ranges) {
                const from = parseInt(range.from); const to = parseInt(range.to);
                if (isNaN(from) || isNaN(to) || from > to) continue;
                if (to - from > 10000) return ['Rentang Terlalu Besar (>10.000)'];

                for (let i = from; i <= to; i++) {
                  const numStr = i.toString();
                  if (!availableSet.has(numStr)) { missing.push(numStr); if (missing.length > 50) break; }
                }
              }
              if (missing.length > 0) return missing;
              return null;
            }, [ranges, availableTeamDocs, activeTeamErrorCheck]);

            const handleAddRange = () => setRanges([...ranges, { from: '', to: '' }]);
            const handleRemoveRange = (index) => { if (ranges.length > 1) setRanges(ranges.filter((_, i) => i !== index)); };
            const handleRangeChange = (index, field, value) => { 
              const newRanges = [...ranges]; 
              newRanges[index] = { ...newRanges[index], [field]: value }; 
              setRanges(newRanges); 
            };

            const injectRange = (fromStr, toStr) => {
              const newRanges = [...ranges];
              if (fromStr === toStr) {
                newRanges[activeInput.index][activeInput.field] = fromStr;
                setRanges(newRanges);
                if (activeInput.field === 'from') setActiveInput({ index: activeInput.index, field: 'to' });
              } else {
                newRanges[activeInput.index].from = fromStr;
                newRanges[activeInput.index].to = toStr;
                setRanges(newRanges);
              }
            };

            const submitGiveToPenimbang = () => {
              if (!penimbangForm.name.trim() || totalSelectedDocs === 0) return fireAlert('Gagal', 'Pastikan nama Penimbang diisi dan minimal 1 dokumen masuk dalam rentang.', 'error');
              if (invalidDocsError) return fireAlert('Gagal', 'Beberapa nomor dalam rentang tidak tersedia di Laci Admin.', 'error');
              
              let idsToHandover = new Set();
              const docsMap = new Map(availableTeamDocs.map(d => [d.number, d.id]));
              
              for (const range of ranges) {
                const from = parseInt(range.from); const to = parseInt(range.to);
                if (isNaN(from) || isNaN(to) || from > to) continue;
                for (let i = from; i <= to; i++) {
                    const docId = docsMap.get(i.toString());
                    if (docId) idsToHandover.add(docId);
                }
              }

              setDocuments(docs => docs.map(d => idsToHandover.has(d.id) ? { ...d, status: 'DI_PENIMBANG', penimbangName: penimbangForm.name.trim() } : d));
              setGivePenimbangModal({ isOpen: false, teamId: null });
              addToast(`Dokumen resmi dipindahkan ke tangan ${penimbangForm.name}`, 'success');
            };

            const handleReturnFromPenimbang = (docId) => {
                setDocuments(docs => docs.map(d => d.id === docId ? { ...d, status: 'DI_ADMIN', penimbangName: null } : d));
                addToast('Dokumen ditarik kembali ke Laci Utama Admin', 'success');
            };

            const requestTransferTeam = () => {
              if (!transferModal.toTeamId || totalSelectedDocs === 0) return fireAlert('Gagal', 'Pastikan tim tujuan dipilih dan minimal 1 dokumen masuk dalam rentang.', 'error');
              if (invalidDocsError) return fireAlert('Gagal', 'Beberapa nomor dalam rentang tidak tersedia di Laci Admin.', 'error');
              if (transferModal.fromTeamId === transferModal.toTeamId) return fireAlert('Gagal', 'Tim asal dan tim tujuan tidak boleh sama.', 'error');
              
              let idsToTransfer = new Set();
              const docsMap = new Map(availableTeamDocs.map(d => [d.number, d.id]));
              
              for (const range of ranges) {
                const from = parseInt(range.from); const to = parseInt(range.to);
                if (isNaN(from) || isNaN(to) || from > to) continue;
                for (let i = from; i <= to; i++) {
                    const docId = docsMap.get(i.toString());
                    if (docId) idsToTransfer.add(docId);
                }
              }

              setConfirmTransfer({
                isOpen: true,
                payload: {
                  ids: idsToTransfer,
                  fromTeamId: transferModal.fromTeamId,
                  toTeamId: transferModal.toTeamId,
                  count: idsToTransfer.size
                }
              });
            };

            const executeTransferTeam = () => {
                const { ids, toTeamId } = confirmTransfer.payload;
                setDocuments(docs => docs.map(d => ids.has(d.id) ? { ...d, teamId: toTeamId } : d));
                setConfirmTransfer({ isOpen: false, payload: null });
                setTransferModal({ isOpen: false, fromTeamId: null, toTeamId: '' });
                addToast(`Berhasil memindahkan ${ids.size} dokumen ke tim baru!`, 'success');
            };

              <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-8 animate-in slide-in-from-bottom-4 duration-500 fade-in">

                    <div className="flex items-center gap-5">
                      <div className="w-20 h-20 bg-gradient-to-br from-amber-100 to-orange-100 rounded-[1.25rem] flex items-center justify-center text-amber-600 shadow-inner"><Inbox size={40} /></div>
                      <div>
                        <h2 className="text-3xl font-black text-slate-800 tracking-tight mb-1">Gudang Inventaris</h2>
                        <p className="text-slate-500 font-medium">Pusat kontrol dokumen sisa dan pelacakan pemegang dokumen (Penimbang).</p>
                      </div>
                    </div>
                    
                    <div className="flex bg-slate-100 p-2 rounded-2xl w-full md:w-auto shadow-inner border border-slate-200/50">
                      <button type="button" onClick={() => setActiveTab('laci')} className={`flex-1 md:flex-none px-8 py-3.5 rounded-xl text-sm font-black uppercase tracking-widest transition-all duration-300 flex justify-center items-center gap-2 ${activeTab === 'laci' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}><Inbox size={18}/> Stok Internal</button>
                      <button type="button" onClick={() => setActiveTab('penimbang')} className={`flex-1 md:flex-none px-8 py-3.5 rounded-xl text-sm font-black uppercase tracking-widest transition-all duration-300 flex justify-center items-center gap-2 ${activeTab === 'penimbang' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}><UserCheck size={18}/> Di Penimbang</button>
                    </div>
                </div>

                {activeTab === 'laci' && (
                  <div className="animate-in slide-in-from-left-4 duration-300 fade-in">
                      {Object.keys(groupedDrawer).length === 0 ? (
                        <div className="bg-white rounded-[2rem] p-20 border-2 border-dashed border-slate-200/80 text-center"><Inbox className="mx-auto mb-6 text-slate-200" size={80} /><h3 className="text-2xl font-black text-slate-700 tracking-tight mb-2">Laci Sangat Bersih</h3><p className="text-slate-500 text-lg">Tidak ada tumpukan dokumen sisa di admin saat ini.</p></div>
                      ) : (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    {Object.entries(groupedDrawer).map(([teamId, docs]) => {
                      const team = teams.find(t => t.id === teamId);
                      return (
                              <div key={teamId} className="bg-white rounded-3xl border border-slate-200/60 shadow-sm flex flex-col relative overflow-hidden group hover:shadow-lg hover:border-brand-200 transition-all duration-300">
                                <div className="absolute top-0 right-0 w-40 h-40 bg-slate-50 rounded-bl-full -z-10 group-hover:bg-brand-50/50 transition-colors duration-500"></div>
                                
                                <div className="p-8 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                  <div>
                                    <h3 className="text-xl font-black text-slate-800 tracking-tight mb-1"><Users size={20} className="inline mr-2 text-slate-400"/> {team?.name || 'Tim Dihapus'}</h3>
                                    <span className="bg-slate-100 text-slate-500 px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider shadow-inner">{docs.length} Dokumen Laci</span>
                                  </div>
                                  <div className="flex flex-col gap-2 w-full sm:w-auto">
                                      <button type="button" onClick={() => { setGivePenimbangModal({isOpen:true, teamId}); setPenimbangForm({name: team?.penimbang || ''}); setRanges([{from: '', to: ''}]); setActiveInput({index: 0, field: 'from'}); }} className="w-full bg-indigo-50 border border-indigo-200 text-indigo-700 px-5 py-3 rounded-xl font-black hover:bg-indigo-100 flex justify-center items-center gap-2 shadow-sm active:scale-95 transition-all group/btn">
                                        <Briefcase size={18} className="group-hover/btn:-translate-y-0.5 transition-transform"/> Serahkan Penimbang
                                      </button>
                                      <button type="button" onClick={() => { setTransferModal({isOpen:true, fromTeamId: teamId, toTeamId: ''}); setRanges([{from: '', to: ''}]); setActiveInput({index: 0, field: 'from'}); }} className="w-full bg-white border border-slate-200 text-slate-600 px-5 py-3 rounded-xl font-black hover:bg-slate-50 flex justify-center items-center gap-2 shadow-sm active:scale-95 transition-all group/btn2">
                                        <RefreshCw size={18} className="group-hover/btn2:-rotate-45 transition-transform"/> Pindah Tim
                                      </button>
                                  </div>
                                </div>
                                
                                <div className="p-8 bg-slate-50/30 flex-1">

                                  </div>
                                </div>
                              </div>
                      )
                    })}
                  </div>
                  )}
                  </div>
                )}

                {activeTab === 'penimbang' && (

                                  </div>
                                ))}
                              </div>
                            </div>

                  </div>

                        <div className="p-8 overflow-y-auto flex-1">

                          </div>

                          {/* Widget Laci Admin Mirip CI */}
                          {availableTeamDocs.length > 0 && (
                            <div className="bg-indigo-50/80 border border-indigo-200/60 p-6 rounded-2xl mb-8">
                              <h3 className="text-sm font-black text-indigo-800 uppercase tracking-widest mb-4 flex items-center gap-2"><Inbox size={18}/> Dokumen Tersedia di Laci ({availableTeamDocs.length} Lembar)</h3>
                              
                              {teamDrawerGroups.length > 0 && (
                                <div className="mb-5">
                                  <p className="text-[10px] font-bold text-indigo-600/80 uppercase tracking-widest mb-2">Pilih Grup Sekaligus:</p>
                                  <div className="flex flex-wrap gap-2.5">
                                    {teamDrawerGroups.map((group, idx) => {
                                      const isUsed = usedDrawerDocs.has(group[0].id);
                                      return (
                                        <button type="button" key={`g${idx}`} disabled={isUsed} onClick={() => injectRange(group[0].number, group[group.length-1].number)} className={`px-4 py-2.5 rounded-xl border-2 font-black text-sm transition-all shadow-sm flex items-center gap-2 ${isUsed ? 'bg-indigo-100/50 border-transparent text-indigo-400 opacity-60' : 'bg-white border-brand-300 text-brand-700 hover:bg-brand-100 hover:border-brand-400 active:scale-95 cursor-pointer'}`}>
                                          {isUsed ? <CheckCircle2 size={16}/> : <ListOrdered size={16}/>} #{group[0].number} - #{group[group.length-1].number} <span className="bg-brand-200/50 px-2 py-0.5 rounded-md text-[10px]">{group.length}x</span>
                                        </button>
                                      )
                                    })}
                                  </div>
                                </div>
                              )}
                              
                              <div>
                                <p className="text-[10px] font-bold text-indigo-600/80 uppercase tracking-widest mb-2">Atau Pilih Satuan (Klik untuk mengisi kolom aktif):</p>
                                <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar pr-2">
                                  {availableTeamDocs.map(doc => {
                                    const isUsed = usedDrawerDocs.has(doc.id);
                                    return (
                                      <button type="button" key={doc.id} disabled={isUsed} onClick={() => injectRange(doc.number, doc.number)} className={`px-3 py-1.5 rounded-lg border font-mono font-bold text-sm transition-all ${isUsed ? 'bg-indigo-100/50 border-transparent text-indigo-400 opacity-60 flex items-center gap-1' : 'bg-white border-brand-200 text-brand-700 hover:bg-brand-100 shadow-sm active:scale-95 cursor-pointer'}`}>
                                        {isUsed && <CheckCircle2 size={12}/>} #{doc.number}
                                      </button>
                                    )
                                  })}
                                </div>
                              </div>
                            </div>
                          )}
                          
                          {/* Input Rentang Handover (Like CI) */}
                          <div className="space-y-4 pt-2">
                              <div className="flex justify-between items-end mb-2">
                                  <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Rentang Dokumen Diserahkan</label>
                                  <button type="button" onClick={() => {setRanges([{from:'', to:''}]); setActiveInput({index: 0, field: 'from'});}} className="text-xs font-black text-brand-700 bg-brand-100 hover:bg-brand-200 px-3 py-1.5 rounded-lg shadow-sm transition-colors active:scale-95">Reset Pilihan</button>
                              </div>
                              {ranges.map((range, idx) => {
                                  const fromVal = parseInt(range.from); const toVal = parseInt(range.to);
                                  const rangeCount = (!isNaN(fromVal) && !isNaN(toVal) && fromVal <= toVal) ? (toVal - fromVal + 1) : 0;
                                  const isFromActive = activeInput.index === idx && activeInput.field === 'from';
                                  const isToActive = activeInput.index === idx && activeInput.field === 'to';
                                  return (
                                  <div key={idx} className="flex flex-col md:flex-row items-start md:items-center gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200/60 transition-all hover:border-brand-200">
                                      <div className="w-full md:flex-1">
                                      <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Mulai Nomor</label>
                                      <input type="number" placeholder="1001" className={`w-full px-5 py-3 bg-white rounded-xl outline-none transition-all font-mono font-black tracking-widest text-xl text-slate-800 placeholder:text-slate-300 ${isFromActive ? 'border-2 border-indigo-500 ring-4 ring-indigo-500/10 shadow-sm' : 'border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10'}`} value={range.from} onChange={(e) => handleRangeChange(idx, 'from', e.target.value)} onFocus={() => setActiveInput({index: idx, field: 'from'})} onClick={() => setActiveInput({index: idx, field: 'from'})} />
                                      </div>
                                      <div className="hidden md:block text-slate-300 font-black text-3xl mt-4">-</div>
                                      <div className="w-full md:flex-1">
                                      <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Sampai Nomor</label>
                                      <input type="number" placeholder="1005" className={`w-full px-5 py-3 bg-white rounded-xl outline-none transition-all font-mono font-black tracking-widest text-xl text-slate-800 placeholder:text-slate-300 ${isToActive ? 'border-2 border-indigo-500 ring-4 ring-indigo-500/10 shadow-sm' : 'border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10'}`} value={range.to} onChange={(e) => handleRangeChange(idx, 'to', e.target.value)} onFocus={() => setActiveInput({index: idx, field: 'to'})} onClick={() => setActiveInput({index: idx, field: 'to'})} />
                                      </div>
                                      <div className="w-full md:w-auto flex items-center justify-between gap-3 mt-2 md:mt-6 shrink-0">

                                      </div>

                          {invalidDocsError && (
                              <div className="mt-6 bg-red-50 border border-red-200 p-6 rounded-2xl flex items-start gap-4 animate-in slide-in-from-top-2 duration-300">

                                      <div className="flex flex-wrap gap-1 mt-2">
                                          {invalidDocsError.slice(0, 10).map(n => <span key={n} className="bg-red-200 text-red-800 text-[10px] font-mono px-1.5 py-0.5 rounded">#{n}</span>)}
                                          {invalidDocsError.length > 10 && <span className="text-red-600 text-xs font-bold">+{invalidDocsError.length - 10} lainnya</span>}
                                      </div>
                                  </div>
                              </div>
                          )}
                        </div>
                        
                        <div className="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">

                          <button type="button" onClick={submitGiveToPenimbang} className="px-8 py-4 font-black text-white bg-brand-500 rounded-2xl shadow-lg shadow-brand-500/30 hover:bg-brand-600 active:scale-95 transition-all flex items-center gap-2"><UserCheck size={20}/> Serahkan Resmi</button>
                        </div>
                    </div>
                  </div>

                {/* MODAL PINDAH TIM */}
                {transferModal.isOpen && (
                  <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center z-[100] p-4 animate-in fade-in duration-200">
                    <div className="bg-white rounded-[2rem] max-w-xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-200 border border-slate-100">
                        <div className="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                          <h3 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3"><RefreshCw size={24} className="text-brand-600"/> Pindah Tim BTPA</h3>
                          <button type="button" onClick={() => setTransferModal({isOpen:false, fromTeamId:null, toTeamId:''})} className="text-slate-400 hover:text-slate-700 bg-white p-2 rounded-full border shadow-sm transition-all"><X size={20}/></button>

                        <div className="p-8 overflow-y-auto flex-1">
