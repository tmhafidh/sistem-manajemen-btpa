<!DOCTYPE html>
  <html lang="id">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Monitor BTPA</title>
      <!-- Tailwind CSS -->
      <script src="https://cdn.tailwindcss.com"></script>
      
      <!-- Konfigurasi Tema Warna Dasar #f36d1c -->
      <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                brand: {
                  50: '#fff3eb',
                  100: '#ffe4d1',
                  200: '#ffc8a3',
                  300: '#ffa26b',
                  400: '#ff7332',
                  500: '#f36d1c', // Warna Utama
                  600: '#e4540d',
                  700: '#be3c09',
                  800: '#973010',
                  900: '#7a2810',
                  950: '#421106',
                }
              }
            }
          }
        }
      </script>
      
      <!-- React & ReactDOM -->
      <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
      <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
      
      <!-- Jembatan Fix untuk Bug Lucide-React -->
      <script>
          window.react = window.React;
          window['react-dom'] = window.ReactDOM;
      </script>
      
      <!-- Lucide Icons (Versi Stabil) -->
      <script src="https://unpkg.com/lucide-react@0.292.0/dist/umd/lucide-react.min.js"></script>

      <!-- Babel -->
      <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
      
      <!-- Konfigurasi Babel Standalone (Paksa Runtime Klasik) -->
      <script>
        Babel.registerPreset('react-classic', {
          presets: [
            [Babel.availablePresets['react'], { runtime: 'classic' }]
          ]
        });
      </script>
  </head>
  <body class="bg-slate-100">
      <div id="root"></div>

      <script type="text/babel" data-presets="env,react-classic">
          const { useState, useEffect, useMemo, useRef } = React;
          
          // Anti-Crash Icons Fallback
          const Icons = window.lucideReact || window.LucideReact || window.lucide || {};
          const safeIcon = (name) => Icons[name] || (({size=24, className=""}) => (
            <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          ));

          const Menu = safeIcon('Menu'); const X = safeIcon('X'); const Users = safeIcon('Users');
          const PlusCircle = safeIcon('PlusCircle'); const Inbox = safeIcon('Inbox'); const Activity = safeIcon('Activity');
          const Trash2 = safeIcon('Trash2'); const CheckCircle2 = safeIcon('CheckCircle2'); const XCircle = safeIcon('XCircle');
          const AlertCircle = safeIcon('AlertCircle'); const RefreshCw = safeIcon('RefreshCw'); const CheckSquare = safeIcon('CheckSquare');
          const Archive = safeIcon('Archive'); const ChevronRight = safeIcon('ChevronRight'); const ListOrdered = safeIcon('ListOrdered');
          const FileText = safeIcon('FileText'); const BarChart3 = safeIcon('BarChart3'); const Search = safeIcon('Search');
          const Play = safeIcon('Play'); const Database = safeIcon('Database'); const Download = safeIcon('Download');
          const Upload = safeIcon('Upload'); const AlertTriangle = safeIcon('AlertTriangle'); const UserCheck = safeIcon('UserCheck');
          const Briefcase = safeIcon('Briefcase'); const Undo2 = safeIcon('Undo2'); const Edit = safeIcon('Edit');
          const ClipboardPaste = safeIcon('ClipboardPaste'); const FileCheck = safeIcon('FileCheck'); const Calendar = safeIcon('Calendar');
          const MapPin = safeIcon('MapPin'); const Filter = safeIcon('Filter'); const Files = safeIcon('Files');
          const LayoutDashboard = safeIcon('LayoutDashboard'); const Globe = safeIcon('Globe');
          const Copy = safeIcon('Copy');

          const generateId = () => Math.random().toString(36).substr(2, 9);
          
          const formatDate = (dateStr) => {
              if (!dateStr) return '-';
              const parts = dateStr.split('-');
              if (parts.length !== 3) return dateStr;
              return `${parts[2]}/${parts[1]}/${parts[0]}`;
          };

          // =========================================================================
          // KOMPONEN HIGHLIGHT PENCARIAN
          // =========================================================================
          const HighlightText = ({ text, highlight }) => {
              if (!highlight || !text) return <span>{text}</span>;
              const parts = String(text).split(new RegExp(`(${highlight})`, 'gi'));
              return (
                  <span>
                      {parts.map((part, i) => 
                          part.toLowerCase() === String(highlight).toLowerCase() ? 
                              <mark key={i} className="bg-amber-300 text-amber-900 rounded-[3px] px-0.5 font-bold shadow-sm">{part}</mark> : 
                              <span key={i}>{part}</span>
                      )}
                  </span>
              );
          };

          // =========================================================================
          // MESIN PENYIMPANAN SINKRON SUPER CEPAT (V5)
          // =========================================================================
          function useSyncStorage(key, initialValue) {
              const [state, setState] = useState(() => {
                  try {
                      const item = window.localStorage.getItem(key);
                      return item ? JSON.parse(item) : initialValue;
                  } catch (error) {
                      console.error("Gagal baca database:", error);
                      return initialValue;
                  }
              });

              const setSyncState = (value) => {
                  setState(prevState => {
                      const newValue = value instanceof Function ? value(prevState) : value;
                      try {
                          window.localStorage.setItem(key, JSON.stringify(newValue));
                      } catch (err) {
                          console.error("Gagal simpan database:", err);
                      }
                      return newValue;
                  });
              };

              return [state, setSyncState];
          }

          // ==========================================
          // 1. DASHBOARD VIEW
          // ==========================================
          const DashboardView = ({ teams, batches, documents, globalNavTarget, setGlobalNavTarget, setActiveMenu, fireAlert }) => {
            const [selectedTeamId, setSelectedTeamId] = useState('ALL');
            const [visibleCount, setVisibleCount] = useState(100);
            const [highlightedDocNumber, setHighlightedDocNumber] = useState(null);

            useEffect(() => { setVisibleCount(100); }, [selectedTeamId]);

            useEffect(() => {
                if (globalNavTarget && globalNavTarget.type === 'TEAM' && globalNavTarget.id) {
                    setSelectedTeamId(globalNavTarget.id);
                    if (globalNavTarget.highlightNumber) setHighlightedDocNumber(globalNavTarget.highlightNumber);
                    setGlobalNavTarget({ type: null, id: null, keyword: null, highlightNumber: null });
                }
            }, [globalNavTarget, setGlobalNavTarget]);

            const targetDocs = selectedTeamId === 'ALL' ? documents : documents.filter(d => d.teamId === selectedTeamId);
            const targetBatches = selectedTeamId === 'ALL' ? batches : batches.filter(b => b.teamId === selectedTeamId);

            useEffect(() => {
                if (highlightedDocNumber) {
                    const targetIdx = targetDocs.findIndex(d => d.number === highlightedDocNumber);
                    if (targetIdx !== -1 && targetIdx >= visibleCount) setVisibleCount(targetIdx + 50);

                    setTimeout(() => {
                        const el = document.getElementById(`doc-dash-${highlightedDocNumber}`);
                        if (el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            setTimeout(() => setHighlightedDocNumber(null), 6000);
                        }
                    }, 300);
                }
            }, [highlightedDocNumber, selectedTeamId, targetDocs, visibleCount]);

            const statTerpakai = targetDocs.filter(d => d.status === 'TERPAKAI').length;
            const statDialokasikan = targetDocs.filter(d => d.status === 'DIALOKASIKAN').length;
            const statLaci = targetDocs.filter(d => d.status === 'DI_ADMIN').length;
            const statPenimbang = targetDocs.filter(d => d.status === 'DI_PENIMBANG').length;
            const totalDocs = targetDocs.length;

            const pTerpakai = totalDocs === 0 ? 0 : (statTerpakai / totalDocs) * 100;
            const pDialokasikan = totalDocs === 0 ? 0 : (statDialokasikan / totalDocs) * 100;
            const pLaci = totalDocs === 0 ? 0 : (statLaci / totalDocs) * 100;
            const pPenimbang = totalDocs === 0 ? 0 : (statPenimbang / totalDocs) * 100;

            const headerTitle = selectedTeamId === 'ALL' ? 'Analitik Keseluruhan' : teams.find(t=>t.id===selectedTeamId)?.name;
            const headerSubtitle = selectedTeamId === 'ALL' ? 'Ringkasan sirkulasi dokumen BTPA dan kandang di seluruh sistem.' : 'Analitik lengkap sirkulasi dokumen BTPA khusus untuk tim ini.';

            return (
              <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                <div className="bg-white p-5 md:p-6 rounded-[2rem] shadow-sm border border-slate-200/60 flex flex-col gap-3">
                  <div className="flex items-center justify-between pl-2">
                      <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Pilih Dasbor Tim</h3>
                      <span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md">{teams.length} Tim Aktif</span>
                  </div>
                  <div className="flex flex-row overflow-x-auto pb-2 gap-3 custom-scrollbar">
                      <button onClick={() => setSelectedTeamId('ALL')} className={`px-5 py-3 rounded-2xl font-bold transition-all flex items-center gap-2 whitespace-nowrap shrink-0 ${selectedTeamId === 'ALL' ? 'bg-slate-800 text-white shadow-lg shadow-slate-800/20' : 'bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100 hover:border-slate-300'}`}><Globe size={18}/><span>Global Master</span></button>
                      {teams.map(t => (
                          <button key={t.id} onClick={() => setSelectedTeamId(t.id)} className={`px-5 py-3 rounded-2xl font-bold transition-all flex items-center gap-2 whitespace-nowrap shrink-0 ${selectedTeamId === t.id ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/30' : 'bg-white border border-slate-200 text-slate-600 hover:bg-brand-50 hover:text-brand-600 hover:border-brand-200'}`}><Users size={18}/><span>{t.name}</span></button>
                      ))}
                  </div>
                </div>

                <div className="flex flex-col sm:flex-row items-start sm:items-center gap-5 bg-white p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-200/60">
                  <div className="w-20 h-20 bg-gradient-to-br from-brand-100 to-orange-100 text-brand-600 rounded-3xl flex items-center justify-center shadow-inner shrink-0">
                      {selectedTeamId === 'ALL' ? <Globe size={36}/> : <BarChart3 size={36}/>}
                  </div>
                  <div>
                    <h2 className="text-3xl md:text-4xl font-black text-slate-800 tracking-tight mb-1">{headerTitle}</h2>
                    <p className="text-slate-500 font-medium">{headerSubtitle}</p>
                  </div>
                </div>
                
                {totalDocs === 0 ? (
                  <div className="p-20 text-center text-slate-400 bg-white rounded-[2rem] border-2 border-dashed border-slate-200/80">
                      <Activity size={64} className="mx-auto mb-6 opacity-20"/>
                      <p className="text-2xl font-black text-slate-600 tracking-tight mb-2">Belum ada rekam jejak</p>
                      <p className="text-lg">Belum ada riwayat sirkulasi dokumen untuk pilihan ini.</p>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4 md:gap-6">
                      <div className="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/60 shadow-sm relative overflow-hidden group hover:border-brand-200 transition-colors">
                        <div className="absolute -right-6 -top-6 text-slate-50 group-hover:scale-110 transition-transform duration-500"><FileText size={120} /></div>
                        <p className="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-2 relative z-10">Total Dokumen</p>
                        <p className="text-4xl md:text-5xl font-black text-slate-800 relative z-10 tracking-tighter">{totalDocs}</p>
                      </div>
                      <div className="bg-emerald-500 p-6 md:p-8 rounded-3xl shadow-lg shadow-emerald-500/20 relative overflow-hidden group text-white">
                        <div className="absolute -right-6 -top-6 text-emerald-400/30 group-hover:scale-110 transition-transform duration-500"><CheckCircle2 size={120} /></div>
                        <p className="text-emerald-100 text-[10px] font-black uppercase tracking-widest mb-2 relative z-10">Terpakai (Selesai)</p>
                        <p className="text-4xl md:text-5xl font-black relative z-10 tracking-tighter">{statTerpakai}</p>
                      </div>
                      <div className="bg-brand-500 p-6 md:p-8 rounded-3xl shadow-lg shadow-brand-500/20 relative overflow-hidden group text-white">
                        <div className="absolute -right-6 -top-6 text-brand-400/30 group-hover:scale-110 transition-transform duration-500"><Inbox size={120} /></div>
                        <p className="text-brand-100 text-[10px] font-black uppercase tracking-widest mb-2 relative z-10">Laci Admin (Sisa)</p>
                        <p className="text-4xl font-black relative z-10 tracking-tighter">{statLaci}</p>
                      </div>
                      <div className="bg-indigo-500 p-6 md:p-8 rounded-3xl shadow-lg shadow-indigo-500/20 relative overflow-hidden group text-white">
                        <div className="absolute -right-6 -top-6 text-indigo-400/30 group-hover:scale-110 transition-transform duration-500"><UserCheck size={120} /></div>
                        <p className="text-indigo-100 text-[10px] font-black uppercase tracking-widest mb-2 relative z-10">Di Penimbang</p>
                        <p className="text-4xl md:text-5xl font-black relative z-10 tracking-tighter">{statPenimbang}</p>
                      </div>
                      <div className="bg-slate-800 p-6 md:p-8 rounded-3xl shadow-lg shadow-slate-800/20 relative overflow-hidden group text-white">
                        <div className="absolute -right-6 -top-6 text-slate-700/50 group-hover:scale-110 transition-transform duration-500"><Activity size={120} /></div>
                        <p className="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-2 relative z-10">Gantung di Kandang</p>
                        <p className="text-4xl md:text-5xl font-black relative z-10 tracking-tighter">{statDialokasikan}</p>
                      </div>
                    </div>

                    <div className="bg-white p-6 md:p-10 rounded-3xl border border-slate-200/60 shadow-sm">
                      <div className="flex justify-between items-center mb-8">
                        <h3 className="text-xl font-black text-slate-800 tracking-tight">Distribusi Status Dokumen</h3>
                        <span className="text-xs font-black text-slate-400 bg-slate-100 px-4 py-2 rounded-xl uppercase tracking-widest shadow-inner">100% Total Kapasitas</span>
                      </div>
                      
                      <div className="h-12 w-full bg-slate-100 rounded-2xl overflow-hidden flex shadow-inner mb-8">
                        <div style={{width: `${pTerpakai}%`}} className="bg-emerald-500 h-full transition-all duration-1000 ease-out flex items-center justify-center text-xs font-black text-white overflow-hidden shadow-[inset_0_-4px_0_rgba(0,0,0,0.1)]" title={`Selesai: ${pTerpakai.toFixed(1)}%`}>{pTerpakai>5&&`${pTerpakai.toFixed(0)}%`}</div>
                        <div style={{width: `${pLaci}%`}} className="bg-brand-500 h-full transition-all duration-1000 ease-out flex items-center justify-center text-xs font-black text-white overflow-hidden shadow-[inset_0_-4px_0_rgba(0,0,0,0.1)]" title={`Laci: ${pLaci.toFixed(1)}%`}>{pLaci>5&&`${pLaci.toFixed(0)}%`}</div>
                        <div style={{width: `${pPenimbang}%`}} className="bg-indigo-500 h-full transition-all duration-1000 ease-out flex items-center justify-center text-xs font-black text-white overflow-hidden shadow-[inset_0_-4px_0_rgba(0,0,0,0.1)]" title={`Penimbang: ${pPenimbang.toFixed(1)}%`}>{pPenimbang>5&&`${pPenimbang.toFixed(0)}%`}</div>
                        <div style={{width: `${pDialokasikan}%`}} className="bg-slate-300 h-full transition-all duration-1000 ease-out flex items-center justify-center text-xs font-black text-slate-600 overflow-hidden shadow-[inset_0_-4px_0_rgba(0,0,0,0.05)]" title={`Menggantung: ${pDialokasikan.toFixed(1)}%`}>{pDialokasikan>5&&`${pDialokasikan.toFixed(0)}%`}</div>
                      </div>
                      
                      <div className="flex flex-wrap justify-center gap-6 md:gap-10 text-sm font-bold">
                        <div className="flex items-center gap-3"><div className="w-5 h-5 bg-emerald-500 rounded-lg shadow-sm"></div> <span className="text-slate-600">Selesai Terpakai</span></div>
                        <div className="flex items-center gap-3"><div className="w-5 h-5 bg-brand-500 rounded-lg shadow-sm"></div> <span className="text-slate-600">Di Laci Admin</span></div>
                        <div className="flex items-center gap-3"><div className="w-5 h-5 bg-indigo-500 rounded-lg shadow-sm"></div> <span className="text-slate-600">Di Penimbang</span></div>
                        <div className="flex items-center gap-3"><div className="w-5 h-5 bg-slate-300 rounded-lg shadow-sm"></div> <span className="text-slate-600">Masih di Kandang</span></div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-8 items-stretch">
                      
                      {/* Riwayat Kandang Aktif & Selesai */}
                      <div className="bg-white border border-slate-200/60 rounded-3xl shadow-sm flex flex-col overflow-hidden h-full">
                        <div className="p-8 border-b border-slate-100 bg-slate-50/50 shrink-0">
                          <h3 className="text-xl font-black text-slate-800 tracking-tight">Riwayat Kandang Aktif & Selesai</h3>
                        </div>
                        <div className="flex-1 relative min-h-[500px] xl:min-h-[600px]">
                          <div className="absolute inset-0 overflow-auto custom-scrollbar">
                              <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-white text-slate-400 text-xs font-black uppercase tracking-widest border-b border-slate-100 sticky top-0 shadow-sm z-10">
                                  <tr>
                                      <th className="px-8 py-5">Nama Kandang</th>
                                      <th className="px-8 py-5">Tanggal</th>
                                      <th className="px-8 py-5">Status</th>
                                      <th className="px-8 py-5 text-center">Vol</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100/80">
                                  {targetBatches.length === 0 ? (
                                    <tr><td colSpan="4" className="p-10 text-center text-slate-400 font-medium">Belum ada riwayat kandang.</td></tr>
                                  ) : (
                                    targetBatches.map(b => (
                                      <tr 
                                        key={b.id} 
                                        onClick={() => {
                                            if (b.status === 'AKTIF' || b.status === 'KOSONG') {
                                                setActiveMenu('proses-panen');
                                                setGlobalNavTarget({ type: 'BATCH', id: b.id, keyword: null });
                                            } else {
                                                if (fireAlert) fireAlert('Kandang Selesai', 'Kandang ini sudah ditutup secara permanen dan hanya tersimpan sebagai arsip.', 'success');
                                            }
                                        }} 
                                        className={`transition-colors ${(b.status === 'AKTIF' || b.status === 'KOSONG') ? 'hover:bg-brand-50 cursor-pointer group' : 'hover:bg-slate-50 cursor-default'}`}
                                      >
                                        <td className="px-8 py-4">
                                          <p className={`font-black text-base transition-colors ${(b.status === 'AKTIF' || b.status === 'KOSONG') ? 'text-slate-800 group-hover:text-brand-600' : 'text-slate-700'}`}>{b.name}</p>
                                          {selectedTeamId === 'ALL' && <p className="text-[10px] font-bold text-slate-400 mt-0.5 uppercase tracking-widest">{teams.find(t=>t.id===b.teamId)?.name}</p>}
                                        </td>
                                        <td className="px-8 py-4 font-semibold text-slate-500">{formatDate(b.date)}</td>
                                        <td className="px-8 py-4"><span className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-sm ${b.status==='AKTIF'?'bg-emerald-100 text-emerald-700': b.status==='KOSONG'?'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-500'}`}>{b.status}</span></td>
                                        <td className="px-8 py-4 text-center font-black text-slate-700 text-lg">{documents.filter(d=>d.batchId===b.id).length}</td>
                                      </tr>
                                    ))
                                  )}
                                </tbody>
                              </table>
                          </div>
                        </div>
                      </div>

                      {/* Log Nomor Dokumen */}
                      <div className="bg-white border border-slate-200/60 rounded-3xl shadow-sm flex flex-col overflow-hidden h-full">
                        <div className="p-8 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center shrink-0">
                          <h3 className="text-xl font-black text-slate-800 tracking-tight">Log Nomor Dokumen</h3>
                          <span className="text-[10px] font-black uppercase tracking-widest bg-white border shadow-sm text-slate-500 px-3 py-1.5 rounded-lg">Semua Status</span>
                        </div>
                        <div className="flex-1 relative min-h-[500px] xl:min-h-[600px]">
                          <div className="absolute inset-0 p-8 flex flex-col">
                              <div className="flex flex-wrap gap-2.5 overflow-y-auto pr-2 custom-scrollbar flex-1 content-start pb-2">
                                {targetDocs.slice(0, visibleCount).map(d => {
                                  let color = 'bg-slate-50 border-slate-200 text-slate-500'; 
                                  if (d.status === 'TERPAKAI') color = 'bg-emerald-50 border-emerald-200 text-emerald-700 shadow-sm';
                                  if (d.status === 'DIALOKASIKAN') color = 'bg-white border-slate-200 text-slate-700 shadow-sm';
                                  if (d.status === 'DI_ADMIN') color = 'bg-amber-50 border-amber-200 text-amber-700 shadow-sm';
                                  if (d.status === 'DI_PENIMBANG') color = 'bg-indigo-50 border-indigo-200 text-indigo-700 shadow-sm';
                                  return <span key={d.id} id={`doc-dash-${d.number}`} className={`px-3 py-1.5 border rounded-lg text-sm font-mono font-bold transition-all duration-500 hover:brightness-95 cursor-default ${highlightedDocNumber === d.number ? 'bg-brand-500 text-white border-brand-600 shadow-[0_0_15px_rgba(243,109,28,0.5)] scale-110 z-10 relative' : color}`} title={d.status}>#{d.number}</span>
                                })}
                              </div>
                              {visibleCount < targetDocs.length && (
                                <div className="mt-8 text-center shrink-0">
                                  <button onClick={() => setVisibleCount(p => p+100)} className="px-8 py-4 bg-slate-50 text-slate-600 font-black text-sm rounded-2xl hover:bg-slate-100 border border-slate-200 transition-all shadow-sm active:scale-95">Muat {targetDocs.length - visibleCount} Nomor Tersisa...</button>
                                </div>
                              )}
                          </div>
                        </div>
                      </div>

                    </div>
                  </div>
                )}
              </div>
            );
          };

          // ==========================================
          // 2. MASTER TIM VIEW
          // ==========================================
          const MasterTimView = ({ teams, setTeams, batches, documents, fireAlert, addToast }) => {
            const [pplName, setPplName] = useState('');
            const [penimbangName, setPenimbangName] = useState('');
            const [editModal, setEditModal] = useState({ isOpen: false, id: '', ppl: '', penimbang: '' });

            const handleAddTeam = (e) => {
              e.preventDefault();
              if (!pplName.trim() || !penimbangName.trim()) return fireAlert('Validasi Gagal', 'Nama PPL dan Nama Penimbang wajib diisi keduanya.', 'error');
              const combinedName = `${pplName.trim()} - ${penimbangName.trim()}`;
              if (teams.some(t => t.name.toLowerCase() === combinedName.toLowerCase())) return fireAlert('Data Duplikat', 'Kombinasi Tim ini sudah terdaftar!', 'error');
              
              setTeams(prev => [...prev, { id: generateId(), name: combinedName, ppl: pplName.trim(), penimbang: penimbangName.trim() }]);
              setPplName(''); setPenimbangName('');
              addToast(`Tim ${combinedName} ditambahkan!`, 'success');
            };

            const handleDeleteTeam = (id) => {
              if (batches.some(b => b.teamId === id) || documents.some(d => d.teamId === id)) return fireAlert('Akses Ditolak', 'Tim ini sedang terikat pada data kandang/dokumen.', 'error');
              setTeams(prev => prev.filter(t => t.id !== id));
              addToast('Tim berhasil dihapus', 'success');
            };

            const handleUpdateTeam = (e) => {
              e.preventDefault();
              if (!editModal.ppl.trim() || !editModal.penimbang.trim()) return fireAlert('Validasi Gagal', 'Semua bidang wajib diisi.', 'error');
              const combinedName = `${editModal.ppl.trim()} - ${editModal.penimbang.trim()}`;
              if (teams.some(t => t.id !== editModal.id && t.name.toLowerCase() === combinedName.toLowerCase())) return fireAlert('Data Duplikat', 'Kombinasi Tim ini sudah ada.', 'error');
              
              setTeams(prev => prev.map(t => t.id === editModal.id ? { ...t, name: combinedName, ppl: editModal.ppl.trim(), penimbang: editModal.penimbang.trim() } : t));
              setEditModal({ isOpen: false, id: '', ppl: '', penimbang: '' });
              addToast('Data tim diperbarui!', 'success');
            };

            return (
              <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                <div className="flex items-center gap-4 mb-8">
                  <div className="p-3 bg-white rounded-2xl shadow-sm border border-slate-100"><Users className="text-brand-600" size={28}/></div>
                  <div>
                    <h2 className="text-3xl font-black text-slate-800 tracking-tight">Master Data Tim</h2>
                    <p className="text-slate-500 font-medium mt-1">Kelola daftar tim pelaksana (kombinasi PPL & Penimbang).</p>
                  </div>
                </div>

                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200/60 transition-all hover:shadow-md">
                  <form onSubmit={handleAddTeam} className="flex flex-col gap-6">
                    <div className="flex flex-col md:flex-row items-center gap-4">
                      <div className="w-full flex-1 space-y-2">
                        <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Nama PPL</label>
                        <div className="relative">
                          <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><Briefcase size={20} className="text-slate-400" /></div>
                          <input type="text" value={pplName} onChange={(e) => setPplName(e.target.value)} placeholder="Ketik nama PPL..." className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 focus:bg-white outline-none transition-all text-slate-700 font-semibold text-lg" />
                        </div>
                      </div>
                      <div className="hidden md:flex text-slate-300 font-black text-3xl mt-6">-</div>
                      <div className="w-full flex-1 space-y-2">
                        <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Nama Penimbang</label>
                        <div className="relative">
                          <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><UserCheck size={20} className="text-slate-400" /></div>
                          <input type="text" value={penimbangName} onChange={(e) => setPenimbangName(e.target.value)} placeholder="Ketik nama Penimbang..." className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 focus:bg-white outline-none transition-all text-slate-700 font-semibold text-lg" />
                        </div>
                      </div>
                      <div className="w-full md:w-auto md:mt-6">
                        <button type="submit" className="w-full h-[60px] bg-slate-800 text-white px-8 rounded-2xl hover:bg-slate-900 flex items-center justify-center gap-2 font-bold transition-all shadow-lg hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0 active:scale-95 shrink-0">
                          <PlusCircle size={22} /> Tambahkan
                        </button>
                      </div>
                    </div>
                    {(pplName || penimbangName) && (
                        <div className="p-5 bg-brand-50 border border-brand-100 rounded-2xl flex flex-col sm:flex-row sm:items-center gap-4 animate-in fade-in zoom-in-95 duration-200">
                          <div className="flex items-center gap-2 text-sm font-bold text-brand-600 uppercase tracking-wider shrink-0">
                            <CheckCircle2 size={20} /> Preview Tim:
                          </div>
                          <div className="bg-white px-5 py-2.5 rounded-xl border border-brand-200 shadow-sm text-slate-800 font-black text-xl tracking-tight">
                            <span className="text-brand-700">{pplName || 'PPL'}</span> <span className="text-slate-300 mx-2">-</span> <span className="text-brand-700">{penimbangName || 'Penimbang'}</span>
                          </div>
                        </div>
                    )}
                  </form>
                </div>

                <div className="bg-white rounded-3xl shadow-sm border border-slate-200/60 overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse min-w-[600px]">
                      <thead>
                        <tr className="bg-slate-50/80 border-b border-slate-100 text-slate-500 text-xs uppercase tracking-widest font-bold">
                          <th className="px-8 py-5">Profil Tim (PPL - Penimbang)</th>
                          <th className="px-8 py-5 text-right">Manajemen</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100/80">
                        {teams.length === 0 ? (
                          <tr><td colSpan="2" className="px-8 py-16 text-center text-slate-400 font-bold">Belum Ada Tim Terdaftar</td></tr>
                        ) : (
                          teams.map(team => (
                            <tr key={team.id} className="hover:bg-slate-50/50 transition-colors group">
                              <td className="px-8 py-5">
                                <div className="flex items-center gap-5">
                                  <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-100 to-orange-100 text-brand-700 flex items-center justify-center text-xl font-black shadow-inner shrink-0">{team.name.charAt(0).toUpperCase()}</div>
                                  <div>
                                    <h3 className="text-xl font-black text-slate-800">{team.name}</h3>
                                    <div className="flex items-center gap-3 mt-1.5 text-xs font-bold uppercase tracking-wider">
                                      <span className="bg-slate-100 text-slate-500 px-2 py-1 rounded-md flex items-center gap-1.5"><Briefcase size={14}/> {team.ppl || 'N/A'}</span>
                                      <span className="bg-slate-100 text-slate-500 px-2 py-1 rounded-md flex items-center gap-1.5"><UserCheck size={14}/> {team.penimbang || 'N/A'}</span>
                                    </div>
                                  </div>
                                </div>
                              </td>
                              <td className="px-8 py-5 text-right">
                                <div className="flex items-center justify-end gap-2">
                                  <button type="button" onClick={() => setEditModal({ isOpen: true, id: team.id, ppl: team.ppl || '', penimbang: team.penimbang || '' })} className="text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 p-3 rounded-xl transition-all shadow-sm border border-transparent hover:border-indigo-100 md:opacity-0 group-hover:opacity-100 focus:opacity-100" title="Edit Tim"><Edit size={20} /></button>
                                  <button type="button" onClick={() => handleDeleteTeam(team.id)} className="text-slate-400 hover:text-red-600 hover:bg-red-50 p-3 rounded-xl transition-all shadow-sm border border-transparent hover:border-red-100 md:opacity-0 group-hover:opacity-100 focus:opacity-100" title="Hapus Tim"><Trash2 size={20} /></button>
                                </div>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>

                {editModal.isOpen && (
                  <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center z-[100] p-4 animate-in fade-in duration-200">
                    <div className="bg-white rounded-[2rem] max-w-lg w-full shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 duration-200 border border-slate-100">
                      <div className="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h3 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3"><Edit size={24} className="text-brand-600"/> Edit Data Tim</h3>
                        <button type="button" onClick={() => setEditModal({ isOpen: false, id: '', ppl: '', penimbang: '' })} className="text-slate-400 hover:text-slate-700 bg-white p-2 rounded-full border shadow-sm transition-all"><X size={20}/></button>
                      </div>
                      <form onSubmit={handleUpdateTeam}>
                        <div className="p-8 space-y-6">
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Ubah Nama PPL</label>
                              <input type="text" value={editModal.ppl} onChange={(e) => setEditModal({...editModal, ppl: e.target.value})} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-lg text-slate-800" />
                            </div>
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Ubah Nama Penimbang</label>
                              <input type="text" value={editModal.penimbang} onChange={(e) => setEditModal({...editModal, penimbang: e.target.value})} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-semibold text-lg text-slate-800" />
                            </div>
                        </div>
                        <div className="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                          <button type="button" onClick={() => setEditModal({ isOpen: false, id: '', ppl: '', penimbang: '' })} className="px-8 py-4 font-bold text-slate-600 bg-white border border-slate-200 rounded-2xl hover:bg-slate-100 transition-all">Batal</button>
                          <button type="submit" className="px-8 py-4 font-black text-white bg-brand-500 rounded-2xl shadow-lg shadow-brand-500/30 hover:bg-brand-600 active:scale-95 transition-all flex items-center gap-2"><CheckCircle2 size={20}/> Simpan Perubahan</button>
                        </div>
                      </form>
                    </div>
                  </div>
                )}
              </div>
            );
          };

          // ==========================================
          // 4. DATABASE VIEW
          // ==========================================
          const DatabaseView = ({ teams, setTeams, batches, setBatches, documents, setDocuments, fireAlert, addToast }) => {
            const [filterStatus, setFilterStatus] = useState('SEMUA');
            const [search, setSearch] = useState('');
            const fileInputRef = useRef(null);
            const [restoreModal, setRestoreModal] = useState({ isOpen: false, data: null });
            const [resetModal, setResetModal] = useState({ isOpen: false, keyword: '' });

            const filteredDocs = documents.filter(doc => {
              const matchesStatus = filterStatus === 'SEMUA' || doc.status === filterStatus;
              const matchesSearch = doc.number.includes(search);
              return matchesStatus && matchesSearch;
            });

            const statusOptions = ['SEMUA', 'DI_ADMIN', 'DIALOKASIKAN', 'DI_PENIMBANG', 'TERPAKAI'];

            const handleBackup = () => {
              const data = { version: '5.1', timestamp: new Date().toISOString(), teams, batches, documents };
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a'); a.href = url;
              const now = new Date();
              const datePart = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
              const timePart = String(now.getHours()).padStart(2, '0') + '-' + String(now.getMinutes()).padStart(2, '0') + '-' + String(now.getSeconds()).padStart(2, '0');
              
              a.download = `backup_btpa_${datePart}_${timePart}.json`;
              document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
              addToast('File backup diunduh!', 'success');
            };

            const handleFileChange = (e) => {
              const file = e.target.files[0]; if (!file) return;
              const reader = new FileReader();
              reader.onload = (event) => {
                try {
                  const data = JSON.parse(event.target.result);
                  if (data.teams && data.batches && data.documents) setRestoreModal({ isOpen: true, data: data });
                  else fireAlert('Format Salah', 'File tidak valid.', 'error');
                } catch (error) { fireAlert('Error', 'Gagal membaca file.', 'error'); }
              };
              reader.readAsText(file); e.target.value = null;
            };

            return (
              <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-3xl font-black text-slate-800 tracking-tight">Database Sistem</h2>
                    <p className="text-slate-500 font-medium mt-1">Monitoring seluruh status dokumen dan manajemen cadangan data (Backup).</p>
                  </div>
                </div>

                {/* Filter Area - Responsive as per user request to be horizontal scrollable */}
                <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200/60 flex flex-col md:flex-row gap-4 items-center">
                  <div className="relative w-full md:w-72">
                      <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                          <Search className="text-slate-400" size={18}/>
                      </div>
                      <input 
                        placeholder="Cari nomor BTPA..." 
                        className="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 transition-all font-bold text-slate-700 text-sm"
                        onChange={(e) => setSearch(e.target.value)}
                        value={search}
                      />
                  </div>
                  
                  <div className="flex-1 flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 custom-scrollbar">
                      {statusOptions.map(status => (
                          <button 
                              key={status}
                              onClick={() => setFilterStatus(status)}
                              className={`px-6 py-3 rounded-2xl font-black text-xs uppercase tracking-widest transition-all whitespace-nowrap ${filterStatus === status ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/30' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                          >
                              {status.replace('_', ' ')}
                          </button>
                      ))}
                  </div>
                </div>

                {/* Tabel Data */}
                <div className="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                  <div className="overflow-x-auto max-h-[400px] custom-scrollbar">
                      <table className="w-full text-left">
                          <thead className="bg-slate-50 text-slate-400 text-[10px] uppercase font-black tracking-widest sticky top-0 shadow-sm z-10">
                              <tr>
                                  <th className="px-8 py-5">No. BTPA</th>
                                  <th className="px-8 py-5">Tim Pelaksana</th>
                                  <th className="px-8 py-5">Status Eksekusi</th>
                                  <th className="px-8 py-5">Posisi Detail</th>
                              </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                              {filteredDocs.map(doc => (
                                  <tr key={doc.id} className="hover:bg-slate-50 transition-colors">
                                      <td className="px-8 py-4 font-mono font-black text-slate-700 text-lg"><HighlightText text={`#${doc.number}`} highlight={search} /></td>
                                      <td className="px-8 py-4 font-bold text-slate-600 flex items-center gap-2"><Users size={16} className="text-slate-400"/> {teams.find(t=>t.id===doc.teamId)?.name || '-'}</td>
                                      <td className="px-8 py-5">
                                          {doc.status === 'DIALOKASIKAN' && <span className="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-1.5 border border-slate-200 shadow-sm"><Activity size={12}/> Di Lapangan</span>}
                                          {doc.status === 'TERPAKAI' && <span className="bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-1.5 border border-emerald-200 shadow-sm"><CheckCircle2 size={12}/> Selesai (Sah)</span>}
                                          {doc.status === 'DI_ADMIN' && <span className="bg-amber-100 text-amber-700 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-1.5 border border-amber-200 shadow-sm"><Inbox size={12}/> Laci Admin</span>}
                                          {doc.status === 'DI_PENIMBANG' && <span className="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center w-max gap-1.5 border border-indigo-200 shadow-sm"><UserCheck size={12}/> Di Penimbang</span>}
                                      </td>
                                      <td className="px-8 py-4 text-slate-500 font-medium text-sm">
                                          {doc.status === 'DI_PENIMBANG' ? `Milik Penimbang: ${doc.penimbangName}` : doc.status === 'DIALOKASIKAN' ? `Milik Kandang: ${batches.find(b=>b.id === doc.batchId)?.name || '?'}` : doc.status}
                                      </td>
                                  </tr>
                              ))}
                          </tbody>
                      </table>
                  </div>
                </div>

                {/* Backup/Restore Area */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
                  <div className="bg-white p-10 rounded-3xl border border-slate-200/60 text-center group shadow-sm hover:shadow-md transition-all">
                    <div className="w-24 h-24 bg-brand-50 text-brand-600 rounded-3xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform duration-500"><Download size={48} /></div>
                    <h3 className="text-2xl font-black mb-2">Unduh Backup</h3>
                    <button type="button" onClick={handleBackup} className="mt-4 w-full bg-slate-800 text-white py-4 rounded-2xl font-bold flex justify-center items-center gap-2 hover:bg-slate-700 transition-colors"><Download size={20}/> Ekspor Data JSON</button>
                  </div>
                  <div className="bg-white p-10 rounded-3xl border border-slate-200/60 text-center group shadow-sm hover:shadow-md transition-all">
                    <div className="w-24 h-24 bg-amber-50 text-brand-600 rounded-3xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform duration-500"><Upload size={48} /></div>
                    <h3 className="text-2xl font-black mb-2">Restore Data</h3>
                    <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileChange} className="hidden" />
                    <button type="button" onClick={() => fileInputRef.current?.click()} className="mt-4 w-full bg-amber-500 text-white py-4 rounded-2xl font-bold flex justify-center items-center gap-2 hover:bg-amber-600 transition-colors"><Upload size={20}/> Impor File Backup</button>
                  </div>
                </div>

                <div className="bg-white p-8 rounded-3xl border border-red-100 flex flex-col md:flex-row items-center justify-between gap-4 mt-8 shadow-sm">
                  <div><h3 className="text-xl font-black text-red-600 flex items-center gap-2"><AlertTriangle size={24}/> Danger Zone</h3><p className="text-slate-500 text-sm mt-1">Hapus semua data secara permanen.</p></div>
                  <button type="button" onClick={() => setResetModal({ isOpen: true, keyword: '' })} className="w-full md:w-auto px-8 py-4 bg-red-50 text-red-600 font-black rounded-2xl border border-red-200 hover:bg-red-600 hover:text-white transition-colors">Kosongkan Sistem</button>
                </div>

                {restoreModal.isOpen && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-[100] p-4 animate-in zoom-in-95 duration-200">
                    <div className="bg-white rounded-[2rem] border border-slate-100 p-8 max-w-md w-full text-center shadow-2xl">
                      <div className="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><AlertTriangle size={36} /></div>
                      <h3 className="text-3xl font-black text-slate-800 tracking-tight mb-4">Timpa Data?</h3>
                      <div className="flex gap-3">
                        <button type="button" onClick={() => setRestoreModal({ isOpen: false, data: null })} className="flex-1 bg-slate-100 py-4 rounded-2xl font-bold">Batal</button>
                        <button type="button" onClick={() => {
                          setTeams(restoreModal.data.teams); setBatches(restoreModal.data.batches); setDocuments(restoreModal.data.documents);
                          setRestoreModal({ isOpen: false, data: null }); fireAlert('Sukses', 'Sistem pulih.', 'success');
                        }} className="flex-1 bg-amber-500 text-white py-4 rounded-2xl font-black">Pulihkan Instan</button>
                      </div>
                    </div>
                  </div>
                )}

                {resetModal.isOpen && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-[100] p-4 animate-in zoom-in-95 duration-200">
                    <div className="bg-white rounded-[2rem] border border-slate-100 p-8 max-w-md w-full text-center shadow-2xl">
                      <div className="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><Trash2 size={36} /></div>
                      <h3 className="text-3xl font-black text-slate-800 tracking-tight mb-2 text-red-600">Reset Total</h3>
                      <p className="mb-4 text-sm text-slate-500">Ketik <strong>HAPUS</strong> untuk setuju.</p>
                      <input type="text" placeholder="Ketik HAPUS..." className="w-full px-5 py-4 border border-slate-200 rounded-2xl text-center font-black tracking-widest mb-8 text-xl" value={resetModal.keyword} onChange={(e) => setResetModal({...resetModal, keyword: e.target.value.toUpperCase()})}/>
                      <div className="flex gap-3">
                        <button type="button" onClick={() => setResetModal({ isOpen: false, keyword: '' })} className="flex-1 bg-slate-100 py-4 rounded-2xl font-bold">Batal</button>
                        <button type="button" onClick={() => {
                          if (resetModal.keyword === 'HAPUS') { setTeams([]); setBatches([]); setDocuments([]); setResetModal({ isOpen: false, keyword: '' }); fireAlert('Sukses', 'Reset berhasil.', 'success'); }
                        }} disabled={resetModal.keyword !== 'HAPUS'} className="flex-1 bg-red-600 text-white py-4 rounded-2xl font-black disabled:opacity-50 transition-all">Eksekusi</button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          };

          // ==========================================
          // 5. INPUT LACI VIEW
          // ==========================================
          const InputLaciView = ({ teams, documents, setDocuments, fireAlert }) => {
            const [teamId, setTeamId] = useState('');
            const [ranges, setRanges] = useState([{ from: '', to: '' }]);
            const [isGenerating, setIsGenerating] = useState(false);

            const totalGeneratedDocs = ranges.reduce((acc, range) => {
              const from = parseInt(range.from); const to = parseInt(range.to);
              if (!isNaN(from) && !isNaN(to) && from <= to) return acc + (to - from + 1);
              return acc;
            }, 0);

            const previewNumbers = useMemo(() => {
              let nums = [];
              for (const range of ranges) {
                const from = parseInt(range.from); const to = parseInt(range.to);
                if (!isNaN(from) && !isNaN(to) && from <= to) {
                  for (let i = from; i <= to; i++) { nums.push(i.toString()); if(nums.length >= 100) break; }
                }
                if(nums.length >= 100) break;
              }
              return nums;
            }, [ranges]);

            const conflictError = useMemo(() => {
              if (!teamId) return null;
              const docsMap = new Map();
              documents.forEach(d => docsMap.set(d.number, d));

              for (const range of ranges) {
                const from = parseInt(range.from); const to = parseInt(range.to);
                if (isNaN(from) || isNaN(to) || from > to) continue;
                if (to - from > 50000) return { number: 'Lebih 50rb', owner: 'Sistem' };

                for (let i = from; i <= to; i++) {
                  const numStr = i.toString();
                  const existing = docsMap.get(numStr);
                  if (existing && existing.teamId !== teamId) {
                    const ownerTeam = teams.find(t => t.id === existing.teamId)?.name || 'Tim Lain';
                    return { number: numStr, owner: ownerTeam };
                  }
                }
              }
              return null;
            }, [ranges, documents, teamId, teams]);

            const handleAddRange = () => setRanges([...ranges, { from: '', to: '' }]);
            const handleRemoveRange = (index) => { if (ranges.length > 1) setRanges(ranges.filter((_, i) => i !== index)); };
            
            const handleRangeChange = (index, field, value) => { 
              const newRanges = [...ranges]; 
              newRanges[index] = { ...newRanges[index], [field]: value }; 
              setRanges(newRanges); 
            };

            const handleGenerate = () => {
              if (!teamId) return fireAlert('Gagal', 'Pilih tim penerima.', 'error');
              if (conflictError) return;
              setIsGenerating(true);
              
              setTimeout(() => {
                try {
                  const existingNums = new Set(documents.filter(d => d.teamId === teamId).map(d => d.number));
                  let newDocs = [];
                  for (const range of ranges) {
                    const from = parseInt(range.from); const to = parseInt(range.to);
                    if (isNaN(from) || isNaN(to) || from > to) continue;
                    for (let i = from; i <= to; i++) {
                      const numStr = i.toString();
                      if (!existingNums.has(numStr)) {
                        newDocs.push({ id: generateId(), batchId: null, teamId, number: numStr, status: 'DI_ADMIN' });
                        existingNums.add(numStr);
                      }
                    }
                  }

                  if (newDocs.length === 0) return fireAlert('Gagal', 'Rentang tidak valid / sudah di laci.', 'error');
                  setDocuments(prev => [...prev, ...newDocs]);
                  fireAlert('Sukses', `${newDocs.length} lembar ditambah ke laci.`, 'success');
                  setTeamId(''); setRanges([{ from: '', to: '' }]);
                } finally { setIsGenerating(false); }
              }, 300);
            };

            return (
              <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                <div className="flex items-center gap-4 mb-8">
                    <div className="p-3 bg-white rounded-2xl shadow-sm border border-slate-100"><Archive className="text-amber-600" size={28}/></div>
                    <div>
                      <h2 className="text-3xl font-black text-slate-800 tracking-tight">Tambah Stok Laci</h2>
                      <p className="text-slate-500 font-medium mt-1">Masukkan dokumen BTPA baru langsung ke gudang (Laci Admin) tanpa kandang.</p>
                    </div>
                </div>

                <div className="bg-white p-6 md:p-10 rounded-[2rem] shadow-sm border border-slate-200/60 space-y-8">
                  <div>
                      <label className="block text-sm font-bold text-slate-700 mb-3 uppercase tracking-wider">Kepemilikan Stok (Tim)</label>
                      <select className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-semibold text-lg text-slate-700 appearance-none cursor-pointer outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition-all" value={teamId} onChange={(e) => setTeamId(e.target.value)}>
                        <option value="">-- Pilih Tim Pelaksana --</option>
                        {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                  </div>
                  <div className="space-y-4">
                      {ranges.map((range, idx) => {
                        const fromVal = parseInt(range.from); const toVal = parseInt(range.to);
                        const rangeCount = (!isNaN(fromVal) && !isNaN(toVal) && fromVal <= toVal) ? (toVal - fromVal + 1) : 0;
                        return (
                          <div key={idx} className="flex flex-col md:flex-row items-start md:items-center gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200/60 transition-all hover:border-brand-200">
                            <div className="w-full md:flex-1">
                              <label className="block text-[10px] font-black uppercase mb-2 text-slate-400">Mulai Nomor</label>
                              <input type="number" placeholder="1001" className="w-full px-5 py-3 bg-white border border-slate-200 rounded-xl font-mono font-black tracking-widest text-xl text-slate-800 placeholder:text-slate-300 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none transition-all" value={range.from} onChange={(e) => handleRangeChange(idx, 'from', e.target.value)} />
                            </div>
                            <div className="hidden md:block font-black text-3xl text-slate-300">-</div>
                            <div className="w-full md:flex-1">
                              <label className="block text-[10px] font-black uppercase mb-2 text-slate-400">Sampai Nomor</label>
                              <input type="number" placeholder="1005" className="w-full px-5 py-3 bg-white border border-slate-200 rounded-xl font-mono font-black tracking-widest text-xl text-slate-800 placeholder:text-slate-300 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none transition-all" value={range.to} onChange={(e) => handleRangeChange(idx, 'to', e.target.value)} />
                            </div>
                            <div className="w-full md:w-auto flex items-center justify-between gap-3 mt-2 md:mt-6 shrink-0">
                              {rangeCount > 0 ? <span className="bg-brand-100/50 text-brand-700 font-black text-sm px-4 py-3 rounded-xl border border-brand-200">{rangeCount} Lembar</span> : <span className="text-slate-400 px-4 py-3 text-sm font-medium">0 Lembar</span>}
                              <button type="button" onClick={() => handleRemoveRange(idx)} disabled={ranges.length === 1} className="p-3 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl disabled:opacity-30 transition-all"><Trash2 size={22}/></button>
                            </div>
                          </div>
                        )
                      })}
                      <button type="button" onClick={handleAddRange} className="w-full md:w-auto px-6 py-4 border-2 border-dashed border-brand-200 text-brand-600 font-bold rounded-2xl flex items-center justify-center gap-2 hover:bg-brand-50 transition-all"><PlusCircle size={20}/> Tambah Baris Input</button>
                  </div>

                  {conflictError && (
                    <div className="bg-red-50 border border-red-200 p-6 rounded-2xl flex items-start gap-4 animate-in slide-in-from-top-2 duration-300">
                      <AlertTriangle size={24} className="text-red-600 mt-1"/>
                      <div>
                          <h4 className="text-red-800 font-black text-lg tracking-tight">Bentrok Lintas Tim!</h4>
                          <p className="text-red-600 font-medium text-sm mt-1">Nomor <strong className="font-mono bg-red-200 px-1.5 rounded">#{conflictError.number}</strong> dimiliki oleh: <strong>{conflictError.owner}</strong></p>
                      </div>
                    </div>
                  )}

                  {totalGeneratedDocs > 0 && !conflictError && (
                      <div className="bg-slate-800 p-6 md:p-8 rounded-3xl text-white flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl shadow-slate-800/20">
                        <div>
                          <p className="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-1">Total Dokumen Baru</p>
                          <p className="text-4xl font-black tracking-tight">{totalGeneratedDocs} <span className="text-base font-bold text-slate-400">Lembar</span></p>
                        </div>
                        <button type="button" onClick={handleGenerate} disabled={isGenerating || !teamId} className="w-full md:w-auto px-10 py-5 bg-brand-500 hover:bg-brand-600 font-black rounded-2xl flex justify-center items-center gap-2 transition-all active:scale-95 disabled:opacity-50">
                          {isGenerating ? <RefreshCw className="animate-spin"/> : <Archive size={20}/>} Simpan ke Laci
                        </button>
                      </div>
                  )}
                  
                  {previewNumbers.length > 0 && !conflictError && (
                      <div className="bg-slate-50 border border-slate-200/60 rounded-2xl p-6">
                          <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Preview Nomor (Otomatis)</p>
                          <div className="flex flex-wrap gap-2">
                            {previewNumbers.map(n => <span key={n} className="bg-white border border-slate-200 px-3 py-1.5 rounded-lg text-sm font-mono font-bold text-slate-600 shadow-sm">#{n}</span>)}
                            {totalGeneratedDocs > 100 && <span className="bg-slate-200 px-3 py-1.5 rounded-lg text-sm font-bold text-slate-600">+{totalGeneratedDocs - 100} lainnya...</span>}
                          </div>
                      </div>
                  )}
                </div>
              </div>
            );
          };

          // ==========================================
          // 6. CHICK IN VIEW (Dengan Smart Click-to-Fill)
          // ==========================================
          const ChickInView = ({ teams, batches, setBatches, documents, setDocuments, fireAlert, addToast }) => {
            const [formData, setFormData] = useState({ teamId: '', date: '', name: '', population: '' });
            const [ranges, setRanges] = useState([{ from: '', to: '' }]);
            const [isGenerating, setIsGenerating] = useState(false);
            const [activeInput, setActiveInput] = useState({ index: 0, field: 'from' }); // State Cerdas

            const populationNum = parseInt(formData.population) || 0;
            const estimatedDocs = Math.ceil(populationNum / 1000);

            const drawerDocsAnalysis = useMemo(() => {
              if (!formData.teamId) return { docs: [], groups: [] };
              const dDocs = documents.filter(d => d.teamId === formData.teamId && d.status === 'DI_ADMIN').sort((a,b) => parseInt(a.number) - parseInt(b.number));
              
              let groups = [];
              if (dDocs.length > 0) {
                let currentGroup = [dDocs[0]];
                for (let i = 1; i < dDocs.length; i++) {
                  if (parseInt(dDocs[i].number) === parseInt(dDocs[i-1].number) + 1) {
                    currentGroup.push(dDocs[i]);
                  } else {
                    if (currentGroup.length > 1) groups.push([...currentGroup]);
                    currentGroup = [dDocs[i]];
                  }
                }
                if (currentGroup.length > 1) groups.push(currentGroup);
              }
              return { docs: dDocs, groups };
            }, [documents, formData.teamId]);

            const usedDrawerDocs = useMemo(() => {
              const used = new Set();
              drawerDocsAnalysis.docs.forEach(doc => {
                const num = parseInt(doc.number);
                const isUsed = ranges.some(r => {
                  const f = parseInt(r.from); const t = parseInt(r.to);
                  if (!isNaN(f) && !isNaN(t)) return num >= f && num <= t;
                  if (!isNaN(f) && isNaN(t)) return num === f;
                  if (isNaN(f) && !isNaN(t)) return num === t;
                  return false;
                });
                if (isUsed) used.add(doc.id);
              });
              return used;
            }, [ranges, drawerDocsAnalysis.docs]);

            const totalGeneratedDocs = ranges.reduce((acc, range) => {
              const from = parseInt(range.from); const to = parseInt(range.to);
              if (!isNaN(from) && !isNaN(to) && from <= to) return acc + (to - from + 1);
              return acc;
            }, 0);

            const previewNumbers = useMemo(() => {
              let nums = [];
              for (const range of ranges) {
                const from = parseInt(range.from); const to = parseInt(range.to);
                if (!isNaN(from) && !isNaN(to) && from <= to) {
                  for (let i = from; i <= to; i++) { nums.push(i.toString()); if(nums.length >= 100) break; }
                }
                if(nums.length >= 100) break;
              }
              return nums;
            }, [ranges]);

            const conflictError = useMemo(() => {
              if (!formData.teamId) return null;
              const docsMap = new Map();
              documents.forEach(d => docsMap.set(d.number, d));

              for (const range of ranges) {
                const from = parseInt(range.from); const to = parseInt(range.to);
                if (isNaN(from) || isNaN(to) || from > to) continue;
                if (to - from > 10000) return { number: '> 10000 limit', owner: 'Sistem' };

                for (let i = from; i <= to; i++) {
                  const numStr = i.toString();
                  const existing = docsMap.get(numStr);
                  if (existing && existing.teamId !== formData.teamId) {
                    const ownerTeam = teams.find(t => t.id === existing.teamId)?.name || 'Tim Lain';
                    return { number: numStr, owner: ownerTeam };
                  }
                }
              }
              return null;
            }, [ranges, documents, formData.teamId, teams]);

            const handleAddRange = () => setRanges([...ranges, { from: '', to: '' }]);
            const handleRemoveRange = (index) => { if (ranges.length > 1) setRanges(ranges.filter((_, i) => i !== index)); };
            const handleRangeChange = (index, field, value) => { 
              const newRanges = [...ranges]; 
              newRanges[index] = { ...newRanges[index], [field]: value }; 
              setRanges(newRanges); 
            };

            // Fungsi Click-to-Fill Cerdas
            const injectRange = (fromStr, toStr) => {
              const newRanges = [...ranges];
              if (fromStr === toStr) {
                newRanges[activeInput.index][activeInput.field] = fromStr;
                setRanges(newRanges);
                // Auto lompat ke kolom 'Sampai Nomor'
                if (activeInput.field === 'from') setActiveInput({ index: activeInput.index, field: 'to' });
              } else {
                newRanges[activeInput.index].from = fromStr;
                newRanges[activeInput.index].to = toStr;
                setRanges(newRanges);
              }
            };

            const handleGenerate = () => {
              if (!formData.teamId || !formData.date || !formData.name || !formData.population) return fireAlert('Validasi Gagal', 'Lengkapi seluruh data kandang (Kiri) terlebih dahulu!', 'error');
              if (conflictError) return;
              if (totalGeneratedDocs === 0) return fireAlert('Data Kosong', 'Rentang nomor BTPA belum diisi dengan benar.', 'error');
              
              setIsGenerating(true);
              setTimeout(() => {
                try {
                  const batchId = generateId();
                  let numbersToGenerate = new Set();
                  for (const range of ranges) {
                    const from = parseInt(range.from); const to = parseInt(range.to);
                    if (isNaN(from) || isNaN(to) || from > to) continue;
                    for (let i = from; i <= to; i++) numbersToGenerate.add(i.toString());
                  }

                  const updatedDocs = documents.map(d => {
                    if (d.status === 'DI_ADMIN' && d.teamId === formData.teamId && numbersToGenerate.has(d.number)) {
                        numbersToGenerate.delete(d.number);
                        return { ...d, batchId, status: 'DIALOKASIKAN' };
                    }
                    return d;
                  });

                  numbersToGenerate.forEach(num => {
                      updatedDocs.push({ id: generateId(), batchId, teamId: formData.teamId, number: num, status: 'DIALOKASIKAN' });
                  });

                  setBatches([...batches, { id: batchId, teamId: formData.teamId, date: formData.date, name: formData.name, population: populationNum, status: 'AKTIF' }]);
                  setDocuments(updatedDocs);
                  
                  fireAlert('Chick-in Berhasil!', `Kandang ${formData.name} berhasil didaftarkan. ${totalGeneratedDocs} dokumen BTPA telah dialokasikan dan siap beredar di lapangan.`, 'success');
                  setFormData({ teamId: '', date: '', name: '', population: '' });
                  setRanges([{ from: '', to: '' }]); 
                  setActiveInput({index: 0, field: 'from'});
                } finally { setIsGenerating(false); }
              }, 300);
            };

            return (
              <div className="p-4 md:p-8 max-w-7xl mx-auto flex flex-col lg:flex-row gap-8 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                {/* Panel Kiri: Form Kandang */}
                <div className="w-full lg:w-[340px] shrink-0 space-y-6">
                    <div className="flex items-center gap-4 mb-6">
                      <div className="w-14 h-14 bg-gradient-to-br from-brand-100 to-orange-100 text-brand-600 rounded-2xl flex items-center justify-center shadow-inner"><PlusCircle size={28}/></div>
                      <div>
                        <h2 className="text-2xl font-black text-slate-800 tracking-tight">1. Data Kandang</h2>
                        <p className="text-slate-500 font-medium text-sm mt-0.5">Informasi siklus panen.</p>
                      </div>
                    </div>

                  <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-200/60 space-y-6">
                    <div className="space-y-2">
                      <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Tim Pelaksana</label>
                      <select className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-slate-700 text-lg appearance-none cursor-pointer" value={formData.teamId} onChange={(e) => {setFormData({...formData, teamId: e.target.value}); setRanges([{from:'', to:''}]); setActiveInput({index: 0, field: 'from'});}}>
                        <option value="">-- Pilih Tim --</option>
                        {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                    </div>
                    <div className="space-y-2">
                      <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Tanggal Chick-in</label>
                      <input type="date" className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-slate-700 text-lg" value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} />
                    </div>
                    <div className="space-y-2">
                      <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Nama Kandang</label>
                      <input type="text" placeholder="Contoh: Kandang A1" className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-slate-700 text-lg" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} />
                    </div>
                    <div className="space-y-2">
                      <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Populasi Ayam</label>
                      <input type="number" placeholder="Contoh: 5000" className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-slate-700 text-lg" value={formData.population} onChange={(e) => setFormData({...formData, population: e.target.value})} />
                    </div>

                    <div className="bg-sky-50 border border-sky-100 p-6 rounded-2xl flex justify-between items-center mt-8">
                        <div>
                          <p className="text-[10px] font-black text-sky-600/80 uppercase tracking-widest mb-1">Estimasi Dokumen</p>
                          <p className="text-3xl font-black text-sky-700 tracking-tight">{estimatedDocs} <span className="text-base font-bold opacity-70">lembar</span></p>
                        </div>
                        <div className="w-12 h-12 bg-sky-100 rounded-xl flex items-center justify-center text-sky-500"><BarChart3 size={24}/></div>
                    </div>
                  </div>
                </div>

                {/* Panel Kanan: Alokasi */}
                <div className="flex-1 space-y-6">
                    <div className="flex items-center gap-4 mb-6">
                      <div className="w-14 h-14 bg-gradient-to-br from-brand-100 to-orange-100 text-brand-600 rounded-2xl flex items-center justify-center shadow-inner"><FileText size={28}/></div>
                      <div>
                        <h2 className="text-2xl font-black text-slate-800 tracking-tight">2. Alokasi BTPA</h2>
                        <p className="text-slate-500 font-medium text-sm mt-0.5">Berikan dokumen baru atau daur ulang dari Laci.</p>
                      </div>
                    </div>

                  <div className="bg-white p-6 md:p-10 rounded-[2rem] shadow-sm border border-slate-200/60 space-y-6">
                    
                    {drawerDocsAnalysis.docs.length > 0 && (
                      <div className="bg-amber-50/80 border border-amber-200/60 p-6 rounded-2xl">
                        <h3 className="text-sm font-black text-amber-800 uppercase tracking-widest mb-4 flex items-center gap-2"><Inbox size={18}/> Dokumen di Laci ({drawerDocsAnalysis.docs.length} Lembar)</h3>
                        
                        {drawerDocsAnalysis.groups.length > 0 && (
                          <div className="mb-5">
                              <p className="text-[10px] font-bold text-amber-600/80 uppercase tracking-widest mb-2">Pilih Grup Sekaligus:</p>
                              <div className="flex flex-wrap gap-2.5">
                                  {drawerDocsAnalysis.groups.map((group, idx) => {
                                      const isUsed = usedDrawerDocs.has(group[0].id);
                                      return (
