<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTPA Hub - Enterprise</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { emerald: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' } }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICONS MAPPING ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const iconElement = lucide.createElement(lucide.icons[name]);
                    iconElement.setAttribute('width', size);
                    iconElement.setAttribute('height', size);
                    if(className) iconElement.setAttribute('class', className);
                    iconRef.current.appendChild(iconElement);
                }
            }, [name, size, className]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [activeMenu, setActiveMenu] = useState('chick-in');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [alertConfig, setAlertConfig] = useState({ isOpen: false, title: '', message: '', type: 'success' });
            const [toasts, setToasts] = useState([]);
            
            // Database States
            const [teams, setTeams] = useState([]);
            const [batches, setBatches] = useState([]);
            const [documents, setDocuments] = useState([]);

            // Global Search State
            const [globalSearch, setGlobalSearch] = useState('');
            const [showSearchBox, setShowSearchBox] = useState(false);

            const addToast = (message, type = 'success') => {
                const id = generateId();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };

            const fireAlert = (title, message, type = 'success') => {
                setAlertConfig({ isOpen: true, title, message, type });
            };

            const closeMobileMenu = () => setIsMobileMenuOpen(false);

            // --- GLOBAL SEARCH LOGIC ---
            const searchResults = useMemo(() => {
                if (!globalSearch.trim()) return [];
                const keyword = globalSearch.trim().toLowerCase();
                const matchedDocs = documents.filter(d => d.number.includes(keyword)).slice(0, 10);
                
                return matchedDocs.map(doc => {
                    const team = teams.find(t => t.id === doc.teamId);
                    const batch = batches.find(b => b.id === doc.batchId);
                    return {
                        ...doc,
                        teamName: team ? team.name : 'Unknown Team',
                        batchName: batch ? batch.name : null
                    };
                });
            }, [globalSearch, documents, teams, batches]);

            // --- VIEW: MASTER TIM ---
            const MasterTimView = () => {
                const [pplName, setPplName] = useState('');
                const [penimbangName, setPenimbangName] = useState('');
                const [editModal, setEditModal] = useState({ isOpen: false, id: '', ppl: '', penimbang: '' });

                const handleAddTeam = (e) => {
                    e.preventDefault();
                    if (!pplName.trim() || !penimbangName.trim()) return fireAlert('Validasi Gagal', 'Nama PPL dan Penimbang wajib diisi.', 'error');
                    const combinedName = `${pplName.trim()} - ${penimbangName.trim()}`;
                    if (teams.some(t => t.name.toLowerCase() === combinedName.toLowerCase())) return fireAlert('Duplikat', 'Kombinasi tim ini sudah ada!', 'error');
                    setTeams([...teams, { id: generateId(), name: combinedName, ppl: pplName.trim(), penimbang: penimbangName.trim() }]);
                    setPplName(''); setPenimbangName(''); addToast(`Tim ditambahkan!`, 'success');
                };

                const handleDeleteTeam = (id) => {
                    if (batches.some(b => b.teamId === id) || documents.some(d => d.teamId === id)) return fireAlert('Akses Ditolak', 'Tim ini sedang digunakan pada data lain.', 'error');
                    setTeams(teams.filter(t => t.id !== id)); addToast('Tim dihapus', 'success');
                };

                const handleUpdateTeam = (e) => {
                    e.preventDefault();
                    if (!editModal.ppl.trim() || !editModal.penimbang.trim()) return fireAlert('Validasi Gagal', 'Semua kolom wajib diisi.', 'error');
                    const combinedName = `${editModal.ppl.trim()} - ${editModal.penimbang.trim()}`;
                    setTeams(teams.map(t => t.id === editModal.id ? { ...t, name: combinedName, ppl: editModal.ppl.trim(), penimbang: editModal.penimbang.trim() } : t));
                    setEditModal({ isOpen: false, id: '', ppl: '', penimbang: '' }); addToast('Tim diperbarui!', 'success');
                };

                return (
                    <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6 fade-in">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Master Data Tim</h2>
                            <p className="text-slate-500 text-sm mt-1">Kelola daftar PPL dan Penimbang.</p>
                        </div>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <form onSubmit={handleAddTeam} className="flex flex-col md:flex-row items-center gap-4">
                                <div className="w-full flex-1">
                                    <label className="text-xs font-semibold text-slate-500 uppercase mb-1 block">Nama PPL</label>
                                    <input type="text" value={pplName} onChange={e => setPplName(e.target.value)} placeholder="Nama PPL..." className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm" />
                                </div>
                                <div className="hidden md:block text-slate-300 font-bold mt-4">-</div>
                                <div className="w-full flex-1">
                                    <label className="text-xs font-semibold text-slate-500 uppercase mb-1 block">Nama Penimbang</label>
                                    <input type="text" value={penimbangName} onChange={e => setPenimbangName(e.target.value)} placeholder="Nama Penimbang..." className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm" />
                                </div>
                                <div className="w-full md:w-auto mt-2 md:mt-5">
                                    <button type="submit" className="w-full bg-slate-800 text-white px-6 py-3 rounded-xl hover:bg-slate-900 font-bold transition-all text-sm flex items-center justify-center gap-2"><Icon name="PlusCircle" size={18}/> Tambah</button>
                                </div>
                            </form>
                            {(pplName || penimbangName) && (
                                <div className="mt-4 p-3 bg-emerald-50 border border-emerald-100 rounded-lg text-sm flex items-center gap-2">
                                    <span className="text-emerald-600 font-semibold uppercase text-xs">Preview Tim: </span>
                                    <strong className="text-slate-800 text-base">{pplName || 'PPL'} - {penimbangName || 'Penimbang'}</strong>
                                </div>
                            )}
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto custom-scrollbar">
                            <table className="w-full text-left border-collapse min-w-[500px]">
                                <thead>
                                    <tr className="bg-slate-50/80 border-b border-slate-100 text-slate-500 text-xs uppercase tracking-wider">
                                        <th className="px-6 py-4 font-semibold">Nama Tim</th>
                                        <th className="px-6 py-4 font-semibold">Struktur</th>
                                        <th className="px-6 py-4 font-semibold text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {teams.length === 0 ? (
                                        <tr><td colSpan="3" className="px-6 py-10 text-center text-slate-400">Belum ada tim terdaftar.</td></tr>
                                    ) : teams.map(team => (
                                        <tr key={team.id} className="hover:bg-slate-50 transition-colors group">
                                            <td className="px-6 py-4 font-bold text-slate-700">{team.name}</td>
                                            <td className="px-6 py-4">
                                                <div className="flex gap-2">
                                                    <span className="text-[10px] bg-sky-50 text-sky-700 px-2 py-1 rounded-md border border-sky-100 font-semibold flex items-center gap-1"><Icon name="Briefcase" size={10}/> PPL: {team.ppl}</span>
                                                    <span className="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-1 rounded-md border border-indigo-100 font-semibold flex items-center gap-1"><Icon name="UserCheck" size={10}/> P: {team.penimbang}</span>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 text-right">
                                                <button onClick={() => setEditModal({ isOpen: true, ...team })} className="text-slate-400 hover:text-indigo-600 p-2 opacity-0 group-hover:opacity-100 transition-all"><Icon name="Edit" size={18} /></button>
                                                <button onClick={() => handleDeleteTeam(team.id)} className="text-slate-400 hover:text-red-600 p-2 opacity-0 group-hover:opacity-100 transition-all"><Icon name="Trash2" size={18} /></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        {/* Edit Modal */}
                        {editModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4 fade-in">
                                <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2"><Icon name="Edit" size={20} className="text-indigo-600"/> Edit Tim</h3>
                                        <button onClick={() => setEditModal({isOpen:false})} className="text-slate-400 hover:text-slate-700"><Icon name="X" size={20}/></button>
                                    </div>
                                    <form onSubmit={handleUpdateTeam} className="space-y-4">
                                        <div>
                                            <label className="text-xs font-semibold text-slate-500 block mb-1">Nama PPL</label>
                                            <input type="text" value={editModal.ppl} onChange={e => setEditModal({...editModal, ppl: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-semibold text-slate-500 block mb-1">Nama Penimbang</label>
                                            <input type="text" value={editModal.penimbang} onChange={e => setEditModal({...editModal, penimbang: e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
                                        </div>
                                        <div className="flex gap-3 justify-end mt-6">
                                            <button type="button" onClick={() => setEditModal({isOpen:false})} className="px-5 py-2.5 text-slate-600 bg-slate-100 rounded-xl font-semibold hover:bg-slate-200">Batal</button>
                                            <button type="submit" className="px-5 py-2.5 text-white bg-indigo-600 rounded-xl font-bold shadow-md hover:bg-indigo-700">Simpan Perubahan</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // --- VIEW: DATABASE BACKUP ---
            const DatabaseView = () => {
                const fileInputRef = useRef(null);
                const [restoreModal, setRestoreModal] = useState({ isOpen: false, data: null });
                const [resetModal, setResetModal] = useState({ isOpen: false, keyword: '' });

                const handleBackup = () => {
                    const data = { version: '2.0', timestamp: new Date().toISOString(), teams, batches, documents };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = `backup_btpa.json`;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                    addToast('File backup diunduh!', 'success');
                };

                const handleFileChange = (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if (data.teams && data.batches && data.documents) {
                                setRestoreModal({ isOpen: true, data: data });
                            } else { fireAlert('Format Salah', 'File backup tidak valid.', 'error'); }
                        } catch (error) { fireAlert('Error', 'Gagal membaca file JSON.', 'error'); }
                    };
                    reader.readAsText(file); e.target.value = null;
                };

                return (
                    <div className="p-4 md:p-8 max-w-4xl mx-auto space-y-6 fade-in">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Backup & Restore</h2>
                            <p className="text-slate-500 text-sm mt-1">Amankan data sistem atau pulihkan dari file cadangan.</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center">
                                <div className="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="Download" size={32}/></div>
                                <h3 className="font-bold text-lg mb-1">Backup Data</h3>
                                <p className="text-sm text-slate-500 mb-6">Unduh data ke komputer format .json.</p>
                                <button onClick={handleBackup} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-emerald-700">Unduh File</button>
                            </div>
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center">
                                <div className="w-16 h-16 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="Upload" size={32}/></div>
                                <h3 className="font-bold text-lg mb-1">Restore Data</h3>
                                <p className="text-sm text-slate-500 mb-6">Pulihkan dari file. Akan menimpa data.</p>
                                <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileChange} className="hidden" />
                                <button onClick={() => fileInputRef.current?.click()} className="w-full bg-amber-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-amber-700">Pilih File</button>
                            </div>
                        </div>

                        <div className="mt-8 bg-red-50 p-6 rounded-2xl border border-red-200 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h3 className="font-bold text-red-800 flex items-center gap-2"><Icon name="AlertTriangle" size={20}/> Reset Sistem</h3>
                                <p className="text-xs text-red-600 mt-1">Hapus seluruh data secara permanen.</p>
                            </div>
                            <button onClick={() => setResetModal({isOpen: true, keyword:''})} className="w-full md:w-auto bg-red-800 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-md hover:bg-red-900 whitespace-nowrap">Kosongkan Data</button>
                        </div>

                        {/* Modals Custom for DB */}
                        {restoreModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[100] p-4 fade-in">
                                <div className="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-xl">
                                    <div className="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="AlertTriangle" size={32} /></div>
                                    <h3 className="text-xl font-bold mb-2 text-slate-800">Timpa Data?</h3>
                                    <p className="text-sm text-slate-500 mb-6">Seluruh data saat ini akan terhapus dan diganti dengan data dari file backup.</p>
                                    <div className="flex gap-3">
                                        <button onClick={() => setRestoreModal({isOpen:false})} className="flex-1 py-3 bg-slate-100 font-bold rounded-xl text-slate-600">Batal</button>
                                        <button onClick={() => { setTeams(restoreModal.data.teams); setBatches(restoreModal.data.batches); setDocuments(restoreModal.data.documents); setRestoreModal({isOpen:false}); addToast('Data berhasil dipulihkan', 'success'); }} className="flex-1 py-3 bg-amber-500 text-white font-bold rounded-xl shadow-md">Ya, Pulihkan</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {resetModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[100] p-4 fade-in">
                                <div className="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-xl border-t-4 border-red-600">
                                    <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="Trash2" size={32} /></div>
                                    <h3 className="text-xl font-bold mb-2 text-slate-800">Hapus Permanen?</h3>
                                    <p className="text-sm text-slate-500 mb-4">Ketik <strong className="text-red-600">HAPUS</strong> untuk setuju mengosongkan seluruh data.</p>
                                    <input type="text" value={resetModal.keyword} onChange={e => setResetModal({...resetModal, keyword: e.target.value.toUpperCase()})} className="w-full border-2 border-red-200 rounded-xl p-3 text-center font-bold tracking-widest mb-6 focus:outline-none focus:border-red-500" placeholder="Ketik HAPUS..." />
                                    <div className="flex gap-3">
                                        <button onClick={() => setResetModal({isOpen:false})} className="flex-1 py-3 bg-slate-100 font-bold rounded-xl text-slate-600">Batal</button>
                                        <button onClick={() => { if(resetModal.keyword==='HAPUS') { setTeams([]); setBatches([]); setDocuments([]); setResetModal({isOpen:false}); addToast('Sistem di-reset', 'success'); } else { fireAlert('Gagal','Kata kunci salah','error') } }} className="flex-1 py-3 bg-red-600 text-white font-bold rounded-xl shadow-md disabled:opacity-50" disabled={resetModal.keyword!=='HAPUS'}>Reset Total</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // --- VIEW: INPUT LACI ADMIN ---
            const InputLaciView = () => {
                const [teamId, setTeamId] = useState('');
                const [ranges, setRanges] = useState([{ from: '', to: '' }]);
                const [previewNumbers, setPreviewNumbers] = useState([]);

                useEffect(() => {
                    let nums = [];
                    for (const r of ranges) {
                        const f = parseInt(r.from); const t = parseInt(r.to);
                        if (!isNaN(f) && !isNaN(t) && f <= t) {
                            for (let i = f; i <= t; i++) { nums.push(i.toString()); if(nums.length >= 100) break; }
                        }
                        if(nums.length >= 100) break;
                    }
                    setPreviewNumbers(nums);
                }, [ranges]);

                const conflictError = useMemo(() => {
                    if (!teamId) return null;
                    for (const r of ranges) {
                        const f = parseInt(r.from); const t = parseInt(r.to);
                        if (isNaN(f) || isNaN(t) || f > t) continue;
                        for (let i = f; i <= t; i++) {
                            const exist = documents.find(d => d.number === i.toString());
                            if (exist && exist.teamId !== teamId) return { number: i.toString(), owner: teams.find(x=>x.id===exist.teamId)?.name || 'Tim Lain' };
                        }
                    }
                    return null;
                }, [ranges, documents, teamId, teams]);

                const totalDocs = ranges.reduce((acc, r) => {
                    const f = parseInt(r.from); const t = parseInt(r.to);
                    if (!isNaN(f) && !isNaN(t) && f <= t) return acc + (t - f + 1);
                    return acc;
                }, 0);

                const handleSave = () => {
                    if (!teamId) return fireAlert('Gagal', 'Pilih tim penerima stok laci!', 'error');
                    if (conflictError) return;
                    
                    let newDocs = [];
                    for (const r of ranges) {
                        const f = parseInt(r.from); const t = parseInt(r.to);
                        if (isNaN(f) || isNaN(t) || f > t) continue;
                        for (let i = f; i <= t; i++) {
                            const num = i.toString();
                            if (!documents.some(d => d.number === num && d.teamId === teamId)) {
                                newDocs.push({ id: generateId(), batchId: null, teamId, number: num, status: 'DI_ADMIN' });
                            }
                        }
                    }
                    if(newDocs.length === 0) return fireAlert('Gagal', 'Nomor tidak valid / sudah ada di laci tim ini.', 'error');
                    setDocuments([...documents, ...newDocs]);
                    fireAlert('Sukses', `${newDocs.length} dokumen dimasukkan ke Laci.`, 'success');
                    setRanges([{from:'', to:''}]); setTeamId('');
                };

                return (
                    <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6 fade-in">
                        <div><h2 className="text-2xl font-bold text-slate-800">Tambah Stok Laci</h2><p className="text-sm text-slate-500 mt-1">Masukkan dokumen BTPA baru langsung ke gudang tanpa kandang.</p></div>
                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Tim Pemilik Stok Laci</label>
                                <select className="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none font-semibold text-slate-700" value={teamId} onChange={e => setTeamId(e.target.value)}>
                                    <option value="">-- Pilih Tim --</option>
                                    {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                </select>
                            </div>
                            <div className="space-y-3">
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Rentang Nomor</label>
                                {ranges.map((r, idx) => (
                                    <div key={idx} className="flex flex-col md:flex-row gap-3 bg-slate-50/50 p-4 rounded-xl border border-slate-200">
                                        <div className="flex-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Mulai Nomor</label>
                                            <input type="number" placeholder="Contoh: 1001" value={r.from} onChange={e => {const n=[...ranges]; n[idx].from=e.target.value; setRanges(n)}} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none font-mono text-lg font-bold tracking-widest text-slate-700" />
                                        </div>
                                        <div className="hidden md:block text-slate-300 font-bold text-xl mt-6">-</div>
                                        <div className="flex-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Sampai Nomor</label>
                                            <input type="number" placeholder="Contoh: 1050" value={r.to} onChange={e => {const n=[...ranges]; n[idx].to=e.target.value; setRanges(n)}} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none font-mono text-lg font-bold tracking-widest text-slate-700" />
                                        </div>
                                        <div className="w-full md:w-auto flex items-center justify-between md:justify-end gap-3 mt-2 md:mt-6">
                                            {r.from && r.to && !isNaN(r.from) && !isNaN(r.to) && parseInt(r.to) >= parseInt(r.from) ? 
                                                <span className="bg-amber-100 text-amber-700 px-3 py-2 rounded-lg text-xs font-bold border border-amber-200">{parseInt(r.to) - parseInt(r.from) + 1} Lembar</span> : 
                                                <span className="text-xs text-slate-400 px-3 py-2">0 Lembar</span>
                                            }
                                            <button onClick={() => setRanges(ranges.filter((_,i)=>i!==idx))} disabled={ranges.length===1} className="p-3 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl disabled:opacity-30 transition-all"><Icon name="Trash2" size={20}/></button>
                                        </div>
                                    </div>
                                ))}
                                <button onClick={()=>setRanges([...ranges, {from:'',to:''}])} className="mt-2 w-full md:w-auto px-6 py-3 border-2 border-dashed border-amber-200 text-amber-600 font-bold rounded-xl hover:bg-amber-50 transition-all flex items-center justify-center gap-2 text-sm"><Icon name="PlusCircle" size={18}/> Tambah Baris Rentang Lainnya</button>
                            </div>
                            
                            {conflictError && (
                                <div className="p-5 bg-red-50 border border-red-200 rounded-xl flex items-start gap-3">
                                    <Icon name="AlertTriangle" size={24} className="text-red-600 mt-1 shrink-0"/>
                                    <div>
                                        <p className="text-red-800 font-bold text-lg">Akses Ditolak Lintas Tim!</p>
                                        <p className="text-red-600 text-sm mt-1">Nomor <strong className="font-mono bg-red-200 px-1 rounded">#{conflictError.number}</strong> sudah dipakai oleh <strong className="uppercase bg-red-600 text-white px-2 py-0.5 rounded text-xs ml-1">{conflictError.owner}</strong></p>
                                    </div>
                                </div>
                            )}

                            {previewNumbers.length > 0 && !conflictError && (
                                <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Preview (Live)</p>
                                    <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar">
                                        {previewNumbers.map(n => <span key={n} className="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm font-mono font-semibold text-slate-600 shadow-sm">#{n}</span>)}
                                        {totalDocs > 100 && <span className="px-3 py-1.5 bg-slate-200 rounded-lg text-sm font-bold text-slate-600">+{totalDocs - 100} lainnya...</span>}
                                    </div>
                                </div>
                            )}

                            <div className="pt-6 border-t border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="text-center md:text-left">
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Total Generate</p>
                                    <p className="text-3xl font-black text-slate-800">{totalDocs} <span className="text-sm font-semibold text-slate-500">Lembar</span></p>
                                </div>
                                <button onClick={handleSave} disabled={!!conflictError || totalDocs===0} className="w-full md:w-auto bg-amber-500 text-white px-10 py-4 rounded-xl font-bold shadow-lg shadow-amber-200 disabled:opacity-50 hover:bg-amber-600 transition-all flex items-center justify-center gap-2"><Icon name="Archive" size={20}/> Simpan ke Laci</button>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- VIEW: CHICK IN (Input Kandang & Alokasi) ---
            const ChickInView = () => {
                const [formData, setFormData] = useState({ teamId: '', date: '', name: '', population: '' });
                const [ranges, setRanges] = useState([{ from: '', to: '' }]);
                const [previewNumbers, setPreviewNumbers] = useState([]);
                const [clickedLaciItems, setClickedLaciItems] = useState(new Set()); // Track items moved to ranges

                const estimatedDocs = Math.ceil((parseInt(formData.population)||0) / 1000);
                
                // Fetch drawer/penimbang docs safely
                const availableDocs = useMemo(() => {
                    if(!formData.teamId || documents.length === 0) return { adminDocs: [], adminGroups: [], penimDocs: [], penimGroups: [] };
                    
                    const tDocs = documents.filter(d => d.teamId === formData.teamId).sort((a,b)=>parseInt(a.number)-parseInt(b.number));
                    const aDocs = tDocs.filter(d => d.status === 'DI_ADMIN');
                    const pDocs = tDocs.filter(d => d.status === 'DI_PENIMBANG');

                    const groupDocs = (docArray) => {
                        let groups = [];
                        if(docArray && docArray.length > 0) {
                            let curr = [docArray[0]];
                            for(let i=1; i<docArray.length; i++) {
                                if(parseInt(docArray[i].number) === parseInt(docArray[i-1].number)+1) curr.push(docArray[i]);
                                else { if(curr.length > 1) groups.push(curr); curr = [docArray[i]]; }
                            }
                            if(curr.length > 1) groups.push(curr);
                        }
                        return groups;
                    };
                    
                    return { 
                        adminDocs: aDocs, adminGroups: groupDocs(aDocs), 
                        penimDocs: pDocs, penimGroups: groupDocs(pDocs) 
                    };
                }, [documents, formData.teamId]);

                useEffect(() => {
                    let nums = [];
                    for(const r of ranges) {
                        const f = parseInt(r.from); const t = parseInt(r.to);
                        if(!isNaN(f) && !isNaN(t) && f<=t) {
                            for(let i=f; i<=t; i++) { nums.push(i.toString()); if(nums.length>=100) break; }
                        }
                        if(nums.length>=100) break;
                    }
                    setPreviewNumbers(nums);
                }, [ranges]);

                const conflictError = useMemo(() => {
                    if (!formData.teamId) return null;
                    for (const r of ranges) {
                        const f = parseInt(r.from); const t = parseInt(r.to);
                        if (isNaN(f) || isNaN(t) || f > t) continue;
                        for (let i = f; i <= t; i++) {
                            const exist = documents.find(d => d.number === i.toString());
                            if (exist && exist.teamId !== formData.teamId) return { number: i.toString(), owner: teams.find(x=>x.id===exist.teamId)?.name || 'Tim Lain' };
                            if (exist && exist.status === 'DIALOKASIKAN') return { number: i.toString(), owner: 'Kandang Lain (Aktif)' };
                        }
                    }
                    return null;
                }, [ranges, documents, formData.teamId, teams]);

                const totalDocs = ranges.reduce((acc, r) => {
                    const f = parseInt(r.from); const t = parseInt(r.to);
                    if (!isNaN(f) && !isNaN(t) && f <= t) return acc + (t - f + 1);
                    return acc;
                }, 0);

                const handleLaciClick = (fromNum, toNum, idKey) => {
                    if(clickedLaciItems.has(idKey)) return;
                    const newRanges = [...ranges];
                    let added = false;
                    for(let i=0; i<newRanges.length; i++){
                        if(!newRanges[i].from && !newRanges[i].to) {
                            newRanges[i] = {from: fromNum, to: toNum}; added=true; break;
                        }
                    }
                    if(!added) newRanges.push({from: fromNum, to: toNum});
                    setRanges(newRanges);
                    const newClicked = new Set(clickedLaciItems);
                    newClicked.add(idKey);
                    setClickedLaciItems(newClicked);
                };

                const handleGenerate = () => {
                    if(!formData.teamId || !formData.date || !formData.name || !formData.population) return fireAlert('Validasi Gagal', 'Lengkapi seluruh data kandang di panel kiri!', 'error');
                    if(conflictError || totalDocs===0) return;
                    
                    const batchId = generateId();
                    const newBatch = { id: batchId, ...formData, status: 'AKTIF' };
                    
                    let newDocs = [...documents];
                    for (const r of ranges) {
                        const f = parseInt(r.from); const t = parseInt(r.to);
                        if(isNaN(f) || isNaN(t) || f>t) continue;
                        for(let i=f; i<=t; i++) {
                            const num = i.toString();
                            const idx = newDocs.findIndex(d => d.number === num && d.teamId === formData.teamId);
                            if(idx !== -1) newDocs[idx] = { ...newDocs[idx], batchId, status: 'DIALOKASIKAN', penimbangName: null };
                            else newDocs.push({ id: generateId(), batchId, teamId: formData.teamId, number: num, status: 'DIALOKASIKAN' });
                        }
                    }
                    
                    setBatches([...batches, newBatch]);
                    setDocuments(newDocs);
                    fireAlert('Berhasil!', `Kandang ${formData.name} berhasil didaftarkan.\n\n${totalDocs} dokumen BTPA telah dialokasikan dan siap digunakan di lapangan.`, 'success');
                    setFormData({ teamId: '', date: '', name: '', population: '' });
                    setRanges([{from:'', to:''}]);
                    setClickedLaciItems(new Set());
                };

                const renderLaciBox = (title, docs, groups, isPenim = false) => {
                    if(!docs || docs.length === 0) return null;
                    const color = isPenim ? 'indigo' : 'amber';
                    const iconName = isPenim ? 'UserCheck' : 'Inbox';
                    
                    return (
                        <div className={`bg-${color}-50 border border-${color}-200 p-5 rounded-2xl`}>
                            <h3 className={`text-sm font-bold text-${color}-800 mb-3 flex items-center gap-2`}><Icon name={iconName} size={18}/> {title} ({docs.length}):</h3>
                            
                            {groups && groups.length > 0 && (
                                <div className="mb-4">
                                    <p className={`text-[10px] font-bold text-${color}-600 uppercase tracking-widest mb-2`}>Grup (Tambahkan Sekaligus):</p>
                                    <div className="flex flex-wrap gap-2">
                                        {groups.map((g, i) => {
                                            const idKey = `g_${g[0].number}_${g[g.length-1].number}`;
                                            const clicked = clickedLaciItems.has(idKey) || (ranges.some(r => parseInt(r.from) <= parseInt(g[0].number) && parseInt(r.to) >= parseInt(g[g.length-1].number)));
                                            return (
                                                <button key={i} onClick={()=>handleLaciClick(g[0].number, g[g.length-1].number, idKey)} disabled={clicked} className={`px-4 py-2 rounded-xl border-2 font-bold text-sm flex items-center gap-2 transition-all ${clicked ? `bg-${color}-100/50 border-transparent text-${color}-400` : `bg-white border-${color}-300 text-${color}-700 hover:bg-${color}-100 shadow-sm active:scale-95`}`}>
                                                    {clicked ? <Icon name="CheckCircle2" size={16}/> : <Icon name="ListOrdered" size={16}/>} #{g[0].number} - #{g[g.length-1].number}
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>
                            )}
                            
                            <div>
                                <p className={`text-[10px] font-bold text-${color}-600 uppercase tracking-widest mb-2`}>Satuan (Pilih Satu per Satu):</p>
                                <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar">
                                    {docs.map(d => {
                                        const clicked = clickedLaciItems.has(`s_${d.number}`) || (ranges.some(r => parseInt(r.from) <= parseInt(d.number) && parseInt(r.to) >= parseInt(d.number)));
                                        return (
                                            <button key={d.id} onClick={()=>handleLaciClick(d.number, d.number, `s_${d.number}`)} disabled={clicked} className={`px-3 py-1.5 rounded-lg border font-mono font-semibold text-sm transition-all ${clicked ? `bg-${color}-100/50 border-transparent text-${color}-400 flex items-center gap-1` : `bg-white border-${color}-200 text-${color}-700 hover:bg-${color}-100 shadow-sm active:scale-95`}`}>
                                                {clicked && <Icon name="CheckCircle2" size={12}/>} #{d.number}
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    );
                };

                return (
                    <div className="p-4 md:p-8 max-w-7xl mx-auto flex flex-col lg:flex-row gap-8 fade-in">
                        {/* Kiri: Form Kandang */}
                        <div className="w-full lg:w-1/3 shrink-0 space-y-6">
                            <div className="flex items-center gap-4 mb-2">
                                <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center shadow-inner"><Icon name="PlusCircle" size={24}/></div>
                                <div><h2 className="text-xl font-bold text-slate-800">1. Data Kandang</h2><p className="text-xs font-semibold text-slate-500">Informasi siklus panen baru</p></div>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                                <div>
                                    <label className="text-xs font-semibold text-slate-500 mb-1 flex items-center gap-1"><Icon name="Users" size={14}/> Tim Pelaksana</label>
                                    <select className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold text-slate-700" value={formData.teamId} onChange={e => {setFormData({...formData, teamId: e.target.value}); setRanges([{from:'',to:''}]); setClickedLaciItems(new Set());}}>
                                        <option value="">Pilih Tim...</option>
                                        {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-slate-500 mb-1 flex items-center gap-1"><Icon name="Calendar" size={14}/> Tgl Chick-in</label>
                                    <input type="date" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold text-slate-700" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-slate-500 mb-1 flex items-center gap-1"><Icon name="FileText" size={14}/> Nama Kandang</label>
                                    <input type="text" placeholder="Misal: Kandang A1" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold text-slate-700" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-slate-500 mb-1 flex items-center gap-1"><Icon name="Hash" size={14}/> Populasi</label>
                                    <input type="number" placeholder="Misal: 5000" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold text-slate-700" value={formData.population} onChange={e => setFormData({...formData, population: e.target.value})} />
                                </div>
                                <div className="bg-sky-50 border border-sky-100 p-4 rounded-xl flex justify-between items-center">
                                    <div>
                                        <p className="text-[10px] font-bold text-sky-700 uppercase tracking-widest">Estimasi Dokumen</p>
                                        <p className="text-2xl font-black text-sky-600">{estimatedDocs} <span className="text-xs font-semibold">lembar</span></p>
                                    </div>
                                    <Icon name="BarChart3" size={24} className="text-sky-300"/>
                                </div>
                            </div>
                        </div>

                        {/* Kanan: Alokasi */}
                        <div className="flex-1 space-y-6">
                            <div className="flex items-center gap-4 mb-2">
                                <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center shadow-inner"><Icon name="FileText" size={24}/></div>
                                <div><h2 className="text-xl font-bold text-slate-800">2. Alokasi Nomor BTPA</h2><p className="text-xs font-semibold text-slate-500">Rentang dokumen untuk kandang ini</p></div>
                            </div>
                            
                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                                
                                {formData.teamId && (availableDocs.adminDocs.length > 0 || availableDocs.penimDocs.length > 0) && (
                                    <div className="space-y-4 mb-6">
                                        <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest border-b pb-2">Tersedia (Klik untuk memilih)</h3>
                                        {renderLaciBox('Sisa di Laci Admin', availableDocs.adminDocs, availableDocs.adminGroups, false)}
                                        {renderLaciBox('Sedang Dibawa Penimbang', availableDocs.penimDocs, availableDocs.penimGroups, true)}
                                    </div>
                                )}

                                <div className="space-y-4">
                                    <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest">Form Input Rentang</h3>
                                    {ranges.map((r, idx) => {
                                        const fromVal = parseInt(r.from); const toVal = parseInt(r.to);
                                        const rangeCount = (!isNaN(fromVal) && !isNaN(toVal) && fromVal <= toVal) ? (toVal - fromVal + 1) : 0;
                                        return (
                                            <div key={idx} className="flex flex-col xl:flex-row items-start xl:items-end gap-3 md:gap-4 bg-slate-50/50 p-4 md:p-5 rounded-xl border border-slate-200/60 transition-all hover:border-emerald-200">
                                                <div className="w-full xl:flex-1">
                                                    <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Mulai Nomor</label>
                                                    <input type="number" placeholder="1001" value={r.from} onChange={e => {const n=[...ranges]; n[idx].from=e.target.value; setRanges(n)}} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-mono text-lg font-bold tracking-widest text-slate-700 shadow-sm" />
                                                </div>
                                                <div className="hidden xl:block text-slate-300 font-bold text-xl pb-3">-</div>
                                                <div className="w-full xl:flex-1">
                                                    <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Sampai Nomor</label>
                                                    <input type="number" placeholder="1005" value={r.to} onChange={e => {const n=[...ranges]; n[idx].to=e.target.value; setRanges(n)}} className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-mono text-lg font-bold tracking-widest text-slate-700 shadow-sm" />
                                                </div>
                                                <div className="w-full xl:w-auto flex items-center justify-between xl:justify-end gap-3 mt-1 xl:mt-0 pb-1">
                                                    {rangeCount > 0 ? <span className="text-sm font-bold text-emerald-700 bg-emerald-100/50 px-4 py-2.5 rounded-xl border border-emerald-200 whitespace-nowrap shadow-sm">{rangeCount} lembar</span> : <span className="text-sm font-medium text-slate-400 px-4 py-2.5">0 lembar</span>}
                                                    <button onClick={() => setRanges(ranges.filter((_,i)=>i!==idx))} disabled={ranges.length===1} className="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl disabled:opacity-30 transition-colors"><Icon name="Trash2" size={20}/></button>
                                                </div>
                                            </div>
                                        )
                                    })}
                                    <button onClick={()=>setRanges([...ranges, {from:'',to:''}])} className="w-full md:w-auto px-6 py-3 border-2 border-dashed border-emerald-200 text-emerald-600 font-bold rounded-xl hover:bg-emerald-50 transition-all flex items-center justify-center gap-2 text-sm"><Icon name="PlusCircle" size={18}/> Tambah Baris Rentang Lainnya</button>
                                </div>

                                {conflictError && (
                                    <div className="p-5 bg-red-50 border border-red-200 rounded-xl flex items-start gap-3">
                                        <Icon name="AlertTriangle" size={24} className="text-red-600 mt-1 shrink-0"/>
                                        <div>
                                            <p className="text-red-800 font-bold text-lg">Akses Ditolak Lintas Tim!</p>
                                            <p className="text-red-600 text-sm mt-1">Nomor <strong className="font-mono bg-red-200 px-1 rounded">#{conflictError.number}</strong> sudah berstatus sah milik: <strong className="uppercase bg-red-600 text-white px-2 py-0.5 rounded text-xs ml-1">{conflictError.owner}</strong></p>
                                        </div>
                                    </div>
                                )}

                                {previewNumbers.length > 0 && !conflictError && (
                                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Preview Alokasi (Live)</p>
                                        <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar">
                                            {previewNumbers.map(n => <span key={n} className="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm font-mono font-semibold text-slate-600 shadow-sm">#{n}</span>)}
                                            {totalDocs > 100 && <span className="px-3 py-1.5 bg-slate-200 rounded-lg text-sm font-bold text-slate-600">+{totalDocs - 100} lainnya...</span>}
                                        </div>
                                    </div>
                                )}

                                <div className={`p-6 rounded-2xl border-2 flex flex-col md:flex-row justify-between items-center gap-4 transition-all ${estimatedDocs > 0 && totalDocs !== estimatedDocs && !conflictError ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200'}`}>
                                    <div className="text-center md:text-left">
                                        <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Total Generate Final</p>
                                        <div className="flex items-center gap-3">
                                            <p className="text-3xl font-black text-slate-800">{totalDocs} <span className="text-sm font-semibold text-slate-500">Lembar</span></p>
                                            {estimatedDocs > 0 && totalDocs !== estimatedDocs && !conflictError && <span className="bg-amber-100 text-amber-700 px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 border border-amber-200"><Icon name="AlertTriangle" size={12}/> Beda Estimasi</span>}
                                            {estimatedDocs > 0 && totalDocs === estimatedDocs && !conflictError && <span className="bg-emerald-100 text-emerald-700 px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 border border-emerald-200"><Icon name="CheckCircle2" size={12}/> Pas Estimasi</span>}
                                        </div>
                                    </div>
                                    <button onClick={handleGenerate} disabled={!!conflictError || totalDocs===0 || !formData.teamId} className="w-full md:w-auto bg-emerald-500 text-white px-8 py-3.5 rounded-xl font-bold shadow-md shadow-emerald-200 disabled:opacity-50 hover:bg-emerald-600 transition-all flex items-center justify-center gap-2"><Icon name="Play" size={20} className="fill-current"/> Proses & Simpan</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- VIEW: PROSES PANEN ---
            const ProsesPanenView = () => {
                const [selectedBatch, setSelectedBatch] = useState(null);
                const [searchTerm, setSearchTerm] = useState("");
                const [visibleCount, setVisibleCount] = useState(50);
                const [massInputModal, setMassInputModal] = useState({ isOpen: false, text: "" });
                
                const activeBatches = batches.filter(b => b.status === 'AKTIF');

                const handleUpdateDocStatus = (docId, newStatus) => {
                    setDocuments(docs => docs.map(d => d.id === docId ? { ...d, status: newStatus } : d));
                };

                const handleBulkAction = (status) => {
                    if (!selectedBatch) return;
                    setDocuments(docs => docs.map(d => (d.batchId === selectedBatch.id && d.status === 'DIALOKASIKAN') ? { ...d, status: status } : d));
                    addToast(`Status diubah massal menjadi ${status === 'TERPAKAI' ? 'Selesai' : 'Laci'}`, 'success');
                };

                const handleCloseBatch = () => {
                    const unresolved = documents.filter(d => d.batchId === selectedBatch.id && d.status === 'DIALOKASIKAN').length;
                    if (unresolved > 0) return fireAlert('Ditolak', `Masih ada ${unresolved} dokumen menggantung! Selesaikan atau Tarik ke laci.`, 'error');
                    setBatches(bs => bs.map(b => b.id === selectedBatch.id ? { ...b, status: 'SELESAI' } : b));
                    fireAlert('Selesai', `Siklus kandang ditutup permanen.`, 'success');
                    setSelectedBatch(null);
                };

                const handleProcessMassInput = () => {
                    const rawText = massInputModal.text;
                    const matchedNumbers = rawText.match(/\d+/g) || [];
                    const uniqueNumbers = [...new Set(matchedNumbers)];

                    if (uniqueNumbers.length === 0) return fireAlert('Data Kosong', 'Tidak ada angka yang terdeteksi.', 'error');
                    
                    let updateCount = 0; let alreadyUsedCount = 0;
                    
                    const updatedDocs = documents.map(d => {
                        if (uniqueNumbers.includes(d.number) && d.batchId === selectedBatch.id) {
                            if (d.status === 'TERPAKAI') { alreadyUsedCount++; return d; } 
                            else { updateCount++; return { ...d, status: 'TERPAKAI' }; }
                        }
                        return d;
                    });

                    const existingBatchNumbers = new Set(documents.filter(d => d.batchId === selectedBatch.id && uniqueNumbers.includes(d.number)).map(d => d.number));
                    const notFoundCount = uniqueNumbers.length - existingBatchNumbers.size;

                    setDocuments(updatedDocs);
                    setMassInputModal({ isOpen: false, text: "" });
                    
                    fireAlert('Laporan Scan Massal', `✅ ${updateCount} diubah jadi Terpakai.\n\n⚠️ ${alreadyUsedCount} sudah Terpakai sebelumnya.\n\n❌ ${notFoundCount} tidak valid (bukan milik kandang ini).`, 'success');
                };

                if (!selectedBatch) {
                    return (
                        <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-6 fade-in">
                            <div className="flex items-center gap-4 mb-4">
                                <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center shadow-inner"><Icon name="RefreshCw" size={24}/></div>
                                <div><h2 className="text-2xl font-bold text-slate-800">Proses Panen</h2><p className="text-sm text-slate-500">Pilih kandang aktif untuk mencatat pengembalian dokumen.</p></div>
                            </div>

                            {activeBatches.length === 0 ? (
                                <div className="bg-white p-12 text-center rounded-2xl border-2 border-dashed border-slate-200">
                                    <Icon name="ListOrdered" size={40} className="mx-auto text-slate-300 mb-4"/>
                                    <p className="text-lg font-bold text-slate-600">Tidak ada kandang aktif.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {activeBatches.map(batch => {
                                        const unresolved = documents.filter(d => d.batchId === batch.id && d.status === 'DIALOKASIKAN').length;
                                        const t = teams.find(x=>x.id===batch.teamId)?.name || 'Unknown';
                                        return (
                                            <div key={batch.id} onClick={() => {setSelectedBatch(batch); setVisibleCount(50); setSearchTerm('');}} className="bg-white p-6 rounded-2xl border border-slate-200 cursor-pointer hover:border-emerald-400 hover:shadow-md transition-all group relative overflow-hidden">
                                                <div className="absolute top-0 right-0 w-24 h-24 bg-emerald-50 rounded-bl-full -z-10 group-hover:scale-110 transition-transform"></div>
                                                <div className="flex justify-between items-start mb-4">
                                                    <div><h3 className="font-bold text-lg text-slate-800 group-hover:text-emerald-600 transition-colors">{batch.name}</h3><p className="text-xs font-semibold text-slate-500 mt-1 flex items-center gap-1"><Icon name="Users" size={14}/> {t}</p></div>
                                                    <span className="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded border border-emerald-200">AKTIF</span>
                                                </div>
                                                <div className="bg-slate-50 p-4 rounded-xl flex gap-4 border border-slate-100 items-center">
                                                    <div className="flex-1"><p className="text-[10px] font-bold text-slate-400 uppercase">Populasi</p><p className="font-bold text-slate-700">{batch.population}</p></div>
                                                    <div className="w-px h-8 bg-slate-200"></div>
                                                    <div className="flex-1"><p className="text-[10px] font-bold text-slate-400 uppercase">Gantung</p><p className={`font-bold ${unresolved>0?'text-amber-500':'text-emerald-500'}`}>{unresolved>0 ? unresolved : 'Bersih'}</p></div>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            )}
                        </div>
                    );
                }

                const batchDocs = documents.filter(d => d.batchId === selectedBatch.id).sort((a,b)=>parseInt(a.number)-parseInt(b.number));
                const filteredDocs = searchTerm ? batchDocs.filter(d => d.number.includes(searchTerm)) : batchDocs;
                const unresolvedCount = batchDocs.filter(d => d.status === 'DIALOKASIKAN').length;

                return (
                    <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-4 fade-in">
                        <button onClick={()=>setSelectedBatch(null)} className="text-sm font-bold text-slate-500 mb-2 flex items-center gap-2 hover:text-emerald-600"><Icon name="ChevronRight" size={16} className="rotate-180"/> Kembali</button>
                        
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-sm relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-48 h-48 bg-emerald-50/50 rounded-full blur-2xl -z-10 translate-x-1/2 -translate-y-1/2"></div>
                            <div>
                                <h2 className="text-2xl font-bold flex items-center gap-2">{selectedBatch.name} <span className="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded border border-emerald-200">AKTIF</span></h2>
                                <p className="text-sm font-semibold text-slate-500 mt-1 flex items-center gap-3">
                                    <span className="flex items-center gap-1"><Icon name="Users" size={14}/> {teams.find(t=>t.id===selectedBatch.teamId)?.name}</span>
                                    <span className="flex items-center gap-1"><Icon name="FileText" size={14}/> {batchDocs.length} Dokumen</span>
                                </p>
                            </div>
                            <div className="flex items-center gap-3 w-full md:w-auto">
                                <button onClick={()=>setMassInputModal({isOpen: true, text: ''})} className="w-full md:w-auto bg-indigo-50 text-indigo-700 border border-indigo-200 px-5 py-2.5 rounded-xl font-bold hover:bg-indigo-100 transition-all flex items-center justify-center gap-2 text-sm"><Icon name="CheckSquare" size={18}/> Scan Massal (Paste)</button>
                                <button onClick={handleCloseBatch} className={`w-full md:w-auto px-6 py-2.5 rounded-xl font-bold transition-all text-sm flex items-center justify-center gap-2 ${unresolvedCount===0?'bg-slate-800 text-white hover:bg-slate-900 shadow-md':'bg-slate-100 text-slate-400 border cursor-not-allowed'}`} disabled={unresolvedCount>0}><Icon name="Archive" size={18}/> Tutup Kandang</button>
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-2xl border border-slate-200 flex flex-col lg:flex-row justify-between gap-4 sticky top-4 z-10 shadow-sm">
                            <div className="flex items-center gap-3 bg-amber-50 px-4 py-2 rounded-xl border border-amber-100 w-full lg:w-auto">
                                <div className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></div>
                                <span className="text-amber-800 font-bold text-sm">{unresolvedCount} Gantung</span>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                                <div className="relative flex-1 sm:min-w-[200px]">
                                    <Icon name="Search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input type="text" placeholder="Cari No..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 text-sm font-semibold" />
                                </div>
                                <div className="w-px h-8 bg-slate-200 hidden sm:block mt-1"></div>
                                <button onClick={()=>handleBulkAction('TERPAKAI')} disabled={unresolvedCount===0} className="flex-1 sm:flex-none px-4 py-2 bg-emerald-50 text-emerald-700 font-bold rounded-xl border border-emerald-200 disabled:opacity-50 text-sm hover:bg-emerald-100 transition-all flex items-center justify-center gap-1.5"><Icon name="CheckCircle2" size={16}/> Semua Selesai</button>
                                <button onClick={()=>handleBulkAction('DI_ADMIN')} disabled={unresolvedCount===0} className="flex-1 sm:flex-none px-4 py-2 bg-amber-50 text-amber-700 font-bold rounded-xl border border-amber-200 disabled:opacity-50 text-sm hover:bg-amber-100 transition-all flex items-center justify-center gap-1.5"><Icon name="Inbox" size={16}/> Semua Laci</button>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead className="bg-slate-50 border-b border-slate-100"><tr className="text-[10px] font-bold text-slate-400 uppercase tracking-widest"><th className="p-4">No. Dokumen</th><th className="p-4">Status Live</th><th className="p-4 text-right">Aksi Manual</th></tr></thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filteredDocs.slice(0, visibleCount).map(doc => (
                                            <tr key={doc.id} className="hover:bg-slate-50/50 group">
                                                <td className="p-4 font-mono font-bold text-lg text-slate-700">#{doc.number}</td>
                                                <td className="p-4">
                                                    {doc.status === 'DIALOKASIKAN' && <span className="text-[10px] bg-slate-100 px-2 py-1 rounded-md font-bold uppercase tracking-wider text-slate-500 border border-slate-200 flex items-center gap-1 w-max"><Icon name="Activity" size={12}/> Menggantung</span>}
                                                    {doc.status === 'TERPAKAI' && <span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-1 rounded-md font-bold uppercase tracking-wider border border-emerald-200 flex items-center gap-1 w-max"><Icon name="CheckCircle2" size={12}/> Selesai</span>}
                                                    {doc.status === 'DI_ADMIN' && <span className="text-[10px] bg-amber-100 text-amber-700 px-2 py-1 rounded-md font-bold uppercase tracking-wider border border-amber-200 flex items-center gap-1 w-max"><Icon name="Inbox" size={12}/> Di Laci</span>}
                                                </td>
                                                <td className="p-4 text-right">
                                                    {doc.status === 'DIALOKASIKAN' ? (
                                                        <div className="flex justify-end gap-2">
                                                            <button onClick={()=>handleUpdateDocStatus(doc.id, 'TERPAKAI')} className="text-xs px-4 py-2 bg-emerald-500 text-white font-bold rounded-lg shadow-sm hover:bg-emerald-600 active:scale-95 transition-all">Selesai</button>
                                                            <button onClick={()=>handleUpdateDocStatus(doc.id, 'DI_ADMIN')} className="text-xs px-4 py-2 bg-amber-500 text-white font-bold rounded-lg shadow-sm hover:bg-amber-600 active:scale-95 transition-all">Ke Laci</button>
                                                        </div>
                                                    ) : ( <button onClick={()=>handleUpdateDocStatus(doc.id, 'DIALOKASIKAN')} className="text-xs px-4 py-2 bg-slate-100 border border-slate-200 font-bold rounded-lg text-slate-500 hover:bg-slate-200 transition-all flex items-center gap-1 ml-auto"><Icon name="Undo2" size={14}/> Batal</button> )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            {visibleCount < filteredDocs.length && <div className="p-4 bg-slate-50 border-t border-slate-100 text-center"><button onClick={()=>setVisibleCount(p=>p+50)} className="px-6 py-2 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50 shadow-sm">Tampilkan Lebih Banyak...</button></div>}
                        </div>

                        {/* Modal Scan Massal */}
                        {massInputModal.isOpen && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[100] fade-in">
                                <div className="bg-white rounded-2xl p-6 w-full max-w-lg shadow-xl">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2"><Icon name="CheckSquare" size={20} className="text-indigo-600"/> Scan / Paste Massal</h3>
                                        <button onClick={()=>setMassInputModal({isOpen:false})} className="text-slate-400 hover:text-slate-700"><Icon name="X" size={20}/></button>
                                    </div>
                                    <p className="text-xs font-semibold text-slate-500 mb-4">Paste data dari Excel / WA ke bawah sini. Sistem akan otomatis mendeteksi semua angka dan mengubah statusnya menjadi <strong>Selesai (Terpakai)</strong>.</p>
                                    <textarea value={massInputModal.text} onChange={e=>setMassInputModal({...massInputModal, text: e.target.value})} className="w-full h-48 p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm shadow-inner resize-none" placeholder="1001&#10;1002&#10;1003..."></textarea>
                                    <div className="flex gap-3 justify-end mt-6">
                                        <button onClick={()=>setMassInputModal({isOpen:false})} className="px-5 py-2.5 font-bold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200">Batal</button>
                                        <button onClick={handleProcessMassInput} className="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 flex items-center gap-2"><Icon name="Play" size={18} className="fill-current"/> Proses Scan</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // --- VIEW: SCAN MASSAL GLOBAL ---
            const ScanMassalView = () => {
                const [inputText, setInputText] = useState('');

                const handleProcess = () => {
                    const matchedNumbers = inputText.match(/\d+/g) || [];
                    const uniqueNumbers = [...new Set(matchedNumbers)];

                    if (uniqueNumbers.length === 0) return fireAlert('Data Kosong', 'Tidak ada angka yang terdeteksi di dalam teks.', 'error');
                    
                    let updateCount = 0; 
                    let alreadyUsedCount = 0;
                    const foundNumbers = new Set();
                    
                    const updatedDocs = documents.map(d => {
                        if (uniqueNumbers.includes(d.number)) {
                            foundNumbers.add(d.number);
                            if (d.status === 'TERPAKAI') { alreadyUsedCount++; return d; } 
                            else { updateCount++; return { ...d, status: 'TERPAKAI' }; }
                        }
                        return d;
                    });

                    const notFoundCount = uniqueNumbers.length - foundNumbers.size;

                    setDocuments(updatedDocs);
                    setInputText("");
                    
                    fireAlert('Laporan Scan Global', `✅ ${updateCount} dokumen berhasil disahkan (Terpakai).\n\n⚠️ ${alreadyUsedCount} dokumen sudah berstatus Terpakai sebelumnya.\n\n❌ ${notFoundCount} nomor tidak ditemukan di sistem.`, 'success');
                };

                return (
                    <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6 fade-in">
                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center shadow-inner"><Icon name="CheckSquare" size={28}/></div>
                                <div><h2 className="text-2xl font-bold text-slate-800">Scan Massal Global</h2><p className="text-sm font-semibold text-slate-500 mt-0.5">Sahkan dokumen BTPA lintas kandang sekaligus dari Excel/WA.</p></div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
                            <p className="text-xs font-semibold text-slate-500 mb-4">Paste (Tempel) ratusan nomor BTPA Anda ke dalam kotak di bawah ini. Sistem akan otomatis melacak nomor tersebut di seluruh database dan mengubah statusnya menjadi <strong className="text-emerald-600">Selesai (Terpakai)</strong> secara global.</p>
                            
                            <textarea 
                                value={inputText} 
                                onChange={e=>setInputText(e.target.value)}
