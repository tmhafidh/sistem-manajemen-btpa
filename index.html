                                            <div style={{width: `${pPenimbang}%`}} className="bg-indigo-500 h-full flex items-center justify-center text-[10px] font-bold text-white overflow-hidden">{pPenimbang>5&&`${pPenimbang.toFixed(0)}%`}</div>
                                            <div style={{width: `${pDialokasikan}%`}} className="bg-slate-300 h-full flex items-center justify-center text-[10px] font-bold text-slate-600 overflow-hidden">{pDialokasikan>5&&`${pDialokasikan.toFixed(0)}%`}</div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm">
                                            <div className="p-4 border-b border-slate-100"><h3 className="font-bold text-sm text-slate-800">Riwayat Kandang</h3></div>
                                            <div className="p-0 overflow-x-auto">
                                                <table className="w-full text-left text-xs">
                                                    <thead className="bg-slate-50 text-slate-500"><tr><th className="px-4 py-2 font-medium">Kandang</th><th className="px-4 py-2 font-medium">Status</th><th className="px-4 py-2 font-medium text-center">Vol</th></tr></thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {teamBatches.map(b => (
                                                            <tr key={b.id}>
                                                                <td className="px-4 py-3 font-semibold text-slate-700">{b.name}</td>
                                                                <td className="px-4 py-3"><span className={`px-2 py-1 rounded text-[10px] font-bold ${b.status==='AKTIF'?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-500'}`}>{b.status}</span></td>
                                                                <td className="px-4 py-3 text-center font-bold">{documents.filter(d=>d.batchId===b.id).length}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm">
                                            <div className="p-4 border-b border-slate-100"><h3 className="font-bold text-sm text-slate-800">Log Dokumen</h3></div>
                                            <div className="p-4">
                                                <div className="flex flex-wrap gap-1.5 max-h-[250px] overflow-y-auto custom-scrollbar pr-1">
                                                    {teamDocs.slice(0, visibleCount).map(d => {
                                                        let c = 'bg-slate-50 border-slate-200 text-slate-500'; 
                                                        if (d.status === 'TERPAKAI') c = 'bg-emerald-50 border-emerald-200 text-emerald-700';
                                                        if (d.status === 'DIALOKASIKAN') c = 'bg-white border-slate-200 text-slate-700';
                                                        if (d.status === 'DI_ADMIN') c = 'bg-amber-50 border-amber-200 text-amber-700';
                                                        if (d.status === 'DI_PENIMBANG') c = 'bg-indigo-50 border-indigo-200 text-indigo-700';
                                                        return <span key={d.id} className={`px-2 py-1 border rounded text-xs font-mono font-medium ${c}`}>#{d.number}</span>
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                );
            };

            // --- VIEW: GLOBAL SEARCH MODAL ---
            const GlobalSearchModal = () => {
                if (!isSearchOpen) return null;
                return (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-start justify-center z-[200] p-4 pt-16 fade-in" onClick={() => setIsSearchOpen(false)}>
                        <div className="bg-white rounded-2xl max-w-xl w-full shadow-2xl overflow-hidden flex flex-col" onClick={e => e.stopPropagation()}>
                            <div className="p-4 border-b border-slate-100 flex items-center gap-3">
                                <Search size={20} className="text-slate-400"/>
                                <input ref={searchInputRef} type="text" placeholder="Ketik nomor BTPA..." className="flex-1 border-none outline-none font-semibold text-lg text-slate-800" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} autoFocus />
                                <button onClick={() => setIsSearchOpen(false)} className="text-slate-400"><X size={20}/></button>
                            </div>
                            <div className="p-4 max-h-[60vh] overflow-y-auto bg-slate-50">
                                {searchQuery.trim() === '' ? <p className="text-center text-sm text-slate-400 py-8">Ketik untuk mencari dokumen lintas tim dan laci.</p> : searchResults.length === 0 ? <p className="text-center text-sm text-slate-400 py-8">Dokumen tidak ditemukan.</p> : (
                                    <div className="space-y-2">
                                        {searchResults.map(doc => {
                                            let bc = 'bg-slate-100 text-slate-600', st = 'GANTUNG', loc = getBatchName(doc.batchId);
                                            if (doc.status === 'TERPAKAI') { bc = 'bg-emerald-100 text-emerald-700'; st = 'SELESAI'; }
                                            else if (doc.status === 'DI_ADMIN') { bc = 'bg-amber-100 text-amber-700'; st = 'LACI'; loc = 'Kantor'; }
                                            else if (doc.status === 'DI_PENIMBANG') { bc = 'bg-indigo-100 text-indigo-700'; st = 'PENIMBANG'; loc = doc.penimbangName; }
                                            return (
                                                <div key={doc.id} className="bg-white p-3 rounded-lg border border-slate-200 flex justify-between items-center shadow-sm">
                                                    <div>
                                                        <p className="font-mono font-bold text-slate-800">#{doc.number}</p>
                                                        <p className="text-[10px] text-slate-500 uppercase mt-0.5">{getTeamName(doc.teamId)} • {loc}</p>
                                                    </div>
                                                    <span className={`px-2 py-1 rounded text-[10px] font-bold ${bc}`}>{st}</span>
                                                </div>
                                            )
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            // Autofocus
            useEffect(() => { if (isSearchOpen && searchInputRef.current) setTimeout(() => searchInputRef.current.focus(), 50); }, [isSearchOpen]);

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row font-sans text-slate-900">
                    
                    {/* Mobile Header */}
                    <div className="md:hidden bg-white border-b border-slate-200 p-3 flex justify-between items-center z-30 sticky top-0">
                        <h1 className="font-bold text-lg flex items-center gap-2"><div className="bg-emerald-500 p-1.5 rounded-lg"><Activity size={16} className="text-white"/></div> BTPA Hub</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setIsSearchOpen(true)} className="p-2 bg-slate-100 text-slate-600 rounded-lg"><Search size={18} /></button>
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-slate-100 text-slate-600 rounded-lg">{isMobileMenuOpen ? <X size={18} /> : <Menu size={18} />}</button>
                        </div>
                    </div>

                    {/* Sidebar */}
                    <div className={`fixed inset-y-0 left-0 z-40 w-[260px] bg-white border-r border-slate-200 transform transition-transform duration-300 md:relative md:translate-x-0 flex flex-col ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-5 hidden md:block">
                            <h1 className="font-bold text-xl text-slate-800 flex items-center gap-2"><div className="bg-emerald-500 p-2 rounded-xl text-white shadow-sm"><Activity size={20}/></div> BTPA Hub</h1>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto px-4 py-2 space-y-1 custom-scrollbar">
                            <div className="mb-4 hidden md:block">
                                <button onClick={() => setIsSearchOpen(true)} className="w-full bg-slate-50 text-slate-500 hover:bg-slate-100 border border-slate-200 px-3 py-2 rounded-lg flex items-center gap-2 text-sm font-medium transition-colors"><Search size={16}/> Cepat Cari...</button>
                            </div>

                            <p className="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 mt-4 md:mt-0">Siklus</p>
                            <NavItem id="chick-in" label="Chick-in (Input)" icon={PlusCircle} />
                            <NavItem id="proses-panen" label="Proses Panen" icon={RefreshCw} />
                            
                            <div className="my-4 border-t border-slate-100 mx-3"></div>
                            
                            <p className="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Inventaris</p>
                            <NavItem id="input-laci" label="Tambah Stok" icon={Archive} />
                            <NavItem id="laci-admin" label="Laci & PPL" icon={Inbox} />
                            <NavItem id="monitor-tim" label="Monitor Tim" icon={BarChart3} />
                            
                            <div className="my-4 border-t border-slate-100 mx-3"></div>
                            
                            <p className="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Sistem</p>
                            <NavItem id="master-tim" label="Master Tim" icon={Users} />
                            <NavItem id="database" label="Backup Data" icon={Database} />
                        </div>
                        
                        <div className="p-4 border-t border-slate-100">
                            <div className="text-center">
                                <p className="text-xs font-semibold text-slate-600">Sistem BTPA v2.0</p>
                                <p className="text-[10px] text-slate-400 mt-0.5">&copy; {new Date().getFullYear()} Teuku M. Hafidh</p>
                            </div>
                        </div>
                    </div>

                    {isMobileMenuOpen && <div className="fixed inset-0 bg-slate-900/40 z-30 md:hidden" onClick={closeMobileMenu} />}

                    {/* Main Content */}
                    <div className="flex-1 overflow-y-auto bg-slate-50 md:h-screen relative custom-scrollbar">
                        {activeMenu === 'master-tim' && <MasterTimView />}
                        {activeMenu === 'database' && <DatabaseView />}
                        {activeMenu === 'input-laci' && <InputLaciView />}
                        {activeMenu === 'chick-in' && <ChickInView />}
                        {activeMenu === 'proses-panen' && <ProsesPanenView />}
                        {activeMenu === 'laci-admin' && <LaciAdminView />}
                        {activeMenu === 'monitor-tim' && <MonitorTimView />}
                    </div>

                    <GlobalSearchModal />

                    {/* Alert Modal */}
                    {alertConfig.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-[150] p-4 fade-in">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl text-center">
                                <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${alertConfig.type === 'success' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}`}>
                                    {alertConfig.type === 'success' ? <CheckCircle2 size={32} /> : <XCircle size={32} />}
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 mb-2">{alertConfig.title}</h3>
                                <p className="text-sm text-slate-500 mb-6">{alertConfig.message}</p>
                                <button onClick={() => setAlertConfig({...alertConfig, isOpen: false})} className={`w-full text-white py-2.5 rounded-lg text-sm font-semibold transition-colors ${alertConfig.type === 'success' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-red-600 hover:bg-red-700'}`}>
                                    Tutup Pesan
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Toasts */}
                    <div className="fixed top-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-sm font-medium fade-in ${toast.type === 'success' ? 'bg-slate-800 text-white' : 'bg-red-600 text-white'}`}>
                                {toast.type === 'success' ? <CheckCircle2 size={18} className="text-emerald-400" /> : <AlertCircle size={18} />}
                                {toast.message}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
