                                    const isUsed = usedDrawerDocs.has(doc.id);
                                    return (
                                      <button type="button" key={doc.id} disabled={isUsed} onClick={() => injectRange(doc.number, doc.number)} className={`px-3 py-1.5 rounded-lg border font-mono font-bold text-sm transition-all ${isUsed ? 'bg-slate-200/50 border-transparent text-slate-400 opacity-60 flex items-center gap-1' : 'bg-white border-brand-200 text-brand-700 hover:bg-brand-100 shadow-sm active:scale-95 cursor-pointer'}`}>
                                        {isUsed && <CheckCircle2 size={12}/>} #{doc.number}
                                      </button>
                                    )
                                  })}
                                </div>
                              </div>
                            </div>
                          )}
                          
                          <div className="space-y-4 pt-2">
                              <div className="flex justify-between items-end mb-2">
                                  <label className="text-xs font-bold text-slate-500 uppercase tracking-widest pl-1">Rentang Dokumen Dipindah</label>
                                  <button type="button" onClick={() => {setRanges([{from:'', to:''}]); setActiveInput({index: 0, field: 'from'});}} className="text-xs font-black text-slate-500 bg-white border border-slate-200 hover:bg-slate-50 px-3 py-1.5 rounded-lg shadow-sm transition-colors active:scale-95">Reset Pilihan</button>
                              </div>
                              {ranges.map((range, idx) => {
                                  const fromVal = parseInt(range.from); const toVal = parseInt(range.to);
                                  const rangeCount = (!isNaN(fromVal) && !isNaN(toVal) && fromVal <= toVal) ? (toVal - fromVal + 1) : 0;
                                  const isFromActive = activeInput.index === idx && activeInput.field === 'from';
                                  const isToActive = activeInput.index === idx && activeInput.field === 'to';
                                  return (
                                  <div key={idx} className="flex flex-col md:flex-row items-start md:items-center gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200/60 transition-all hover:border-brand-200">
                                      <div className="w-full md:flex-1">
                                      <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Mulai Nomor</label>
                                      <input type="number" placeholder="1001" className={`w-full px-5 py-3 bg-white rounded-xl outline-none transition-all font-mono font-black tracking-widest text-xl text-slate-800 placeholder:text-slate-300 ${isFromActive ? 'border-2 border-brand-500 ring-4 ring-brand-500/10 shadow-sm' : 'border border-slate-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10'}`} value={range.from} onChange={(e) => handleRangeChange(idx, 'from', e.target.value)} onFocus={() => setActiveInput({index: idx, field: 'from'})} onClick={() => setActiveInput({index: idx, field: 'from'})} />
                                      </div>
                                      <div className="hidden md:block text-slate-300 font-black text-3xl mt-4">-</div>
                                      <div className="w-full md:flex-1">
                                      <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Sampai Nomor</label>
                                      <input type="number" placeholder="1005" className={`w-full px-5 py-3 bg-white rounded-xl outline-none transition-all font-mono font-black tracking-widest text-xl text-slate-800 placeholder:text-slate-300 ${isToActive ? 'border-2 border-brand-500 ring-4 ring-brand-500/10 shadow-sm' : 'border border-slate-200 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10'}`} value={range.to} onChange={(e) => handleRangeChange(idx, 'to', e.target.value)} onFocus={() => setActiveInput({index: idx, field: 'to'})} onClick={() => setActiveInput({index: idx, field: 'to'})} />
                                      </div>
                                      <div className="w-full md:w-auto flex items-center justify-between gap-3 mt-2 md:mt-6 shrink-0">
                                      {rangeCount > 0 ? <span className="bg-brand-100/50 text-brand-700 font-black text-sm px-4 py-3 rounded-xl border border-brand-200">{rangeCount} Lembar</span> : <span className="text-slate-400 px-4 py-3 text-sm font-medium">0 Lembar</span>}
                                      <button type="button" onClick={() => handleRemoveRange(idx)} disabled={ranges.length === 1} className="p-3 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl disabled:opacity-30 transition-all"><Trash2 size={22}/></button>
                                      </div>
                                  </div>
                                  )
                              })}
                              <button type="button" onClick={handleAddRange} className="w-full md:w-auto px-6 py-4 border-2 border-dashed border-brand-200 text-brand-600 font-bold rounded-2xl hover:bg-brand-50 transition-all flex items-center justify-center gap-2"><PlusCircle size={20}/> Tambah Baris Input</button>
                          </div>

                          {/* Error Invalid */}
                          {invalidDocsError && (
                              <div className="mt-6 bg-red-50 border border-red-200 p-6 rounded-2xl flex items-start gap-4 animate-in slide-in-from-top-2 duration-300">
                                  <div className="bg-red-100 text-red-600 p-2 rounded-xl mt-1"><AlertTriangle size={24}/></div>
                                  <div>
                                      <h4 className="text-red-800 font-black text-lg tracking-tight">Nomor Tidak Tersedia!</h4>
                                      <p className="text-red-600 font-medium text-sm mt-1">Ada <strong className="font-bold">{invalidDocsError.length}</strong> dokumen dalam rentang yang tidak tersedia di Laci Admin Tim ini.</p>
                                  </div>
                              </div>
                          )}
                        </div>
                        
                        <div className="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                          <button type="button" onClick={() => setTransferModal({isOpen:false, fromTeamId:null, toTeamId:''})} className="px-8 py-4 font-bold text-slate-600 bg-white border border-slate-200 rounded-2xl hover:bg-slate-100 transition-all">Batal</button>
                          <button type="button" onClick={requestTransferTeam} className="px-8 py-4 font-black text-white bg-brand-500 rounded-2xl shadow-lg shadow-brand-500/30 hover:bg-brand-600 active:scale-95 transition-all flex items-center gap-2">Pindah Kepemilikan <ChevronRight size={20}/></button>
                        </div>
                    </div>
                  </div>
                )}

                {/* MODAL KONFIRMASI PINDAH TIM */}
                {confirmTransfer.isOpen && confirmTransfer.payload && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-[110] p-4 animate-in fade-in duration-200">
                    <div className="bg-white rounded-[2rem] border border-slate-100 p-8 max-w-md w-full shadow-2xl text-center">
                        <div className="w-20 h-20 bg-brand-50 text-brand-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><RefreshCw size={36} /></div>
                        <h3 className="text-3xl font-black text-slate-800 tracking-tight mb-2">Konfirmasi Perpindahan</h3>
                        <p className="text-slate-500 font-medium mb-6">Anda akan memindahkan <strong className="text-slate-800">{confirmTransfer.payload.count} dokumen BTPA</strong> di dalam Laci Admin.</p>
                        
                        <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 mb-8 flex flex-col gap-3">
                            <div className="flex justify-between items-center text-sm font-bold">
                                <span className="text-slate-400">Dari:</span>
                                <span className="text-slate-800">{teams.find(t => t.id === confirmTransfer.payload.fromTeamId)?.name}</span>
                            </div>
                            <div className="h-px bg-slate-200 w-full"></div>
                            <div className="flex justify-between items-center text-sm font-black">
                                <span className="text-slate-400">Ke Tim:</span>
                                <span className="text-brand-600">{teams.find(t => t.id === confirmTransfer.payload.toTeamId)?.name}</span>
                            </div>
                        </div>

                        <div className="flex gap-3">
                            <button type="button" onClick={() => setConfirmTransfer({ isOpen: false, payload: null })} className="flex-1 bg-slate-100 hover:bg-slate-200 py-4 rounded-2xl font-bold text-slate-600 transition-colors">Batal</button>
                            <button type="button" onClick={executeTransferTeam} className="flex-1 bg-brand-500 hover:bg-brand-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-brand-500/30 transition-all active:scale-95">Ya, Pindahkan</button>
                        </div>
                    </div>
                  </div>
                )}
              </div>
            );
          };

          // ==========================================
          // 9. SCAN MASSAL VIEW (Dengan Validasi 2 Tahap)
          // ==========================================
          const ScanMassalView = ({ teams, batches, documents, setDocuments, fireAlert, addToast }) => {
              const [inputText, setInputText] = useState('');
              const [validation, setValidation] = useState(null);

              const getPositionText = (doc) => {
                  if (doc.status === 'DIALOKASIKAN') {
                      const b = batches.find(b => b.id === doc.batchId);
                      return b ? `Kandang ${b.name}` : 'Di Lapangan';
                  }
                  if (doc.status === 'DI_ADMIN') return 'Laci Admin';
                  if (doc.status === 'DI_PENIMBANG') return `Penimbang: ${doc.penimbangName}`;
                  if (doc.status === 'TERPAKAI') return 'Sudah Sah (Selesai)';
                  return doc.status;
              };

              const handleValidate = () => {
                  if (!inputText.trim()) return fireAlert('Gagal', 'Masukkan nomor BTPA terlebih dahulu pada kotak teks.', 'error');
                  const numbers = inputText.match(/\d+/g) || [];
                  const uniqueNumbers = [...new Set(numbers)]; 
                  if (uniqueNumbers.length === 0) return fireAlert('Gagal', 'Tidak ada angka yang terdeteksi dari teks yang Anda masukkan.', 'error');

                  let ready = []; let already = []; let notFound = [];
                  uniqueNumbers.forEach(num => {
                      const doc = documents.find(d => d.number === num);
                      if (!doc) notFound.push(num);
                      else if (doc.status === 'TERPAKAI') already.push(doc);
                      else ready.push(doc);
                  });

                  setValidation({ ready, already, notFound, isExecuted: false, totalInput: uniqueNumbers.length });
                  addToast('Validasi selesai. Silakan cek tabel preview sebelum eksekusi.', 'success');
              };

              const handleExecute = () => {
                  if (!validation || validation.ready.length === 0) return;
                  const idsToUpdate = new Set(validation.ready.map(d => d.id));
                  setDocuments(docs => docs.map(d => idsToUpdate.has(d.id) ? { ...d, status: 'TERPAKAI' } : d));
                  setValidation({ ...validation, isExecuted: true });
                  addToast(`Eksekusi Sukses: ${validation.ready.length} dokumen telah disahkan!`, 'success');
              };

              const resetScan = () => { setValidation(null); setInputText(''); };

              return (
                  <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 animate-in slide-in-from-bottom-4 duration-500 fade-in">
                      <div className="flex items-center gap-4 mb-8">
                          <div className="p-3 bg-white rounded-2xl shadow-sm border border-slate-100"><ClipboardPaste className="text-brand-600" size={28}/></div>
                          <div>
                              <h2 className="text-3xl font-black text-slate-800 tracking-tight">Scan Massal (Global)</h2>
                              <p className="text-slate-500 font-medium mt-1">Sistem validasi dua tahap untuk memproses penyelesaian BTPA secara massal.</p>
                          </div>
                      </div>

                      <div className="flex flex-col lg:flex-row gap-6">
                          <div className="w-full lg:w-1/3 bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200/60 flex flex-col">
                              <label className="text-sm font-bold text-slate-700 uppercase tracking-widest mb-3 flex items-center gap-2"><ClipboardPaste size={18}/> Paste Daftar Nomor BTPA</label>
                              <textarea 
                                  value={inputText} 
                                  onChange={(e) => setInputText(e.target.value)} 
                                  disabled={validation !== null}
                                  placeholder="Contoh:&#10;1001&#10;1002&#10;1005&#10;Bisa dipisah enter atau koma..." 
                                  className={`w-full flex-1 min-h-[260px] p-5 border rounded-2xl outline-none focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 transition-all font-mono font-bold text-slate-700 resize-none ${validation ? 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed' : 'bg-slate-50 border-slate-200'}`}
                              ></textarea>
                              
                              {!validation ? (
                                  <button type="button" onClick={handleValidate} className="mt-4 w-full bg-brand-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-brand-500/30 hover:bg-brand-400 active:scale-95 transition-all flex items-center justify-center gap-2">
                                      <FileCheck size={20}/> Validasi Nomor
                                  </button>
                              ) : (
                                  <button type="button" onClick={resetScan} className="mt-4 w-full bg-slate-800 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-slate-700 active:scale-95 transition-all flex items-center justify-center gap-2">
                                      <RefreshCw size={20}/> Scan Ulang Baru
                                  </button>
                              )}
                          </div>

                          <div className="w-full lg:w-2/3">
                              {validation ? (
                                  <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-200/60 animate-in fade-in zoom-in-95 h-full flex flex-col relative overflow-hidden">
                                      {validation.isExecuted && <div className="absolute inset-0 bg-emerald-500/5 z-0 pointer-events-none"></div>}
                                      
                                      <div className="relative z-10 flex justify-between items-center border-b pb-4 mb-6">
                                          <h3 className="text-xl font-black text-slate-800 tracking-tight flex items-center gap-2">
                                              {validation.isExecuted ? <><CheckCircle2 className="text-emerald-500"/> Laporan Hasil Eksekusi</> : <><Search className="text-brand-500"/> Preview Validasi Data</>}
                                          </h3>
                                          <span className={`px-3 py-1 text-[10px] font-black uppercase tracking-widest rounded-lg shadow-sm border ${validation.isExecuted ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-amber-100 text-amber-700 border-amber-200'}`}>
                                              {validation.isExecuted ? 'SUDAH EKSEKUSI' : 'MENUNGGU KONFIRMASI'}
                                          </span>
                                      </div>
                                      
                                      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6 relative z-10">
                                          <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                              <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Input</p>
                                              <p className="text-2xl font-black text-slate-700">{validation.totalInput}</p>
                                          </div>
                                          <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                              <p className="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-1">{validation.isExecuted ? 'Berhasil Disahkan' : 'Siap Dieksekusi'}</p>
                                              <p className="text-2xl font-black text-emerald-600">{validation.ready.length}</p>
                                          </div>
                                          <div className="bg-amber-50 p-4 rounded-2xl border border-amber-100">
                                              <p className="text-[10px] font-black text-amber-600 uppercase tracking-widest mb-1">Sudah Selesai</p>
                                              <p className="text-2xl font-black text-amber-600">{validation.already.length}</p>
                                          </div>
                                          <div className="bg-red-50 p-4 rounded-2xl border border-red-100">
                                              <p className="text-[10px] font-black text-red-600 uppercase tracking-widest mb-1">Tidak Ditemukan</p>
                                              <p className="text-2xl font-black text-red-600">{validation.notFound.length}</p>
                                          </div>
                                      </div>

                                      {validation.ready.length > 0 && (
                                          <div className="flex-1 min-h-0 border border-slate-200 rounded-2xl overflow-hidden bg-white flex flex-col relative z-10">
                                              <div className="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                                                  <h4 className="font-black text-slate-700 text-sm">Daftar Dokumen Siap Diproses ({validation.ready.length})</h4>
                                              </div>
                                              <div className="overflow-y-auto flex-1 custom-scrollbar max-h-[300px]">
                                                  <table className="w-full text-left text-sm">
                                                      <thead className="bg-white text-slate-400 text-[10px] uppercase font-black tracking-widest sticky top-0 shadow-sm">
                                                          <tr><th className="px-5 py-3">No. BTPA</th><th className="px-5 py-3">Tim Pelaksana</th><th className="px-5 py-3">Posisi Terakhir</th><th className="px-5 py-3 text-right">Status Baru</th></tr>
                                                      </thead>
                                                      <tbody className="divide-y divide-slate-100">
                                                          {validation.ready.map(doc => (
                                                              <tr key={doc.id} className="hover:bg-slate-50 transition-colors">
                                                                  <td className="px-5 py-3 font-mono font-black text-slate-700">#{doc.number}</td>
                                                                  <td className="px-5 py-3 font-bold text-slate-500 flex items-center gap-1.5"><Users size={12}/> {teams.find(t=>t.id===doc.teamId)?.name || '-'}</td>
                                                                  <td className="px-5 py-3 font-bold text-slate-500">{getPositionText(doc)}</td>
                                                                  <td className="px-5 py-3 text-right">
                                                                      {validation.isExecuted ? <span className="text-emerald-500 font-black flex items-center justify-end gap-1"><CheckCircle2 size={14}/> Selesai (Sah)</span> : <span className="text-amber-500 font-bold bg-amber-50 px-2 py-1 rounded border border-amber-100 text-xs flex items-center justify-end gap-1 w-fit ml-auto"><Activity size={12}/> Akan Selesai</span>}
                                                                  </td>
                                                              </tr>
                                                          ))}
                                                      </tbody>
                                                  </table>
                                              </div>
                                          </div>
                                      )}

                                      <div className="mt-4 flex flex-col md:flex-row gap-4 relative z-10">
                                          {validation.already.length > 0 && (
                                              <div className="flex-1 p-4 border border-amber-200 bg-amber-50 rounded-2xl">
                                                  <p className="text-[10px] font-black text-amber-700 uppercase tracking-widest mb-2">Sudah Sah Sebelumnya ({validation.already.length}):</p>
                                                  <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scrollbar">
                                                      {validation.already.map(doc => <span key={doc.id} className="bg-amber-100 text-amber-700 border border-amber-200 px-2 py-0.5 rounded font-mono text-xs shadow-sm">#{doc.number}</span>)}
                                                  </div>
                                              </div>
                                          )}
                                          {validation.notFound.length > 0 && (
                                              <div className="flex-1 p-4 border border-red-200 bg-red-50 rounded-2xl">
                                                  <p className="text-[10px] font-black text-red-600 uppercase tracking-widest mb-2 flex items-center gap-1"><AlertTriangle size={12}/> Tidak Terdaftar / Ilegal ({validation.notFound.length}):</p>
                                                  <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scrollbar">
                                                      {validation.notFound.map(n => <span key={n} className="bg-red-100 text-red-600 border border-red-200 px-2 py-0.5 rounded font-mono text-xs shadow-sm">#{n}</span>)}
                                                  </div>
                                              </div>
                                          )}
                                      </div>

                                      {!validation.isExecuted && validation.ready.length > 0 && (
                                          <div className="mt-6 pt-6 border-t border-slate-100 flex justify-end relative z-10">
                                              <button type="button" onClick={handleExecute} className="w-full md:w-auto px-10 py-4 bg-emerald-500 text-white font-black rounded-2xl shadow-lg shadow-emerald-500/30 hover:bg-emerald-600 active:scale-95 transition-all flex items-center justify-center gap-3">
                                                  <CheckSquare size={20} /> Eksekusi {validation.ready.length} Dokumen Jadi Sah
                                              </button>
                                          </div>
                                      )}
                                  </div>
                              ) : (
                                  <div className="bg-slate-50/50 p-6 rounded-[2rem] border-2 border-dashed border-slate-200 h-full flex flex-col items-center justify-center text-center">
                                      <div className="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4"><Search size={32} className="text-slate-300" /></div>
                                      <h3 className="text-xl font-black text-slate-500 mb-2 tracking-tight">Menunggu Inputan Data</h3>
                                      <p className="text-slate-400 font-medium">Masukkan nomor di sebelah kiri dan klik "Validasi Nomor" untuk melihat hasil pelacakan di sini sebelum dieksekusi.</p>
                                  </div>
                              )}
                          </div>
                      </div>
                  </div>
              );
          };

          const App = () => {
            const [activeMenu, setActiveMenu] = useState('dashboard');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [alertConfig, setAlertConfig] = useState({ isOpen: false, title: '', message: '', type: 'success' });
            const [toasts, setToasts] = useState([]);
            
            const [teams, setTeams] = useSyncStorage('BTPA_TEAMS_V5', []);
            const [batches, setBatches] = useSyncStorage('BTPA_BATCHES_V5', []);
            const [documents, setDocuments] = useSyncStorage('BTPA_DOCS_V5', []);

            const [globalNavTarget, setGlobalNavTarget] = useState({ type: null, id: null, keyword: null, highlightNumber: null, tab: null });
            const [globalSearch, setGlobalSearch] = useState('');
            const [showSearchBox, setShowSearchBox] = useState(false);

            const searchResults = useMemo(() => {
                if (!globalSearch.trim()) return [];
                const query = globalSearch.toLowerCase().trim();
                let results = [];
                batches.forEach(b => { if (b.name.toLowerCase().includes(query)) results.push({ id: b.id, type: 'BATCH', title: b.name, subtitle: `Status: ${b.status} | Populasi: ${b.population}`, data: b }); });
                teams.forEach(t => { if (t.name.toLowerCase().includes(query) || (t.ppl || '').toLowerCase().includes(query) || (t.penimbang || '').toLowerCase().includes(query)) results.push({ id: t.id, type: 'TEAM', title: t.name, subtitle: `PPL: ${t.ppl || '-'} | Penim: ${t.penimbang || '-'}`, data: t }); });
                documents.forEach(d => { if (d.number.includes(query)) results.push({ id: d.id, type: 'DOCUMENT', title: `BTPA #${d.number}`, subtitle: `Status: ${d.status}`, data: d }); });
                return results.slice(0, 15);
            }, [globalSearch, documents, teams, batches]);

            const handleGlobalSearchResultClick = (res) => {
                setGlobalSearch(''); setShowSearchBox(false);
                if (res.type === 'BATCH') {
                    if (res.data.status === 'AKTIF' || res.data.status === 'KOSONG') { setActiveMenu('proses-panen'); setGlobalNavTarget({ type: 'BATCH', id: res.id }); } 
                    else { setActiveMenu('dashboard'); setGlobalNavTarget({ type: 'TEAM', id: res.data.teamId }); }
                } else if (res.type === 'TEAM') { setActiveMenu('dashboard'); setGlobalNavTarget({ type: 'TEAM', id: res.id });
                } else if (res.type === 'DOCUMENT') { 
                    const doc = res.data;
                    if (doc.status === 'DIALOKASIKAN' || doc.status === 'TERPAKAI') {
                        const batch = batches.find(b => b.id === doc.batchId);
                        if (batch && (batch.status === 'AKTIF' || batch.status === 'KOSONG')) {
                            setActiveMenu('proses-panen');
                            setGlobalNavTarget({ type: 'BATCH', id: batch.id, highlightNumber: doc.number });
                        } else {
                            setActiveMenu('dashboard');
                            setGlobalNavTarget({ type: 'TEAM', id: doc.teamId, highlightNumber: doc.number });
                        }
                    } else if (doc.status === 'DI_ADMIN') {
                        setActiveMenu('laci-admin');
                        setGlobalNavTarget({ type: 'LACI', tab: 'laci', highlightNumber: doc.number });
                    } else if (doc.status === 'DI_PENIMBANG') {
                        setActiveMenu('laci-admin');
                        setGlobalNavTarget({ type: 'LACI', tab: 'penimbang', highlightNumber: doc.number });
                    }
                }
                setIsMobileMenuOpen(false);
            };
            
            const addToast = (message, type = 'success') => {
              const id = generateId(); setToasts(prev => [...prev, { id, message, type }]); setTimeout(() => { setToasts(prev => prev.filter(t => t.id !== id)); }, 3000);
            };

            const fireAlert = (title, message, type = 'success') => setAlertConfig({ isOpen: true, title, message, type });

            const NavItem = ({ id, label, icon: Icon }) => (
              <button type="button" onClick={() => { setActiveMenu(id); setIsMobileMenuOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl transition-all duration-300 group ${activeMenu === id ? 'bg-brand-500 text-white font-semibold shadow-lg shadow-brand-500/30 tracking-wide translate-x-1' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900 font-medium hover:translate-x-1'}`}>
                {Icon && <Icon size={20} className={`transition-colors ${activeMenu === id ? "text-white" : "text-slate-400 group-hover:text-brand-500"}`} />} <span>{label}</span>
              </button>
            );

            return (
              <div className="h-screen overflow-hidden bg-slate-100 flex flex-col md:flex-row font-sans text-slate-900 selection:bg-brand-200 selection:text-brand-900">
                <div className="md:hidden bg-slate-900 text-white p-4 flex items-center gap-4 z-30 sticky top-0 shadow-lg shrink-0">
                  <button type="button" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2.5 bg-slate-800 rounded-xl hover:bg-slate-700 transition-colors active:scale-95 shrink-0">{isMobileMenuOpen ? <X size={24} /> : <Menu size={24} />}</button>
                  <h1 className="font-black text-2xl flex items-center gap-3 tracking-tight"><div className="bg-gradient-to-br from-brand-400 to-brand-600 p-2 rounded-xl shadow-inner"><Files size={22} className="text-white"/></div> BTPA Monitor</h1>
                </div>
                <div className={`fixed inset-y-0 left-0 z-40 w-[260px] bg-white border-r border-slate-200/80 shadow-[10px_0_30px_rgba(0,0,0,0.05)] md:shadow-none transform transition-transform duration-500 ease-in-out md:relative md:translate-x-0 flex flex-col h-full ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                  <div className="p-8 hidden md:block shrink-0">
                      <h1 className="font-black text-3xl text-slate-800 flex items-center gap-4 tracking-tight"><div className="bg-gradient-to-br from-brand-400 to-brand-600 p-3 rounded-[1.25rem] text-white shadow-lg shadow-brand-500/30"><Files size={28}/></div> Monitor BTPA</h1>
                  </div>
                  <div className="px-5 mb-4 relative mt-4 md:mt-0 z-50 shrink-0">
                      <div className="relative"><div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><Search size={18} className="text-slate-400" /></div><input type="text" placeholder="Cari No. BTPA, Kandang, Tim..." className="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none font-bold text-slate-700 text-sm transition-all shadow-inner" value={globalSearch} onChange={(e) => { setGlobalSearch(e.target.value); setShowSearchBox(e.target.value.length > 0); }} onFocus={() => { if(globalSearch) setShowSearchBox(true) }} onBlur={() => setTimeout(() => setShowSearchBox(false), 200)}/></div>
                      {showSearchBox && (
                          <div className="absolute top-full left-5 right-5 mt-2 bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden max-h-80 overflow-y-auto z-[100] custom-scrollbar">
                              {searchResults.length === 0 ? (<div className="p-6 text-center text-sm font-bold text-slate-400 flex flex-col items-center gap-2"><Search size={24} className="opacity-50"/> Tidak ada hasil ditemukan.</div>) : ( searchResults.map(res => {
                                  let IconComponent = FileText; let iconColor = "text-amber-500 bg-amber-50 border-amber-100";
                                  if (res.type === 'BATCH') { IconComponent = Activity; iconColor = "text-brand-600 bg-brand-50 border-brand-100"; } else if (res.type === 'TEAM') { IconComponent = Users; iconColor = "text-indigo-600 bg-indigo-50 border-indigo-100"; }
                                  return (<div key={res.id} onMouseDown={() => handleGlobalSearchResultClick(res)} className="p-4 border-b border-slate-50 hover:bg-slate-50 transition-colors cursor-pointer flex gap-3 items-center group"><div className={`p-2 rounded-lg border ${iconColor} group-hover:scale-110 transition-transform`}><IconComponent size={16}/></div><div><div className="font-black text-slate-800 text-sm tracking-tight"><HighlightText text={res.title} highlight={globalSearch} /></div><p className="text-[10px] font-bold text-slate-500 mt-0.5"><HighlightText text={res.subtitle} highlight={globalSearch} /></p></div></div>)
                              }) )}
                          </div>
                      )}
                  </div>
                  
                  <div className="flex-1 overflow-y-auto py-2 px-5 space-y-2 custom-scrollbar">
                    <p className="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 mt-2 md:mt-0">Menu Utama</p>
                    <NavItem id="dashboard" label="Dasbor Analitik" icon={LayoutDashboard} />
                    <div className="my-6 border-t border-slate-100 mx-4"></div>
                    <p className="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Siklus Kandang</p>
                    <NavItem id="chick-in" label="1. Buka Kandang (Input)" icon={PlusCircle} />
                    <NavItem id="proses-panen" label="2. Proses Panen Aktif" icon={RefreshCw} />
                    <NavItem id="scan-massal" label="Scan Massal (Global)" icon={ClipboardPaste} />
                    <div className="my-6 border-t border-slate-100 mx-4"></div>
                    <p className="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Inventaris & Gudang</p>
                    <NavItem id="input-laci" label="Tambah Stok Laci" icon={Archive} />
                    <NavItem id="laci-admin" label="Gudang (Laci & PPL)" icon={Inbox} />
                    <div className="my-6 border-t border-slate-100 mx-4"></div>
                    <p className="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Manajemen Sistem</p>
                    <NavItem id="master-tim" label="Master Data Tim" icon={Users} />
                    <NavItem id="database" label="Backup & Restore" icon={Database} />
                  </div>

                  <div className="p-6 border-t border-slate-100 bg-slate-50/50 shrink-0">
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 text-center shadow-sm">
                      <p className="text-xs font-black text-slate-700 tracking-tight">Sistem Digital BTPA</p>
                      <p className="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest">&copy; 2026 T.M. Hafidh Rafif</p>
                    </div>
                  </div>
                </div>

                {isMobileMenuOpen && <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 md:hidden transition-opacity duration-300" onClick={() => setIsMobileMenuOpen(false)} />}

                <div className="flex-1 overflow-y-auto bg-slate-50/50 h-full relative custom-scrollbar">
                  {activeMenu === 'dashboard' && <DashboardView teams={teams} batches={batches} documents={documents} globalNavTarget={globalNavTarget} setGlobalNavTarget={setGlobalNavTarget} setActiveMenu={setActiveMenu} fireAlert={fireAlert} />}
                  {activeMenu === 'master-tim' && <MasterTimView teams={teams} setTeams={setTeams} batches={batches} documents={documents} fireAlert={fireAlert} addToast={addToast} />}
                  {activeMenu === 'database' && <DatabaseView teams={teams} setTeams={setTeams} batches={batches} setBatches={setBatches} documents={documents} setDocuments={setDocuments} fireAlert={fireAlert} addToast={addToast} />}
                  {activeMenu === 'input-laci' && <InputLaciView teams={teams} documents={documents} setDocuments={setDocuments} fireAlert={fireAlert} />}
                  {activeMenu === 'chick-in' && <ChickInView teams={teams} batches={batches} setBatches={setBatches} documents={documents} setDocuments={setDocuments} fireAlert={fireAlert} addToast={addToast} />}
                  {activeMenu === 'proses-panen' && <ProsesPanenView teams={teams} batches={batches} setBatches={setBatches} documents={documents} setDocuments={setDocuments} globalNavTarget={globalNavTarget} setGlobalNavTarget={setGlobalNavTarget} fireAlert={fireAlert} addToast={addToast} />}
                  {activeMenu === 'laci-admin' && <LaciAdminView teams={teams} documents={documents} setDocuments={setDocuments} fireAlert={fireAlert} addToast={addToast} globalNavTarget={globalNavTarget} setGlobalNavTarget={setGlobalNavTarget} />}
                  {activeMenu === 'scan-massal' && <ScanMassalView teams={teams} batches={batches} documents={documents} setDocuments={setDocuments} fireAlert={fireAlert} addToast={addToast} />}
                </div>

                {alertConfig.isOpen && (
                  <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-md flex items-center justify-center z-[100] p-4 animate-in fade-in duration-300">
                    <div className="bg-white rounded-[2rem] max-w-sm w-full p-8 shadow-2xl animate-in zoom-in-95 duration-300 border border-slate-100">
                      <div className={`w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner ${alertConfig.type === 'success' ? 'bg-emerald-50 text-emerald-500' : 'bg-red-50 text-red-500'}`}>{alertConfig.type === 'success' ? <CheckCircle2 size={48} /> : <XCircle size={48} />}</div>
                      <h3 className="text-3xl font-black text-center mb-2 tracking-tight text-slate-800">{alertConfig.title}</h3>
                      <p className="text-center text-slate-500 mb-8 font-medium leading-relaxed">{alertConfig.message}</p>
                      <button type="button" onClick={() => setAlertConfig({...alertConfig, isOpen: false})} className={`w-full text-white py-4 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all ${alertConfig.type === 'success' ? 'bg-brand-500 hover:bg-brand-600 shadow-brand-500/30' : 'bg-red-500 hover:bg-red-600 shadow-red-500/30'}`}>Tutup Pesan</button>
                    </div>
                  </div>
                )}

                <div className="fixed top-6 right-6 z-[80] flex flex-col gap-3 pointer-events-none">
                  {toasts.map(toast => (
                    <div key={toast.id} className={`pointer-events-auto flex items-center gap-4 px-6 py-4 rounded-2xl shadow-xl transform transition-all animate-in slide-in-from-right-8 duration-500 ${toast.type === 'success' ? 'bg-slate-800 text-white border border-slate-700' : 'bg-red-600 text-white'}`}>
                      {toast.type === 'success' ? <CheckCircle2 size={24} className="text-emerald-400" /> : <AlertCircle size={24} className="text-white" />}
                      <p className="text-sm font-bold tracking-wide">{toast.message}</p>
                    </div>
                  ))}
                </div>

                {/* Global CSS Overrides & Scaling */}
                <style dangerouslySetInnerHTML={{__html: `
                  html { font-size: 14px; } /* Skala 87.5% dari default 16px */
                  .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
                  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
                  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 12px; }
                  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
                  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
                `}} />
              </div>
            );
          };

          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(<App />);
      </script>
  </body>
  </html>
